allowBuilds:
  '@nestjs/core': set this to true or false
  '@openapitools/openapi-generator-cli': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  '@scarf/scarf': set this to true or false
  '@swc/core': set this to true or false
  '@temporalio/core-bridge': set this to true or false
  bcrypt: set this to true or false
  prisma: set this to true or false
  protobufjs: set this to true or false
  redis-memory-server: set this to true or false

# Supply-chain defense for `pnpm install`.
#
# minimumReleaseAge holds back any package version younger than this many
# minutes from being installed. Most malicious npm versions are detected and
# pulled within 24-72h, so a 3-day delay catches them before they hit a build.
minimumReleaseAge: 4320

onlyBuiltDependencies:
  - '@openapitools/openapi-generator-cli'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@temporalio/core-bridge'
  - bcrypt
  - prisma
  - protobufjs
