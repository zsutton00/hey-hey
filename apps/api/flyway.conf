# Flyway configuration shared across local/CI/prod.
# Provide FLYWAY_URL, FLYWAY_USER, and FLYWAY_PASSWORD via environment variables.
locations=filesystem:db/flyway
baselineOnMigrate=false
validateOnMigrate=true
group=false
outOfOrder=true
table=flyway_schema_history
schemas=public
# Cutover defaults for existing Prisma-managed databases.
# Can be overridden with FLYWAY_BASELINE_VERSION / FLYWAY_BASELINE_DESCRIPTION.
baselineVersion=2026.02.18.0
baselineDescription=Prisma cutover
