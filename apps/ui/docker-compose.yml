services:
  ui:
    profiles: ["ui"]
    build:
      context: ../..
      dockerfile: apps/ui/Dockerfile
      args:
        APP_VERSION: ${UI_IMAGE_TAG:-local}
    image: hey-hey-ui:${UI_IMAGE_TAG:-local}
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      PORT: 5173
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PROTOCOL: ${API_PROTOCOL:-http}
      API_HOST: ${API_HOST:-localhost}
      API_PORT: ${API_PORT:-3000}
      API_BASE_PATH: ${API_BASE_PATH:-/api/v1}
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_WS_URL: ${VITE_WS_URL:-}
      VITE_ENV: ${VITE_ENV:-production}
    networks:
      - hey-hey-network

networks:
  hey-hey-network:
    name: hey-hey-network
    driver: bridge
