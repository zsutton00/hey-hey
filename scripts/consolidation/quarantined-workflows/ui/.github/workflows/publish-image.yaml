name: Publish UI image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ui_common_ref:
        description: "ui-common ref to build against (branch, tag, or SHA). Defaults to its default branch."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout ui-common repo
        uses: actions/checkout@v4
        with:
          repository: zsutton00/ui-common
          path: ui-common
          ref: ${{ inputs.ui_common_ref || '' }}
          token: ${{ secrets.SHARED_REPOS_TOKEN }}

      - name: Create expected ../ui-common path
        run: |
          # from /home/runner/work/ui/ui
          ln -sfn "$(pwd)/ui-common" ../ui-common
          ls -la ../ui-common
          test -f ../ui-common/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false

      - name: Install ui-common deps
        working-directory: ui-common
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build ui-common dist
        working-directory: ui-common
        env:
          UI_COMMON_BUILD_DTS: "false"
        run: |
          ./node_modules/.bin/tsc --build
          ./node_modules/.bin/tsup

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SAFE_REF="${SAFE_REF//[^a-zA-Z0-9_.-]/-}"
          UI_COMMON_SHA="$(git -C ui-common rev-parse --short=7 HEAD)"
          echo "safe_ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ui_common_sha_short=$UI_COMMON_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }} # don't push on PRs
          build-contexts: |
            ui_common=../ui-common
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.sha_short }}-uc-${{ steps.meta.outputs.ui_common_sha_short }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ui-service:${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/ui-service:${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.sha_short }}-uc-${{ steps.meta.outputs.ui_common_sha_short }}
            ghcr.io/${{ github.repository_owner }}/ui-service:${{ steps.meta.outputs.safe_ref }}
            ghcr.io/${{ github.repository_owner }}/ui-service:${{ steps.meta.outputs.safe_ref }}-ui-common-${{ steps.meta.outputs.ui_common_sha_short }}
