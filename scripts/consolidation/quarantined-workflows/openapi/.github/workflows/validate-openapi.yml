name: OpenAPI validation

on:
  pull_request:
    paths:
      - "specs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master]
    paths:
      - "specs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate all specifications and the canonical fixture
        run: npm run validate:all
