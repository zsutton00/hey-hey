name: Publish API image

on:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SAFE_REF="${SAFE_REF//[^a-zA-Z0-9_.-]/-}"
          echo "safe_ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }} # don't push on PRs
          tags: |
            ghcr.io/zsutton00/api-service:${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.sha_short }}
            ghcr.io/zsutton00/api-service:${{ steps.meta.outputs.safe_ref }}
