<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notification settings</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f7f7f8;
        color: #1d1d1f;
      }

      .settings-card {
        max-width: 560px;
        margin: 32px auto;
        padding: 16px 20px;
        background: #fff;
        border: 1px solid #d9d9de;
        border-radius: 10px;
      }

      .settings-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .settings-card__title {
        margin: 0;
        font-size: 18px;
      }

      .settings-card__actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .badge {
        padding: 2px 10px;
        border-radius: 999px;
        background: #e3f3e7;
        color: #1f6b35;
        font-size: 12px;
      }

      .button {
        padding: 5px 12px;
        border: 1px solid #c7c7cc;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      .settings-card__description {
        margin: 12px 0 0;
        color: #4a4a50;
      }
    </style>
  </head>
  <body>
    <section class="settings-card" data-hh-id="settings-card">
      <header class="settings-card__header" data-hh-id="header-row">
        <h2 class="settings-card__title" data-hh-id="title">
          Notification settings
        </h2>
        <div class="settings-card__actions">
          <span class="badge" data-hh-id="status-badge">Enabled</span>
          <button class="button" type="button" data-hh-id="edit-button">
            Edit
          </button>
        </div>
      </header>
      <p class="settings-card__description" data-hh-id="description">
        Choose which project events send you an email and which only appear in
        your inbox.
      </p>
    </section>
  </body>
</html>
