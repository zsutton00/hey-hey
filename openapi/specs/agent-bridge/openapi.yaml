    AgentTriggerStartRun:
      $ref: ../schemas/conversations.yaml#/AgentTriggerStartRun
    AgentTriggerUserMessage:
      $ref: ../schemas/conversations.yaml#/AgentTriggerUserMessage
    ExternalAgentActionSchemas:
      $ref: ../schemas/conversations.yaml#/ExternalAgentActionSchemas
    PlanShapingProposedStagesCompletionPayload:
      $ref: ../schemas/external-agent-completion.yaml#/PlanShapingProposedStagesCompletionPayload
    PlanShapingVisualPreviewCompletionPayload:
      $ref: ../schemas/external-agent-completion.yaml#/PlanShapingVisualPreviewCompletionPayload
    PlanShapingVisualPreviewPromptPayload:
      $ref: ../schemas/trigger-payloads.yaml#/PlanShapingVisualPreviewPromptPayload
    LocalPlanExecutionPromptPayload:
      type: object
      required:
        - plan
        - review
      properties:
        plan:
          $ref: "#/components/schemas/LocalPlanExecutionPromptPayloadPlan"
        review:
          $ref: "#/components/schemas/LocalStartupPlanReviewSummary"
          description: |
            The user's review of the plan: question answers, discrepancy dispositions, and feedback notes.
        feedback:
          type: string
          nullable: true
          description: Optional free-text user feedback submitted alongside the approval.
    LocalEntityConversationPromptPayload:
      type: object
      required:
        - entity
        - userMessage
      properties:
        entity:
          $ref: "#/components/schemas/LocalEntityConversationEntity"
        pageContext:
          type: string
          description: >
            Human-readable description of the current view context (e.g. "You are viewing the plan 'Q4 Roadmap' (planId:
            abc123)")
        influences:
          type: array
          items:
            $ref: "#/components/schemas/LocalEntityConversationInfluence"
          description: >
            Entities that influenced the creation or current state of this entity. Provides decision lineage and design
            rationale context.
        originatingConversationId:
          type: string
          description: >
            ID of the conversation that originated this entity, if applicable. Allows the agent to reference prior
            discussion context.
        userMessage:
          type: string
          description: |
            Required free-form message from the user to guide the agent's response to this entity conversation turn.
    LocalGoalPmPromptPayload:
      type: object
      required:
        - entity
        - userMessage
        - activeConversationId
        - conversationInventory
      properties:
        entity:
          $ref: "#/components/schemas/LocalGoalPmGoal"
        userMessage:
          type: string
          description: >-
            Free-form request to resolve into one Goal PM destination or explicit next action.
        activeConversationId:
          type: string
          format: uuid
          description: Canonical conversation active when the request was submitted.
        conversationInventory:
          type: array
          items:
            $ref: "#/components/schemas/LocalGoalPmConversationInventoryItem"
          description: >-
            Authoritative inventory of canonical conversations owned by the active goal. Goal PM may use only these
            conversations as existing-conversation destinations and message-evidence sources.
    LocalGoalPmConversationInventoryItem:
      type: object
      additionalProperties: false
      required:
        - conversationId
        - title
        - owner
        - workflowName
      properties:
        conversationId:
          type: string
          format: uuid
          description: Canonical CONVERSATION identity.
        title:
          type: string
          minLength: 1
          description: Canonical meaningful conversation title.
        owner:
          $ref: "#/components/schemas/LocalGoalPmConversationOwner"
        workflowName:
          $ref: "../schemas/conversations.yaml#/WorkflowName"
    LocalGoalPmConversationOwner:
      type: object
      additionalProperties: false
      required:
        - entityType
        - entityId
        - taskType
      properties:
        entityType:
          type: string
          enum:
            - TASK
        entityId:
          type: string
          format: uuid
          description: Canonical GOAL task identity that owns the conversation.
        taskType:
          type: string
          enum:
            - GOAL
    LocalGoalPmGoal:
      allOf:
        - $ref: "#/components/schemas/RunEntityReference"
        - type: object
          required:
            - entityType
            - taskType
          properties:
            entityType:
              type: string
              enum:
                - TASK
            taskType:
              type: string
              enum:
                - GOAL
            title:
              type: string
              description: Human-readable goal title
            description:
              type: string
              description: Goal description
            acceptanceCriteria:
              type: string
              description: Goal acceptance criteria, when present
            dueDate:
              type: string
              format: date-time
              description: Goal deadline
            trackedEntities:
              type: array
              items:
                $ref: "#/components/schemas/TrackedEntitySnapshot"
              description: Existing work already tracked by this goal
    LocalGoalPmRoutingEvidence:
      type: object
      additionalProperties: false
      required:
        - messageId
        - excerpt
        - rationale
      properties:
        messageId:
          type: string
          format: uuid
          description: Canonical MESSAGE identity supporting this conversation match.
        excerpt:
          type: string
          minLength: 1
          description: Bounded excerpt from the canonical message; never a serialized message object.
        rationale:
          type: string
          minLength: 1
          description: Why this message supports the proposed destination.
    LocalGoalPmRoutingConversationOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - kind
        - conversationId
        - title
        - evidence
        - rationale
      properties:
        optionId:
          type: string
          minLength: 1
          description: Stable identity of this offered option within the response.
        kind:
          type: string
          enum:
            - existingConversation
        conversationId:
          type: string
          format: uuid
          description: Canonical CONVERSATION identity; never a MESSAGE identity.
        title:
          type: string
          minLength: 1
          description: Meaningful canonical conversation title; placeholder labels are invalid.
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LocalGoalPmRoutingEvidence"
        rationale:
          type: string
          minLength: 1
    LocalGoalPmStartNewConversationOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - kind
        - title
        - rationale
        - requiresConfirmation
      properties:
        optionId:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - startNewConversation
        title:
          type: string
          minLength: 1
        rationale:
          type: string
          minLength: 1
        requiresConfirmation:
          type: boolean
          enum:
            - true
    LocalGoalPmRefineSearchOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - kind
        - title
        - prompt
        - rationale
      properties:
        optionId:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - refineSearch
        title:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
          description: Focused clarification prompt for a follow-up discovery turn.
        rationale:
          type: string
          minLength: 1
    LocalGoalPmWorkTarget:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - entityType
            - entityId
            - title
          properties:
            entityType:
              type: string
              enum:
                - TASK
            entityId:
              type: string
              format: uuid
            title:
              type: string
              minLength: 1
        - type: object
          additionalProperties: false
          required:
            - entityType
            - entityId
            - title
          properties:
            entityType:
              type: string
              enum:
                - PLAN
            entityId:
              type: string
              format: uuid
            title:
              type: string
              minLength: 1
      discriminator:
        propertyName: entityType
    LocalGoalPmTrackExistingWorkOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - kind
        - target
        - rationale
        - requiresSelection
      properties:
        optionId:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - trackExistingWork
        target:
          $ref: "#/components/schemas/LocalGoalPmWorkTarget"
        rationale:
          type: string
          minLength: 1
        requiresSelection:
          type: boolean
          enum:
            - true
    LocalGoalPmCreateMissingWorkOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - kind
        - parentFeatureId
        - workItemType
        - title
        - description
        - acceptanceCriteria
        - authoringMode
        - rationale
        - requiresSelection
      properties:
        optionId:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - createMissingWork
        parentFeatureId:
          type: string
          format: uuid
        workItemType:
          type: string
          enum:
            - TASK
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        acceptanceCriteria:
          type: string
          minLength: 1
        authoringMode:
          type: string
          enum:
            - PROPOSAL
        rationale:
          type: string
          minLength: 1
        requiresSelection:
          type: boolean
          enum:
            - true
    LocalGoalPmProposalOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - kind
        - proposalId
        - title
        - rationale
        - requiresSelection
      properties:
        optionId:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - proposal
        proposalId:
          type: string
          format: uuid
          description: Canonical PROPOSAL identity; this option is not a conversation destination.
        title:
          type: string
          minLength: 1
        rationale:
          type: string
          minLength: 1
        requiresSelection:
          type: boolean
          enum:
            - true
    LocalGoalPmRoutingOption:
      oneOf:
        - $ref: "#/components/schemas/LocalGoalPmRoutingConversationOption"
        - $ref: "#/components/schemas/LocalGoalPmStartNewConversationOption"
        - $ref: "#/components/schemas/LocalGoalPmRefineSearchOption"
        - $ref: "#/components/schemas/LocalGoalPmTrackExistingWorkOption"
        - $ref: "#/components/schemas/LocalGoalPmCreateMissingWorkOption"
        - $ref: "#/components/schemas/LocalGoalPmProposalOption"
      discriminator:
        propertyName: kind
        mapping:
          existingConversation: "#/components/schemas/LocalGoalPmRoutingConversationOption"
          startNewConversation: "#/components/schemas/LocalGoalPmStartNewConversationOption"
          refineSearch: "#/components/schemas/LocalGoalPmRefineSearchOption"
          trackExistingWork: "#/components/schemas/LocalGoalPmTrackExistingWorkOption"
          createMissingWork: "#/components/schemas/LocalGoalPmCreateMissingWorkOption"
          proposal: "#/components/schemas/LocalGoalPmProposalOption"
    LocalGoalPmRoutingResponse:
      type: object
      additionalProperties: false
      required:
        - responseType
        - goalId
        - options
      properties:
        responseType:
          type: string
          enum:
            - goal_pm_routing_v1
        goalId:
          type: string
          format: uuid
          description: Canonical GOAL task identity for the routing turn.
        options:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/LocalGoalPmRoutingOption"
