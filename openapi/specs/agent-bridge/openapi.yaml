      $ref: ../schemas/changed-file-reporting.yaml#/ChangedFileReportResult
    AgentBridgeStartRunAdmission:
      allOf:
        - $ref: "#/components/schemas/StartRunPromptPayload"
      not:
        allOf:
          - required:
              - fastMode
          - properties:
              provider:
                not:
                  enum:
                    - codex
                    - claude
      description: >-
        Transport-neutral admission shape used by Agent Bridge validation to
        admit Fast mode only for Codex and Claude runs without exporting the
        deprecated conversation HTTP request DTO.
    RunContextMetadata:
      $ref: ../schemas/run-context.yaml#/RunContextMetadata
    RunReferences:
      $ref: ../schemas/run-context.yaml#/RunReferences
    LocalPromptType:
