        launchConfig:
          $ref: ../schemas/trigger-payloads.yaml#/TaskMonitorLaunchConfig
        userMessage:
          type: string
          maxLength: 5000
    TaskMonitorPauseCommand:
      type: object
      additionalProperties: false
      required:
        - cause
      properties:
        cause:
          type: string
          enum:
            - PAUSE
    TaskMonitorResumeCommand:
      type: object
      additionalProperties: false
      required:
        - cause
      properties:
        cause:
          type: string
          enum:
            - RESUME
    TaskMonitorStopCommand:
      type: object
      additionalProperties: false
      required:
        - cause
      properties:
        cause:
          type: string
          enum:
            - STOP
    TaskMonitorJudgmentResolvedCommand:
      type: object
      additionalProperties: false
      required:
        - cause
        - judgment
      properties:
        cause:
          type: string
          enum:
            - JUDGMENT_RESOLVED
        judgment:
          $ref: ../schemas/work-items.yaml#/TaskMonitorJudgmentResponse
    TaskMonitorContinueCommand:
      type: object
      additionalProperties: false
      required:
        - cause
      properties:
        cause:
          type: string
          enum:
            - CONTINUE
    TaskMonitorCompleteCommand:
      type: object
      additionalProperties: false
      required:
        - cause
      properties:
        cause:
          type: string
          enum:
            - COMPLETE
    TaskMonitorHaltCommand:
      type: object
      additionalProperties: false
      required:
        - cause
      properties:
        cause:
          type: string
          enum:
            - HALT
    TaskMonitorCommandTarget:
      type: object
      additionalProperties: false
      required:
        - workItemType
        - workItemId
      properties:
        workItemType:
          type: string
          enum:
            - TASK_MONITOR
        workItemId:
          type: string
          format: uuid
    MonitorCommandAdmittedAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - status
