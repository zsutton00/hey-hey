    LocalValidationWalkthroughPromptPayload:
      type: object
      description: >
        Payload for the validation_walkthrough prompt type. The validation agent reads `scope` plus `entityId` as the
        launch context the validation session is exercising — a single task, a parent task and its split children, or a
        plan stage. The agent uses these inputs to decide which prior plan/implement reports to pull and which
        integration seams to cover when authoring the VALIDATION_WALKTHROUGH report.
      required:
        - scope
        - entityId
      properties:
        scope:
          type: string
          description: >
            The scope of the validation walkthrough. `task` covers a single task. `parent_task` covers a parent task and
            each split child, with explicit integration-seam checks across the children. `plan_stage` covers a plan
            stage's design doc plus every step's plan/implement reports.
          enum:
            - task
            - parent_task
            - plan_stage
        entityId:
          type: string
          format: uuid
          description: |
            ID of the in-scope entity (task id, parent task id, or plan stage id, matching `scope`).
