        - status
        - exitCode
        - lane
        - createdAt
        - updatedAt
        - detail
      properties:
        entryId:
          type: string
          description: Stable within the live Run instance; unique per tool call.
        toolUseId:
          type: string
        toolName:
          type: string
          nullable: true
          description: Null until the provider names the tool.
        summary:
          type: string
          description: One short line naming the tool and its most telling argument.
        status:
