    LocalRunDiffFilePatch:
      type: object
      required:
        - serviceId
        - repoPath
        - filePath
        - diff
        - preContent
        - postContent
      properties:
        serviceId:
          type: string
          description: Service that owns this changed file within the Run.
        repoPath:
          type: string
          description: Absolute path of the repository or worktree this patch belongs to.
        filePath:
          type: string
          description: Relative path of the file within that service repository or worktree.
        diff:
          type: string
          description: Unified diff output for this file.
        preContent:
          type: string
          nullable: true
          description: >
            File contents before the change, as a single string. Null when the file did not exist on the base side (e.g.
            a newly added file).
        postContent:
          type: string
          nullable: true
          description: >
            File contents after the change, as a single string. Null when the file no longer exists on disk (e.g. a
            deleted file).
    LocalTaskMonitorCoordinatorDecision:
      oneOf:
        - $ref: "#/components/schemas/LocalTaskMonitorRequestReviewDecision"
