      properties:
        status:
          type: string
          enum:
            - ADMITTED
        commandId:
          type: string
          format: uuid
        replayed:
          type: boolean
    MonitorCommandRejectedAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - status
