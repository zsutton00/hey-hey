        - SIGNATURE_INVALID
        - MACHINE_MISMATCH
        - OWNER_MISMATCH
        - STALE
        - EXPIRED
        - NONCE_REPLAY
        - KIND_NOT_ALLOWED
        - ROUTING_MISMATCH
        - MONITOR_NOT_FOUND
        - INVALID_CONTEXT
        - INVALID_LIFECYCLE
        - PAUSED
        - HALTED
        - NOT_READY
        - GUIDANCE_REQUIRED
        - DUPLICATE
        - NO_ELIGIBLE_WORK
        - MISSING_JUDGMENT
        - ROUTE_REJECTED
        - INTERNAL_ERROR

