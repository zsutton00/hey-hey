        - $ref: "#/components/schemas/CliReadToolCallsLatestTurnDisabled"
      discriminator:
        propertyName: state
        mapping:
          available: "#/components/schemas/CliReadToolCallsLatestTurnAvailable"
          disabled: "#/components/schemas/CliReadToolCallsLatestTurnDisabled"
      description: >-
        Live, transient view of the latest Turn's tool calls, or the typed outcome that remote viewing is turned off on
        this machine. Nothing here is stored by the CLI, the platform or the browser.
    CliReadToolCallsLatestTurnAvailable:
      type: object
      required:
        - state
        - runId
        - turnId
        - toolCalls
        - omittedEarlierCount
        - evictedCount
      properties:
        state:
          type: string
          enum:
            - available
        runId:
          type: string
          format: uuid
        turnId:
          type: string
          nullable: true
          description: CLI-owned identity of the latest Turn (the active Turn, else the newest Turn with activity). Null when the Run has no tool activity.
        toolCalls:
          type: array
          description: The Turn's tool calls in the order they began, subagent calls included and distinguished by lane.
          items:
            $ref: "#/components/schemas/CliReadToolCall"
        omittedEarlierCount:
          type: integer
          format: int32
          minimum: 0
          description: Earliest tool calls of the Turn dropped so the response fits the transport budget.
        evictedCount:
          type: integer
          format: int32
          minimum: 0
          description: Entries the CLI's bounded activity history has already discarded for this Run; earlier calls may be missing.
      additionalProperties: false
    CliReadToolCallsLatestTurnDisabled:
      type: object
      required:
