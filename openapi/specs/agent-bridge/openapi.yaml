openapi: 3.0.3
info:
  title: Hey Hey Agent Bridge Runtime Contract
  version: 1.0.0
  description: >-
    Transport-neutral schemas consumed by the paired Agent Bridge runtime. This source contains signed platform
    triggers, CLI run execution and response models, authorized remote reads, and Task Monitor validation contracts.
paths: {}
components:
  schemas:
    ChangedFileClaim:
      $ref: ../schemas/changed-file-reporting.yaml#/ChangedFileClaim
    ChangedFileReportInput:
      $ref: ../schemas/changed-file-reporting.yaml#/ChangedFileReportInput
