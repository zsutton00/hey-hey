        - questionAnswers
        - discrepancyDispositions
      properties:
        responseType:
          type: string
          enum:
            - startup_plan_review_v1
        questionAnswers:
          type: array
          items:
            $ref: "#/components/schemas/LocalStartupPlanQuestionAnswer"
        discrepancyDispositions:
          type: array
          items:
            $ref: "#/components/schemas/LocalStartupPlanDiscrepancyReview"
    LocalEntityConversationEntity:
      allOf:
        - $ref: "#/components/schemas/RunEntityReference"
        - type: object
          properties:
            title:
              type: string
              description: Human-readable title of the entity
            description:
              type: string
              description: Entity description or content
            acceptanceCriteria:
              type: string
              description: Acceptance criteria (for tasks)
            content:
              type: string
              description: Full content body (for design docs, artifacts, etc.)
            metadata:
              type: object
              additionalProperties: true
              description: Additional entity-specific metadata
            taskType:
              type: string
              description: >-
                Registry-authoritative subtype key for TASK entities. Present
                when the underlying work item needs subtype context, including
                built-in and project-defined custom work-item types. Preserve
                the key exactly; it is separate from the canonical TASK
                entityType and may be used by subtype-aware prompt branches.
            dueDate:
              type: string
              format: date-time
              description: >-
                Optional target date on GOAL tasks; omit for an undated Goal. Missing dates must not produce a date-based closing prompt.
                alongside the goal description.
            trackedEntities:
              type: array
              items:
                $ref: "#/components/schemas/TrackedEntitySnapshot"
              description: >-
                Outgoing TRACKS-edge snapshots. Populated when the entity is a GOAL task so the goal-scoping prompt
                section can list what is already attached and avoid re-attaching it.
    LocalEntityConversationInfluence:
      type: object
      required:
        - entityId
        - entityType
        - reasoning
        - reasonType
      properties:
        entityId:
          type: string
          format: uuid
          description: ID of the influencing entity
        entityType:
          type: string
          description: Type of the influencing entity (e.g. TASK, DESIGN_DOC, ARTIFACT)
        reasoning:
          type: string
          description: Explanation of how this entity influenced the decision
        reasonType:
          type: string
          description: >-
            Type of influence relationship. Recognized values: `explicit_mention`, `implied`, `derived`, `origin`. The
            `origin` value is system-injected to mark the host conversation's workflow-about entity and is not
            declarable by agents.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score for this influence relationship
    LocalPromptProposalInput:
      type: object
      required:
        - id
        - action
        - status
        - targetEntityId
        - targetEntityType
        - updates
      properties:
        reconciliation:
          $ref: "../schemas/proposals.yaml#/ProposalReconciliationState"
          description: Server-owned original/current content and immutable revision history for reconciliation. Candidate submissions return to review and never approve or apply.
        id:
          type: string
          description: Proposal ID.
        action:
          type: string
          description: Proposal action (CREATE, UPDATE, DELETE).
        status:
          type: string
          description: Current proposal status (DRAFT, APPROVED, REJECTED).
        targetEntityId:
          type: string
          description: ID of the entity this proposal targets.
        targetEntityType:
          type: string
          description: Type of the target entity (TASK, DESIGN_DOC, etc).
        title:
          type: string
          nullable: true
          description: >
            Per-action snapshot of the proposal target's display title at the moment the proposal was written. Mirrors
            `ProposalResponseDto.title` on the platform API. Null on legacy rows that pre-date the column.
        updates:
          type: object
          additionalProperties: true
          description: The proposed changes payload.
        influences:
          type: array
          items:
            $ref: "#/components/schemas/LocalPromptProposalInfluence"
          description: Entities that influenced this proposal.
        approvals:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Approval history for this proposal.
