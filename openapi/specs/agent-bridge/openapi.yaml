    TaskMonitorExternalCommand:
      oneOf:
        - $ref: "#/components/schemas/TaskMonitorStartCommand"
        - $ref: "#/components/schemas/TaskMonitorPauseCommand"
        - $ref: "#/components/schemas/TaskMonitorResumeCommand"
        - $ref: "#/components/schemas/TaskMonitorStopCommand"
        - $ref: "#/components/schemas/TaskMonitorJudgmentResolvedCommand"
        - $ref: "#/components/schemas/TaskMonitorContinueCommand"
        - $ref: "#/components/schemas/TaskMonitorCompleteCommand"
        - $ref: "#/components/schemas/TaskMonitorHaltCommand"
      discriminator:
        propertyName: cause
        mapping:
          START: "#/components/schemas/TaskMonitorStartCommand"
          PAUSE: "#/components/schemas/TaskMonitorPauseCommand"
          RESUME: "#/components/schemas/TaskMonitorResumeCommand"
          STOP: "#/components/schemas/TaskMonitorStopCommand"
          JUDGMENT_RESOLVED: "#/components/schemas/TaskMonitorJudgmentResolvedCommand"
          CONTINUE: "#/components/schemas/TaskMonitorContinueCommand"
          COMPLETE: "#/components/schemas/TaskMonitorCompleteCommand"
          HALT: "#/components/schemas/TaskMonitorHaltCommand"
      description: >-
        Closed union of user-authored Task Monitor lifecycle commands. Automated progression is driven by canonical
        report and Agent Session lifecycle events.
    MonitorCommandBody:
      type: object
      additionalProperties: false
      required:
        - version
        - kind
        - commandId
        - createdAt
        - expiresAt
        - organizationId
        - projectId
        - target
        - command
      properties:
        version:
          type: integer
          enum:
            - 1
        kind:
          type: string
          enum:
            - task_monitor_command
        commandId:
          type: string
          format: uuid
          description: Durable command, idempotency, acknowledgement, and log correlation identity.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        organizationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/TaskMonitorCommandTarget"
        command:
          $ref: "#/components/schemas/TaskMonitorExternalCommand"
      description: >-
        Complete signed monitor command. It deliberately contains no Run, conversation, agent-session, handler, or
        internal declaration identity.
    MonitorCommandAcknowledgement:
      oneOf:
        - $ref: "#/components/schemas/MonitorCommandAdmittedAcknowledgement"
        - $ref: "#/components/schemas/MonitorCommandRejectedAcknowledgement"
      discriminator:
        propertyName: status
        mapping:
          ADMITTED: "#/components/schemas/MonitorCommandAdmittedAcknowledgement"
          REJECTED: "#/components/schemas/MonitorCommandRejectedAcknowledgement"
    TaskMonitorStartCommand:
      type: object
      additionalProperties: false
      required:
        - cause
        - launchConfig
      properties:
        cause:
          type: string
          enum:
