          type: string
          minLength: 1
        requiredServiceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Complete deduplicated set of project Service IDs the approved implementation may modify.
        primaryImplementations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LocalResponseStartupPrimaryImplementation"
        executionPlan:
          type: array
          items:
