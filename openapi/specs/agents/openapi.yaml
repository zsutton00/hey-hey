    DecisionRefinerRequest:
      $ref: "../schemas/agent-coordination.yaml#/DecisionRefinerRequest"

    DecisionRefinerResponse:
      $ref: "../schemas/agent-coordination.yaml#/DecisionRefinerResponse"

    DecisionRefinerResponseWrapper:
      type: object
      description: Response wrapper returned by the decision refiner route.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the agent call succeeded.
        data:
          $ref: "#/components/schemas/DecisionRefinerResponse"

    InitiativeRefinerRequest:
      $ref: "../schemas/agent-coordination.yaml#/InitiativeRefinerRequest"

    InitiativeRefinerResponse:
      $ref: "../schemas/agent-coordination.yaml#/InitiativeRefinerResponse"

    InitiativeRefinerResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "#/components/schemas/InitiativeRefinerResponse"

    TaskRefinerRequest:
      $ref: "../schemas/agent-coordination.yaml#/TaskRefinerRequest"

    TaskRefinerResponse:
      $ref: "../schemas/agent-coordination.yaml#/TaskRefinerResponse"

    TaskRefinerResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "#/components/schemas/TaskRefinerResponse"

    EntityConversationRequest:
      $ref: "../schemas/agent-coordination.yaml#/EntityConversationRequest"

    EntityConversationResponse:
      $ref: "../schemas/agent-coordination.yaml#/EntityConversationResponse"

    EntityConversationResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "#/components/schemas/EntityConversationResponse"

    RelatedEntityDto:
      $ref: "../schemas/agent-coordination.yaml#/RelatedEntityDto"

    UsageSummary:
      $ref: "../schemas/agent-coordination.yaml#/UsageSummary"

    DailySessionRequest:
      $ref: "../schemas/agent-coordination.yaml#/DailySessionRequest"

    DailySessionResponse:
      $ref: "../schemas/agent-coordination.yaml#/DailySessionResponse"

    DailySessionResponseWrapper:
      type: object
