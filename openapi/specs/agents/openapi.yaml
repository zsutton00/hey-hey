    ProjectConversationResponseData:
      $ref: "../schemas/agent-coordination.yaml#/ProjectConversationResponse"

    ProjectConversationResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "#/components/schemas/ProjectConversationResponseData"

security:
  - BearerAuth: []

paths:
  /coding-prompts-planning:
    post:
      tags:
        - CodingPrompts
      operationId: runCodingPromptsPlanning
      summary: Retrieve planning and evidence context for coding prompts
      description: >
        Runs the coding-prompts planning workflow and returns planning/search artifacts
        (messages, retrieval plan summary, evidence, and project state summary) without
        generating a final coding prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodingPromptsRequest"
      responses:
        "200":
          description: Coding prompt planning context generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodingPromptsPlanningResponseWrapper"
        "400":
          description: Invalid payload supplied in the request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "500":
          description: Unexpected error while invoking the workflow.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  details:
                    type: string

  /initiative-refiner:
    post:
      tags:
        - InitiativeRefiner
      operationId: runInitiativeRefiner
      summary: Run the initiative refiner workflow
      description: >
        Runs the initiative refiner workflow for structured updates to initiative sections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeRefinerRequest"
      responses:
        "200":
          description: Initiative refiner completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeRefinerResponseWrapper"
        "400":
          description: Invalid payload supplied in the request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "500":
          description: Unexpected error while invoking the workflow.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  details:
                    type: string

  /plans-scope:
