      operationId: runAdrRefiner
      summary: Run the ADR refiner agent
      description: >
        Calls the planner-enabled ADR refiner agent using the structured ADR payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdrRefinerRequest"
      responses:
        "200":
          description: Agent completed the request successfully.
          content:
            application/json:
