  /daily-session:
    post:
      tags:
        - DailySession
      operationId: runDailySession
      summary: Run the daily session workflow
      description: >
        Runs the daily session multi-agent workflow. Receives an activity delta payload
        with the user's current activity snapshot, computed changes since last session,
        and a user message. Routes through a search planner agent before composing a
        response via a writer agent. Returns a response plus related entities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailySessionRequest"
