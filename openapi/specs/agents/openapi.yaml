openapi: 3.0.3
info:
  title: Hey Hey Agents API
  version: 1.0.0
  description: Endpoints for interacting with ADR-focused agent workflows.

servers:
  - url: /api/agents
    description: Agent orchestration endpoints

tags:
  - name: Adr
    description: Architectural Decision Record agent endpoints
  - name: BrainstormRefiner
    description: Brainstorm document refiner agent endpoints
  - name: DecisionRefiner
    description: Decision document refiner agent endpoints
  - name: InitiativeRefiner
    description: Initiative refiner agent endpoints
  - name: TaskRefiner
    description: Task refiner agent endpoints
  - name: CodingPrompts
    description: Retrieve planning and evidence context for coding prompts
  - name: Plans
    description: Plan workflows for capturing scope and constraints
  - name: EntityConversation
    description: Entity-focused conversational agent endpoints
  - name: ProjectConversation
    description: Project-level conversational agent endpoints
  - name: DailySession
    description: Daily session conversational agent endpoints

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    InitiativeSummary:
      $ref: "../schemas/agent-coordination.yaml#/InitiativeSummary"

    TaskSummary:
      $ref: "../schemas/agent-coordination.yaml#/TaskSummary"

    ConversationMessage:
      $ref: "../schemas/agent-coordination.yaml#/ConversationMessage"

    CodingPromptsRequest:
      $ref: "../schemas/agent-coordination.yaml#/CodingPromptRequest"

    CodingPromptPlanningResponse:
      $ref: "../schemas/agent-coordination.yaml#/CodingPromptPlanningResponse"

    CodingPromptsPlanningResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "#/components/schemas/CodingPromptPlanningResponse"

    PlanScopeRequest:
      $ref: "../schemas/agent-coordination.yaml#/PlanScopeRequest"

    PlanScopeResponse:
      $ref: "../schemas/agent-coordination.yaml#/PlanScopeResponse"

    PlanScopeResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "#/components/schemas/PlanScopeResponse"

    PlanApprovalRequest:
      $ref: "../schemas/agent-coordination.yaml#/PlanApprovalRequest"

    PlanProposalResponse:
      $ref: "../schemas/agent-coordination.yaml#/PlanProposalResponse"

    PlanProposalResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "#/components/schemas/PlanProposalResponse"

    PlanGapCategory:
      type: string
      enum:
        - tasks
        - design_docs
        - services

    PlanGapItem:
      $ref: "../schemas/agent-coordination.yaml#/PlanGapItem"

    PlanGapDiscoveryUserFeedback:
      $ref: "../schemas/agent-coordination.yaml#/PlanGapDiscoveryUserFeedback"

    PlanGapDiscoveryResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the workflow completed successfully.
        data:
          $ref: "../schemas/agent-coordination.yaml#/PlanGapDiscoveryResponse"

    AdrRefinerResponse:
      $ref: "../schemas/agent-coordination.yaml#/AdrRefinerResponse"

    AdrRefinerResponseWrapper:
      type: object
      description: Response wrapper returned by the ADR refiner route.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the agent call succeeded.
        data:
          $ref: "#/components/schemas/AdrRefinerResponse"

    AdrRefinerRequest:
      $ref: "../schemas/agent-coordination.yaml#/AdrRefinerRequest"

    BrainstormRefinerRequest:
      $ref: "../schemas/agent-coordination.yaml#/BrainstormRefinerRequest"

    BrainstormRefinerResponse:
      $ref: "../schemas/agent-coordination.yaml#/BrainstormRefinerResponse"

    BrainstormRefinerResponseWrapper:
      type: object
      description: Response wrapper returned by the brainstorm refiner route.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Indicates whether the agent call succeeded.
