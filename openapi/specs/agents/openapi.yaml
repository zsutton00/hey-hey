          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  details:
                    type: string

  /plans-approval:
    post:
      tags:
        - Plans
      operationId: runPlanApproval
      summary: Run the plan approval workflow
      description: >
        Runs the plan approval workflow to draft a plan proposal for user feedback.
      requestBody:
