TaskMonitorExecutionCondition:
  type: object
  additionalProperties: false
  required: [lifecycle, control, work, intervention]
  properties:
    lifecycle:
      type: string
      enum: [ABSENT, RUNNING, HALTED, COMPLETED]
    control:
      type: string
      nullable: true
      enum: [ACTIVE, PAUSING, PAUSED, RESUMING, null]
    work:
      type: string
      nullable: true
      enum:
        [
          LOADING_MONITOR,
          COORDINATING,
          VALIDATING_LAUNCH,
          RECONCILING_TASK_ACTIVATION,
          RECONCILING_MONITOR_PROJECTION,
          LAUNCH_READY,
          CREATING_AGENT_SESSION,
          CREATING_CONVERSATION,
          STARTING_RUN,
          RECONCILING_AGENT_SESSION_CREATION,
          RECONCILING_CONVERSATION_CREATION,
          RECONCILING_RUN_START,
          PERSISTING_LAUNCH,
          PROJECTING_STARTED,
          OBSERVING_RUN,
          EVALUATING_RUN,
          REQUESTING_REVIEW,
          AWAITING_REVIEW,
          REVIEW_REQUEST_FAILED,
          MONITOR_LOAD_FAILED,
          LAUNCH_JUDGMENT,
          OUTCOME_JUDGMENT,
          SUPERVISION_FAILED,
          RETRYABLE_LAUNCH,
          ADMITTING_LAUNCH_RETRY,
          null,
        ]
    intervention:
      type: string
      nullable: true
      enum:
        [
          CLEAR,
          PENDING,
          APPLYING_DECISION,
          APPLICATION_FAILED,
          APPLICATION_STALE,
          APPLICATION_CANCELLED,
          APPLICATION_UNCERTAIN,
          null,
        ]
  description: Independent committed execution regions; region values are null outside RUNNING.

TaskMonitorStateFailure:
  type: object
  additionalProperties: false
  required: [code, cause, correctiveGuidance]
  properties:
    code:
      type: string
      enum:
        [
          OPERATION_FAILED,
          BRANCH_CHECKED_OUT_IN_HOST_REPOSITORY,
          INVALID_CONFIGURATION,
          CATALOG_UNAVAILABLE,
        ]
    cause:
      type: string
      description: The concrete cause retained by the monitor owner; never a guessed diagnosis.
    correctiveGuidance:
      type: string
      description: Actionable correction supported by the committed failure and current policy.
    setting:
      type: string
    suppliedValue:
      type: string
    supportedValues:
      type: array
      items:
        type: string
  description: Report only known details. Configuration and catalog classifications are available for authoritative producers; publication does not add recovery admission behavior.

TaskMonitorStatePendingJudgment:
  type: object
  additionalProperties: false
  required: [request, guidance]
  properties:
    request:
      type: string
      description: The coordinator's request for the user's judgment, as committed by the monitor owner.
    guidance:
      type: string
      description: How the user answers the request; a pending judgment is a normal supervision outcome, not a failure.
  description: The monitor is waiting for the user's judgment. Reported apart from failure so clients never infer it from failure text.

TaskMonitorLifecycleAction:
  type: object
  additionalProperties: false
  required: [kind, command]
  properties:
    kind:
      type: string
      enum:
        [INITIAL_START, PAUSED_CONTINUATION, RETRYABLE_RECOVERY, PAUSE, STOP]
    command:
      type: string
      enum: [START, RESUME, PAUSE, STOP]
  description: The owner advertises only currently admitted command mappings; clients retain Start/Pause presentation and use existing signed command admission.

TaskMonitorPendingJudgmentAnswer:
  type: object
  additionalProperties: false
  required: [command, choices]
  properties:
    command:
      type: string
      enum: [HUMAN_DECISION]
      description: The signed monitor command that answers this request.
    choices:
      type: array
      items:
        type: string
        enum: [APPROVE, DENY]
  description: How a person answers a pending judgment through existing signed command admission.

TaskMonitorPendingJudgment:
  type: object
  additionalProperties: false
  required:
    [
      interventionId,
      providerActionId,
      runId,
      agentSessionId,
      action,
      target,
      fingerprint,
      reason,
      answer,
    ]
  properties:
    interventionId:
      type: string
      format: uuid
    providerActionId:
      type: string
      minLength: 1
    runId:
      type: string
      format: uuid
    agentSessionId:
      type: string
      format: uuid
    action:
      type: string
    target:
      type: string
    fingerprint:
      type: string
      minLength: 1
    reason:
      type: string
      description: Why a person, not the monitor, must decide this request.
    escalatedAt:
      type: string
      format: date-time
      description: When the request went to a person. Omitted for a request raised before the time was recorded.
    answer:
      $ref: "#/TaskMonitorPendingJudgmentAnswer"
  description: >-
    A provider request awaiting the user's judgment, reported as its own outcome and never as a
    failure. Present only once a person owns the request; a request the monitor is still deciding
    is not a pending judgment.

TaskMonitorOutstandingPermission:
  type: object
  additionalProperties: false
  required:
    [
      interventionId,
      runId,
      agentSessionId,
      providerActionId,
      providerSessionId,
      fingerprint,
      action,
      target,
      answerable,
    ]
  properties:
    interventionId:
      type: string
      format: uuid
    runId:
      type: string
      format: uuid
    agentSessionId:
      type: string
      format: uuid
    providerActionId:
      type: string
    providerSessionId:
      type: string
    fingerprint:
      type: string
    action:
      type: string
    target:
      type: string
    owner:
      type: string
      enum: [MONITOR, HUMAN]
      description: Current request owner, independent of temporary admission constraints.
    answerable:
      type: boolean
      description: The monitor admits a human answer for this request in its current state.

TaskMonitorStateProjection:
  type: object
  additionalProperties: false
  required: [execution, availableActions]
  properties:
    execution:
      $ref: "#/TaskMonitorExecutionCondition"
    failure:
      $ref: "#/TaskMonitorStateFailure"
    outstandingPermissions:
      type: array
      description: Undecided active and queued permission requests. Older publishers omit this field.
      items:
        $ref: "#/TaskMonitorOutstandingPermission"
    pendingJudgment:
      oneOf:
        - $ref: "#/TaskMonitorStatePendingJudgment"
        - $ref: "#/TaskMonitorPendingJudgment"
    availableActions:
      type: array
      items:
        $ref: "#/TaskMonitorLifecycleAction"
  description: Complete replacement snapshot. Omitted failure means the owner has no current failure, and omitted pendingJudgment means it awaits no judgment; freshness updates never remove a retained failure.

TaskMonitorStateObservation:
  type: object
  additionalProperties: false
  required: [taskMonitorId, machineId, sourceRevision, projection]
  properties:
    taskMonitorId:
      type: string
      format: uuid
    machineId:
      type: string
      format: uuid
    sourceRevision:
      type: integer
      format: int64
      minimum: 0
      description: Durable CLI machine revision; unchanged when replayed.
    projection:
      $ref: "#/TaskMonitorStateProjection"
  description: Sent on task_monitor.state_observed. Machine identity must match the authenticated connection and canonical owner. Platform derives project and organization scope.
