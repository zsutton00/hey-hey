      MOCKUP: "#/FeatureRequirementStoredMockupCitation"
      DIAGRAM: "#/FeatureRequirementStoredDiagramCitation"

FeatureRequirementStoredTaskCitation:
  allOf:
    - $ref: "#/FeatureRequirementStoredCitation"
    - type: object
