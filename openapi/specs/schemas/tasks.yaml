# Diagram metadata, canonical references and groups use schema-backed sections
# (diagramMetadata / diagramElementMetadata / diagramGroups) in generic CREATE
# and UPDATE shapes.
# Note: TaskStatus is now unified with InitiativeStatus as WorkStatus in common.yaml

TaskPriority:
  type: string
  enum:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
  description: The priority level of an item.
  example: "HIGH"

TaskSource:
  type: string
  enum:
    - system
    - user
    - agent
  description: Origin source for task creation.
  example: "system"

TaskType:
  type: string
  description: >
    Work-item type key. Values are registry-backed and may include system
    keys such as `STANDARD`, `BUG`, `FEATURE`, `GOAL`, `PLAN`, `PLAN_STAGE`,
    `CONTRACT`, `DIAGRAM`, `DIAGRAM_ELEMENT`, and `TASK_MONITOR`, or project-defined
    keys created at runtime.
  example: "STANDARD"

FeatureTag:
  type: string
  enum:
    - product
    - frontend
    - backend
    - infra
    - design
    - AI
  description: |
    Coarse-grained classification of what kind of work a FEATURE task
    represents. Single source of truth — every Feature-shaped DTO that
    surfaces the tag references this enum.

    Values:
      * `product` — user-facing product capabilities and outcomes.
      * `frontend` — client/UI-shaped delivery (web, mobile, surfaces).
      * `backend` — server/API/data-shaped delivery.
      * `infra` — platform, deployment, observability, build, runtime.
      * `design` — design-system, visual, or UX research deliverables.
      * `AI` — AI/agent-shaped delivery: prompts, agent orchestration, runners.

    Set on every FEATURE task at creation time. Other task types
    (STANDARD, BUG, GOAL) do not carry a tag.
  example: "backend"

TaskSortBy:
  type: string
  enum:
    - createdAt
    - updatedAt
    - title
    - status
    - priority
  description: Field to sort tasks by.
  example: "createdAt"

TaskSortDir:
  type: string
  enum:
    - asc
    - desc
  description: Sort direction for task listing.
  example: "desc"

TaskSectionKey:
  type: string
  enum:
    - description
    - acceptanceCriteria
    - requirements
    - graphPresentation
  description: Allowed section keys for task content. `requirements` is a feature-scoped section key.

TaskSection:
  type: object
  required:
    - key
    - order
  properties:
    id:
      type: string
      description: The section's unique id
    key:
      $ref: "#/TaskSectionKey"
    order:
      type: integer
      description: Ordering index for rendering sections.

TaskSectionInput:
  type: object
  required:
    - key
    - content
  properties:
    key:
      type: string
      description: Section key from the work-item type definition.
    content:
      description: >
        Section content to initialize or update. Markdown sections use strings;
        JSON sections use schema-backed values, html/css sections use the
        strict WorkItemHtmlCssSectionContent object, and structured-mockup
        sections use WorkItemStructuredMockupSectionContent.
      nullable: true
    order:
      type: integer
      description: Optional ordering index for rendering sections.

# ------------------------------------------------
# FEATURE structured requirements
# ------------------------------------------------
FeatureRequirementCitation:
