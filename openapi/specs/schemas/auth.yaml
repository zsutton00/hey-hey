# =============================================
# Authentication Schemas
# =============================================
AccountDefaultOrganizationDto:
  type: object
  additionalProperties: false
  required: [organizationId]
  properties:
    organizationId:
      type: string
      format: uuid
      nullable: true
      description: Explicit account preference; null means no saved choice. Never substitutes for an existing browser session selection.

SetAccountDefaultOrganizationDto:
  type: object
  additionalProperties: false
  required: [organizationId]
  properties:
    organizationId:
      type: string
      format: uuid
      description: Must match the valid browser session's confirmed organization and current authorized membership.

LocalBootstrapResponseDto:
  type: object
  additionalProperties: false
  required: [handoffToken, expiresInSeconds]
  properties:
    handoffToken:
      type: string
      minLength: 40
      description: >-
        One-use local browser handoff capability. Keep only in process memory
        and an ephemeral URL fragment; never persist or log it.
    expiresInSeconds:
      type: integer
      enum: [120]
      description: Handoff validity in seconds.

LocalCliCredentialsResponseDto:
  type: object
  additionalProperties: false
  required: [accessToken, refreshToken, expiresInSeconds]
  properties:
    accessToken:
      type: string
      description: Access token for the local application, held only in the CLI credential store.
    refreshToken:
      type: string
      description: Refresh token for the local application, held only in the CLI credential store.
    expiresInSeconds:
      type: integer
      minimum: 1
      description: Access token validity in seconds.

LocalHandoffRequestDto:
  type: object
  additionalProperties: false
  required: [handoffToken]
  properties:
    handoffToken:
      type: string
      minLength: 40

LocalNameRequestDto:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name only; not a login identifier or authentication factor.

LocalCodingAgentAvailability:
  type: string
  enum: [installed, not-found, check-failed]
  description: Whether the executable for one coding agent was found on this computer. It says nothing about login or model readiness.

LocalCodingAgentDetectionDto:
  type: object
  additionalProperties: false
  required: [claude, codex, opencode]
  description: Installed coding agents found by the local CLI, carried in the local pairing page URL fragment. Display information only; it never grants host authority and never contains paths, credentials or provider output.
  properties:
    claude:
      $ref: "#/LocalCodingAgentAvailability"
    codex:
      $ref: "#/LocalCodingAgentAvailability"
    opencode:
      $ref: "#/LocalCodingAgentAvailability"

LocalSetupStatusDto:
  type: object
  additionalProperties: false
  required:
    [
      nameComplete,
      browserSession,
      machineConnected,
      executionReady,
      hasProjects,
      setupProjectId,
    ]
  properties:
    nameComplete:
      type: boolean
    browserSession:
      type: boolean
    machineConnected:
      type: boolean
      description: True only while an authorized CLI machine has live Redis presence.
    executionReady:
      type: boolean
      description: True only while a connected protocol-2 machine has an active controller credential; each host action still requires its existing assertion or grant.
    hasProjects:
      type: boolean
      description: True when the local organization already contains a project, for automatic workspace return.
    setupProjectId:
      type: string
      format: uuid
      nullable: true
      description: The default project created when the name was saved, while it is still in onboarding and no other project has finished setup. First-project setup resumes this project; null once setup is complete or before the name is saved.

LoginDto:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: User's email address
    password:
      type: string
      minLength: 8
      description: User's password

PasswordRecoveryRequestDto:
  type: object
  additionalProperties: false
  required:
    - email
  properties:
    email:
      type: string
      format: email
      description: Email address for the identity requesting recovery

PasswordRecoveryAcknowledgementDto:
  type: object
  additionalProperties: false
  required:
    - message
  properties:
    message:
      type: string
      enum:
        - If an eligible account exists, recovery instructions will be sent.

RegisterDto:
  type: object
  required:
    - email
    - password
    - name
  properties:
    email:
      type: string
      format: email
      description: User's email address
    password:
      type: string
      minLength: 8
      description: User's password
    name:
      type: string
      description: User's full name
    organizationName:
      type: string
      description: Name for the user's default organization (optional)

BrowserAuthResponseDto:
  type: object
  description: >-
    Browser authentication response. Refresh continuity is maintained by
    HttpOnly cookies and is never returned in JSON. The user's currentOrganizationId
    is non-null and matches the confirmed organization in the access token.
  required:
    - user
    - accessToken
    - expiresIn
  properties:
    user:
      $ref: "#/UserResponseDto"
    accessToken:
      type: string
      description: Short-lived JWT access token for browser authorization
    expiresIn:
      type: integer
      description: Access-token expiration time in seconds
  additionalProperties: false

BrowserOrganizationChoiceDto:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string

BrowserOrganizationSelectionDto:
  type: object
  additionalProperties: false
  description: >-
    Authenticated browser identity requiring explicit organization selection.
    No access token is issued and user.currentOrganizationId is null.
    Choices are informational; an explicit request reauthorizes current access.
  required: [status, user, organizations]
  properties:
    status:
      type: string
      enum: [selection_required, selection_denied]
    user:
      $ref: "#/UserResponseDto"
    organizations:
      type: array
      items:
        $ref: "#/BrowserOrganizationChoiceDto"

BrowserSessionResponseDto:
  description: >-
    Establishes or atomically rotates cookie-only refresh continuity. Confirmed
    access has matching token and user organization IDs. Fresh sign-in restores
    an authorized saved organization, or selects the sole accessible organization
    when no choice is saved. Multiple accessible organizations without a saved
    choice return selection_required. Unauthorized stored or requested choices
    return selection_denied without selecting another membership. Selection
    outcomes persist null choice, clear prior access, and preserve browser identity.
  oneOf:
    - $ref: "#/BrowserAuthResponseDto"
    - $ref: "#/BrowserOrganizationSelectionDto"

RefreshBrowserSessionDto:
  type: object
  description: Optional explicit organization choice. Absence reauthorizes the stored choice; presence reauthorizes only the requested organization.
  properties:
    organizationId:
      type: string
      format: uuid
  additionalProperties: false

AuthResponseDto:
  type: object
  required:
    - user
    - accessToken
    - refreshToken
  properties:
    user:
      $ref: "#/UserResponseDto"
    accessToken:
      type: string
      description: JWT access token
    refreshToken:
      type: string
      description: Refresh token for token renewal
    expiresIn:
      type: integer
      description: Token expiration time in seconds

# =============================================
# User Schemas
# =============================================
UserResponseDto:
  type: object
  required:
    - id
    - email
    - name
    - isActive
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UserId"
    email:
      type: string
      format: email
      description: User's email address
    name:
      type: string
      description: User's full name
    isActive:
      type: boolean
      description: Whether the user account is active
    lastLoginAt:
      type: string
      format: date-time
      nullable: true
      description: Last login timestamp
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
    currentOrganizationId:
      allOf:
        - $ref: "./common.yaml#/OrganizationId"
      nullable: true
    isLocalAccount:
      type: boolean
      description: True only for the single-person identity bootstrapped by the local application. Its internal placeholder email must not be shown or sent to email flows.

# =============================================
# Password Change Schemas
# =============================================
ChangePasswordDto:
  type: object
  required:
    - passwordChangeToken
    - newPassword
  properties:
    passwordChangeToken:
      type: string
      description: >-
        Purpose-specific, single-use credential issued either at login when
        mustChangePassword is true, for an invited identity in a welcome link,
        or for account recovery. The credential is exchangeable only through
        the password-replacement operation and is validated against its
        persisted purpose and purpose-specific expiry policy.
    newPassword:
      type: string
      minLength: 8
      description: The new password to set

ChangeCurrentPasswordDto:
  type: object
  additionalProperties: false
  required:
    - currentPassword
    - newPassword
  properties:
    currentPassword:
      type: string
      minLength: 1
      description: The signed-in user's existing password; never returned or persisted.
    newPassword:
      type: string
      minLength: 8
      description: The replacement password.

PasswordChangeRequiredDto:
  type: object
  required:
    - mustChangePassword
    - passwordChangeToken
  properties:
    mustChangePassword:
      type: boolean
      description: Always true when this response is returned
    passwordChangeToken:
      type: string
      description: >-
        Purpose-specific, single-use credential for the change-password
        endpoint. Valid for no more than 15 minutes.

# =============================================
# Beta Onboarding Schemas
# =============================================
OnboardBetaUserDto:
  type: object
  required:
    - email
    - name
    - organizationName
  properties:
    email:
      type: string
      format: email
      description: Email address for the new beta user
    name:
      type: string
      description: Full name of the new beta user
    organizationName:
      type: string
      description: Name for the user's organization

OnboardBetaUserResponseDto:
  type: object
  required:
    - userId
    - organizationId
    - email
  properties:
    userId:
      $ref: "./common.yaml#/UserId"
    organizationId:
      $ref: "./common.yaml#/OrganizationId"
    email:
      type: string
      format: email
      description: The email address the welcome was sent to

PlatformAdminAccessDto:
  type: object
  required:
    - isPlatformAdmin
  properties:
    isPlatformAdmin:
      type: boolean
      description: >-
        Whether the caller is a platform admin, decided by the same allowlist
        the server applies to admin endpoints.

AccountPasskeyDto:
  type: object
  additionalProperties: false
  required: [id, name, createdAt, lastUsedAt, backedUp]
  properties:
    id:
      type: string
      format: uuid
      description: Identifier of the account passkey record.
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name chosen by the account owner.
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
      nullable: true
      description: Last successful sign-in or account proof with this passkey.
    backedUp:
      type: boolean
      description: Whether the authenticator reports the passkey as synced or backed up.

AccountPasskeyListDto:
  type: object
  additionalProperties: false
  required: [passkeys]
  properties:
    passkeys:
      type: array
      items:
        $ref: "#/AccountPasskeyDto"

AccountPasskeyRegistrationOptionsDto:
  type: object
  additionalProperties: false
  description: >-
    Inputs for navigator.credentials.create. The challenge is single-use,
    expires after five minutes, and is bound to the signed-in account and the
    acting browser session.
  required:
    [
      challenge,
      rpId,
      rpName,
      userHandle,
      userName,
      userDisplayName,
      excludeCredentialIds,
      timeoutMs,
    ]
  properties:
    challenge:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"
    rpId:
      type: string
    rpName:
      type: string
    userHandle:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"
      description: Base64url WebAuthn user handle for this account.
    userName:
      type: string
    userDisplayName:
      type: string
    excludeCredentialIds:
      type: array
      items:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
    timeoutMs:
      type: integer

AccountPasskeyAssertionOptionsDto:
  type: object
  additionalProperties: false
  description: >-
    Inputs for navigator.credentials.get. The challenge is single-use, expires
    after five minutes, and is accepted only for the purpose it was issued for.
  required: [challenge, rpId, allowCredentialIds, timeoutMs]
  properties:
    challenge:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"
    rpId:
      type: string
    allowCredentialIds:
      type: array
      description: Empty for discoverable sign-in; the account's own passkeys for account proof.
      items:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
    timeoutMs:
      type: integer

AccountPasskeyProofOptionsRequestDto:
  type: object
  additionalProperties: false
  required: [operation]
  properties:
    operation:
      type: string
      enum: [register, remove]
    passkeyId:
      type: string
      format: uuid
      description: Required when operation is remove; the passkey that will be removed.

AccountPasskeyRegistrationCredentialDto:
  type: object
  additionalProperties: false
  required: [id, rawId, type, response]
  properties:
    id:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9_-]+$"
    rawId:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9_-]+$"
    type:
      type: string
      enum: [public-key]
    authenticatorAttachment:
      type: string
      enum: [platform, cross-platform]
      nullable: true
    response:
      type: object
      additionalProperties: false
      required: [clientDataJSON, attestationObject, transports]
      properties:
        clientDataJSON:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
        attestationObject:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
        transports:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [ble, cable, hybrid, internal, nfc, smart-card, usb]

AccountPasskeyAssertionCredentialDto:
  type: object
  additionalProperties: false
  required: [id, rawId, type, response]
  properties:
    id:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9_-]+$"
    rawId:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9_-]+$"
    type:
      type: string
      enum: [public-key]
    authenticatorAttachment:
      type: string
      enum: [platform, cross-platform]
      nullable: true
    response:
      type: object
      additionalProperties: false
      required: [clientDataJSON, authenticatorData, signature, userHandle]
      properties:
        clientDataJSON:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
        authenticatorData:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
        signature:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
        userHandle:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9_-]*$"

AccountProofDto:
  type: object
  additionalProperties: false
  description: >-
    Fresh proof of account ownership. Supply exactly one of the current
    password or an assertion from one of the account's own passkeys answering
    a proof challenge issued for this operation.
  properties:
    currentPassword:
      type: string
      minLength: 1
      maxLength: 1024
    passkeyAssertion:
      $ref: "#/AccountPasskeyAssertionCredentialDto"

AccountPasskeySignInDto:
  type: object
  additionalProperties: false
  required: [credential]
  properties:
    credential:
      $ref: "#/AccountPasskeyAssertionCredentialDto"

AccountPasskeyRegistrationDto:
  type: object
  additionalProperties: false
  required: [name, credential, proof]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    credential:
      $ref: "#/AccountPasskeyRegistrationCredentialDto"
    proof:
      $ref: "#/AccountProofDto"

AccountPasskeyRenameDto:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100

AccountPasskeyRemovalDto:
  type: object
  additionalProperties: false
  required: [proof]
  properties:
    proof:
      $ref: "#/AccountProofDto"

DevAdminModeDto:
  type: object
  additionalProperties: false
  required: [devAdminMode]
  properties:
    devAdminMode:
      type: boolean
      description: Whether dev-admin mode is now on. The browser renews its session to pick it up.
