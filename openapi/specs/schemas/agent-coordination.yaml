    description:
      type: string
    status:
      type: string
    goals:
      type: array
      items:
        type: string
    constraints:
      type: array
      items:
        type: string
    timeline:
      type: string

EntityConversationPlanSummary:
  type: object
  required:
    - title
    - outcome
  properties:
    title:
      type: string
    outcome:
      type: string
    description:
      type: string
    status:
      type: string

EntityConversationTaskRequest:
  allOf:
    - $ref: "#/EntityConversationBaseRequest"
    - type: object
      required:
        - entityType
        - entity
      properties:
        entityType:
          type: string
          enum:
            - task
        entity:
          $ref: "#/EntityConversationTaskSummary"

EntityConversationInitiativeRequest:
  allOf:
    - $ref: "#/EntityConversationBaseRequest"
    - type: object
      required:
        - entityType
        - entity
      properties:
        entityType:
          type: string
          enum:
            - initiative
        entity:
          $ref: "#/EntityConversationInitiativeSummary"

EntityConversationDesignDocRequest:
  allOf:
    - $ref: "#/EntityConversationBaseRequest"
    - type: object
      required:
        - entityType
        - entity
      properties:
        entityType:
          type: string
          enum:
            - design-doc
        entity:
          $ref: "#/EntityConversationDesignDocSummary"

EntityConversationAgentSessionRequest:
  allOf:
    - $ref: "#/EntityConversationBaseRequest"
    - type: object
      required:
        - entityType
        - entity
      properties:
        entityType:
          type: string
          enum:
            - agent-session
        entity:
          $ref: "#/EntityConversationAgentSessionSummary"

EntityConversationProjectRequest:
  allOf:
