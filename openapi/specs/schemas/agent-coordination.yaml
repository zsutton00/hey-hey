EntityConversationPlanRequest:
  allOf:
    - $ref: "#/EntityConversationBaseRequest"
    - type: object
      required:
        - entityType
        - entity
      properties:
        entityType:
          type: string
          enum:
            - plan
        entity:
          $ref: "#/EntityConversationPlanSummary"

EntityConversationRequest:
  oneOf:
    - $ref: "#/EntityConversationTaskRequest"
    - $ref: "#/EntityConversationInitiativeRequest"
    - $ref: "#/EntityConversationDesignDocRequest"
    - $ref: "#/EntityConversationAgentSessionRequest"
    - $ref: "#/EntityConversationProjectRequest"
    - $ref: "#/EntityConversationPlanRequest"

EntityConversationSuggestedAction:
  type: string
  enum:
    - generate_task
    - generate_step_task
    - generate_inititiave
    - generate_design_doc
    - generate_step_design_doc
    - generate_agent_session

EntityConversationResponse:
  type: object
  required:
    - response
    - relatedEntities
  properties:
    response:
      type: string
    suggestedActions:
      type: array
      items:
        $ref: "#/EntityConversationSuggestedAction"
    influences:
      type: array
      items:
        $ref: "./artifacts.yaml#/Influence"
    relatedEntities:
      type: array
      items:
        $ref: "#/RelatedEntityDto"
