# =============================================
# Activity Delta Schemas
# Contract between API service and Agents service for daily-session workflow.
# Defines how activity deltas flow from the API node to the Agents service.
# =============================================

ActivityDeltaStatusChange:
  type: object
  required:
    - entityId
    - entityType
    - previousStatus
    - currentStatus
    - changedAt
  properties:
    entityId:
      type: string
      format: uuid
      description: ID of the entity whose status changed
    entityType:
      $ref: "./common.yaml#/EntityType"
    title:
      type: string
      description: Human-readable title of the entity
    previousStatus:
      type: string
      description: Status before the transition
      example: "IN_PROGRESS"
    currentStatus:
      type: string
      description: Status after the transition
      example: "COMPLETED"
    changedAt:
      type: string
      format: date-time
      description: Timestamp when the status transition occurred

ActivityDeltaItemCompletion:
  type: object
  required:
    - entityId
    - entityType
    - completedAt
  properties:
    entityId:
      type: string
      format: uuid
      description: ID of the completed entity
    entityType:
      $ref: "./common.yaml#/EntityType"
    title:
      type: string
      description: Human-readable title of the completed entity
    completedAt:
      type: string
      format: date-time
      description: Timestamp when the item was completed

ActivityDeltaNewSignal:
  type: object
  required:
    - entityId
    - entityType
    - signalType
    - receivedAt
  properties:
    entityId:
      type: string
      format: uuid
      description: ID of the entity that received the signal
    entityType:
      $ref: "./common.yaml#/EntityType"
    title:
      type: string
      description: Human-readable title of the entity
    signalType:
      type: string
      description: Type of signal received (e.g., new message, mention, review request)
      example: "new_message"
    summary:
      type: string
      description: Brief human-readable summary of the signal
    receivedAt:
      type: string
      format: date-time
      description: Timestamp when the signal was received

ActivityDelta:
  type: object
  required:
    - statusChanges
    - itemCompletions
    - newSignals
    - computedAt
  properties:
    statusChanges:
      type: array
      items:
        $ref: "#/ActivityDeltaStatusChange"
      description: Status transitions detected since the activity snapshot was taken
    itemCompletions:
      type: array
      items:
        $ref: "#/ActivityDeltaItemCompletion"
      description: Items that reached a completed state since the snapshot
    newSignals:
      type: array
      items:
        $ref: "#/ActivityDeltaNewSignal"
      description: New signals (messages, mentions, reviews) received since the snapshot
    computedAt:
      type: string
      format: date-time
      description: Timestamp when this delta was computed by the API service

ActivityRecordLinkType:
  type: string
  enum:
    - SELF
    - PARENT
    - CHILD
    - SIBLING
    - DEPENDS_ON
    - BLOCKS
    - RELATED
  description: Relationship between the originating entity and a linked entity in an activity record.

ActivityRecordLinkedEntity:
  type: object
  required:
    - entityId
    - entityType
    - linkType
    - title
  properties:
    entityId:
      type: string
      format: uuid
    entityType:
      $ref: "./common.yaml#/EntityType"
    linkType:
      $ref: "#/ActivityRecordLinkType"
    title:
      type: string
      description: Human-readable title/name for the linked entity.
    updatedAt:
      type: string
      format: date-time
      description: The entity's most recent graph-backed update timestamp, when available.
    status:
      type: string
      description: Current task or agent session status when upstream data is available for this entity.
    conversationId:
      type: string
      format: uuid
      nullable: true
      description: The most recent conversation associated with this entity, if any.
    lastMessage:
      type: object
      nullable: true
      description: The latest message in the agent session conversation when this linked entity is an agent session. Passed through as an opaque object.

ActivityRecordPlanContext:
  type: object
  properties:
    planId:
      type: string
      format: uuid
      description: Unique identifier for a plan.
    planTitle:
      type: string
      description: Human-readable title for the plan.
    planStageId:
      type: string
      format: uuid
      description: Unique identifier for a plan stage.
    planStageTitle:
      type: string
      description: Human-readable title for the plan stage.
    planStepId:
      type: string
      format: uuid
      description: Unique identifier for a plan step.
    planStepTitle:
      type: string
      description: Human-readable title for the plan step.

ActivityRecord:
  type: object
  required:
    - entityId
    - entityType
    - title
    - timestamp
    - linkedEntities
    - reports
  properties:
    entityId:
      type: string
      format: uuid
    entityType:
      $ref: "./common.yaml#/EntityType"
    title:
      type: string
      description: Human-readable title for the activity record.
    status:
      type: string
      description: Current status when available.
    timestamp:
      type: string
      format: date-time
      description: Ranking timestamp for this record.
    updatedAt:
      type: string
      format: date-time
      description: Most recent update timestamp when available.
    linkedEntities:
      type: array
      items:
        $ref: "#/ActivityRecordLinkedEntity"
      description: Entities linked to this activity record (parent, child, sibling, etc.).
    reports:
      type: array
      items:
        type: object
      description: Report snapshots associated with this record. Passed through as opaque objects.
    conversationId:
      type: string
      format: uuid
      nullable: true
      description: Most recent conversation associated with this record, if any.
    lastMessage:
      type: object
      nullable: true
      description: The latest message in the conversation when this record represents an agent session. Passed through as an opaque object.
    plan:
      $ref: "#/ActivityRecordPlanContext"

ActivityDeltaPayload:
  type: object
  required:
    - payloadVersion
    - computedDelta
    - activitySnapshot
  properties:
    payloadVersion:
      type: integer
      minimum: 1
      description: Schema version for backward compatibility. Increment when breaking changes are introduced.
      example: 1
    activitySnapshot:
      type: array
      items:
        $ref: "#/ActivityRecord"
      description: Activity state snapshot taken at session start, used as the baseline for delta computation
    computedDelta:
      $ref: "#/ActivityDelta"
      description: Computed differences between the activity snapshot and current state
    lastSystemMessage:
      type: string
      description: The most recent system message from the conversation, providing continuity context for the agent
    lastUserActivities:
      type: array
      items:
        $ref: "#/ActivityRecord"
      description: Recent user activity records correlated to the current session
    conversationId:
      $ref: "./common.yaml#/ConversationId"
      description: Conversation this delta payload belongs to
    sessionStartedAt:
      type: string
      format: date-time
      description: Timestamp when the daily session began, anchoring the snapshot baseline

DailySessionRequest:
  description: >
    Request payload for the daily session workflow. Extends the API-side
    ActivityDeltaPayload with agent-workflow fields (lastUserMessage,
    recentConversationMessages).
  allOf:
    - $ref: "#/ActivityDeltaPayload"
    - type: object
      required:
        - lastUserMessage
      properties:
        lastUserMessage:
          type: string
          description: Latest user message to respond to
        recentConversationMessages:
          type: array
          items:
            $ref: "#/ConversationMessage"
          description: Recent conversation messages for context continuity and de-duplication

DailySessionSuggestedAction:
  type: string
  enum:
    - review_item
    - follow_up
    - continue_work

DailySessionResponse:
  type: object
  required:
    - response
    - relatedEntities
    - conversationTitle
  properties:
    response:
      type: string
      description: Natural-language response from the daily session writer
    conversationTitle:
      type: string
      maxLength: 50
      description: Short title for the conversation (max 50 characters)
    suggestedActions:
      type: array
      items:
        $ref: "#/DailySessionSuggestedAction"
    influences:
      type: array
      items:
        $ref: "./artifacts.yaml#/Influence"
    relatedEntities:
      type: array
      items:
        $ref: "#/RelatedEntityDto"
    usage:
      allOf:
        - $ref: "#/UsageSummary"
      nullable: true

RelatedEntityDto:
  type: object
  required:
    - entityId
    - entityType
    - entityName
  properties:
    entityId:
      type: string
      description: Related entity identifier
    entityType:
      type: string
      description: Related entity type
    entityName:
      type: string
      description: Display name for the related entity
    writerPayloadMode:
      type: string
      enum:
        - full_document
        - summary_only
        - excluded
      description: How this entity's evidence would be included in writer context
    selectedForHydration:
      type: boolean
      description: Whether this entity was selected for full-document hydration
    hydrated:
      type: boolean
      description: Whether full-document hydration succeeded for this entity
