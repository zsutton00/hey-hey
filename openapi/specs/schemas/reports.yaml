  properties:
    messageId:
      type: string
      format: uuid
      description: >
        Carrier message id minted atomically with the report when the
        create request carries conversation context and no source message
        id. Omitted when no carrier message is minted.
    reportGuidance:
      $ref: "./trigger-payloads.yaml#/SessionMonitorReportGuidance"

CreateReportResponseDtoOther:
  allOf:
    - $ref: "#/ReportDtoOther"
