ReportDto:
  type: object
  required:
    - id
    - organizationId
    - reportType
    - audience
    - title
    - payload
    - version
    - schemaVersion
    - createdAt
    - expiresAt
    - entities
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
