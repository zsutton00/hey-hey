CreateReportEntityDto:
  type: object
  required:
    - entityType
    - entityId
    - relation
  properties:
    entityType:
      $ref: "#/ReportRelatedEntityType"
    entityId:
      type: string
      format: uuid
    relation:
      $ref: "#/ReportEntityRelation"

LinkedReportEntityRef:
  type: object
  description: >
    Typed `{ entityType, entityId }` pair referenced inline in a report's
    body (e.g. an @-mention inside a `COMPETITIVE_ANALYSIS` or
    `FEATURE_TREE_ANALYSIS` payload's `text` field). Distinct from
    `CreateReportEntityDto` — these have no relation; the service always
    persists them as `CONTEXT` rows on the report.
  required:
    - entityType
    - entityId
  properties:
    entityType:
      $ref: "#/ReportRelatedEntityType"
    entityId:
      type: string
      format: uuid

ReportEntityDto:
  type: object
  required:
    - entityType
    - entityId
    - relation
    - createdAt
  properties:
    entityType:
      $ref: "#/ReportRelatedEntityType"
    entityId:
      type: string
      format: uuid
    relation:
      $ref: "#/ReportEntityRelation"
    displayName:
      type: string
      description: Human-readable name resolved from the entity registry
    createdAt:
      type: string
      format: date-time

CreateReportDto:
  oneOf:
    - $ref: "#/CreateReportDtoOther"
    - $ref: "#/CreateReportDtoFeatureSyncDecisionV1"
    - $ref: "#/CreateReportDtoFeatureSyncDecisionV2"

CreateReportDtoBase:
  type: object
  required:
    - audience
  properties:
    projectId:
      type: string
      format: uuid
      nullable: true
      description: Optional project scope for the report
    audience:
      $ref: "#/ReportAudience"
    expiresAt:
      type: string
      format: date-time
      nullable: true
      description: Optional explicit expiration timestamp; defaults to retention policy
    neverExpires:
      type: boolean
      default: false
      description: >
        When true the report is exempt from the retention-policy expiry and
        lives until the entity it is attached to is deleted. expiresAt must
        then be omitted. Eval run-record reports (EVAL_RUN, EVAL_ATTEMPT,
        EVAL_HUMAN_REVIEW) are created with this set.
    agent:
      type: string
      nullable: true
      description: >
        Optional report-level agent identity for the emitting run/session.
        This is shared envelope metadata and must not be duplicated inside
        individual report payload variants.
    sourceExecutionId:
      type: string
      format: uuid
      nullable: true
      description: Optional originating flow execution id
    parentReportId:
      type: string
      format: uuid
      nullable: true
      description: Optional parent report ID for hierarchical grouping
    entities:
      type: array
      items:
        $ref: "#/CreateReportEntityDto"
    linkedEntities:
      type: array
      description: >
        Optional list of typed `{ entityType, entityId }` references
        for entities mentioned inline in the report's body (e.g.
        @-mentions inside a `COMPETITIVE_ANALYSIS` or
        `FEATURE_TREE_ANALYSIS` payload's `text` field). Each entry
        materializes a `CONTEXT` row on the report alongside the
        structured `entities[]` relationships, which describe the
        report's primary/context anchoring rather than inline body
        references. Optional and additive — reports that omit it are
        valid.
      items:
        $ref: "#/LinkedReportEntityRef"

CreateReportDtoOther:
  allOf:
    - $ref: "#/CreateReportDtoBase"
    - type: object
      required: [payload, reportType]
      properties:
        reportType:
          type: string
          enum: [PROJECT_REPORT, CODING_RESEARCH, EVIDENCE_PIPELINE, SNAPSHOT, ROLLUP_PROPOSAL, DAILY_SESSION, GOAL_PROGRESS, RISK_ALERT, SESSION_SUMMARY, COMMIT, PLAN, IMPLEMENT, REVIEW, CHANGE_WALKTHROUGH, FEATURE_SYNC, FEATURE_SYNC_HANDOFF, DECISION_NEEDED, PHASE_GROUNDING, VALIDATION_WALKTHROUGH, FEATURE_TREE_ANALYSIS, COMPETITIVE_ANALYSIS, SESSION_MONITOR_DEFERRAL, EVAL_RUN, EVAL_ATTEMPT, EVAL_HUMAN_REVIEW]
        payload:
          $ref: "#/OtherReportPayload"
        schemaVersion:
          type: integer
          default: 1

CreateReportDtoFeatureSyncDecisionV1:
  allOf:
    - $ref: "#/CreateReportDtoBase"
    - type: object
      required: [payload, reportType]
      properties:
        reportType:
          type: string
          enum: [FEATURE_SYNC_DECISION]
        payload:
          $ref: "#/FeatureSyncDecisionReportPayloadV1"
        schemaVersion:
          type: integer
          enum: [1]
          default: 1

CreateReportDtoFeatureSyncDecisionV2:
  allOf:
    - $ref: "#/CreateReportDtoBase"
    - type: object
      required: [payload, reportType, schemaVersion]
      properties:
        reportType:
          type: string
          enum: [FEATURE_SYNC_DECISION]
        payload:
          $ref: "#/FeatureSyncDecisionReportPayloadV2"
        schemaVersion:
          type: integer
          enum: [2]

UpdateReportDto:
  oneOf:
