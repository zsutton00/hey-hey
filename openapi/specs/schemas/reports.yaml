      type: integer
    schemaVersion:
      type: integer
    agent:
      type: string
      nullable: true
      description: >
        Optional report-level agent identity for the emitting run/session.
        Conversation viewers may use this value to place reports with
        compatible agent-authored messages before falling back to timestamp
        proximity.
    sourceExecutionId:
      type: string
      format: uuid
      nullable: true
    parentReportId:
      type: string
