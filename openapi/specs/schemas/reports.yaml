      nullable: true
      description: Parent report ID for hierarchical grouping
    ragEnabled:
      type: boolean
      description: >
        Whether this report may be ingested into graph and embeddings. Absent
        means true. Derived by the API, never set by clients. A reusable
        exclusion control, not an approval flag.
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
      nullable: true
      description: Null when the report never expires.
    entities:
      type: array
      items:
