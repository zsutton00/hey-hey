ReportSummaryDto:
  type: object
  description: >
    Compact report summary returned by `list_reports_by_entity`. Carries only
    the fields needed to render a list row and follow up with a full fetch.
  required:
    - id
    - reportType
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    reportType:
      $ref: "#/ReportType"
    sourceExecution:
      type: string
      format: uuid
      nullable: true
      description: Originating flow execution id, when one is attached.
    createdAt:
      type: string
      format: date-time
CreateReportCompletedAttempt:
  type: object
  required: [code, requestId, attemptId, reportId]
  properties:
    code:
      type: string
      enum: [PROJECT_REPORT_ATTEMPT_COMPLETED]
    requestId:
      type: string
      format: uuid
    attemptId:
      type: string
      format: uuid
    reportId:
      type: string
      format: uuid

CreateReportCompletedAttemptError:
  allOf:
    - $ref: './common.yaml#/ApiErrorResponse'
    - type: object
      required: [code, data]
      properties:
        code:
          type: string
          enum: [PROJECT_REPORT_ATTEMPT_COMPLETED]
        data:
          $ref: '#/CreateReportCompletedAttempt'

ChangeWalkthroughWorkspaceSource:
  type: object
  additionalProperties: false
  required: [kind]
  properties:
    kind:
      type: string
      enum: [WORKSPACE]
ChangeWalkthroughGitSource:
  type: object
  additionalProperties: false
  required: [kind, revision]
  properties:
    kind:
      type: string
      enum: [GIT]
    revision:
      type: string
      pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
      description: Immutable full Git commit object ID.
ChangeWalkthroughSourceVersion:
  oneOf:
    - $ref: '#/ChangeWalkthroughWorkspaceSource'
    - $ref: '#/ChangeWalkthroughGitSource'
ChangeWalkthroughVerifiedSource:
  type: object
  additionalProperties: false
  required: [status, checkedAt]
  properties:
    status:
      type: string
      enum: [VERIFIED]
    checkedAt:
      type: string
      format: date-time
ChangeWalkthroughUnresolvedSource:
  type: object
  additionalProperties: false
  required: [status, reason]
  properties:
    status:
      type: string
      enum: [UNRESOLVED]
    reason:
      type: string
      minLength: 1
ChangeWalkthroughSourceVerification:
  description: Host-computed evidence at submission time. Revalidate before opening current source.
  oneOf:
    - $ref: '#/ChangeWalkthroughVerifiedSource'
    - $ref: '#/ChangeWalkthroughUnresolvedSource'
ChangeWalkthroughExcerpt:
  type: object
  required: [serviceId, file, startLine, endLine, language, code, sourceVersion, verification]
  properties:
    serviceId:
      type: string
      format: uuid
    file:
      type: string
      minLength: 1
      description: Normalized repository-relative POSIX path with no absolute, dot, parent, empty or backslash segments. Invalid references are retained as UNRESOLVED.
    startLine:
      type: integer
      minimum: 1
    endLine:
      type: integer
      minimum: 1
      description: Inclusive end, at least startLine. Invalid ranges are UNRESOLVED.
    language:
      type: string
    code:
      type: string
      description: Exact literal lines joined with newline, excluding the final line separator.
    sourceVersion:
      $ref: '#/ChangeWalkthroughSourceVersion'
    verification:
      $ref: '#/ChangeWalkthroughSourceVerification'
ChangeWalkthroughStep:
  type: object
  required: [excerpt, explanation]
  properties:
    excerpt:
      $ref: '#/ChangeWalkthroughExcerpt'
    explanation:
      type: string
ChangeWalkthroughChange:
  type: object
  required: [title, context, walkthrough, behavioralConsequence]
  properties:
    title:
      type: string
    context:
      type: string
    walkthrough:
      type: array
      items:
        $ref: '#/ChangeWalkthroughStep'
    behavioralConsequence:
      type: string
ChangeWalkthroughGroup:
  type: object
  required: [title, changes]
  properties:
    title:
      type: string
    changes:
      type: array
      items:
        $ref: '#/ChangeWalkthroughChange'
ChangeWalkthroughReportPayload:
  description: Guided behavioral changes in importance order with inspected literal excerpts and immediate explanations. Required Review output, not a repair-authority gate.
  allOf:
    - $ref: '#/BaseReportPayload'
  type: object
  required: [reportType, summary, targetRunId, groups]
  properties:
    reportType:
      type: string
      enum: [CHANGE_WALKTHROUGH]
    summary:
      type: string
    targetRunId:
      type: string
      format: uuid
      description: Host-stamped reviewed Run identity whose resolved Service workspaces supply source authority.
    groups:
      type: array
      items:
        $ref: '#/ChangeWalkthroughGroup'
