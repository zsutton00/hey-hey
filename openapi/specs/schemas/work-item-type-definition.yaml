# =============================================
# Work-Item Type Definition Schemas
# =============================================
# The canonical type-definition payload shared by the three actors that
# handle a drafted work-item type: the agent/admin that composes it, the
# submit tool that accepts it, and the validator that checks it before it
# becomes a proposal. The submit tool's input schema *is* this contract —
# there is no separate structured-output schema — so the spec shape and the
# server-side check at submit time are the only authority. Keep this in
# lockstep with the WORK_ITEM_TYPE proposal target in proposals.yaml and the
# work_item_type registry table in the API.

WorkItemTypeKey:
  type: string
  description: >
    An open work-item type key — either one of the system values (STANDARD,
    FEATURE, GOAL, BUG, PLAN, PLAN_STAGE, CONTRACT, DIAGRAM, DIAGRAM_ELEMENT,
    TASK_MONITOR) or a project-scoped custom key (e.g. "MARKETING"). Used
    wherever a type filter or type reference must
    accept custom types registered via the work-item type registry.
  example: "STANDARD"

WorkItemIconKey:
  type: string
  enum:
    - task
    - bug
    - feature
    - goal
    - contract
    - design
    - decision
    - workflow
    - plan
    - plan-stage
    - star
    - flag
    - folder
    - book
    - lightbulb
    - science
    - code
    - database
    - link
    - people
    - chat
    - calendar
    - timer
    - chart
    - shield
  description: Closed UI presentation palette token resolved by shared clients; registry data never contains component names or asset paths.

WorkItemColorKey:
  type: string
  enum: [primary, secondary, success, warning, error, info]
  description: Curated theme color token. Only PROJECT_CUSTOM definitions may author a color; canonical definitions and overrides retain platform colors. Omission restores the default presentation.

WorkItemTypeRole:
  type: string
  enum:
    - work-item
    - project-info
    - scheduled
    - trigger
    - monitor
  description: >
    Classification-only role for a work-item type. The role lets consumers
    group definitions by purpose without branching on stable type keys. It
    does not define lifecycle, scheduling, triggering, capability, status,
    parentage, or execution behavior.

WorkItemConfigKind:
  type: string
  enum:
    - INITIAL_WORKTREE
  description: |
    Explicit launch-configuration kind accepted by a work-item type. The
    registry policy uses this closed vocabulary; eligibility is never inferred
    from the work-item type key or role.

WorkItemConfigV1:
  type: object
  additionalProperties: false
  required:
    - kind
    - version
  properties:
    kind:
      $ref: "#/WorkItemConfigKind"
      description: Discriminator for the launch-configuration semantics.
    version:
      type: string
      enum: ["v1"]
      description: |
        Schema-version literal for this launch-configuration kind. A future
        required-field change must mint a new version rather than changing v1.
    initialWorktreeBranch:
      type: string
      minLength: 1
      nullable: true
      description: |
        Optional branch default for coding-session setup. Null or omission
        means no stored branch choice; creating the work item never creates a
        checkout or materializes a worktree.
  description: First version of the generic work-item launch configuration envelope.

WorkItemConfig:
  oneOf:
    - $ref: "#/WorkItemConfigV1"
  discriminator:
    propertyName: kind
    mapping:
      INITIAL_WORKTREE: "#/WorkItemConfigV1"
  description: |
    Discriminated union of typed, versioned launch configuration envelopes.
    The kind selects the configuration semantics and version evolves the
    shape within that kind.

WorkItemTypeDefinitionDto:
  type: object
  additionalProperties: false
  description: >
    A complete work-item-type definition — the serialized registry
    config for one type, composed by the agentic drafter or the admin
    form and submitted as a WORK_ITEM_TYPE proposal. Canonical-seeded and
    project-authored custom definitions use this same shape and declare the
    same axes.
  required:
    - key
    - name
    - role
    - sections
    - allowedStatuses
  properties:
    key:
      type: string
      description: >
        Stable registry identifier for the type (e.g. "MARKETING" or
        "WORKFLOW_STEP"). This is the value carried on a work item's `type`,
        the `{typeKey}` path segment on the /work-item-types endpoints, and
        the key get_tool_guidance is requested by. Immutable once a type is
        created.
      example: "WORKFLOW"
    name:
      type: string
      description: Human-readable display name shown in create flows and review surfaces.
      example: "Marketing"
    agentGuidance:
      $ref: "#/WorkItemTypeAgentGuidance"
    sessionRoleGuidance:
      $ref: "#/WorkItemTypeSessionRoleGuidance"
    maintenanceGuidance:
      type: string
      description: Optional type-owned advice for maintaining items of this type.
    role:
      $ref: "#/WorkItemTypeRole"
    acceptedConfigKinds:
      type: array
      items:
        $ref: "#/WorkItemConfigKind"
      description: |
        Launch-configuration kinds explicitly accepted for this effective
        work-item type definition. Omitted legacy policy is treated as an
        empty array; consumers must not infer acceptance from key, role, or
        another capability.
    iconKey:
      $ref: "#/WorkItemIconKey"
      description: Optional registry-backed UI icon identity. Missing values fail closed in type-specific consumers.
    colorKey:
      $ref: "#/WorkItemColorKey"
      description: Optional independent custom-type theme color. Omit to clear the stored selection. Forbidden on canonical definitions and canonical overrides.
    description:
      type: string
      nullable: true
      description: One-paragraph purpose of the type — what work it captures and when to reach for it.
    sections:
      type: array
      description: >
        Ordered per-type content sections. Each section carries its own
        writing standard, so the authoring contract for an item of this type
        is fully described by its definition.
      items:
        $ref: "#/WorkItemTypeSectionDefinition"
    requiredScalars:
      type: array
      description: >
        Scalar fields an item of this type must carry. Each entry names a
        field from the closed WorkItemTypeScalarField set; membership here
        means an item cannot be created without that field.
      items:
        $ref: "#/WorkItemTypeScalarField"
    forbiddenScalars:
      type: array
      description: >
        Scalar fields an item of this type may not carry. Each entry names a
        field from the closed WorkItemTypeScalarField set; membership here
        means the field is rejected on items of this type. A field absent
        from both lists is optional.
      items:
        $ref: "#/WorkItemTypeScalarField"
    allowedStatuses:
      type: array
      description: >
        The work statuses an item of this type may occupy. Reuses the shared
        WorkStatus enum rather than declaring a type-local status set.
      items:
        $ref: "./common.yaml#/WorkStatus"
    allowedParentTypes:
      type: array
      description: >
        Type keys an item of this type may be parented under. An empty array
        means the type is top-level only.
      items:
        $ref: "#/WorkItemTypeKey"
      example: ["FEATURE"]
    edgeTargets:
      type: array
      description: >
        Which typed edges an item of this type may originate, and the type
        keys each edge may point at. Reuses the shared AgentEdgeType enum.
      items:
        $ref: "#/WorkItemTypeEdgeTarget"
    allowedParentEntityTypes:
      type: array
      description: >
        Entity types (not type keys) an item of this type may be parented
        under — the EntityType-grained parentage axis the engine reads,
        distinct from the type-key `allowedParentTypes` above. The list is
        evaluated literally: an empty array permits no EntityType parent.
      items:
        $ref: "./common.yaml#/EntityType"
    tracking:
      $ref: "#/WorkItemTypeTracking"
    agentSettableStatuses:
      type: array
      description: >
        The subset of `allowedStatuses` an agent may set directly on an item
        of this type. Statuses the engine reserves for system transitions are
        absent here. Reuses the shared WorkStatus enum.
      items:
        $ref: "./common.yaml#/WorkStatus"
    anchorableReportTypes:
      type: array
      description: >
        Report types that may be anchored to an item of this type. Reuses the
        shared ReportType enum. An empty array means no report type anchors to
        this type.
      items:
        $ref: "./reports.yaml#/ReportType"
    writingStandards:
      allOf:
        - $ref: "#/WorkItemTypeWritingStandards"
      nullable: true
      description: >
        Type-level authoring prose an agent reads before creating or editing
        an item of this type — distinct from the per-section
        `writingStandard`. Split by authoring mode (create / edit). Null when
        the type carries no type-level standards.
    capabilities:
      $ref: "#/WorkItemTypeCapabilities"

WorkItemTypeSectionDefinition:
  type: object
  description: One content section in a work-item type, with the writing standard that governs it.
  required:
    - key
    - label
  properties:
    key:
      type: string
      description: Stable identifier for the section within the type (e.g. "audience").
      example: "audience"
    label:
      type: string
      description: Human-readable section heading shown in the editor and review surfaces.
      example: "Target audience"
    writingStandard:
      type: string
      nullable: true
      description: >
        Guidance describing what belongs in this section and to what quality
        bar — the per-section authoring contract surfaced to drafters.
    kind:
      type: string
      enum:
        - markdown
        - json
        - html/css
        - structured-mockup
      default: markdown
      description: >
        Storage and editor kind for the section. Markdown sections store prose;
        json sections store a schema-backed JSON document; html/css sections
        store a strict object with required string `html` and `css` fields;
        structured-mockup sections store a versioned, host-rendered component
        document.
        All kinds are serialized through the shared work-item section boundary.
    schemaRef:
      type: string
      nullable: true
      description: >
        OpenAPI component schema reference for json sections. Omitted for
        markdown, html/css, and structured-mockup sections.
    sizeProfiles:
      type: array
      minItems: 1
      items:
        $ref: "#/WorkItemHtmlCssSizeProfile"
      description: >
        Ordered, named presentation profiles available to authors of an
        html/css or structured-mockup section. Omitted for markdown and json
        sections. Dimension policy belongs to the definition; item content
        stores only sizeKey.
    diagramElementPolicy:
      $ref: "#/DiagramElementPolicy"
    defaultSizeKey:
      type: string
      minLength: 1
      description: >
        Profile key used when legacy or newly-authored content omits sizeKey.
        Required whenever sizeProfiles are configured and omitted otherwise.
    required:
      type: boolean
      default: true
      description: >
        Whether an item must supply this section when it is created. Omitted
        for legacy definitions means true; optional sections may be omitted or
        explicitly cleared after creation.

WorkItemHtmlCssDimensions:
  type: object
  additionalProperties: false
  required:
    - width
    - height
  properties:
    width:
      type: integer
      minimum: 1
    height:
      type: integer
      minimum: 1

WorkItemHtmlCssSizeBreakpoint:
  type: object
  additionalProperties: false
  required:
    - minContainerWidth
    - inline
    - page
  properties:
    minContainerWidth:
      type: integer
      minimum: 0
      description: Inclusive container-width threshold. Breakpoints are ordered by this value and begin at zero.
    inline:
      $ref: "#/WorkItemHtmlCssDimensions"
    page:
      $ref: "#/WorkItemHtmlCssDimensions"

WorkItemHtmlCssSizeProfile:
  type: object
  additionalProperties: false
  required:
    - key
    - label
    - breakpoints
  properties:
    key:
      type: string
      minLength: 1
      description: Stable value persisted as sizeKey in section content.
    label:
      type: string
      minLength: 1
      description: Author-facing profile label.
    breakpoints:
      type: array
      minItems: 1
      items:
        $ref: "#/WorkItemHtmlCssSizeBreakpoint"
      description: Strictly ascending thresholds beginning at zero.

WorkItemHtmlCssSectionContent:
  type: object
  additionalProperties: false
  description: Reusable source payload for an html/css work-item section.
  required:
    - html
    - css
  properties:
    html:
      type: string
      description: HTML source for the section.
    css:
      type: string
      description: CSS source for the section. An empty string is valid.
    sizeKey:
      type: string
      minLength: 1
      description: Optional stable profile selection resolved against the effective section definition; omission uses defaultSizeKey.
    annotations:
      type: array
      items:
        $ref: "#/WorkItemHtmlCssAnnotation"
      description: Optional section-scoped review records kept separate from authored HTML and CSS.

WorkItemHtmlCssAnnotationElementTarget:
  type: object
  additionalProperties: false
  required: [type, nodeId]
  properties:
    type:
      type: string
      enum: [element]
    nodeId:
      type: string
      minLength: 1
      description: Stable data-hh-id value exposed by the validated HTML/CSS document.

WorkItemHtmlCssAnnotationPositionTarget:
  type: object
  additionalProperties: false
  required: [type, x, y, sizeKey]
  properties:
    type:
      type: string
      enum: [position]
    x:
      type: number
      minimum: 0
      maximum: 1
    y:
      type: number
      minimum: 0
      maximum: 1
    sizeKey:
      type: string
      minLength: 1
      description: Presentation profile in which the normalized position was authored.

WorkItemHtmlCssAnnotationTarget:
  oneOf:
    - $ref: "#/WorkItemHtmlCssAnnotationElementTarget"
    - $ref: "#/WorkItemHtmlCssAnnotationPositionTarget"
  discriminator:
    propertyName: type

WorkItemHtmlCssAnnotation:
  type: object
  additionalProperties: false
  required:
    [id, note, author, category, lifecycle, authoredProposalId, authoredSizeKey, target]
  properties:
    id:
      $ref: "#/WorkItemStructuredMockupAnnotationId"
    note:
      type: string
      minLength: 1
      maxLength: 4000
    author:
      $ref: "#/WorkItemStructuredMockupAnnotationAuthor"
    category:
      $ref: "#/WorkItemStructuredMockupAnnotationCategory"
    lifecycle:
      $ref: "#/WorkItemStructuredMockupAnnotationLifecycle"
    authoredProposalId:
      type: string
      format: uuid
    authoredSizeKey:
      type: string
      minLength: 1
    target:
      $ref: "#/WorkItemHtmlCssAnnotationTarget"

WorkItemStructuredMockupWidth:
  oneOf:
    - $ref: "#/WorkItemStructuredMockupWidthFlexible"
    - $ref: "#/WorkItemStructuredMockupWidthFixed"

WorkItemStructuredMockupWidthFlexible:
  type: object
  additionalProperties: false
  required:
    - mode
  properties:
    mode:
      type: string
      enum:
        - fit
        - fill

WorkItemStructuredMockupWidthFixed:
  type: object
  additionalProperties: false
  required:
    - mode
    - value
  properties:
    mode:
      type: string
      enum:
        - fixed
    value:
      type: integer
      minimum: 1
      description: Pixel width. Required only when mode is fixed.

WorkItemStructuredMockupHeight:
  oneOf:
    - $ref: "#/WorkItemStructuredMockupHeightContent"
    - $ref: "#/WorkItemStructuredMockupHeightFixed"

WorkItemStructuredMockupHeightContent:
  type: object
  additionalProperties: false
  required:
    - mode
  properties:
    mode:
      type: string
      enum:
        - content

WorkItemStructuredMockupHeightFixed:
  type: object
  additionalProperties: false
  required:
    - mode
    - value
  properties:
    mode:
      type: string
      enum:
        - fixed
    value:
      type: integer
      minimum: 1
      description: Pixel height. Required only when mode is fixed.

WorkItemStructuredMockupLayoutProps:
  type: object
  additionalProperties: false
  required:
    - id
    - width
    - height
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local component identity, unique within the document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"

WorkItemStructuredMockupTextProps:
  type: object
  additionalProperties: false
  required:
    - id
    - width
    - height
    - text
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local component identity, unique within the document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"
    text:
      type: string
    variant:
      type: string
      enum: [body, heading, caption, label, badge]
      description: Host-owned text hierarchy and emphasis. Omission renders body text.

WorkItemStructuredMockupButtonProps:
  type: object
  additionalProperties: false
  required:
    - id
    - width
    - height
    - label
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local component identity, unique within the document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"
    label:
      type: string

WorkItemStructuredMockupInputProps:
  type: object
  additionalProperties: false
  required:
    - id
    - width
    - height
    - label
    - placeholder
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local component identity, unique within the document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"
    label:
      type: string
    placeholder:
      type: string
    value:
      type: string
    multiline:
      type: boolean
      description: Explicit textarea mode. When omitted, newline-containing values use multiline mode.

WorkItemStructuredMockupSurfaceProps:
  type: object
  additionalProperties: false
  required:
    - id
    - width
    - height
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local component identity, unique within the document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"
    label:
      type: string

WorkItemStructuredMockupImagePlaceholderProps:
  type: object
  additionalProperties: false
  required:
    - id
    - width
    - height
    - altText
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local component identity, unique within the document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"
    altText:
      type: string

WorkItemStructuredMockupContainerProps:
  type: object
  additionalProperties: false
  required:
    - id
    - width
    - height
    - gap
    - padding
    - justify
    - align
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local component identity, unique within the document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"
    gap:
      type: integer
      minimum: 0
    padding:
      type: integer
      minimum: 0
    justify:
      type: string
      enum: [start, center, end, spread]
      description: Main-axis distribution of child components.
    align:
      type: string
      enum: [start, center, end, stretch]
      description: Cross-axis positioning of child components.

    surface:
      type: string
      enum: [plain, panel, muted, dashed]
      description: Host-owned surface treatment for a container with editable children. Omission renders plain layout.

WorkItemStructuredMockupSlotProps:
  type: object
  additionalProperties: false
  required: [id, width, height, name]
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local slot identity, unique within the source document.
    width:
      $ref: "#/WorkItemStructuredMockupWidth"
    height:
      $ref: "#/WorkItemStructuredMockupHeight"
    name:
      type: string
      minLength: 1
      description: Stable source-owned destination name used by reusable occurrences.
    surface:
      type: string
      enum: [plain, panel, muted, dashed]

WorkItemStructuredMockupIconProps:
  type: object
  additionalProperties: false
  required: [id, width, height, iconKey, accessibleLabel]
  properties:
    id: { type: string, minLength: 1 }
    width: { $ref: "#/WorkItemStructuredMockupWidth" }
    height: { $ref: "#/WorkItemStructuredMockupHeight" }
    iconKey: { type: string, minLength: 1 }
    accessibleLabel: { type: string, minLength: 1 }

WorkItemStructuredMockupSlotAssignment:
  type: object
  additionalProperties: false
  required: [slotName, children]
  properties:
    slotName:
      type: string
      minLength: 1
    children:
      type: array
      items:
        $ref: "#/WorkItemStructuredMockupComponentV4"

WorkItemStructuredMockupOccurrenceProps:
  type: object
  additionalProperties: false
  required: [id, width, height, sourceMockupId, slotAssignments]
  properties:
    id:
      type: string
      minLength: 1
      description: Stable document-local occurrence identity, distinct from sourceMockupId.
    width: { $ref: "#/WorkItemStructuredMockupWidth" }
    height: { $ref: "#/WorkItemStructuredMockupHeight" }
    sourceMockupId:
      type: string
      format: uuid
    slotAssignments:
      type: array
      items:
        $ref: "#/WorkItemStructuredMockupSlotAssignment"

WorkItemStructuredMockupText:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type:
      type: string
      enum: [text]
    props:
      $ref: "#/WorkItemStructuredMockupTextProps"

WorkItemStructuredMockupButton:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type:
      type: string
      enum: [button]
    props:
      $ref: "#/WorkItemStructuredMockupButtonProps"

WorkItemStructuredMockupInput:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type:
      type: string
      enum: [input]
    props:
      $ref: "#/WorkItemStructuredMockupInputProps"

WorkItemStructuredMockupCard:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type:
      type: string
      enum: [card]
    props:
      $ref: "#/WorkItemStructuredMockupSurfaceProps"

WorkItemStructuredMockupRectangle:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type:
      type: string
      enum: [rectangle]
    props:
      $ref: "#/WorkItemStructuredMockupSurfaceProps"

WorkItemStructuredMockupDivider:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type:
      type: string
      enum: [divider]
    props:
      $ref: "#/WorkItemStructuredMockupLayoutProps"

WorkItemStructuredMockupImagePlaceholder:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type:
      type: string
      enum: [image-placeholder]
    props:
      $ref: "#/WorkItemStructuredMockupImagePlaceholderProps"

WorkItemStructuredMockupRow:
  type: object
  additionalProperties: false
  required: [type, props, children]
  properties:
    type:
      type: string
      enum: [row]
    props:
      $ref: "#/WorkItemStructuredMockupContainerProps"
    children:
      type: array
      items:
        $ref: "#/WorkItemStructuredMockupComponent"

WorkItemStructuredMockupColumn:
  type: object
  additionalProperties: false
  required: [type, props, children]
  properties:
    type:
      type: string
      enum: [column]
    props:
      $ref: "#/WorkItemStructuredMockupContainerProps"
    children:
      type: array
      items:
        $ref: "#/WorkItemStructuredMockupComponent"

WorkItemStructuredMockupSlot:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type: { type: string, enum: [slot] }
    props: { $ref: "#/WorkItemStructuredMockupSlotProps" }

WorkItemStructuredMockupIcon:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type: { type: string, enum: [icon] }
    props: { $ref: "#/WorkItemStructuredMockupIconProps" }

WorkItemStructuredMockupOccurrence:
  type: object
  additionalProperties: false
  required: [type, props]
  properties:
    type: { type: string, enum: [mockup-occurrence] }
    props: { $ref: "#/WorkItemStructuredMockupOccurrenceProps" }

WorkItemStructuredMockupComponentV4:
  oneOf:
    - $ref: "#/WorkItemStructuredMockupText"
    - $ref: "#/WorkItemStructuredMockupButton"
    - $ref: "#/WorkItemStructuredMockupInput"
    - $ref: "#/WorkItemStructuredMockupCard"
    - $ref: "#/WorkItemStructuredMockupRectangle"
    - $ref: "#/WorkItemStructuredMockupDivider"
    - $ref: "#/WorkItemStructuredMockupImagePlaceholder"
    - $ref: "#/WorkItemStructuredMockupRowV4"
    - $ref: "#/WorkItemStructuredMockupColumnV4"
    - $ref: "#/WorkItemStructuredMockupSlot"
    - $ref: "#/WorkItemStructuredMockupIcon"
    - $ref: "#/WorkItemStructuredMockupOccurrence"
  discriminator:
    propertyName: type

WorkItemStructuredMockupRowV4:
  type: object
  additionalProperties: false
  required: [type, props, children]
  properties:
    type: { type: string, enum: [row] }
    props: { $ref: "#/WorkItemStructuredMockupContainerProps" }
    children:
      { type: array, items: { $ref: "#/WorkItemStructuredMockupComponentV4" } }

WorkItemStructuredMockupColumnV4:
  type: object
  additionalProperties: false
  required: [type, props, children]
  properties:
    type: { type: string, enum: [column] }
    props: { $ref: "#/WorkItemStructuredMockupContainerProps" }
    children:
      { type: array, items: { $ref: "#/WorkItemStructuredMockupComponentV4" } }

WorkItemStructuredMockupIconKey:
  type: string
  enum:
    - task
    - bug
    - feature
    - goal
    - contract
    - workflow
    - plan
    - plan-stage
    - add
    - arrow-down
    - arrow-left
    - arrow-right
    - arrow-up
    - check
    - close
    - edit
    - info
    - menu
    - search
    - settings
    - star
    - warning
  description: >
    Registered host icon token. The token resolves through the shared icon
    registry; structured content cannot provide an asset path, SVG, component
    name, or renderer implementation.

WorkItemStructuredMockupSemanticRole:
  type: string
  enum:
    - button
    - heading
    - img
    - link
    - list
    - listitem
    - navigation
    - region
    - status
    - separator
    - textbox
    - none
    - presentation
  description: Host-controlled semantic role exposed to implementation agents without changing the visual design.

WorkItemStructuredMockupColor:
  type: string
  enum: [primary, secondary, success, warning, error, info, neutral, muted, surface, transparent]
  description: Host palette token used for constrained component color.

WorkItemStructuredMockupOverflow:
  type: string
  enum: [visible, hidden]
  description: Constrained overflow behavior for a component boundary.

WorkItemStructuredMockupCaretDirection:
  type: string
  enum: [up, right, down, left]
  description: Direction in which a caret points.

WorkItemStructuredMockupShapeKind:
  type: string
  enum: [circle, square, rounded, pill, diamond, triangle]
  description: Host-controlled basic shape kind.

WorkItemStructuredMockupDividerOrientation:
  type: string
  enum: [horizontal, vertical]
  description: Explicit divider axis.

WorkItemStructuredMockupV5AppearanceProps:
  type: object
  additionalProperties: false
  properties:
    role:
      $ref: "#/WorkItemStructuredMockupSemanticRole"
    description:
      type: string
      minLength: 1
      description: Agent-readable semantic description that is not rendered as design text.
    color:
      $ref: "#/WorkItemStructuredMockupColor"
    opacity:
      type: number
      minimum: 0
      maximum: 1
      description: Inclusive opacity value applied by the host renderer.
    overflow:
      $ref: "#/WorkItemStructuredMockupOverflow"

WorkItemStructuredMockupTextV5Props:
  type: object
  additionalProperties: false
  required: [id, width, height, text]
  properties:
    id: { type: string, minLength: 1 }
    width: { $ref: "#/WorkItemStructuredMockupWidth" }
    height: { $ref: "#/WorkItemStructuredMockupHeight" }
    text: { type: string }
    variant: { type: string, enum: [body, heading, caption, label, badge] }
    role: { $ref: "#/WorkItemStructuredMockupSemanticRole" }
    description: { type: string, minLength: 1 }
    color: { $ref: "#/WorkItemStructuredMockupColor" }
    opacity: { type: number, minimum: 0, maximum: 1 }
    overflow: { $ref: "#/WorkItemStructuredMockupOverflow" }

WorkItemStructuredMockupButtonV5Props:
  type: object
  additionalProperties: false
  required: [id, width, height, label]
  properties:
    id: { type: string, minLength: 1 }
    width: { $ref: "#/WorkItemStructuredMockupWidth" }
    height: { $ref: "#/WorkItemStructuredMockupHeight" }
    label: { type: string }
    role: { $ref: "#/WorkItemStructuredMockupSemanticRole" }
    description: { type: string, minLength: 1 }
    color: { $ref: "#/WorkItemStructuredMockupColor" }
    opacity: { type: number, minimum: 0, maximum: 1 }
    overflow: { $ref: "#/WorkItemStructuredMockupOverflow" }

WorkItemStructuredMockupInputV5Props:
  type: object
  additionalProperties: false
  required: [id, width, height, label, placeholder]
  properties:
    id: { type: string, minLength: 1 }
    width: { $ref: "#/WorkItemStructuredMockupWidth" }
    height: { $ref: "#/WorkItemStructuredMockupHeight" }
    label: { type: string }
    placeholder: { type: string }
    value: { type: string }
    multiline: { type: boolean }
    role: { $ref: "#/WorkItemStructuredMockupSemanticRole" }
    description: { type: string, minLength: 1 }
    color: { $ref: "#/WorkItemStructuredMockupColor" }
    opacity: { type: number, minimum: 0, maximum: 1 }
    overflow: { $ref: "#/WorkItemStructuredMockupOverflow" }

WorkItemStructuredMockupSurfaceV5Props:
