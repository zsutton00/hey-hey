      type: array
      items:
        $ref: "#/WorkItemStructuredMockupComponent"
    sizeKey:
      type: string
      minLength: 1
    annotations:
      type: array
      items:
        $ref: "#/WorkItemStructuredMockupAnnotation"

WorkItemStructuredMockupSectionContentV4:
  type: object
  additionalProperties: false
  required: [schemaVersion, revision, content, annotations]
  properties:
    schemaVersion: { type: string, enum: [work-item-structured-mockup.v4] }
    revision: { type: integer, minimum: 1 }
    content:
      type: array
      items: { $ref: "#/WorkItemStructuredMockupComponentV4" }
    sizeKey: { type: string, minLength: 1 }
    annotations:
      type: array
      items: { $ref: "#/WorkItemStructuredMockupAnnotation" }

WorkItemStructuredMockupSectionContentV5:
  type: object
  additionalProperties: false
  description: >
    Versioned structured mockup document with a closed visual vocabulary and
    agent-readable semantic metadata. Appearance values are host palette
    tokens; content cannot provide CSS, selectors, external resources, or
    renderer code.
  required: [schemaVersion, revision, content, annotations]
  properties:
    schemaVersion: { type: string, enum: [work-item-structured-mockup.v5] }
    revision: { type: integer, minimum: 1 }
    content:
      type: array
      items: { $ref: "#/WorkItemStructuredMockupComponentV5" }
    sizeKey: { type: string, minLength: 1 }
    annotations:
      type: array
      items: { $ref: "#/WorkItemStructuredMockupAnnotation" }

WorkItemStructuredMockupSectionContent:
  oneOf:
    - $ref: "#/WorkItemStructuredMockupSectionContentV3"
    - $ref: "#/WorkItemStructuredMockupSectionContentV4"
    - $ref: "#/WorkItemStructuredMockupSectionContentV5"
  discriminator:
    propertyName: schemaVersion

WorkItemTypeScalarField:
  type: string
  enum:
    - dueDate
    - tag
  description: >
    A scalar field an item may carry beyond its content sections. The closed
    set mirrors the registry's TaskScalarField axis. A work-item type lists
    each field under requiredScalars (an item of the type must carry it) or
    forbiddenScalars (an item of the type may not carry it); a field in
    neither list is optional.

WorkItemTypeEdgeTarget:
  type: object
  description: A typed edge an item of this type may originate, and the types it may point at.
  required:
    - edgeType
    - targetTypeKeys
  properties:
    edgeType:
      $ref: "./agent-edges.yaml#/AgentEdgeType"
    targetTypeKeys:
      type: array
      description: >
        Type keys this edge may point at. An empty array means the edge type
        is permitted against any type.
      items:
        $ref: "#/WorkItemTypeKey"

WorkItemTypeTracking:
  type: object
  additionalProperties: false
  description: >
    Inbound TRACKS authorization owned by this target work-item type. The
    declaration names the entity categories and open work-item type keys that
    may originate TRACKS relationships to this type. Source-oriented
    eligibility is derived by inverting active target declarations;
    `edgeTargets` does not authorize TRACKS.
  required:
    - allowedSourceEntityTypes
    - allowedSourceTaskTypes
  properties:
    allowedSourceEntityTypes:
      type: array
      description: >
        Entity types that may track an item of this target type. Reuses the
        shared EntityType enum. Empty when no entity category may track it.
      items:
        $ref: "./common.yaml#/EntityType"
    allowedSourceTaskTypes:
      type: array
      description: >
        Open work-item type keys that may track this target when the source
        entity is a work item. Every listed key must resolve to an active
        definition in the same project snapshot.
      items:
        $ref: "#/WorkItemTypeKey"

WorkItemTypeWritingStandards:
  type: object
  description: >
    Type-level authoring prose for a work-item type, split by authoring mode.
    Mirrors the WorkItemWritingStandards shape the registry reads: the
    `create` body carries the full per-type discipline; the `edit` body adds
    the edit-path framing on top of the same rules.
  required:
    - create
    - edit
  properties:
    create:
      type: string
      description: Authoring prose read before creating an item of this type.
    edit:
      type: string
      description: Authoring prose read before editing an item of this type.

WorkItemTypeCapabilities:
  type: object
  description: >
    Capability flags an item of this type carries — the boolean switches the
    canonical definitions declare. Product Feature hierarchy participation is platform-owned by the FEATURE type key; structural work-item parentage is declared
    by WorkItemTypeDefinitionDto.allowedParentTypes, while requiresParent
    remains the independent mandatory-parent capability. Known keys are named
    so generated clients can consume them directly; unknown keys are rejected
    so consumers share one contract vocabulary.
  properties:
    requiresParent:
      type: boolean
      description: Whether an item of this type must be created under a parent.
    planEligible:
      type: boolean
      description: Whether this type may be planned as plan implementation work.
    hasSetInitialStatus:
      type: boolean
      description: Whether this type's first allowed status is an explicit initial-status policy.
    rendersInline:
      type: boolean
      description: Whether mentions of this type may render as an inline rich surface instead of a badge.
    showsInExplorerSidebar:
      type: boolean
      description: Whether this type opts into an Explorer Sidebar section; false or omission means no Explorer section is configured.
    graph:
      $ref: "#/WorkItemTypeGraphCapability"
  additionalProperties: false

WorkItemTypeGraphCapability:
  type: object
  description: >
    Optional type-neutral graph presentation and authoring capability for work
    items of this type. When present, graph readers and editors resolve their
    behavior from these declarations rather than from a work-item type name.
    `rendersInline` remains only the legacy inline-render compatibility flag;
    graph data access, validation, rendering, and authoring are described here.
  required:
    - nodeChildType
    - layout
    - readableRelationships
    - editableRelationships
    - rendererKey
    - editorKey
    - supportedActions
  properties:
    nodeChildType:
      allOf:
        - $ref: "#/WorkItemTypeKey"
      description: >
        Child work-item type key eligible to act as a node inside this graph.
        The value may name a system type or a project-scoped custom type.
    layout:
      $ref: "#/WorkItemTypeGraphLayoutDeclaration"
    layoutPreference:
      $ref: "#/WorkItemTypeGraphLayoutPreferenceDeclaration"
      description: Type-owned declaration for the preferred graph shape section.
    groups:
      $ref: "#/WorkItemTypeGraphGroupsDeclaration"
      description: Type-owned declaration for the optional Diagram groups section.
    readableRelationships:
      type: array
      description: Relationship declarations readers may request for this graph surface.
      items:
        $ref: "#/WorkItemTypeGraphRelationshipDeclaration"
    editableRelationships:
      type: array
      description: Relationship declarations editors may create, update, reconnect, or delete.
      items:
        $ref: "#/WorkItemTypeGraphRelationshipDeclaration"
    searchableMetaLinkTargets:
      type: array
      description: >
        Entity and work-item type targets that graph editors may search when
        attaching meta relationships. Empty or omitted means the type exposes
        no graph-specific meta-link target search affordance.
      items:
        $ref: "#/WorkItemTypeGraphSearchableMetaLinkTarget"
    rendererKey:
      type: string
      description: Runtime UI renderer capability key selected by this type.
      example: "work-item-graph"
    editorKey:
      type: string
      description: Runtime UI editor capability key selected by this type.
      example: "work-item-graph-editor"
    supportedActions:
      type: array
      description: Graph viewer/editor actions supported by this type.
      items:
        $ref: "#/WorkItemTypeGraphAction"
    readExpansions:
      type: array
      description: Fixed bounded traversals executed by aggregate readers.
      items:
        $ref: "#/WorkItemTypeGraphReadExpansion"

WorkItemTypeGraphReadExpansion:
  type: object
  additionalProperties: false
  required: [key, seed, path, projectionKind, deduplicateBy, limit]
  properties:
    key:
      type: string
      minLength: 1
    seed:
      type: string
      enum: [graphRoot, graphNodes]
    path:
      type: array
      minItems: 1
      maxItems: 5
      items:
        $ref: "#/WorkItemTypeGraphReadExpansionHop"
    projectionKind:
      type: string
      enum: [workItemReference]
    deduplicateBy:
      type: string
      enum: [entityId]
    excludeRoot:
      type: boolean
      default: false
    limit:
      type: integer
      minimum: 1
      maximum: 500

WorkItemTypeGraphReadExpansionHop:
  type: object
  additionalProperties: false
  required: [relationshipType, direction, target]
  properties:
    relationshipType:
      type: string
      enum: [DEPENDS_ON, HAS_TASK, GUARANTEES, IMPLEMENTS, CONSUMES]
      description: Supported fixed traversal relationship label.
    direction:
      type: string
      enum: [OUTGOING, INCOMING]
    target:
      $ref: "#/WorkItemTypeGraphReadExpansionEndpoint"

WorkItemTypeGraphReadExpansionEndpoint:
  type: object
  additionalProperties: false
  required: [entityTypes]
  properties:
    entityTypes:
      type: array
      minItems: 1
      items:
        $ref: "./agent-edges.yaml#/AgentEdgeEndpointEntityType"
    workItemTypeKeys:
      type: array
      items:
        $ref: "#/WorkItemTypeKey"

WorkItemTypeGraphLayoutDeclaration:
  type: object
  description: >
    Declares the type-owned JSON section that stores authored logical graph
    layout. The section schema reference should point at the reusable
    WorkItemGraphLayoutValue schema exposed from work-items.yaml unless a later
    compatible version is explicitly selected.
  required:
    - sectionKey
    - schemaRef
  properties:
    sectionKey:
      type: string
      description: Section key on the graph root item that stores authored layout.
      example: "graphLayout"
    schemaRef:
      type: string
      description: >
        OpenAPI component schema reference for the layout value accepted by
        the section. The default reusable value is
        `#/components/schemas/WorkItemGraphLayoutValue`.
      example: "#/components/schemas/WorkItemGraphLayoutValue"

WorkItemTypeGraphLayoutPreferenceDeclaration:
  type: object
  additionalProperties: false
  description: Declares the type-owned JSON section storing the preferred graph shape.
  required:
    - sectionKey
    - schemaRef
  properties:
    sectionKey:
      type: string
      description: Section key on the graph root item that stores the preferred shape.
      example: "graphLayoutPreference"
    schemaRef:
      type: string
      description: OpenAPI component schema reference for the preference value.
      example: "#/components/schemas/WorkItemGraphLayoutPreferenceValue"

WorkItemTypeGraphGroupsDeclaration:
  type: object
  additionalProperties: false
  description: >
    Declares the optional type-owned JSON section storing named groups and
    nested boundaries for graph nodes. Group edits stay independent of the
    authored layout section.
  required:
    - sectionKey
    - schemaRef
  properties:
    sectionKey:
      type: string
      description: Section key on the graph root item that stores groups.
      example: "diagramGroups"
    schemaRef:
      type: string
      description: OpenAPI component schema reference for the groups value.
      example: "#/components/schemas/DiagramGroupsValue"

WorkItemTypeGraphRelationshipDeclaration:
  type: object
  description: >
    Type-neutral declaration for one relationship label visible to a graph
    reader or editor, including its flow/meta role, endpoint constraints,
    direction rules, and optional metadata schema.
  required:
    - edgeType
    - category
    - sourceEndpoint
    - targetEndpoint
  properties:
    edgeType:
      $ref: "./agent-edges.yaml#/AgentEdgeType"
    category:
      allOf:
        - $ref: "./agent-edges.yaml#/AgentEdgeCategory"
      description: Whether this relationship participates in graph flow structure or generic meta topology.
    sourceEndpoint:
      $ref: "#/WorkItemTypeGraphEndpointRule"
    targetEndpoint:
      $ref: "#/WorkItemTypeGraphEndpointRule"
    direction:
      $ref: "#/WorkItemTypeGraphDirectionRule"
    metadataSchemaRef:
      type: string
      nullable: true
      description: >
        Optional OpenAPI component schema reference for relationship metadata
        carried by this edge type. Null means no type-specific metadata schema
        is declared.

WorkItemTypeGraphEndpointRole:
  type: string
  enum:
    - graphRoot
    - graphNode
    - externalEntity
  description: >
    Endpoint role relative to the graph surface. graphRoot is the containing
    work item, graphNode is an eligible child node, and externalEntity is an
    entity outside the authored graph.

WorkItemTypeGraphEndpointRule:
  type: object
  description: Type-neutral endpoint constraints for a graph relationship declaration.
  required:
    - role
    - entityTypes
  properties:
    role:
      $ref: "#/WorkItemTypeGraphEndpointRole"
    entityTypes:
      type: array
      description: Entity types allowed for this endpoint.
      items:
        $ref: "./agent-edges.yaml#/AgentEdgeEndpointEntityType"
    workItemTypeKeys:
      type: array
      description: >
        Work-item type keys allowed when the endpoint entity type is TASK.
        Empty or omitted means any work-item type allowed by the surrounding
        graph declaration.
      items:
        $ref: "#/WorkItemTypeKey"

WorkItemTypeGraphDirectionRule:
  type: object
  description: Direction and predicate requirements for a graph relationship declaration.
  properties:
    required:
      type: boolean
      description: Whether this relationship must carry an explicit direction.
      default: false
    allowedDirections:
      type: array
      description: Directions allowed when a direction is present.
      items:
        $ref: "./agent-edges.yaml#/AgentEdgeDirection"
    predicateRequired:
      type: boolean
      description: Whether this relationship must carry a branch label or predicate.
      default: false

WorkItemTypeGraphSearchableMetaLinkTarget:
  type: object
  description: Search target declaration for graph meta-link authoring.
  required:
    - edgeType
    - targetEntityTypes
  properties:
    edgeType:
      $ref: "./agent-edges.yaml#/AgentEdgeType"
    targetEntityTypes:
      type: array
      items:
        $ref: "./agent-edges.yaml#/AgentEdgeEndpointEntityType"
      description: Entity types the editor may search for this meta relationship.
    targetWorkItemTypeKeys:
      type: array
      items:
        $ref: "#/WorkItemTypeKey"
      description: >
        Work-item type keys allowed when a target entity is a TASK. Empty or
        omitted means any work-item type allowed by the relationship rule.

WorkItemTypeGraphAction:
  type: string
  enum:
    - viewGraph
    - createNode
    - updateNode
    - deleteNode
    - createRelationship
    - updateRelationship
    - reconnectRelationship
    - deleteRelationship
    - replaceLayout
    - clearLayout
  description: Type-neutral graph viewer/editor action key.

WorkItemTypeLifecycleStatus:
  type: string
  enum:
    - ACTIVE
    - ARCHIVED
  description: >
    Lifecycle status of a registered work-item type. ACTIVE types can be used
    to create new items; ARCHIVED types reject new items but keep existing
    ones renderable and queryable.

WorkItemTypeEditRequestDto:
  type: object
  description: >
    Request to start proposal review for editing an existing project-owned
    work-item type, whether canonical-seeded or custom. The submitted complete
    WorkItemTypeDefinitionDto may change every authorable semantic axis while
    the stable key and platform-protected hierarchy behavior remain immutable.
    Removing sections or revoking tracking-source type keys requires the
    existing count-backed acknowledgement, but approval updates only the
    reviewed definition and never migrates or deletes existing work-item data
    or relationships.
  required:
    - definition
  properties:
    definition:
      $ref: "#/WorkItemTypeDefinitionDto"
    acknowledgeCanonicalCustomization:
      type: boolean
      default: false
      description: Must be true when editing a canonical definition creates a project override.

WorkItemTypeSectionContentImpactDetailDto:
  type: object
  description: A removed section key and the number of existing work items that carry content for it.
  required:
    - sectionKey
    - affectedItemCount
  properties:
    sectionKey:
      type: string
      description: Stable key of a section removed by the proposed definition edit.
    affectedItemCount:
      type: integer
      format: int32
      minimum: 0
      description: Number of existing work items of this type with content stored under the removed section key.

WorkItemTypeSectionContentImpactDto:
  type: object
  description: >
    Read-only impact summary for removing sections from a work-item type.
    Counts support acknowledgement before review; reading or confirming impact
    never changes work items or their sections, and approval does not remove
    existing section content.
  required:
    - totalAffectedItemCount
    - sections
  properties:
    totalAffectedItemCount:
      type: integer
      format: int32
      minimum: 0
      description: >
        Number of distinct existing work items with content in at least one
        requested removed section. An item is counted once even when it has
        content in multiple removed sections.
    sections:
      type: array
      description: Impact detail for every requested removed section key, including zero-count keys.
      items:
        $ref: "#/WorkItemTypeSectionContentImpactDetailDto"

WorkItemTypeTrackingLinkRevocationImpactDetailDto:
  type: object
  description: A revoked tracking source type key and the number of existing TRACKS links it invalidates.
  required:
    - sourceTypeKey
    - affectedLinkCount
  properties:
    sourceTypeKey:
      $ref: "#/WorkItemTypeKey"
    affectedLinkCount:
      type: integer
      format: int32
      minimum: 0
      description: Number of existing TRACKS links whose source has the revoked work-item type key.

WorkItemTypeTrackingLinkRevocationImpactDto:
  type: object
  description: >
    Read-only impact summary for revoking inbound tracking-source work-item
    type keys from a target definition. Counts include only TRACKS links made
    outside the updated authoring policy. Counts support acknowledgement only;
    reading, confirming, or approving the definition change never deletes
    existing TRACKS links.
  required:
    - totalAffectedLinkCount
    - sources
  properties:
    totalAffectedLinkCount:
      type: integer
      format: int32
      minimum: 0
      description: Total number of existing TRACKS links invalidated across all requested source type keys.
    sources:
      type: array
      description: Impact detail for every requested revoked source type key, including zero-count keys.
      items:
        $ref: "#/WorkItemTypeTrackingLinkRevocationImpactDetailDto"

WorkItemTypeCascadeImpactDto:
  type: object
  additionalProperties: false
  description: >
    Read-only impact snapshot for irreversibly deleting a project-owned custom
    work-item type. Item count includes active and archived work items of the
    type. Edge count includes distinct agent-authored graph edges incident on
    those items, counting an edge only once when both endpoints are in the
    affected item set. Canonical-seeded project definitions are not eligible
    for hard deletion and do not produce a cascade impact snapshot.
  required:
    - itemCount
    - edgeCount
  properties:
    itemCount:
      type: integer
      format: int32
      minimum: 0
      description: Number of existing work items that would be hard-deleted.
    edgeCount:
      type: integer
      format: int32
      minimum: 0
      description: Number of distinct incident graph edges that would be deleted.

WorkItemTypeCascadeImpactConflictDto:
  allOf:
    - $ref: "./common.yaml#/ApiErrorResponse"
    - type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - currentImpact
          properties:
            currentImpact:
              $ref: "#/WorkItemTypeCascadeImpactDto"
          description: Current impact that superseded the caller's confirmed snapshot.

WorkItemTypeArchiveRequestDto:
  type: object
  description: >
    Request to start review for archiving an existing project-owned
    canonical-seeded or custom work-item type. Archive is a lifecycle status
    transition that prevents new items from being created for the type while
    keeping existing items renderable and queryable. It does not perform
    hard-delete, does not cascade to existing items, and does not return
    destructive-impact counts.
  properties:
    reason:
      type: string
      nullable: true
      description: Optional reviewer-facing rationale for archiving the type.
    acknowledgeCanonicalCustomization:
      type: boolean
      default: false
      description: Must be true when archiving a canonical definition creates a project override.

WorkItemTypeEffectiveSource:
  type: string
  enum:
    - CANONICAL
    - CANONICAL_OVERRIDE
    - PROJECT_CUSTOM

WorkItemTypeSummaryDto:
  type: object
  description: >
    A centrally resolved project-effective definition. Canonical definitions
    are overlaid by complete project overrides; custom definitions are supplied
    only by project rows. Consumers do not merge sources locally.
  required:
    - id
    - definition
    - status
    - projectId
    - effectiveSource
  properties:
    id:
      type: string
      format: uuid
      description: Stable identifier of the canonical or project row supplying the effective definition.
    definition:
      $ref: "#/WorkItemTypeDefinitionDto"
    status:
      $ref: "#/WorkItemTypeLifecycleStatus"
    projectId:
      $ref: "./common.yaml#/ProjectId"
      description: Project scope in which this effective definition was resolved.
    effectiveSource:
      $ref: "#/WorkItemTypeEffectiveSource"

WorkItemTypeGuidanceExample:
  type: object
  additionalProperties: false
  required: [title, guidance]
  properties:
    title:
      type: string
      minLength: 1
    guidance:
      type: string
      minLength: 1

WorkItemTypeGuidanceContext:
  type: object
  additionalProperties: false
  required: [focalTypeKeys, guidance]
  properties:
    focalTypeKeys:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
    guidance:
      type: string
      minLength: 1
    examples:
      type: array
      description: Examples in author-declared order.
      items:
        $ref: "#/WorkItemTypeGuidanceExample"

WorkItemTypeAgentGuidance:
  type: object
  additionalProperties: false
  required: [overview]
  description: Semantic understanding, separate from catalog descriptions and authoring standards. Omission means no guide; content is never synthesized.
  properties:
    overview:
      type: string
      minLength: 1
    examples:
      type: array
      description: General examples in author-declared order.
      items:
        $ref: "#/WorkItemTypeGuidanceExample"
    contexts:
      type: array
      description: Sparse directional contexts in author-declared order.
      items:
        $ref: "#/WorkItemTypeGuidanceContext"

WorkItemTypeContextualGuidanceDto:
  type: object
  additionalProperties: false
  required: [guidance, examples]
  properties:
    guidance:
      type: string
      minLength: 1
    examples:
      type: array
      items:
        $ref: "#/WorkItemTypeGuidanceExample"

WorkItemTypeGuidanceDto:
  type: object
  additionalProperties: false
  required: [typeKey, name, overview, examples]
  properties:
    typeKey:
      type: string
      minLength: 1
    name:
      type: string
    overview:
      type: string
      minLength: 1
    examples:
      type: array
      description: Ordered general examples; empty when omitted from the definition.
      items:
        $ref: "#/WorkItemTypeGuidanceExample"
    contextualGuidance:
      type: array
      description: Only matching contexts, in declared order. Omitted without a focal key or matching entries. Omitted examples become empty arrays.
      items:
        $ref: "#/WorkItemTypeContextualGuidanceDto"

WorkItemTypeGuidancePurpose:
  type: string
  enum: [semantic, maintenance, role]
  description: Selects semantic, maintenance or explicitly selected session-role guidance.

WorkItemTypeMaintenanceGuidanceDto:
  type: object
  additionalProperties: false
  required: [typeKey, name]
  properties:
    typeKey:
      type: string
      minLength: 1
    name:
      type: string
    maintenanceGuidance:
      type: string

WorkItemTypeSessionRoleGuidance:
  type: object
  additionalProperties: false
  description: Optional type-owned prose keyed by the shared SessionRole catalog. Each entry is independent; omitted entries provide no advice.
  properties:
    implementation:
      type: string
    research:
      type: string
    planning:
      type: string
    review:
      type: string

WorkItemTypeRoleGuidanceDto:
  type: object
  additionalProperties: false
  required: [typeKey, name, sessionRole]
  properties:
    typeKey:
      type: string
      minLength: 1
    name:
      type: string
    sessionRole:
      $ref: "./work-items.yaml#/SessionRole"
    guidance:
      type: string

WorkItemTypeGuidanceBatchRequestDto:
  type: object
  additionalProperties: false
  required: [typeKeys]
  anyOf:
    - properties:
        purpose:
          enum: [semantic, maintenance]
    - required: [purpose, sessionRole]
      properties:
        purpose:
          enum: [role]
  description: A bounded batch sharing one purpose and optional semantic focal type. Purpose role requires sessionRole explicitly; the mode-settings default does not apply. Role reads ignore focalTypeKey.
  properties:
    typeKeys:
      type: array
      minItems: 1
      maxItems: 10
      description: Distinct work-item type keys, returned in this order. Duplicate keys are invalid.
      items:
        type: string
    purpose:
      $ref: "#/WorkItemTypeGuidancePurpose"
    sessionRole:
      $ref: "./work-items.yaml#/SessionRole"
    focalTypeKey:
      type: string

WorkItemTypeGuidanceBatchResultDto:
  oneOf:
    - $ref: "#/WorkItemTypeGuidanceDto"
    - $ref: "#/WorkItemTypeMaintenanceGuidanceDto"
    - $ref: "#/WorkItemTypeRoleGuidanceDto"
  description: One requested type's semantic, maintenance or role projection; typeKey identifies the request represented by this result.

WorkItemTypeGuidanceBatchDto:
  type: object
  additionalProperties: false
  required: [results]
  description: One purpose-specific result per requested type, in the request's typeKeys order.
  properties:
    results:
      type: array
      minItems: 1
      maxItems: 10
      items:
        $ref: "#/WorkItemTypeGuidanceBatchResultDto"

DiagramElementPolicy:
  type: object
  additionalProperties: false
  required: [roles, referenceTargets]
  description: Project-effective policy on the DiagramElementMetadata section definition. Role keys must be unique and include GENERIC and DIAGRAM_REFERENCE so default creation and Diagram references remain available.
  properties:
    roles:
      type: array
      minItems: 1
      items:
        $ref: "#/DiagramElementRoleDefinition"
    referenceTargets:
      type: array
      items:
        $ref: "#/DiagramReferenceTargetRule"

DiagramElementRoleDefinition:
  type: object
  additionalProperties: false
  required: [key, label, notation]
  properties:
    key:
      $ref: "./work-items.yaml#/DiagramElementRole"
    label:
      type: string
      minLength: 1
    notation:
      type: string
      enum: [box, person, cylinder, diamond, frame]
      description: Stable host-owned notation token, never authored CSS or component code.

DiagramReferenceTargetRule:
  type: object
  additionalProperties: false
  required: [entityType]
  properties:
    entityType:
      type: string
      enum: [TASK, SERVICE]
    workItemTypeKeys:
      type: array
      description: Allowed TASK discriminators; omitted permits any work-item type. Targets must still be accessible and non-archived. Invalid for SERVICE.
      items:
        $ref: "#/WorkItemTypeKey"
