AgentTriggerStartRun:
  type: object
  required:
    - promptType
    - operationId
    - operationFingerprint
    - triggerMessageId
    - payload
  description: >-
    Trigger variant emitted by the API when a UI surface asks to materialize a
    new CLI run against a conversation. Unlike the other AgentTrigger variants
    — each of which carries the bootstrap context a workflow node needs at
    entry — this variant carries the Agent Bridge run-materialization envelope
    on its payload, so the CLI dispatcher can issue a typed run without
    re-deriving any field. The discriminator value is the sentinel literal
    `start_run`; on the turn-firing arm, the actual per-handler routing key the
    CLI dispatches against lives on `payload.handlerPromptType`, not on the
    top-level `promptType`. The workflow arm instead carries `workflowName`
    plus a `workflow_kickoff` payload used only to materialize the Run.
  properties:
    inputExecution:
      $ref: "./agent-operation.yaml#/InputExecutionIdentity"
    sourceUserMessageId:
      $ref: "./common.yaml#/MessageId"
      description: Canonical executable input message, omitted for bind-only workflow starts.
    operationId:
      $ref: "./agent-operation.yaml#/AgentOperationId"
    operationFingerprint:
      $ref: "./agent-operation.yaml#/AgentOperationFingerprint"
    promptType:
      type: string
      enum:
        - start_run
      description: >-
        Sentinel discriminator value for the start-run envelope variant.
        Distinct from the per-node `promptType` literals carried by the other
        AgentTrigger variants — the real handler routing key for this trigger
        lives on `payload.handlerPromptType`.
    nodeId:
      type: string
      description: >-
        Optional node id the conversation was paused on when the start-run
        envelope was emitted. Carried for symmetry with node-entry triggers;
        the CLI does not branch on it for start-run envelopes.
    triggerMessageId:
      type: string
      description: >-
        Id of the SYSTEM message this trigger was minted onto. Stamped by the
        server at message-create time so the persisted `data.triggersAgent`
        and the signed envelope's `event` carry the same id, allowing the
        bridge to validate that the wire frame matches the row it loaded
        before signing. See Trigger Payload Context design doc.
    admittedServiceScope:
      $ref: "./trigger-payloads.yaml#/UserMessageAdmittedServiceScope"
      description: >-
        Complete Service scope durably admitted from Service mentions in the
        first user message that starts the session. Present whenever that
        message mentions a Service; the first admitted Service becomes the
        launch anchor when the Agent Session had none. The CLI reconciles it
        into Run-owned workspace authority before the first Turn.
    payload:
      $ref: "./trigger-payloads.yaml#/StartRunPromptPayload"
  additionalProperties: false

StartRunWorktree:
  $ref: "./trigger-payloads.yaml#/StartRunWorktree"

ConversationStartRunRequestDto:
  allOf:
    - $ref: "./trigger-payloads.yaml#/StartRunPromptPayload"
    - type: object
      required:
        - authorization
        - operationId
        - operationFingerprint
        - machineId
      properties:
        operationId:
          $ref: "./agent-operation.yaml#/AgentOperationId"
        operationFingerprint:
          $ref: "./agent-operation.yaml#/AgentOperationFingerprint"
        authorization:
          $ref: "./controller-authorization.yaml#/AdmissionEnvelopeAuthorization"
          description: >-
            Exactly one fresh controller assertion with its complete immutable
            descriptor or one active controller-device grant reference. The
            server admits it before launch records or delivery and resolves
            all reuse scope from persisted grant state.
        worktree:
          $ref: "#/StartRunWorktree"
        initialMessage:
          type: object
          required:
            - role
          additionalProperties: false
          properties:
            role:
              $ref: "#/MessageType"
              description: >-
                Whether the seeded first row is authored as a USER message or a
                SYSTEM message. Reuses the shared message-role enum.
            triggersAgent:
              type: boolean
              default: true
              description: >-
                Governs whether seeding this initial message also dispatches the
                agent, orthogonally to `role`. Defaults to `true`, preserving
                every existing launch path unchanged: a USER seed dispatches the
                agent in place of the SYSTEM start_run trigger, and a SYSTEM seed
                still fires the SYSTEM trigger. When `false` on a SYSTEM seed,
                start-run persists the greeting as the conversation's first row
                and materializes the Run without firing the SYSTEM trigger or any
                agent turn — the agent wakes only on the user's first USER
                message on the normal promptType rail. The handler applies
                `triggersAgent ?? true`, so callers that omit it are unaffected.
        machineId:
          type: string
          format: uuid
          description: >-
            Required. The start-run trigger is dispatched to this specific
            machine rather than the most-recently-paired active machine for the
            user. The machine must belong to the conversation owner and must not
            be revoked; an invalid value is rejected with 400 INVALID_MACHINE_ID
            before any trigger is emitted.
  # Keep this conditional outside allOf. openapi-generator otherwise folds the
  # Codex-only branch into the shared provider enum for every generated client.
  not:
    allOf:
      - required:
          - fastMode
      - properties:
          provider:
            not:
              enum:
                - codex
  description: >-
    Existing inbound request body for `POST .../conversations/{conversationId}/start-run`.
    Shares `StartRunPromptPayload`'s fields (which ride on the resulting
    AgentTriggerStartRun envelope) plus an optional structured `initialMessage`;
    exporting both names keeps the inbound DTO and the trigger payload
    independently evolvable.

ConversationStartRunResponseDto:
  type: object
  required:
    - dispatched
    - operationId
    - operationFingerprint
    - operationState
    - triggerMessageId
  properties:
    operationId:
      $ref: "./agent-operation.yaml#/AgentOperationId"
    operationFingerprint:
      $ref: "./agent-operation.yaml#/AgentOperationFingerprint"
    operationState:
      type: string
      enum:
        [DISPATCH_PENDING, RECONCILING, SUCCEEDED, DENIED, FAILED, CANCELLED]
    dispatched:
      type: boolean
      enum: [true]
      description: >-
        True when the API committed the operation and its durable delivery
        obligation. The CLI acknowledgement may arrive later; callers must use
        the operation state rather than treating persistence as delivery success.
    triggerMessageId:
      type: string
      format: uuid
      description: >-
        Id of the SYSTEM trigger message the API authored for the run — the row
        carrying `AgentTriggerStartRun`. Authored on every path, including when
        the request supplies an `initialMessage` (the seeded first row is a
        separate USER or SYSTEM row and is not the dispatching trigger). Equal to the
        `triggerMessageId` on the signed envelope the CLI receives — callers can
        use this id to correlate the request with the run the CLI subsequently
        materializes.
    agentSessionId:
      type: string
      format: uuid
      description: Canonical Agent Session resolved for this launch.
  description: >-
    Acknowledgement response for `POST
    .../conversations/{conversationId}/start-run`. The actual run is created
    asynchronously on the CLI host once it receives the signed envelope.
    `DISPATCH_PENDING` records a committed operation whose CLI delivery is
    offline or ambiguous and will be retried. `SUCCEEDED` records an explicit
    CLI acceptance acknowledgement; `RECONCILING` remains a legacy
    compatibility state for older persisted operations and never authorizes
    rollback or duplicate semantic work.

AgentTriggerUserMessage:
  type: object
  required:
    - promptType
    - operationId
    - operationFingerprint
    - triggerMessageId
    - sourceUserMessageId
    - payload
  description: >-
    Trigger variant emitted when a USER message lands on a conversation with an
    active AgentSession binding. Unlike the other AgentTrigger variants — each
    of which carries the bootstrap context a workflow node needs at entry —
    this variant is a user-message follow-up: it rides on the already-loaded
    CLI run state. The wire body carries the routing key
    (`payload.handlerPromptType`), the user's text (`payload.userMessage`),
    the authenticated complete Service grant (`admittedServiceScope`), present
    whenever the message mentions a Service, and the persistence links
    (`triggerMessageId`, `sourceUserMessageId`). The CLI reconciles the
    admitted grant into Run-owned Service authority before handling the
    message; typed Service mentions never require a separate approval.
    The discriminator value is the sentinel literal `user_message`; the actual
    handler routing key the CLI dispatches against lives on the payload, not
    on the top-level `promptType`.
  properties:
    inputExecution:
      $ref: "./agent-operation.yaml#/InputExecutionIdentity"
    operationId:
      $ref: "./agent-operation.yaml#/AgentOperationId"
    operationFingerprint:
      $ref: "./agent-operation.yaml#/AgentOperationFingerprint"
    promptType:
      type: string
      enum:
        - user_message
      description: >-
        Sentinel discriminator value for the user-message follow-up variant.
        Distinct from the per-node `promptType` literals carried by the other
        AgentTrigger variants — the real handler routing key for this trigger
        lives on `payload.handlerPromptType`.
    nodeId:
      type: string
      description: >-
        Optional node id the conversation was paused on when the USER message
        landed. Carried for symmetry with node-entry triggers; the CLI does
        not branch on it for user-message follow-ups.
    triggerMessageId:
      type: string
      description: >-
        Id of the SYSTEM message this trigger was minted onto. Stamped by the
        server at message-create time so the persisted `data.triggersAgent`
        and the signed envelope's `event` carry the same id, allowing the
        bridge to validate that the wire frame matches the row it loaded
        before signing. See Trigger Payload Context design doc.
    sourceUserMessageId:
      type: string
      description: >-
        Id of the USER message that prompted this trigger. The persistence
        link from the trigger back to the user turn it follows up on; used by
        the CLI to attribute the agent's response to the correct user turn.
    admittedServiceScope:
      $ref: "./trigger-payloads.yaml#/UserMessageAdmittedServiceScope"
      description: >-
        Complete Service scope durably admitted with this authenticated user
        message. A consumer resolves the selected machine's bindings and
        reconciles the Run workspace before handling the message.
    payload:
      $ref: "./trigger-payloads.yaml#/UserMessagePromptPayload"
  additionalProperties: false

