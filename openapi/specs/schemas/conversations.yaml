# ──────────────────────────────────────────────────────────────────────────
# Workflow-routed arm. Carries `workflowName` (mutually exclusive with
# `promptType`) plus the `action` + `payload` body per the CLI Run Input
# Dispatch contract — no per-`promptType` typed payload.
# ──────────────────────────────────────────────────────────────────────────

UserMessageData:
  type: object
  description: |
    A USER message body. The freeform user-form bag — the
    `round{N}_{fieldName}` keys (one per conversational round; values are text
    responses, selections, or boolean choices), plus `type` and `comment` —
    lives at this top level alongside the server-stamped-only `triggersAgent`.
    The typed dispatch instruction the CLI routes on lives in the nested
    `agentInput` envelope, which selects a direct `promptType`. Keeping
    `agentInput` separate from the
    freeform bag means the dispatch payload is a closed, typed shape rather than
    inheriting the bag's `additionalProperties: true`.
  properties:
    type:
      $ref: "#/UserMessageDataType"
      description: Optional type to categorize the user message data
    comment:
      type: string
      description: Optional general comment from the user
    triggersAgent:
      $ref: "#/AgentTrigger"
      description: >-
        Structured marker that this user message is a trigger for the CLI to
        dispatch a PromptHandler. Server-stamped only, never UI-claimed: the
        stamp lives on the persisted USER row and is the seam the emitter reads
        from. Inbound create rejects any UI-supplied value (the rejection logic
        itself is owned by the API sub-task).
    agentInput:
      $ref: "#/UserMessageAgentInput"
      description: >-
        Typed executable envelope: the per-`promptType` payload the CLI
        validates and routes on. Workflow-owned answers use the dedicated
        workflow-answer operation and are not valid message input.
        Optional — a pure freeform-form response carries only the `round{N}_`
        keys and no dispatch envelope.
    attachments:
      type: array
      items:
        $ref: "./trigger-payloads.yaml#/RunAttachmentReference"
      description: >-
        Files the user attached to this message, by the references the CLI
        returned at upload. Copied onto the follow-up user_message trigger;
        empty when none. Supported UTF-8 text/code files and PNG, JPEG or WebP
        images reach providers as content without changing user text. Bytes and
        local paths never appear here. Unsupported formats are rejected at upload.
  additionalProperties: true
  example:
    round1_project_concept: "AI-powered analytics dashboard for sales teams"
    round2_data_sources: "Salesforce, HubSpot, Google Analytics"
    agentInput:
      promptType: task_refiner
      payloadVersion: 1
      task: { id: "…" }
      userMessage: "Tighten the acceptance criteria"

UserMessageAgentInput:
  description: |
    Typed dispatch envelope carried on `UserMessageData.agentInput`, modelled as
    a discriminated union over `promptType` (mirroring the CLI's
    `LocalPromptType` enum in the Agent Bridge contract). Workflow-owned answers are admitted through
    `SubmitWorkflowAnswerRequestDto`, never through a USER message.

    The 22 start-run-eligible `promptType` arms each carry their spec-canonical
    typed fields (e.g. `designDocId`, `planId`, `validation`,
    `stageIdx`, `phaseIdx`, `journeyStep`, `priorPhases`, `featureId`,
    `projectId`, `taskId`); the remaining 10 arms carry only the optional
    `userMessage` slot. The freeform `round{N}_{fieldName}` keys do NOT live
    here — they stay on `UserMessageData`.
  oneOf:
    - $ref: "#/UserMessageDataStartupSession"
    - $ref: "#/UserMessageDataPlanExecution"
    - $ref: "#/UserMessageDataFinalAssessment"
    - $ref: "#/UserMessageDataVerificationPlan"
    - $ref: "#/UserMessageDataChildTaskUpdates"
    - $ref: "#/UserMessageDataEntityConversation"
    - $ref: "#/UserMessageDataGoalPm"
    - $ref: "#/UserMessageDataOpenItemsTriage"
    - $ref: "#/UserMessageDataVerifyFeature"
    - $ref: "#/UserMessageDataSetSplitting"
    - $ref: "#/UserMessageDataFreeForm"
    - $ref: "#/UserMessageDataDailySession"
    - $ref: "#/UserMessageDataRollupProposal"
    - $ref: "#/UserMessageDataTaskRefiner"
    - $ref: "#/UserMessageDataFeatureRefiner"
    - $ref: "#/UserMessageDataDesignDocRefiner"
    - $ref: "#/UserMessageDataProposalRefiner"
    - $ref: "#/UserMessageDataCommit"
    - $ref: "#/UserMessageDataAgentSearch"
    - $ref: "#/UserMessageDataReportUpdate"
    - $ref: "#/UserMessageDataCodeReview"
    - $ref: "#/UserMessageDataFeatureSyncAnalyze"
    - $ref: "#/UserMessageDataFeatureSyncIterate"
    - $ref: "#/UserMessageDataPlanShapingFeatureSyncAnalyze"
    - $ref: "#/UserMessageDataPlanShapingFeatureSyncIterate"
    - $ref: "#/UserMessageDataPlanShapingProposedStages"
    - $ref: "#/UserMessageDataPlanShapingRefineStage"
    - $ref: "#/UserMessageDataPlanShapingVisualPreview"
    - $ref: "#/UserMessageDataPlanShapingPhaseBreakdown"
    - $ref: "#/UserMessageDataPlanShapingStepReview"
    - $ref: "#/UserMessageDataPlanShapingFinalize"
    - $ref: "#/UserMessageDataImplement"
    - $ref: "#/UserMessageDataValidationWalkthrough"
    - $ref: "#/UserMessageDataCodingFreeform"
    - $ref: "#/UserMessageDataWorkflowDefined"
    - $ref: "#/UserMessageDataFeatureTreeConversation"
    - $ref: "#/UserMessageDataTaskMonitor"
  discriminator:
    propertyName: promptType

ExternalAgentCompletionPayload:
  type: object
  required:
    - action
  description: |
    Shape of `FlowUserMessage.data` when an external agent (POST /message
    with type=SYSTEM, userId="system") completes a paused EXTERNAL_AGENT
    node. NOT a standalone request body — it is the `data` field carried on
    the normal user-message envelope. `action` is a discriminator that the
    engine validates against the node's declared action schemas; `payload`
    is the action-specific body validated by the corresponding Zod schema.
    Malformed or unknown-action messages leave the engine paused and surface
    an ExternalAgentValidationError so the producer can retry.
  properties:
    action:
      type: string
      description: >
        Action discriminator. Must match one of the action keys declared by
        the EXTERNAL_AGENT node.
      example: "DISCREPANCY"
    payload:
      $ref: "./external-agent-completion.yaml#/RepositoryGroundingExternalCompletionPayload"
      description: >-
        Action-specific payload validated against the node's Zod schema.
        Repository-grounding completions use RepositoryGroundingCompletion;
        other actions retain a generic object payload.
      example:
        items: ["spec field X missing from implementation"]

ExternalAgentValidationError:
  type: object
  required:
    - reason
    - nodeId
  description: |
    Structured error emitted when an EXTERNAL_AGENT completion message fails
    validation. The node stays paused so downstream producers (e.g. the CLI)
    can retry with a well-formed message.
  properties:
    nodeId:
      type: string
      description: ID of the EXTERNAL_AGENT node that rejected the message.
    action:
      type: string
      description: The action that was supplied, if any.
    reason:
      type: string
      enum:
        - missing_action
        - unknown_action
        - invalid_payload
      description: |
        Why validation failed:
        - missing_action: no `action` field on the completion payload
        - unknown_action: action is not declared in the node's actions map
        - invalid_payload: payload did not match the node's Zod schema

ExternalAgentActionSchema:
  type: object
  required:
    - action
    - waitForUser
  additionalProperties: false
  properties:
    action:
      type: string
      description: >
        Action discriminator literal matching the key used in the node's
        action map. The workflow engine routes completions on this value.
    waitForUser:
      type: boolean
      description: >
        When true, completions with this action park the workflow at the
        current EXTERNAL_AGENT node — the API-side
        handleExternalAgentCompletionCreated transitions the Temporal
        workflow to WAITING_FOR_USER_INPUT without routing through
        process-user-response, and the node re-enters only on a genuine
        user message. When false, the completion proceeds immediately
        along the workflow edge. Self-loop iterative actions (REVISED,
        DONE on implement) MUST be true to prevent infinite re-trigger
        loops. Non-parked actions (REFINE, APPROVED, NO_DISCREPANCY,
        DISCREPANCY, RESOLVED) MUST be false; REFINE is a deliberate
        self-loop that re-fires generation rather than parking.
    description:
      type: string
      description: >
        Human-readable explanation of what this action signals and how
        downstream nodes should interpret it.
  description: >
    Declaration of a single action an EXTERNAL_AGENT node may emit on
    completion. Consumed by handleExternalAgentCompletionCreated on the
    API side (which reads waitForUser to decide whether to park the
    workflow) and by CLI submission-tool registration on the client side.

CodingPlanActionSchemas:
  type: object
  required:
    - REFINE
    - APPROVED
  additionalProperties: false
  properties:
    REFINE:
      allOf:
        - $ref: "#/ExternalAgentActionSchema"
        - type: object
          properties:
            action:
              type: string
              enum: [REFINE]
            waitForUser:
              type: boolean
              enum: [false]
    APPROVED:
      allOf:
        - $ref: "#/ExternalAgentActionSchema"
        - type: object
          properties:
            action:
              type: string
              enum: [APPROVED]
            waitForUser:
              type: boolean
              enum: [false]
  description: >
    User-authored actions accepted by the coding-plan EXTERNAL_AGENT node.
