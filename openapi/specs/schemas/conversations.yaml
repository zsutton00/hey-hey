  required:
    - id
    - type
    - label
  properties:
    id:
      type: string
      description: Unique identifier for the UI element
      example: "project_details"
    type:
      $ref: "./flows.yaml#/ExtendedUIFieldType"
    label:
      type: string
      description: Display label for the UI element
      example: "What specific problem does your project solve?"
    placeholder:
      type: string
      description: Placeholder text for input elements
      example: "Please provide what specific problem does your project solve?"
    required:
      type: boolean
      description: Whether this field is required
      example: true
    multiline:
      type: boolean
      description: Whether text input should be multiline
      example: false
    options:
      type: array
      items:
        $ref: "#/SelectOption"
      description: Options for select elements
    availableIntegrations:
      type: array
      items:
        type: string
      description: Available integrations for integration_selector elements
    submitText:
      type: string
      description: The text the UI should show on the submit button for this element. Note this implicitly requires there to be only one uiElement
      example: "User needs help understanding project requirements"
    secondaryAction:
      $ref: "#/SecondaryActionConfig"
      description: Optional secondary action associated with this field
    influences:
      type: array
      items:
        $ref: "./artifacts.yaml#/Influence"
      description: Array of entities that influenced the generation of this UI element/question. Empty array for green field questions.
      example: []
    payload:
      oneOf:
        - $ref: "#/MultipleChoicePayload"
        - $ref: "#/PlanGapDiscoveryPayload"
        - $ref: "#/QuestionsGroupPayload"
        - $ref: "#/PlanApprovalPayload"
        - $ref: "#/OnboardingPlanCandidateReviewPayload"

        - $ref: "#/PlanDocumentViewPayload"
        - $ref: "#/CodingPromptStartupPlanPayload"
        - $ref: "#/CodingPlanContext"
        - $ref: "#/CodingPlanVersion"
        - $ref: "#/CodingPlanDiscrepancy"
        - $ref: "#/CodingPromptFinalAssessmentPayload"
        - $ref: "#/CodingPromptMergedFinalAssessmentPayload"
        - $ref: "#/AgentRequestPermissionPayload"
        - $ref: "#/AgentRequestServiceScopePayload"
        - $ref: "#/AgentRequestReviewFileScopePayload"
        - $ref: "#/AgentQuestionPayload"
        - $ref: "#/FileDiffPayload"
        - $ref: "#/PlanGenerationFinalizePayload"
        - $ref: "#/PlanGenerationJourneyReviewPayload"
        - $ref: "#/PlanGenerationVisualPreviewPayload"
        - $ref: "#/PlanGenerationStageReviewPayload"
        - $ref: "#/GoalPmRoutingPayload"
        - $ref: "#/OpenItemsTriagePayload"
        - $ref: "#/VerifyFeaturePayload"
        - $ref: "./repository-grounding.yaml#/RepositoryGroundingFieldPayload"
        - $ref: "./repository-grounding.yaml#/RepositoryPlacementStrategyPayload"
        - $ref: "./repository-grounding.yaml#/RepositoryPlacementReviewPayload"
        - $ref: "#/ImplementationReadinessPayload"
      description: Optional payload for custom UI elements
    promptType:
      type: string
      description: >
        Opaque dispatch hint round-tripped verbatim by the server to the
        client. Set by EXTERNAL_AGENT nodes on entry so downstream clients
        (e.g. the CLI) can dispatch the corresponding local handler. The
        server does not interpret this value.
      example: "feature_sync_review"
  description: UI element specification for rendering interactive components

