        - CODING_PROMPTS
        - AGENT
        - ROUTING
        - DAILY_SESSION
        - SESSION_MONITOR
        - TASK_MONITOR_TASK_ACTIVITY
        - TASK_MONITOR_INTERVENTION
        - TASK_MONITOR_LAUNCH_RECOVERY
        - TASK_MONITOR_SUPERVISION
        - CARRIER
      description: Type identifier for system message data
    proposalSuggestion:
      $ref: './proposals.yaml#/ProposalReconciliationSuggestion'
    flowId:
      type: string
      description: ID of the conversational flow this message belongs to
    nodeId:
      type: string
      description: ID of the specific node/step within the flow
    response:
      type: string
      description: Human-readable response message from the system
    title:
      type: string
      description: Title or header for this conversation step
    detectedIntent:
      type: string
      description: Intent detected by the LLM
    intentConfidence:
      type: number
      format: float
      minimum: 0
      maximum: 1
      description: Confidence score for the detected intent
    ragEnabled:
      type: boolean
      description: Whether this message should be included in RAG retrieval
    reasoning:
      type: string
      description: LLM's reasoning for the intent detection
    skippable:
      type: boolean
      description: Whether this step can be skipped by the user
    uiHints:
      $ref: "#/UIHints"
      description: Hints about expected UI elements for loading skeleton
    uiElements:
      type: array
      items:
        $ref: "#/UIElement"
      description: UI elements for rendering the response
    actions:
      type: array
      items:
        $ref: "#/Action"
      description: Actions to perform
    triggerNotification:
      type: boolean
      description: Whether this message should trigger a user notification (e.g. task completed, permission requested)
    actionHint:
      type: string
      enum:
        - task_complete
        - permission_requested
        - design_proposed
        - review_requested
      description: Hint for what contextual actions the UI should surface in response to this message
    triggersAgent:
      $ref: "#/AgentTrigger"
      description: >-
        Structured marker that this message is a trigger for the CLI to
        dispatch a PromptHandler. Presence of this field is the signal;
        the CLI derives pending work by taking trigger messages minus
        completion messages that back-reference them. SYSTEM triggers are
        emitted by the workflow engine on EXTERNAL_AGENT node entry.
    providerSessionId:
      type: string
      description: >-
        Provider-side (SDK) session id that authored this message, captured
        at the moment the CLI emitted it. Schema-optional so the same data
        type stays valid for the user-decision-dispatch SYSTEM completion
        path that posts without an active Turn. At the message-author
        boundary this field is required on every Turn-produced AGENT
        message and on every Turn-scoped SYSTEM completion (anchor,
        assistant-complete, submission-tool action, run-stop finalize);
        handlers that author messages outside a Turn may omit it. May
        carry the Run's `pending_<uuid>` placeholder until the SDK
        confirms its own session id on the first Turn.
      example: "sess_01HXYZ..."
    promptHandler:
      type: string
      description: >-
        Registered CLI prompt-handler key (`PromptType`) that authored this
        message. Schema-optional so the user-decision-dispatch SYSTEM
        completion path stays valid without a Turn. Required at the
        message-author boundary on Turn-produced AGENT messages and on
        Turn-scoped SYSTEM completions; populated from the active Turn's
        handler.promptType.
      example: "FEATURE_SYNC_ANALYZE"
  discriminator:
    propertyName: type
    mapping:
      QUESTIONS: "#/QuestionsSystemMessageData"
      ANALYSIS: "#/AnalysisSystemMessageData"
      NOOP: "#/NoopSystemMessageData"
      INITIATIVES: "#/GenerationSystemMessageData"
      ARTIFACTS_GENERATION: "#/GenerationSystemMessageData"
      TASKS: "#/TasksSystemMessageData"
      FEATURE_LIST: "#/FeatureListSystemMessageData"
      TASK_STUBS: "#/TaskStubSystemMessageData"
      TASK_PRIORITY: "#/TaskPrioritySystemMessageData"
      ERROR: "#/ErrorSystemMessageData"
      INTEGRATIONS: "#/IntegrationsSystemMessageData"
      CODING_PROMPTS: "#/CodingPromptSystemMessageData"
      AGENT: "#/AgentSystemMessageData"
      ROUTING: "#/RoutingSystemMessageData"
      DAILY_SESSION: "#/DailySessionSystemMessageData"
      SESSION_MONITOR: "#/SessionMonitorSystemMessageData"
      TASK_MONITOR_TASK_ACTIVITY: "#/TaskMonitorTaskActivitySystemMessageData"
      TASK_MONITOR_INTERVENTION: "#/TaskMonitorInterventionSystemMessageData"
      TASK_MONITOR_LAUNCH_RECOVERY: "#/TaskMonitorLaunchRecoverySystemMessageData"
      TASK_MONITOR_SUPERVISION: "#/TaskMonitorSupervisionSystemMessageData"
      CARRIER: "#/CarrierSystemMessageData"

