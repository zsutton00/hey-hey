      plan_shaping_proposed_stages: "#/AgentTriggerPlanShapingProposedStages"
      plan_shaping_refine_stage: "#/AgentTriggerPlanShapingRefineStage"
      plan_shaping_visual_preview: "#/AgentTriggerPlanShapingVisualPreview"
      implement: "#/AgentTriggerImplement"
      plan_shaping_finalize: "#/AgentTriggerPlanShapingFinalize"
      plan_shaping_phase_breakdown: "#/AgentTriggerPlanShapingPhaseBreakdown"
