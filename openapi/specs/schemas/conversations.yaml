    - planShapingVisualPreview
    - planShapingPhaseBreakdown
    - planShapingStepReview
    - refineStageStepCreation
    - repositoryPlacement
    - repositoryFeatureEnrichment
    - repositoryFirstWork
  additionalProperties: false
  properties:
    codingPlan:
      $ref: "#/CodingPlanActionSchemas"
      description: Legacy alias for featureSyncCodingPlan.
    implement:
      $ref: "#/ImplementActionSchemas"
      description: Legacy alias for featureSyncImplement.
    featureSyncCodingPlan:
      $ref: "#/CodingPlanActionSchemas"
    featureSyncAnalyze:
      $ref: "#/FeatureSyncAnalyzeActionSchemas"
    featureSyncIterate:
      $ref: "#/FeatureSyncIterateActionSchemas"
    featureSyncImplement:
      $ref: "#/ImplementActionSchemas"
    planShapingFeatureSyncAnalyze:
      $ref: "#/PlanShapingFeatureSyncAnalyzeActionSchemas"
    planShapingFeatureSyncIterate:
      $ref: "#/PlanShapingFeatureSyncIterateActionSchemas"
    planShapingProposedStages:
      $ref: "#/PlanShapingReadyActionSchemas"
    planShapingVisualPreview:
      $ref: "#/PlanShapingVisualPreviewActionSchemas"
    planShapingPhaseBreakdown:
      $ref: "#/PlanShapingPhaseBreakdownActionSchemas"
    planShapingStepReview:
      $ref: "#/PlanShapingStepReviewActionSchemas"
    refineStageStepCreation:
      $ref: "#/PlanShapingReadyActionSchemas"
    repositoryPlacement:
      $ref: "#/RepositoryPlacementActionSchemas"
    repositoryFeatureEnrichment:
      $ref: "#/RepositoryFeatureEnrichmentActionSchemas"
    repositoryFirstWork:
      $ref: "#/RepositoryFirstWorkActionSchemas"
  description: >
    Umbrella registry of action schemas for every named EXTERNAL_AGENT
    node currently declared in the spec, keyed by node id. Each entry is
    a map of the node's declared action names to their
    ExternalAgentActionSchema declarations. Consumed by both the API
    (handleExternalAgentCompletionCreated looks up the resolved node's
    action by name to read waitForUser) and the CLI (submission-tool
    registration reads the action map to declare the node's tools).

SystemMessage:
  type: object
  required:
    - id
    - projectId
    - type
    - status
    - data
    - conversationId
    - createdAt
    - awaitingResponse
  properties:
    executionStatus:
      $ref: "#/MessageExecutionStatus"
    executionQueueConfirmed:
      type: boolean
      readOnly: true
      description: >-
        True only while queued after the execution owner confirms this input
        must wait: derived from an executionAdmissionDisposition of QUEUED or
        a waiting projection. False or absent on an executable queued message
        means delivery is pending or the input was admitted for immediate
        execution; render it beside the composer, outside the visible queue
        and conversation timeline.
    executionAdmissionDisposition:
      $ref: "#/MessageExecutionAdmissionDisposition"
    executionCancellationRequested:
      type: boolean
      description: >-
        A durable cancellation request is awaiting owner confirmation. This
        does not imply cancellation and never stops already-started execution.
    executionOperationId:
      $ref: "./agent-operation.yaml#/AgentOperationId"
      description: Exact submitted operation owning this executable message.
    id:
      $ref: "./common.yaml#/MessageId"
      description: Unique identifier of the Message interaction
    projectId:
      $ref: "./common.yaml#/ProjectId"
    type:
      type: string
      enum: [SYSTEM]
      description: Message type - always SYSTEM for this schema
    userId:
      type: string
      description: ID of the user who created the message, or 'system' for system-generated messages
      example: "system"
    status:
      $ref: "#/MessageStatus"
      description: Current status of the message
    data:
      $ref: "#/SystemMessageData"
      description: System message data following SystemMessageData structure
    conversationId:
      type: string
      description: ID of the associated conversation
    parentMessageId:
      $ref: "./common.yaml#/MessageId"
      description: ID of the message this responds to (for responses)
    responses:
      type: array
      items:
        $ref: "#/MessageResponseDto"
      description: Messages that respond to this message
    parentMessage:
      $ref: "#/MessageResponseDto"
      description: The message this is responding to
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp
    awaitingResponse:
      type: boolean
      description: Whether the message is awaiting a response from the user
    proposals:
      type: array
      items:
        $ref: "./proposals.yaml#/ProposalResponseDto"
      description: Proposals created for or linked to this message (included when includeProposals=true)
    reports:
      type: array
      items:
        $ref: "./reports.yaml#/ReportDto"
      description: Reports linked to this message via ReportEntity (included when includeReports=true)

