# =============================================
# QUESTIONS Gate User-Submission Schemas
# =============================================
#
# Shape of `userMessage.data[fieldId]` when the user clicks a
# SecondaryAction button on a QUESTIONS gate. The server-side
# MessageProcessor.buildQuestionsFieldActionSignalMessage bridge lifts
# `action` and `payload` from this entry to the top level of
# `userMessage.data` before signaling the workflow, where
# `validateQuestionsAction` validates them against the gate's declared
# action-schema map.
#
# These schemas are distinct from the `*Payload` schemas above, which
# describe the button-config payload the agent attaches to a
# `SecondaryActionConfig` rendered to the user. User-submission schemas
# describe the wire shape that comes BACK when the user picks an action.
#
# Each gate declares a discriminated union over its action discriminators,
# plus one per-(gate, action) variant pinning the action enum to a single
# literal so TypeScript narrowing isolates the payload shape per branch.
# Cross-field refinements that OpenAPI cannot express structurally stay in Zod and are pinned to the generated types
# via `satisfies` assertions in the server's `*-schemas.ts` files.

# ----- Shared payloads -----

QuestionsFeedbackPayload:
  type: object
  additionalProperties: false
  required:
    - feedback
  properties:
    feedback:
      type: string
      description: |
        Free-form review feedback the user types into the gate's textarea.
        Required for REFINE submissions so the next agent turn receives the
        user's requested changes.
  description: |
    Feedback payload carried by the canonical REFINE action at plan-shaping
    and refine-stage review gates.

QuestionsApprovedPayload:
  type: object
  additionalProperties: false
  description: |
    Intentionally empty payload carried by the canonical APPROVED action at
    plan-shaping and refine-stage review gates.

# ----- plan-shaping / proposed-stages-feedback -----

PlanShapingProposedStagesFeedbackRefineSubmission:
  type: object
  required:
    - action
    - payload
  properties:
    action:
      type: string
      enum:
        - REFINE
    payload:
      $ref: "#/QuestionsFeedbackPayload"
  description: |
    User-submission shape for the plan-shaping proposed-stages-feedback
    gate's `REFINE` action. Routes back to `proposed-stages`
    so the agent runs another revision pass against the feedback body.

PlanShapingProposedStagesFeedbackApprovedSubmission:
  type: object
  required:
    - action
    - payload
  properties:
    action:
      type: string
      enum:
        - APPROVED
    payload:
      $ref: "#/QuestionsApprovedPayload"
  description: |
    User-submission shape for the plan-shaping proposed-stages-feedback
    gate's `APPROVED` action. Records that the user is ready to advance
    to visual preview without changing any PlanStage proposal state.

PlanShapingProposedStagesFeedbackUserSubmission:
  oneOf:
    - $ref: "#/PlanShapingProposedStagesFeedbackRefineSubmission"
    - $ref: "#/PlanShapingProposedStagesFeedbackApprovedSubmission"
  discriminator:
    propertyName: action
    mapping:
      REFINE: "#/PlanShapingProposedStagesFeedbackRefineSubmission"
      APPROVED: "#/PlanShapingProposedStagesFeedbackApprovedSubmission"
  description: |
    Discriminated union of submissions accepted by the plan-shaping
    proposed-stages-feedback gate. The server's
    `planShapingProposedStagesFeedbackActions` Zod schema map mirrors
    this union 1:1 (enforced at compile time via a `satisfies` check).

# ----- plan-shaping / visual-preview-feedback -----

PlanShapingVisualPreviewFeedbackRefineSubmission:
  type: object
  required:
    - action
    - payload
  properties:
    action:
      type: string
      enum:
        - REFINE
    payload:
      $ref: "#/QuestionsFeedbackPayload"
  description: |
    User-submission shape for the plan-shaping visual-preview-feedback gate's
    `REFINE` action. Routes back to visual-preview generation with the user's
    feedback while preserving the carried-forward proposal set.

PlanShapingVisualPreviewFeedbackApprovedSubmission:
  type: object
  required:
    - action
    - payload
  properties:
    action:
      type: string
      enum:
        - APPROVED
    payload:
      $ref: "#/QuestionsApprovedPayload"
  description: |
    User-submission shape for the plan-shaping visual-preview-feedback gate's
    `APPROVED` action. Accepts the complete ordered visual proposal set before
    stage selection begins.

# ----- refine-stage / validation-choice -----

# ----- refine-stage / steps-feedback -----

RefineStageStepsFeedbackRefineSubmission:
  type: object
  required:
    - action
    - payload
  properties:
    action:
      type: string
      enum:
        - REFINE
    payload:
      $ref: "#/QuestionsFeedbackPayload"
  description: |
    User-submission shape for the refine-stage steps-feedback gate's `REFINE`
    action. Routes back to `step-creation` so the
    agent runs another revision pass against the feedback body.

RefineStageStepsFeedbackApprovedSubmission:
  type: object
  required:
    - action
    - payload
  properties:
    action:
      type: string
      enum:
        - APPROVED
    payload:
      $ref: "#/QuestionsApprovedPayload"
  description: |
    User-submission shape for the refine-stage steps-feedback gate's
    `APPROVED` action. Approves every DRAFT PlanStep proposal scoped
    to the conversation before advancing to `finalize`.

RefineStageStepsFeedbackUserSubmission:
  oneOf:
    - $ref: "#/RefineStageStepsFeedbackRefineSubmission"
    - $ref: "#/RefineStageStepsFeedbackApprovedSubmission"
  discriminator:
    propertyName: action
    mapping:
      REFINE: "#/RefineStageStepsFeedbackRefineSubmission"
      APPROVED: "#/RefineStageStepsFeedbackApprovedSubmission"
  description: |
    Discriminated union of submissions accepted by the refine-stage
    steps-feedback gate. The server's `refineStageStepsFeedbackActions`
    Zod schema map mirrors this union 1:1.

# Secondary Action Configuration
SecondaryActionConfig:
  type: object
  required:
    - id
    - type
    - label
    - handler
    - fieldId
  properties:
    id:
      type: string
      description: Unique identifier for this secondary action
      example: "task-generation-action-1"
    type:
      type: string
      enum: ["field_action", "form_action", "workflow_action"]
      description: Type of secondary action
      example: "form_action"
    presentation:
      type: string
      enum:
        - BUTTON
        - INLINE
      default: BUTTON
    label:
      type: string
      description: Display label for the action button
      example: "Generate Tasks"
    fieldId:
      type: string
      description: The UI Element ID
      example: "task-input-1"
    icon:
      type: string
      description: Optional icon name or identifier
      example: "✨"
    handler:
      $ref: "#/SecondaryActionHandler"
      description: Action handler/callback identifier
    disabled:
      type: boolean
      default: false
      description: Whether the action is disabled
      example: false
    payload:
      allOf:
        - $ref: "#/SecondaryActionPayload"
      description: Structured data payload for the action handler
  description: Configuration for a secondary action button

# Secondary Action embedded in Actions array
SecondaryAction:
  allOf:
    - $ref: "#/Action"
    - type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum: ["secondary_action"]
          description: Action type identifier
        payload:
          type: object
          required:
            - action
          properties:
            action:
              $ref: "#/SecondaryActionConfig"
              description: Secondary action configuration
  description: Secondary action embedded in actions array

# Secondary Action Handlers enumeration
SecondaryActionHandler:
  type: string
  enum:
    - "verify_feature"
    - "task_generation_generate"
    - "continue_conversation"
    - "task_stub_generation_generate"
    - "adr_content_apply"
    - "initiative_content_apply"
    - "task_content_apply"
    - "next_step"
    - "complete_onboarding"
    - "coding_prompt_accept"
    - "suggested_action"
    - "related_entities"
    - "plan_gap_continue_revising"
    - "plan_approval_continue_revising"
    - "plan_stage_continue_revising"
    - "plan_service_analyze"
    - "suggested_agent_action"
    - "sync_recommendation_continue_revising"
    - "feature_list_continue_revising"
    - "plan_generation_stage_review_continue_revising"
    - "plan_generation_stage_review_approve_all"
    - "plan_generation_step_review_continue_revising"
    - "plan_generation_step_review_approve_all"
    - "plan_generation_visual_preview_approve"
    - "plan_generation_visual_preview_continue_revising"
    - "plan_generation_journey_map_approve"
    - "plan_generation_journey_map_continue_revising"
    - "refine_stage_validation_choice_pick_validation_on"
    - "refine_stage_validation_choice_pick_validation_off"
    - "plan_shaping_feature_sync_review_done"
    - "plan_shaping_feature_sync_review_request_revisions"
    - "implementation_readiness_reply"
    - "implementation_readiness_dismiss"
  description: |
    Predefined secondary action handlers:
    - task_generation_generate: Task generation field actions
    - continue_conversation: Continue conversation without triggering generation
    - adr_content_apply: Apply suggested ADR context section
    - initiative_content_apply: Apply suggested initiative field edits
    - task_content_apply: Apply suggested task field edits
    - next_step: Perform the next step
    - complete_onboarding: Mark the onboarding experience as complete
    - coding_prompt_accept: Accept the system's prompt code
    - suggested_action: Surface a suggested action from an agent response
    - related_entities: Surface related entities from an agent response
    - plan_gap_continue_revising: Continue revising plan gap discovery
    - plan_approval_continue_revising: Continue revising plan approval
    - plan_stage_continue_revising: Continue revising plan stage proposal
    - plan_service_analyze: Have system analyze plan for services
    - suggested_agent_action: Pre-canned prompt template to send to a coding agent
    - sync_recommendation_continue_revising: Continue refining sync recommendations
    - plan_generation_stage_review_continue_revising: Continue revising local plan-generation proposed stages
    - plan_generation_stage_review_approve_all: Approve all local plan-generation proposed stages
    - plan_generation_step_review_continue_revising: Continue revising local plan-generation proposed steps
    - plan_generation_step_review_approve_all: Approve all local plan-generation proposed steps
    - plan_generation_journey_map_approve: Approve the JourneyMap and kick off plan creation
    - plan_generation_journey_map_continue_revising: Continue revising the JourneyMap with user feedback
    - refine_stage_validation_choice_pick_validation_on: Opt into the post-creation validation pass on the refine-stage validation-choice gate
    - refine_stage_validation_choice_pick_validation_off: Skip the post-creation validation pass on the refine-stage validation-choice gate
    - plan_shaping_feature_sync_review_done: Declare the feature-sync review finished and advance to stage proposal without approving any proposal; pending DRAFTs are recorded as dismissed
    - plan_shaping_feature_sync_review_request_revisions: Request revisions on the feature-sync review gate; revision text is carried by the field element payload

# Secondary Action Context for execution
SecondaryActionContext:
  type: object
  required:
    - conversationId
    - projectId
    - organizationId
    - messageId
    - fieldId
  properties:
    # Form context
    conversationId:
      type: string
      description: Form conversation context
    projectId:
      type: string
      description: Project context
    organizationId:
      type: string
      description: Organization context
    messageId:
      type: string
      description: Current message ID

    # Field context (if applicable)
    fieldId:
      type: string
      description: The UI Element ID
    fieldType:
      type: string
      description: Field type for field-specific actions

    uiElements:
      type: array
      items:
        $ref: "#/UIElement"
      description: All UI elements in current form
  description: Context passed to secondary action handlers for execution

# =============================================
# Skip To Node Schemas
# =============================================

SkipToNodeRequestDto:
  type: object
  required:
    - targetNode
  properties:
    targetNode:
      type: string
      description: The node ID to skip to in the workflow
      example: "generate_tasks"
  description: Request to skip to a specific workflow node

SkipToNodeResponseDto:
  type: object
  required:
    - success
    - currentNode
  properties:
    success:
      type: boolean
      description: Whether the skip operation was successful
      example: true
    currentNode:
      type: string
      description: The current node ID after the skip
      example: "generate_tasks"
    message:
      type: string
      description: Optional message about the skip operation
      example: "Successfully skipped to generate_tasks node"
  description: Response from skip to node operation

AvailableSkipNode:
  type: object
  required:
    - nodeId
    - label
    - canSkip
  properties:
    nodeId:
      type: string
      description: The workflow node ID
      example: "generate_tasks"
    label:
      type: string
      description: Human-readable label for the node
      example: "Generate Tasks"
    canSkip:
      type: boolean
      description: Whether skipping to this node is currently allowed
      example: true
    reason:
      type: string
      description: Reason why skip is not allowed (if canSkip is false)
      example: "Cannot skip while generation is in progress"
  description: Information about a skip-to-able node

AvailableSkipNodesResponseDto:
  type: object
  required:
    - nodes
  properties:
    nodes:
      type: array
      items:
        $ref: "#/AvailableSkipNode"
      description: List of available skip-to-able nodes with their current status
  description: Response containing all available skip-to-able nodes

OnboardingPlanCandidateReviewPayload:
  type: object
  required:
    - response
    - stages
  properties:
    response:
      type: string
      description: User-facing summary and stage guidance
    stages:
      type: array
      items:
        $ref: "#/OnboardingPlanCandidateReviewPayloadStage"
      description: Proposed execution stages
  description: Plan stage proposal payload for UI rendering

OnboardingPlanCandidateReviewPayloadStage:
  type: object
  required:
    - title
    - description
    - purpose
    - timing
    - sequenceOrder
    - itemCounts
  properties:
    title:
      type: string
      description: Stage title
    description:
      type: string
      description: High-level stage description
    purpose:
      type: string
      description: Outcome or purpose for the stage
    timing:
      type: string
      description: Relative timing or sequencing notes
    sequenceOrder:
      type: integer
      description: Order of the stage in the sequence
    itemCounts:
      $ref: "#/OnboardingPlanCandidateReviewPayloadStageItemCounts"
  description: Proposed plan stage details

OnboardingPlanCandidateReviewPayloadStageItemCounts:
  type: object
  required:
    - tasks
    - designDocs
    - services
  properties:
    tasks:
      type: integer
      description: Task count for the stage
    designDocs:
      type: integer
      description: Design doc count for the stage
    services:
      type: integer
      description: Service count for the stage
  description: Coverage counts for plan stage items

PlanGenerationStageReviewPayload:
  type: object
  additionalProperties: false
  required:
    - expectedStageCount
  properties:
    expectedStageCount:
      type: integer
      minimum: 0
      description: Exact decided stage total from the corresponding accepted completion; advisory for readiness.

PlanGenerationStageReviewElement:
  allOf:
    - $ref: "#/UIElement"
    - type: object
      required:
        - payload
      properties:
        payload:
          $ref: "#/PlanGenerationStageReviewPayload"
  x-discriminator-value: plan_generation_stage_review

AgentTriggerWorkTrackerConnect:
  type: object
  additionalProperties: false
  required: [promptType, nodeId, triggerMessageId, payload]
  properties:
    inputExecution:
      $ref: "./agent-operation.yaml#/InputExecutionIdentity"
    promptType:
      type: string
      enum: [work_tracker_connect]
    nodeId:
      type: string
      minLength: 1
    triggerMessageId:
      type: string
      minLength: 1
    payload:
      $ref: "./work-tracker-import.yaml#/WorkTrackerImportRequest"

AgentTriggerWorkTrackerImport:
  type: object
  additionalProperties: false
  required: [promptType, nodeId, triggerMessageId, payload]
  properties:
    inputExecution:
      $ref: "./agent-operation.yaml#/InputExecutionIdentity"
    promptType:
      type: string
      enum: [work_tracker_import]
    nodeId:
      type: string
      minLength: 1
    triggerMessageId:
      type: string
      minLength: 1
    payload:
      $ref: "./work-tracker-import.yaml#/WorkTrackerImportRequest"
