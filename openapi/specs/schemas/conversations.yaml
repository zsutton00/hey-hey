# Discriminated union over the two enactment shapes the API hook supports
# when `outcome=CONTINUED`:
#   - action-bearing : `{ action, response? }` — completes a paused
#                      EXTERNAL_AGENT node by riding the existing
#                      `completesExternalAgentNode` completion path.
#   - response-only  : `{ response }` — re-enters the workflow as a USER
#                      message envelope (`data.agentInput.workflowName`)
#                      so the receiving handler classifies it identically
#                      to a user-typed reply.
# The arms are keyed on the presence/absence of `action` rather than a
# discriminator literal — the action-bearing arm REQUIRES `action`, the
# response-only arm FORBIDS it, and both are validated by the API-side zod
# schema at ingestion.
SessionMonitorContinuationCompletion:
  oneOf:
    - $ref: "#/SessionMonitorContinuationCompletionAction"
    - $ref: "#/SessionMonitorContinuationCompletionResponse"
  description: >-
    Continuation dispatch payload the API hook enacts on
    `outcome=CONTINUED`. Exactly one arm is populated per message: the
    action-bearing arm completes a paused EXTERNAL_AGENT node; the
    response-only arm re-enters the workflow as a USER message.

SessionMonitorContinuationCompletionAction:
  type: object
  required:
    - action
  additionalProperties: false
  properties:
    action:
      type: string
      description: >-
        Action discriminator the API hook routes on. Sourced from the
        vocabulary the server attached to the trigger payload's
        `reportGuidance.actions`, which comes from the originating
        session's active EXTERNAL_AGENT node action map before the
        SYSTEM/AGENT completion message is written.
      example: "RESOLVED"
    response:
      type: string
      description: >-
        Optional free-form response body the session-monitor wants to ride
        on the completion envelope. Carried verbatim onto
        `ExternalAgentNodeCompletion.payload.response`.

SessionMonitorContinuationCompletionResponse:
  type: object
  required:
    - response
  additionalProperties: false
  properties:
    response:
      type: string
      description: >-
        Free-form user-reply body the session-monitor authored. The API hook
        writes a USER message whose `data.agentInput.workflowName` envelope
        carries this text in the `userMessage` slot, so downstream handlers
        classify it identically to a user-typed reply.

