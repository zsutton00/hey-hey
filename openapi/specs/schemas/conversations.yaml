# Posted by the CLI session-monitor agent identity to render the agent's
# report-evaluation lifecycle inline in the conversation. CLI Channel Security
# is the precondition for posting under this identity: only the session-monitor
# handler running on a trusted CLI Run may emit SESSION_MONITOR system messages.
#
# The optional `state` field distinguishes the non-terminal evaluating message
# from the terminal decision. Omitted `state` is treated as DECISION for
# backwards compatibility with decision messages written before this field
# existed.
#
# Terminal DECISION messages record the already-admitted branch:
#   - CONTINUED  → the typed admission boundary kept the parent workflow
#                  moving and `continuationCompletion` records its consequence.
#   - DEFERRED   → the typed admission boundary handed the report back for
#                  review and `continuationCompletion` MUST be absent.
# Non-terminal EVALUATING messages MUST omit `outcome` and
# `continuationCompletion`; they only tell the user the monitor has started
# evaluating the report.
SessionMonitorSystemMessageData:
  allOf:
    - $ref: "#/SystemMessageData"
    - type: object
      required:
        - type
        - response
        - agentIdentity
        - content
      properties:
        flowId:
          type: string
          description: ID of the conversational flow this message belongs to
          example: "agent-session"
        nodeId:
          type: string
          description: ID of the specific node/step within the flow
          example: "session_monitor"
        ragEnabled:
          type: boolean
          description: Whether this message should be included in RAG retrieval
        title:
          type: string
          description: Title or header for this conversation step, used for breadcrumbs and navigation
          example: "Session Monitor"
        agentIdentity:
          type: string
          description: >-
            Stable identifier for the session-monitor agent that authored
            this message. Carried so the UI can render the message under a
            distinct, recognizable agent identity rather than the generic
            SYSTEM author.
          example: "session-monitor"
        content:
          type: string
          description: >-
            Body emitted by the session-monitor agent for the user to read in
            the conversation view. EVALUATING messages describe that the
            monitor has started reviewing the report; DECISION messages carry
            the terminal continuation-decision body.
        reportId:
          type: string
          format: uuid
          description: >-
            Optional id of the source report this decision was derived from.
            Carried so the UI can link back to the underlying report when one
            exists.
        state:
          $ref: "#/SessionMonitorMessageState"
          description: >-
            Lifecycle state of the session-monitor message. EVALUATING is a
            non-terminal progress message and carries no `outcome`.
            DECISION is the terminal evidence message that carries `outcome`
            and drives notification only. Omitted state is treated as DECISION
            for backwards compatibility with pre-state messages.
        outcome:
          $ref: "#/SessionMonitorOutcome"
          description: >-
            The session-monitor's admitted terminal decision for this report.
            The evidence hook routes notification emission off this field.
            Required when `state=DECISION` or `state` is omitted. Must be
            absent when `state=EVALUATING`. CONTINUED requires
            `continuationCompletion`; DEFERRED forbids it.
        continuationCompletion:
          $ref: "#/SessionMonitorContinuationCompletion"
          description: >-
            Server-derived record of the consequence selected at the typed
            Session Monitor decision boundary. It is evidence only and never
            grants continuation authority to a generic Message submission.
        decisionOperationId:
          $ref: "./session-monitor-decision.yaml#/SessionMonitorDecisionId"
          description: Stable admitted decision identity that produced this evidence.
        decisionFingerprint:
          $ref: "./agent-operation.yaml#/AgentOperationFingerprint"
          description: Server-derived semantic fingerprint of the admitted decision.
        consequenceMessageId:
          allOf:
            - $ref: "./common.yaml#/MessageId"
          nullable: true
          description: >-
            Server-authored executable consequence Message, or null when the
            admitted decision deferred without an executable consequence.
  x-discriminator-value: SESSION_MONITOR

SessionMonitorMessageState:
  type: string
  enum:
    - EVALUATING
    - DECISION
  description: >-
    Lifecycle state for SESSION_MONITOR system messages. EVALUATING is the
    non-terminal "monitor is reviewing the report" message; DECISION is the
    terminal continuation decision. Omitted state is interpreted as DECISION
    for backwards compatibility with existing messages.

# Discriminator value used by SessionMonitorSystemMessageData.outcome. Kept as
# a top-level schema so generated clients export a typed enum the API hook
# (and any consumer rendering the decision) can route on without re-deriving
# the string literals.
SessionMonitorOutcome:
  type: string
  enum:
    - CONTINUED
    - DEFERRED
  description: >-
    The session-monitor's terminal decision for the report it consumed.
    `CONTINUED` means the typed decision boundary kept the parent workflow
    moving and this message records its consequence; `DEFERRED` means the
    monitor decided the report needs human review and no executable
    consequence was created.

