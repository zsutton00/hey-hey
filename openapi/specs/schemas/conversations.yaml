GoalPmRoutingDecisionResponseDto:
  type: object
  additionalProperties: false
  required:
    [
      sourceConversationId,
      sourceMessageId,
      uiElementId,
      selectedOption,
      decidedBy,
      createdAt,
    ]
  properties:
    sourceConversationId:
      $ref: "./common.yaml#/ConversationId"
    sourceMessageId:
      $ref: "./common.yaml#/MessageId"
    uiElementId:
      type: string
      minLength: 1
    selectedOption:
      $ref: "#/GoalPmRoutingOption"
    decidedBy:
      $ref: "./common.yaml#/UserId"
    createdAt:
      type: string
      format: date-time

GoalPmRoutingCreation:
  type: object
  additionalProperties: false
  required: [config, provider, machineId]
  properties:
    config:
      $ref: "./coding-sessions.yaml#/AgentSessionConfigEntityConversationV1"
    provider:
      type: string
      enum: [claude, codex, opencode]
    machineId:
      type: string
      format: uuid
    fastMode:
      type: boolean

GoalPmRoutingOutcome:
  type: object
  additionalProperties: false
  required: [entityType, entityId, title]
  properties:
    entityType:
      type: string
      enum: [CONVERSATION, TASK, PROPOSAL]
    entityId:
      type: string
      format: uuid
    title:
      type: string
      minLength: 1
    agentSessionId:
      type: string
      format: uuid

GoalPmRoutingAnswer:
  type: object
  additionalProperties: false
  required:
    [type, selectedOption, operationId, state, requestedAt, pendingRequest]
  description: Durable linked USER form answer. Destination creation and this answer commit together. Local execution is separately authorized using the stable operationId; PENDING retains a recoverable handoff and never authorizes creating another destination.
  properties:
    type:
      type: string
      enum: [GOAL_PM_ROUTING]
    selectedOption:
      $ref: "#/GoalPmRoutingOption"
    operationId:
      type: string
      format: uuid
    state:
      type: string
      enum: [PENDING, COMPLETED]
    requestedAt:
      type: string
      format: date-time
    pendingRequest:
      type: string
    creation:
      $ref: "#/GoalPmRoutingCreation"
    outcome:
      $ref: "#/GoalPmRoutingOutcome"

GoalPmRoutingEnactmentRequest:
  type: object
  additionalProperties: false
  required: [selection]
  properties:
    selection:
      $ref: "#/GoalPmRoutingSelectionPayload"
    creation:
      $ref: "#/GoalPmRoutingCreation"
    pendingRequest:
      type: string
  description: Recover the committed answer before consulting creation inputs. A fresh new-conversation selection requires creation settings. Legacy record-only choices cannot be enacted.

GoalPmRoutingEnactmentResponse:
  type: object
  additionalProperties: false
  required:
    [
      sourceConversationId,
      sourceMessageId,
      uiElementId,
      answer,
      answerMessageId,
    ]
  properties:
    sourceConversationId:
      $ref: "./common.yaml#/ConversationId"
    sourceMessageId:
      $ref: "./common.yaml#/MessageId"
    uiElementId:
      type: string
    answer:
      $ref: "#/GoalPmRoutingAnswer"
    answerMessageId:
      $ref: "./common.yaml#/MessageId"

GoalPmRoutingCompletionRequest:
  type: object
  additionalProperties: false
  required: [selection]
  properties:
    selection:
      $ref: "#/GoalPmRoutingSelectionPayload"

GoalPmRoutingOption:
  oneOf:
    - $ref: "#/GoalPmExistingConversationOption"
    - $ref: "#/GoalPmStartNewConversationOption"
    - $ref: "#/GoalPmRefineSearchOption"
    - $ref: "#/GoalPmTrackExistingWorkOption"
    - $ref: "#/GoalPmCreateMissingWorkOption"
    - $ref: "#/GoalPmProposalOption"
  discriminator:
    propertyName: kind
    mapping:
      existingConversation: "#/GoalPmExistingConversationOption"
      startNewConversation: "#/GoalPmStartNewConversationOption"
      refineSearch: "#/GoalPmRefineSearchOption"
      trackExistingWork: "#/GoalPmTrackExistingWorkOption"
      createMissingWork: "#/GoalPmCreateMissingWorkOption"
      proposal: "#/GoalPmProposalOption"

GoalPmExistingConversationOption:
  type: object
  additionalProperties: false
  required: [optionId, kind, conversationId, title, evidence, rationale]
  properties:
    optionId:
      type: string
      minLength: 1
    kind:
      type: string
      enum: [existingConversation]
    conversationId:
      type: string
      format: uuid
      description: Canonical CONVERSATION identity; never a MESSAGE identity
    title:
      type: string
      minLength: 1
      description: Meaningful canonical conversation title; placeholder labels are invalid
    evidence:
      type: array
      minItems: 1
      items:
        $ref: "#/GoalPmRoutingEvidence"
    rationale:
      type: string
      minLength: 1

GoalPmRoutingEvidence:
  type: object
  additionalProperties: false
  required: [messageId, excerpt, rationale]
  properties:
    messageId:
      type: string
      format: uuid
      description: Canonical MESSAGE identity supporting this conversation match
    excerpt:
      type: string
      minLength: 1
      description: Bounded excerpt from the canonical message; never a serialized message object
    rationale:
      type: string
      minLength: 1
      description: Why this message supports the proposed destination

GoalPmStartNewConversationOption:
  type: object
  additionalProperties: false
  required: [optionId, kind, title, rationale, requiresConfirmation]
  properties:
    optionId:
      type: string
      minLength: 1
    kind:
      type: string
      enum: [startNewConversation]
    title:
      type: string
      minLength: 1
    rationale:
      type: string
      minLength: 1
    requiresConfirmation:
      type: boolean
      enum: [true]

GoalPmRefineSearchOption:
  type: object
  additionalProperties: false
  required: [optionId, kind, title, prompt, rationale]
  properties:
    optionId:
      type: string
      minLength: 1
    kind:
      type: string
      enum: [refineSearch]
    title:
      type: string
      minLength: 1
    prompt:
      type: string
      minLength: 1
    rationale:
      type: string
      minLength: 1

GoalPmTrackExistingWorkOption:
  type: object
  additionalProperties: false
  required: [optionId, kind, target, rationale, requiresSelection]
  properties:
    optionId:
      type: string
      minLength: 1
    kind:
      type: string
      enum: [trackExistingWork]
    target:
      oneOf:
        - $ref: "#/GoalPmTaskTarget"
        - $ref: "#/GoalPmPlanTarget"
      discriminator:
        propertyName: entityType
    rationale:
      type: string
      minLength: 1
    requiresSelection:
      type: boolean
      enum: [true]

GoalPmCreateMissingWorkOption:
  type: object
  additionalProperties: false
  required:
    [
      optionId,
      kind,
      parentFeatureId,
      workItemType,
      title,
      description,
      acceptanceCriteria,
      authoringMode,
      rationale,
      requiresSelection,
    ]
  properties:
    optionId:
      type: string
      minLength: 1
    kind:
      type: string
      enum: [createMissingWork]
    parentFeatureId:
      type: string
      format: uuid
    workItemType:
      type: string
      enum: [TASK]
    title:
      type: string
      minLength: 1
    description:
      type: string
      minLength: 1
    acceptanceCriteria:
      type: string
      minLength: 1
    authoringMode:
      type: string
      enum: [PROPOSAL]
    rationale:
      type: string
      minLength: 1
    requiresSelection:
      type: boolean
      enum: [true]

GoalPmProposalOption:
  type: object
  additionalProperties: false
  required: [optionId, kind, proposalId, title, rationale, requiresSelection]
  properties:
    optionId:
      type: string
      minLength: 1
    kind:
      type: string
      enum: [proposal]
    proposalId:
      type: string
      format: uuid
      description: Canonical PROPOSAL identity; this option is not a conversation destination
    title:
      type: string
      minLength: 1
    rationale:
      type: string
      minLength: 1
    requiresSelection:
      type: boolean
      enum: [true]

GoalPmTaskTarget:
  type: object
  additionalProperties: false
  required: [entityType, entityId, title]
  properties:
    entityType:
      type: string
      enum: [TASK]
    entityId:
      type: string
      format: uuid
    title:
      type: string
      minLength: 1

GoalPmPlanTarget:
  type: object
  additionalProperties: false
  required: [entityType, entityId, title]
  properties:
    entityType:
      type: string
      enum: [PLAN]
    entityId:
      type: string
      format: uuid
    title:
      type: string
      minLength: 1

FileDiffPayload:
  type: object
  required:
    - responseType
    - sourceDiffId
    - diffs
    - validation
    - metrics
  properties:
    responseType:
      type: string
      enum: [file_diff_v1]
    sourceDiffId:
      type: string
      description: Identifier linking back to the originating diff event
    diffs:
      type: array
      items:
        $ref: "#/FileDiffEntry"
      description: Per-file diff entries
    validation:
      $ref: "#/FileDiffValidation"
    metrics:
      $ref: "#/FileDiffMetrics"
  description: Structured payload for file diff UI elements

FileDiffEntry:
  type: object
  required:
    - filePath
    - diffFormat
    - timestamp
    - sessionId
    - agentId
  properties:
    filePath:
      type: string
      description: Path of the file being edited
    beforeContent:
      type: string
      nullable: true
      description: File content before the edit
    afterContent:
      type: string
      nullable: true
      description: File content after the edit
    diffFormat:
      type: string
      enum: [unified, structured, raw]
      description: Format of the diff data
    timestamp:
      type: string
      description: ISO 8601 timestamp of the diff event
    sessionId:
      type: string
      description: Agent session that produced this diff
    agentId:
      type: string
      description: Agent that produced this diff
    permissionRequestId:
      type: string
      nullable: true
      description: Permission request that triggered this edit
    diffBlob:
      type: string
      nullable: true
      description: Raw diff text when format is unrecognized

FileDiffValidation:
  type: object
  required:
    - valid
    - errors
  properties:
    valid:
      type: boolean
      description: Whether all diffs passed validation
    errors:
      type: array
      items:
        type: string
      description: Validation error messages

FileDiffMetrics:
  type: object
  required:
    - detectionSuccessCount
    - detectionFailureCount
    - formatConversionCount
    - validationSuccessCount
    - validationFailureCount
  properties:
    detectionSuccessCount:
      type: integer
    detectionFailureCount:
      type: integer
    formatConversionCount:
      type: integer
    validationSuccessCount:
      type: integer
    validationFailureCount:
      type: integer
  description: Metrics from the diff detection and normalization pipeline

MultipleChoiceAction:
  type: string
  enum:
    - create-plan
    - create-initiative
  description: Onboarding branch action selected for the chosen option

MultipleChoiceOption:
  type: object
  required:
    - title
    - description
    - action
  properties:
    title:
      type: string
      description: Option title shown to the user
    description:
      type: string
      description: Explains when to choose this onboarding option
    action:
      $ref: "#/MultipleChoiceAction"

MultipleChoicePayload:
  type: object
  required:
    - options
  properties:
    options:
      type: array
      items:
        $ref: "#/MultipleChoiceOption"
      description: Branching options for the onboarding question
  description: Payload containing branching options for the onboarding question

PlanGapDiscoveryPayload:
  type: object
  required:
    - response
    - category
    - gaps
    - clarificationQuestions
  properties:
    response:
      type: string
      description: User-facing summary and next-step guidance
    category:
      type: string
      enum:
        - tasks
        - design_docs
        - services
      description: Category analyzed in this response
    gaps:
      type: object
      required:
        - tasks
        - design_docs
        - services
      properties:
        tasks:
          type: array
          items:
            $ref: "#/PlanGapItemPayload"
        design_docs:
          type: array
          items:
            $ref: "#/PlanGapItemPayload"
        services:
          type: array
          items:
            $ref: "#/PlanGapItemPayload"
      description: Gap items grouped by category
    clarificationQuestions:
      type: object
      required:
        - tasks
        - design_docs
        - services
      properties:
        tasks:
          type: array
          items:
            type: string
        design_docs:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            type: string
      description: Clarifying questions grouped by category
  description: Plan gap discovery payload for UI rendering

QuestionsGroupPayload:
  type: object
  required:
    - questions
  properties:
    questions:
      type: array
      items:
        type: string
      description: Clarifying questions for scope and constraints
  description: Plan scope constraints payload for UI rendering

PlanApprovalPayload:
  type: object
  required:
    - description
    - workstreams
  properties:
    description:
      type: object
      required:
        - approach
        - outcome
        - verification
      properties:
        approach:
          type: string
          description: 2-3 sentence summary of the approach
        outcome:
          type: string
          description: 2-4 sentences on what the finished product will do
        verification:
          type: string
          description: How we'll know this meets the goals
    workstreams:
      type: array
      items:
        type: object
        required:
          - name
          - focus
        properties:
          name:
            type: string
            description: Clear name for this workstream
          focus:
            type: string
            description: What this workstream accomplishes
  description: Plan approval payload for UI rendering

PlanDocumentViewPayload:
  type: object
  required:
    - entityId
  properties:
    entityId:
      type: string
      description: Design doc ID to render in read-only mode
    template:
      type: string
      enum: [PLAN_DOCUMENT]
      description: Expected design doc template for rendering
  description: Payload for read-only plan document viewer UI element

PlanGenerationJourneyReviewPayload:
  type: object
  required:
    - responseType
    - journeyMap
  properties:
    responseType:
      type: string
      enum: [plan_generation_journey_review_v1]
      description: Discriminator identifying this as a plan-generation journey-review payload.
    journeyMap:
      $ref: "./trigger-payloads.yaml#/JourneyMap"
      description: >
        The agent-authored JourneyMap the user is being asked to review.
        Carried verbatim from `FlowContext.journeySteps` (which the
        journey-map node stamped on the prior APPROVED submission), so
        the review UI can render the full map alongside the feedback
        textarea without re-fetching from history. Not a persisted
        platform entity — exists only on FlowContext and on this
        review-element payload.
  description: >
    Payload for the plan-generation journey-review gate UI element.
    Carries the JourneyMap the journey-map agent just emitted so the
    review component can render the ordered journey steps inline with
    the feedback textarea and the Continue Revising / Approve buttons.

PlanGenerationVisualPreviewRelationship:
  type: object
  additionalProperties: false
  required:
    - kind
    - proposalId
  properties:
    kind:
      type: string
      enum: [depends_on, refines]
      description: Same-family semantic relationship from this visual to another visual proposal.
    proposalId:
      type: string
      minLength: 1
      description: Proposal identity of the same-family visual this entry depends on or refines.
  description: Explicit same-family relationship metadata for one visual preview entry.

PlanGenerationVisualPreviewEntry:
  type: object
  additionalProperties: false
  required:
    - proposalId
    - artifactFamily
    - presentationOrder
  properties:
    proposalId:
      type: string
      minLength: 1
      description: Proposal identity attached to the Message and rendered for this entry.
    artifactFamily:
      type: string
      enum: [mockup, diagram]
      description: Visual artifact family used to validate and label the entry.
    presentationOrder:
      type: integer
      minimum: 0
      description: Explicit zero-based order in which this visual is presented.
    relationship:
      $ref: "#/PlanGenerationVisualPreviewRelationship"
  description: One explicitly ordered visual proposal entry.

PlanGenerationVisualPreviewPayload:
  type: object
  additionalProperties: false
  required:
    - responseType
    - entries
  properties:
    responseType:
      type: string
      enum: [plan_generation_visual_preview_v1]
      description: Discriminator identifying this as a plan-generation visual-preview payload.
    entries:
      type: array
      minItems: 1
      items:
        $ref: "#/PlanGenerationVisualPreviewEntry"
      description: Explicitly ordered Mockup and Diagram proposal entries for the preview.
  description: >
    Payload for the plan-generation visual-preview UI field. Proposal identities
    are resolved from the current Message's attached proposals so carried-forward
    references retain their original identity and history.

PlanGenerationVisualPreviewElement:
  allOf:
    - $ref: "#/UIElement"
    - type: object
      required:
        - payload
      properties:
        payload:
          $ref: "#/PlanGenerationVisualPreviewPayload"
  x-discriminator-value: plan_generation_visual_preview

PlanGenerationFinalizePayload:
  type: object
  required:
    - responseType
    - planId
    - firstStageId
    - readyButtonLabel
    - progressLabel
  properties:
    responseType:
      type: string
      enum: [plan_generation_finalize_v1]
      description: Discriminator identifying this as a plan-generation finalize payload
    planId:
      type: string
      description: Identifier of the plan being finalized
    firstStageId:
      type: string
      description: Identifier of the first stage the Execution Guidance feature will poll once finalization completes
    readyButtonLabel:
      type: string
      description: Label rendered on the inline Ready button shown to the user
    progressLabel:
      type: string
      description: Label rendered in the progress bar while finalization is in flight (e.g. "Finalizing your plan...")
  description: >
    Payload for the plan-generation finalize gate UI element. Enables the
    Execution Guidance feature contract by giving the client the planId and
    firstStageId it needs to begin polling for stage execution once the user
    confirms via the Ready button.

PermissionRequestAgentType:
  type: string
  enum: [claude, codex, opencode]
  description: Agent providers that can issue permission requests

PermissionRequestSummary:
  type: object
  required:
    - id
    - permissionType
    - sessionId
    - agentId
    - agentType
    - timestamp
    - idempotencyToken
    - referencedFiles
    - referencedDiffs
  properties:
    id:
      type: string
      description: Unique permission request identifier
    runId:
      type: string
      nullable: true
      description: Agent run identifier when available
    permissionType:
      type: string
      description: Provider-specific permission or tool name
    sessionId:
      type: string
      description: Provider session identifier
    agentId:
      type: string
      description: Agent instance identifier that requested permission
    agentType:
      $ref: "#/PermissionRequestAgentType"
    timestamp:
      type: string
      format: date-time
      description: Request creation timestamp
    idempotencyToken:
      type: string
      description: Stable token used when responding to the permission request
    reason:
      type: string
      nullable: true
      description: User-facing explanation for the request
    agentIntent:
      type: string
      nullable: true
      description: Optional summary of the broader agent intent
    referencedFiles:
      type: array
      items:
        type: string
      description: Files referenced by the permission request
    referencedDiffs:
      type: array
      items:
        type: string
      description: Diffs referenced by the permission request
  description: Normalized permission request details for UI rendering

AgentRequestPermissionPayload:
  type: object
  required:
    - responseType
    - permissionRequest
  properties:
    responseType:
      type: string
      enum: [agent_request_permission_v1]
    permissionRequest:
      $ref: "#/PermissionRequestSummary"
    rawEvent:
      type: object
      additionalProperties: true
      nullable: true
      description: Original provider event payload for debugging and follow-up actions
    enrichmentMetadata:
      type: object
      additionalProperties: true
      nullable: true
      description: Supplemental metadata derived while normalizing the permission request
    decision:
      type: string
      enum: [approve, always_approve, whitelist, deny]
      nullable: true
      description: The user's decision, written when the permission decision is recorded on this message
    decidedAt:
      type: string
      format: date-time
      nullable: true
      description: ISO timestamp of when the decision was recorded
  description: Structured payload for permission-request UI elements

AgentQuestionOption:
  type: object
  additionalProperties: false
  required:
    - label
    - description
  properties:
    label:
      type: string
      minLength: 1
    description:
      type: string

AgentQuestion:
  type: object
  additionalProperties: false
  required:
    - question
    - header
    - multiSelect
    - options
  properties:
    question:
      type: string
      minLength: 1
    header:
      type: string
    multiSelect:
      type: boolean
    options:
      type: array
      minItems: 1
      items:
        $ref: "#/AgentQuestionOption"

AgentQuestionPayload:
  type: object
  required:
    - responseType
    - requestId
    - sessionId
    - agentType
    - idempotencyToken
    - questions
  properties:
    responseType:
      type: string
      enum: [agent_question_v1]
    requestId:
      type: string
      minLength: 1
    sessionId:
      type: string
      minLength: 1
    agentType:
      type: string
      enum: [claude, codex, opencode]
    idempotencyToken:
      type: string
      minLength: 1
    questions:
      type: array
      minItems: 1
      items:
        $ref: "#/AgentQuestion"
      description: >-
        Mirrors the provider's question tool input (Claude `AskUserQuestion`)
        so the CLI passes it through without reshaping.
    answers:
      type: object
      additionalProperties:
        type: string
      nullable: true
      description: The submitted answers, written once the answer is recorded on this message.
    answeredAt:
      type: string
      format: date-time
      nullable: true
  description: Structured payload for agent question UI elements.

AgentSessionServiceScopeRequest:
  type: object
  additionalProperties: false
  required:
    - id
    - runId
    - sessionId
    - agentId
    - agentType
    - timestamp
    - idempotencyToken
    - currentServiceIds
    - requestedServiceIds
    - reason
  properties:
    id:
      type: string
      minLength: 1
      description: Unique service-scope request identifier
    runId:
      type: string
      nullable: true
      description: Active local Run identifier when available
    sessionId:
      type: string
      minLength: 1
      description: AgentSession identifier owning the request
    agentId:
      type: string
      minLength: 1
      description: Stable coding-agent handler identifier
    agentType:
      $ref: "#/PermissionRequestAgentType"
    timestamp:
      type: string
      format: date-time
      description: Request creation timestamp
    idempotencyToken:
      type: string
      minLength: 1
      description: Stable token used when responding to this request
    currentServiceIds:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: Services already in the active coding-session scope
    requestedServiceIds:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: Complete proposed Service scope after approval
    reason:
      type: string
      minLength: 1
      description: Agent explanation for the additional Service scope
  description: Reviewable request for expanding a repository-bound coding session's Service scope

AgentRequestServiceScopePayload:
  type: object
  additionalProperties: false
  required:
    - responseType
    - serviceScopeRequest
  properties:
    responseType:
      type: string
      enum: [agent_request_service_scope_v1]
      description: Discriminator identifying a Service-scope review payload
    serviceScopeRequest:
      $ref: "#/AgentSessionServiceScopeRequest"
    decision:
      type: string
      enum: [approve, deny]
      nullable: true
      description: User decision recorded on the review message
    decidedAt:
      type: string
      format: date-time
      nullable: true
      description: ISO timestamp of the recorded decision
  description: Structured payload for coding-session Service-scope review UI elements

AgentSessionReviewFileScopeRequestFile:
  type: object
  additionalProperties: false
  required:
    - serviceId
    - filePath
    - reason
  properties:
    serviceId:
      type: string
      minLength: 1
      description: Service that owns the requested file
    filePath:
      type: string
      minLength: 1
      description: Canonical repo-relative path within the named Service workspace
    reason:
      type: string
      minLength: 1
      description: Why the originating task's repair requires this exact file

AgentSessionReviewFileScopeRequest:
  type: object
  additionalProperties: false
  required:
    - id
    - runId
    - sessionId
    - agentId
    - agentType
    - timestamp
    - idempotencyToken
    - files
  properties:
    id:
      type: string
      minLength: 1
    runId:
      type: string
      minLength: 1
    sessionId:
      type: string
      minLength: 1
    agentId:
      type: string
      minLength: 1
    agentType:
      $ref: "#/PermissionRequestAgentType"
    timestamp:
      type: string
      format: date-time
    idempotencyToken:
      type: string
      minLength: 1
    files:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: "#/AgentSessionReviewFileScopeRequestFile"
  description: File-specific request to expand one Review repair beyond the canonical changed-file set

AgentRequestReviewFileScopePayload:
  type: object
  additionalProperties: false
  required:
    - responseType
    - reviewFileScopeRequest
  properties:
    responseType:
      type: string
      enum: [agent_request_review_file_scope_v1]
    reviewFileScopeRequest:
      $ref: "#/AgentSessionReviewFileScopeRequest"
    decision:
      type: string
      enum: [approve, deny]
      nullable: true
    decidedAt:
      type: string
      format: date-time
      nullable: true
  description: Structured payload for one file-specific Review scope decision

CodingPromptStartupSourceType:
  type: string
  enum:
    - evidenceItem
    - task
    - designDoc
    - plan
    - initiative
  description: Source types used by startup-plan structured responses

CodingPromptStartupSourceRef:
  type: object
  required:
    - sourceType
    - sourceId
  properties:
    sourceType:
      $ref: "#/CodingPromptStartupSourceType"
    sourceId:
      type: string
  description: Source reference used by startup-plan structured responses

CodingPromptStartupPlanReference:
  type: object
  required:
    - sourceType
    - sourceId
    - rationale
  properties:
    sourceType:
      $ref: "#/CodingPromptStartupSourceType"
    sourceId:
      type: string
    rationale:
      type: string
  description: Evidence reference attached to a startup execution-plan step

CodingPromptStartupPlanStep:
  type: object
  required:
    - stepId
    - title
    - description
    - references
    - phase
  properties:
    stepId:
      type: string
    title:
      type: string
    description:
      type: string
    targetFiles:
      type: array
      items:
        type: string
      description: Repo-relative file paths the step intends to modify; investigative or read-only steps may omit it
    references:
      type: array
      items:
        $ref: "#/CodingPromptStartupPlanReference"
    validationFocus:
      type: string
    phase:
      type: integer
      minimum: 1
      description: Phase number this step belongs to. Contiguous clusters of steps sharing working context form a phase. Required; integer ≥1.
  description: Single execution-plan step in a startup structured response

CodingPromptStartupPrimaryImplementationConnection:
  type: object
  description: >
    Evidence-backed connection between a primary implementation and a resolved,
    non-archived workflow step or Contract. This records plan evidence only and
    does not create graph topology.
  required:
    - entityType
    - entityId
    - entityTitle
    - relationship
    - sourceField
    - sourceExcerpt
    - rationale
  properties:
    entityType:
      type: string
      enum:
        - workflowStep
        - contract
    entityId:
      type: string
      format: uuid
    entityTitle:
      type: string
      minLength: 1
    relationship:
      type: string
      enum:
        - fulfills
        - authors
        - enforces
        - consumes
    sourceField:
      type: string
      minLength: 1
      description: Field path or graph edge that establishes the connection.
    sourceExcerpt:
      type: string
      minLength: 1
      description: Complete source excerpt supporting the connection.
    rationale:
      type: string
      minLength: 1

CodingPromptStartupPrimaryImplementation:
  type: object
  required:
    - title
    - content
    - rationale
  properties:
    title:
      type: string
      minLength: 1
    content:
      type: string
      minLength: 1
      description: The proposed centerpiece, such as a DTO, table definition, or prose block.
    rationale:
      type: string
      minLength: 1
    location:
      type: string
      minLength: 1
    language:
      type: string
      minLength: 1
    connections:
      type: array
      minItems: 1
      description: >
        Optional evidence-bearing connections. Omit this property when no
        applicable connection is established.
      items:
        $ref: "#/CodingPromptStartupPrimaryImplementationConnection"

CodingPromptStartupDiscrepancy:
  type: object
  required:
    - sourceRef
    - sourceExcerpt
    - reasoning
    - discrepancyText
    - severity
  properties:
    sourceRef:
      $ref: "#/CodingPromptStartupSourceRef"
    sourceField:
      type: string
    sourceExcerpt:
      type: string
    reasoning:
      type: string
    discrepancyText:
      type: string
    severity:
      type: string
      enum: [low, medium, high]
  description: Input discrepancy captured in startup-plan output

CodingPromptStartupClarificationQuestion:
  type: object
  required:
    - question
  properties:
    question:
      type: string
    reason:
      type: string
    relatedSourceRefs:
      type: array
      items:
        $ref: "#/CodingPromptStartupSourceRef"
  description: Blocking clarification question in startup-plan output

CodingPromptStartupPlanPayload:
  type: object
  required:
    - responseType
    - sessionTitle
    - requiredServiceIds
    - primaryImplementations
    - executionPlan
    - discrepancies
    - clarificationQuestions
  properties:
    responseType:
      type: string
      enum: [startup_plan_v1]
    sessionTitle:
      type: string
    requiredServiceIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
      description: Complete deduplicated set of project Service IDs the proposed implementation may modify.
    primaryImplementations:
      type: array
      minItems: 1
      items:
        $ref: "#/CodingPromptStartupPrimaryImplementation"
    executionPlan:
      type: array
      items:
        $ref: "#/CodingPromptStartupPlanStep"
    discrepancies:
      type: array
      items:
        $ref: "#/CodingPromptStartupDiscrepancy"
    clarificationQuestions:
      type: array
      items:
        $ref: "#/CodingPromptStartupClarificationQuestion"
  description: Structured startup-plan payload for coding-prompt UI rendering

CodingPlanEmissionInput:
  type: object
  additionalProperties: false
  required: [markdown, requiredServiceIds]
  properties:
    markdown:
      type: string
      minLength: 1
      description: Complete visible plan. Preserve this exact text through approval and implementation.
    requiredServiceIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid

CodingPlanVersion:
  type: object
  additionalProperties: false
  required: [responseType, markdown, requiredServiceIds]
  properties:
    responseType:
      type: string
      enum: [coding_plan_version_v1]
    markdown:
      $ref: "#/CodingPlanEmissionInput/properties/markdown"
    requiredServiceIds:
      $ref: "#/CodingPlanEmissionInput/properties/requiredServiceIds"

CodingPlanVersionApproval:
  type: object
  additionalProperties: false
  required: [responseType, versionMessageId]
  properties:
    responseType:
      type: string
      enum: [coding_plan_version_approval_v1]
    versionMessageId:
      type: string
      format: uuid
      description: Message containing the current complete emitted plan in the bound conversation.
    feedback:
      type: string
    runtime:
      $ref: "#/ImplementRuntimeSelection"

CodingPlanVersionElement:
  allOf:
    - $ref: "#/UIElement"
    - type: object
      required: [payload]
      properties:
        payload:
          $ref: "#/CodingPlanVersion"
  x-discriminator-value: coding_plan_version

CodingPlanContext:
  type: object
  additionalProperties: false
  required:
    [
      responseType,
      sessionTitle,
      intent,
      technicalContext,
      issues,
      requiredServiceIds,
    ]
  properties:
    responseType:
      type: string
      enum: [coding_plan_context_v1]
    sessionTitle:
      type: string
      minLength: 1
    intent:
      type: string
      minLength: 1
    technicalContext:
      type: string
      minLength: 1
    issues:
      type: array
      items:
        $ref: "#/CodingPlanIssueResolution"
    requiredServiceIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid

CodingPlanIssueResolution:
  type: object
  additionalProperties: false
  required: [messageId, resolution]
  properties:
    messageId:
      type: string
      format: uuid
    resolution:
      type: string
      description: Current resolution, or the remaining question when unresolved.

CodingPlanDiscrepancy:
  allOf:
    - $ref: "#/CodingPromptStartupDiscrepancy"
    - type: object
      required: [sourceField]
      properties:
        sourceField:
          type: string
          minLength: 1
  description: One evidence-bearing, individually replyable planning issue.

CodingPlanConversationalApproval:
  type: object
  additionalProperties: false
  required: [responseType, contextMessageId]
  properties:
    responseType:
      type: string
      enum: [coding_plan_approval_v1]
    contextMessageId:
      type: string
      format: uuid
      description: Exact persisted context reviewed by the user; the server loads its content.
    feedback:
      type: string
    runtime:
      $ref: "#/ImplementRuntimeSelection"

CodingPlanApprovalPayload:
  oneOf:
    - $ref: "#/CodingPlanVersionApproval"
    - $ref: "#/CodingPlanReviewAnswerPayload"
  description: Conversational approval, with explicit compatibility for historical structured sessions.

CodingPlanContextElement:
  allOf:
    - $ref: "#/UIElement"
    - type: object
      properties:
        payload:
          $ref: "#/CodingPlanContext"
  x-discriminator-value: coding_plan_context

CodingPlanDiscrepancyElement:
  allOf:
    - $ref: "#/UIElement"
    - type: object
      properties:
        payload:
          $ref: "#/CodingPlanDiscrepancy"
  x-discriminator-value: coding_plan_discrepancy

CodingPlanReviewDiscrepancyFeedbackEntry:
  type: object
  additionalProperties: false
  required: [discrepancyIndex, note]
  properties:
    discrepancyIndex:
      type: integer
      minimum: 0
    note:
      type: string
  description: User review feedback for one discrepancy in the startup plan.

CodingPlanReviewStepFeedbackEntry:
  type: object
  additionalProperties: false
  required: [stepId, note]
  properties:
    stepId:
      type: string
      minLength: 1
    note:
      type: string
  description: User review feedback for one execution-plan step.

CodingPlanReviewQuestionAnswerEntry:
  type: object
  additionalProperties: false
  required: [questionIndex, answer]
  properties:
    questionIndex:
      type: integer
      minimum: 0
    answer:
      type: string
  description: User answer for one indexed startup-plan clarification question.

CodingPlanReviewAnswerPayload:
  allOf:
    - $ref: "#/CodingPromptStartupPlanPayload"
    - type: object
      properties:
        discrepancyFeedback:
          type: array
          items:
            $ref: "#/CodingPlanReviewDiscrepancyFeedbackEntry"
        stepFeedback:
          type: array
          items:
            $ref: "#/CodingPlanReviewStepFeedbackEntry"
        questionAnswers:
          type: array
          items:
            $ref: "#/CodingPlanReviewQuestionAnswerEntry"
        feedback:
          type: string
          description: Optional general review feedback that applies to the whole plan.
        provider:
          type: string
          enum:
            - claude
            - codex
            - opencode
          description: Agent provider selected for the implementation run.
        model:
          type: string
          minLength: 1
          description: Provider model selected for the implementation run.
        reasoningEffort:
          type: string
          enum:
            - none
            - minimal
            - low
            - medium
            - high
            - xhigh
            - max
            - ultra
            - default
          description: Reasoning-effort level selected for the implementation run.
        fastMode:
          type: boolean
          description: Optional provider-neutral Fast mode selection; omit for unsupported selections.
  description: >
    Startup plan plus the user-authored review feedback and implementation-run
    selection submitted by Coding Plan review controls.

WorkflowReviewAction:
  type: string
  enum:
    - REFINE
    - APPROVED
    - DISMISSED
  description: >
    Canonical user-authored workflow review vocabulary. REFINE requests
    another review turn, APPROVED accepts the reviewed artifact, and DISMISSED
    exits a review without approving its pending proposals.

CodingPlanRefineWorkflowAnswer:
  type: object
  additionalProperties: false
  required: [action, payload]
  properties:
    action:
      type: string
      enum: [REFINE]
    payload:
      $ref: "#/CodingPlanReviewAnswerPayload"

CodingPlanApprovedWorkflowAnswer:
  type: object
  additionalProperties: false
  required: [action, payload]
  properties:
    action:
      type: string
      enum: [APPROVED]
    payload:
      $ref: "#/CodingPlanApprovalPayload"

CodingPlanWorkflowAnswer:
  oneOf:
    - $ref: "#/CodingPlanRefineWorkflowAnswer"
    - $ref: "#/CodingPlanApprovedWorkflowAnswer"
  discriminator:
    propertyName: action
    mapping:
      REFINE: "#/CodingPlanRefineWorkflowAnswer"
      APPROVED: "#/CodingPlanApprovedWorkflowAnswer"
  description: >
    Action-specific coding-plan workflow answer. The payload is the startup
    plan itself, never a field-keyed form envelope or a generic UI decision.

PlanShapingFeatureSyncReviewDismissedAnswerPayload:
  type: object
  additionalProperties: false
  description: Empty payload for completing the feature-sync review gate.

PlanShapingFeatureSyncItemDecision:
  type: object
  additionalProperties: false
  required:
    - itemId
    - choice
  description: >
    The user's choice on one flagged feature-sync item. Guides the next
    revision pass only; it never approves a proposal or advances the
    review.
  properties:
    itemId:
      type: string
      minLength: 1
      description: >
        The `id` of the flagged item the choice applies to.
    choice:
      type: string
      enum:
        - accept
        - amend
        - dismiss
    note:
      type: string

PlanShapingFeatureSyncReviewRefineAnswerPayload:
  type: object
  additionalProperties: false
  required: [feedback]
  properties:
    feedback:
      type: string
    decisions:
      type: array
      items:
        $ref: "#/PlanShapingFeatureSyncItemDecision"
  description: User feedback and per-item choices for one bounded feature-sync revision pass.

PlanShapingFeatureSyncReviewDismissedWorkflowAnswer:
  type: object
  additionalProperties: false
  required: [action, payload]
  properties:
    action:
      type: string
      enum: [DISMISSED]
    payload:
      $ref: "#/PlanShapingFeatureSyncReviewDismissedAnswerPayload"

PlanShapingFeatureSyncReviewRefineWorkflowAnswer:
  type: object
  additionalProperties: false
  required: [action, payload]
  properties:
    action:
      type: string
      enum: [REFINE]
    payload:
      $ref: "#/PlanShapingFeatureSyncReviewRefineAnswerPayload"

CodingPromptFinalAssessmentSourceType:
  type: string
  enum:
    - evidenceItem
    - task
    - designDoc
    - plan
    - initiative
    - sessionOutput
  description: Source types used by final-assessment structured responses

CodingPromptFinalAssessmentSourceRef:
  type: object
  required:
    - sourceType
    - sourceId
  properties:
    sourceType:
      $ref: "#/CodingPromptFinalAssessmentSourceType"
    sourceId:
      type: string
  description: Evidence reference used by final-assessment structured responses

CodingPromptFinalAssessmentTarget:
  type: object
  required:
    - entityType
    - entityId
  properties:
    entityType:
      type: string
      enum: [task, designDoc, implementationHint, evidenceItem]
    entityId:
      type: string
  description: Entity targeted by final-assessment recommendations

CodingPromptFinalAssessmentTaskTarget:
  type: object
  required:
    - entityType
    - entityId
  properties:
    entityType:
      type: string
      enum: [task]
    entityId:
      type: string
  description: Active task target for final-assessment output

CodingPromptFinalAssessmentHierarchyWalkAction:
  type: string
  enum:
    - proposed_update
    - no_update
  description: Action taken at a hierarchy level during the feature walk

CodingPromptFinalAssessmentHierarchyWalkEntry:
  type: object
  required:
    - entityType
    - entityId
    - name
    - distance
    - action
    - rationale
  properties:
    entityType:
      type: string
      description: Entity type walked (e.g. task, feature)
    entityId:
      type: string
      format: uuid
      description: ID of the entity
    name:
      type: string
      description: Display name of the entity
    distance:
      type: integer
      minimum: 0
      description: Hops from the originating task
    action:
      $ref: "#/CodingPromptFinalAssessmentHierarchyWalkAction"
    rationale:
      type: string
      minLength: 1
      description: Why this action was chosen
  description: Single entry in the hierarchy walk documenting action taken at one level

CodingPromptFinalAssessmentDependentTaskWalkEntry:
  type: object
  required:
    - entityId
    - entityType
    - name
    - relationshipType
    - action
    - rationale
  properties:
    entityId:
      type: string
      format: uuid
      description: UUID of the dependent task
    entityType:
      type: string
      description: Entity type (always 'task' for dependent task walks)
    name:
      type: string
      description: Display name of the dependent task
    relationshipType:
      type: string
      description: Edge type that triggered the check (e.g. DEPENDS_ON, DERIVES_FROM)
    action:
      $ref: "#/CodingPromptFinalAssessmentHierarchyWalkAction"
    rationale:
      type: string
      minLength: 1
      description: Why this action was chosen
  description: Single entry in the dependent task walk documenting action taken on a topology-linked task

CodingPromptFinalAssessmentVerdict:
  type: string
  enum:
    - completed
    - partiallyCompleted
    - blocked
    - notCompleted
    - unknown
  description: Final-assessment verdict for the active task

CodingPromptFinalAssessmentStatusRecommendation:
  type: object
  required:
    - status
    - reason
  properties:
    status:
      $ref: "./common.yaml#/WorkStatus"
    reason:
      type: string
  description: Recommended task status and supporting reason

CodingPromptFinalAssessmentTaskAssessment:
  type: object
  required:
    - target
    - verdict
    - statusRecommendation
    - summary
  properties:
    target:
      $ref: "#/CodingPromptFinalAssessmentTaskTarget"
    verdict:
      $ref: "#/CodingPromptFinalAssessmentVerdict"
    statusRecommendation:
      $ref: "#/CodingPromptFinalAssessmentStatusRecommendation"
    summary:
      type: string
  description: Final-assessment decision for the active task

CodingPromptFinalAssessmentArtifactUpdateSuggestion:
  type: object
  required:
    - target
    - updateType
    - reasoning
    - sourceRefs
  properties:
    target:
      $ref: "#/CodingPromptFinalAssessmentTarget"
    updateType:
      type: string
    reasoning:
      type: string
    sourceRefs:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentSourceRef"
  description: Suggested artifact update emitted by final assessment

CodingPromptFinalAssessmentEvidenceCorrection:
  type: object
  required:
    - target
    - severity
    - issueType
    - reasoning
    - suggestedReplacement
    - sourceExcerpt
  properties:
    target:
      $ref: "#/CodingPromptFinalAssessmentTarget"
    severity:
      type: string
      enum: [low, medium, high]
    issueType:
      type: string
    reasoning:
      type: string
    suggestedReplacement:
      type: string
    sourceExcerpt:
      type: string
  description: Evidence correction emitted by final assessment

CodingPromptFinalAssessmentValidationRecommendation:
  type: object
  required:
    - stepId
    - title
    - stepDescription
    - executionType
    - estimatedEffort
    - confidence
    - preconditions
    - expectedResult
    - provenance
  properties:
    stepId:
      type: string
    title:
      type: string
    stepDescription:
      type: string
    executionType:
      type: string
      enum: [manual, automated]
    estimatedEffort:
      type: integer
    confidence:
      type: number
    preconditions:
      type: array
      items:
        type: string
    expectedResult:
      type: string
    provenance:
      type: object
      required:
        - sessionId
        - agentResponseId
      properties:
        sessionId:
          type: string
        agentResponseId:
          type: string
  description: Validation recommendation emitted by final assessment

CodingPromptFinalAssessmentOpenQuestion:
  type: object
  required:
    - question
    - reason
  properties:
    question:
      type: string
    reason:
      type: string
  description: Open question emitted by final assessment

CodingPromptFinalAssessmentV1Payload:
  type: object
  required:
    - responseType
    - taskAssessment
    - artifactUpdateSuggestions
    - evidenceCorrections
    - openQuestions
  properties:
    responseType:
      type: string
      enum: [final_assessment_v1]
    taskAssessment:
      $ref: "#/CodingPromptFinalAssessmentTaskAssessment"
    artifactUpdateSuggestions:
      type: array
      items:
        type: object
    evidenceCorrections:
      type: array
      items:
        type: object
    openQuestions:
      type: array
      items:
        type: object
  description: Legacy final-assessment payload for coding-prompt UI rendering

CodingPromptFinalAssessmentV2Payload:
  type: object
  required:
    - responseType
    - taskAssessment
    - artifactUpdateSuggestions
    - evidenceCorrections
    - validationRecommendationsSummary
    - validationRecommendations
    - openQuestions
    - hierarchyWalk
  properties:
    responseType:
      type: string
      enum: [final_assessment_v2]
    taskAssessment:
      $ref: "#/CodingPromptFinalAssessmentTaskAssessment"
    implementationNotes:
      type: string
    artifactUpdateSuggestions:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentArtifactUpdateSuggestion"
    evidenceCorrections:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentEvidenceCorrection"
    validationRecommendationsSummary:
      type: string
    validationRecommendations:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentValidationRecommendation"
    openQuestions:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentOpenQuestion"
    hierarchyWalk:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentHierarchyWalkEntry"
      description: Each level the agent walked in the feature hierarchy, documenting action taken and why
    dependentTaskWalk:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentDependentTaskWalkEntry"
      description: Tasks discovered via topology edges that the agent visited and assessed for stale content
  description: Current final-assessment payload for coding-prompt UI rendering

CodingPromptFinalAssessmentPayload:
  oneOf:
    - $ref: "#/CodingPromptFinalAssessmentV1Payload"
    - $ref: "#/CodingPromptFinalAssessmentV2Payload"
  description: Structured final-assessment payload for coding-prompt UI rendering

CodingPromptNeighborhoodTaskUpdate:
  type: object
  required:
    - taskId
    - descriptionUpdate
    - acceptanceCriteriaUpdate
    - reasoning
  properties:
    taskId:
      type: string
    descriptionUpdate:
      type: string
      nullable: true
    acceptanceCriteriaUpdate:
      type: string
      nullable: true
    reasoning:
      type: string
  description: Suggested update to a neighboring task based on final assessment findings

CodingPromptMergedFinalAssessmentPayload:
  type: object
  required:
    - responseType
    - taskAssessment
    - artifactUpdateSuggestions
    - evidenceCorrections
    - neighborhoodTaskUpdates
    - hierarchyWalk
  properties:
    responseType:
      type: string
      enum: [merged_final_assessment_v1]
    taskAssessment:
      $ref: "#/CodingPromptFinalAssessmentTaskAssessment"
    implementationNotes:
      type: string
    artifactUpdateSuggestions:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentArtifactUpdateSuggestion"
    evidenceCorrections:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentEvidenceCorrection"
    neighborhoodTaskUpdates:
      type: array
      items:
        $ref: "#/CodingPromptNeighborhoodTaskUpdate"
    hierarchyWalk:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentHierarchyWalkEntry"
      description: Each level the agent walked in the feature hierarchy, documenting action taken and why
    dependentTaskWalk:
      type: array
      items:
        $ref: "#/CodingPromptFinalAssessmentDependentTaskWalkEntry"
      minItems: 1
      description: Tasks discovered via topology edges that the agent visited and assessed for stale content
  description: Merged final-assessment payload combining task assessment with neighborhood task updates

PlanGapItemPayload:
  type: object
  required:
    - title
    - sourceCategory
  properties:
    title:
      type: string
    description:
      type: string
    sourceCategory:
      type: string
      enum:
        - tasks
        - design_docs
        - services
    notes:
      type: string
    overlapDetected:
      type: boolean
    overlapNotes:
      type: string
    potentialCoverage:
      type: array
      items:
        $ref: "#/RelatedEntityDto"
      description: Related entities that might cover this gap
  description: Plan gap item payload

Action:
  type: object
  required:
    - type
  properties:
    type:
      type: string
      description: Type of action to perform
      example: "save_project_setup"
    payload:
      type: object
      description: Action-specific data payload
      properties:
        entityId:
          type: string
  description: Action specification for UI operations and workflow orchestration

UserMessageDataType:
  type: string
  enum:
    - CONTROL
  description: |
    Type of user message data:
    - CONTROL: Control messages sent by the system to control workflows

UserMessageDataBase:
  type: object
  description: |
    Minimal shared base for every `UserMessageData.agentInput` arm: the
    top-level `userMessage` slot (the user's free-form text for the dispatch
    turn) plus the optional `provenance` marker that distinguishes
    auto-authored envelopes from human-typed ones. Unlike the freeform `data`
    bag, `agentInput` arms do NOT inherit `additionalProperties: true` — the
    typed dispatch envelope stays closed to the freeform `round{N}_{fieldName}`
    keys, which live on `UserMessageData` itself. Each per-`promptType` arm
    `allOf`-composes this base with its own discriminator literal and typed
    fields.
  properties:
    userMessage:
      type: string
      description: >-
        Top-level free-form user text for the dispatch turn, carried uniformly
        across arms. Arms whose CLI payload also surfaces a typed `userMessage`
        reuse this same slot rather than declaring a second one.
    skillSelection:
      $ref: "./run-payloads.yaml#/AgentSkillSelection"
      description: >-
        Optional pathless Skill identity carried with the next Run Turn. The
        provider resolves it locally; host paths never cross the platform
        boundary.
    provenance:
      $ref: "#/UserMessageAgentInputProvenance"
      description: >-
        Optional marker identifying a non-human author of the dispatch
        envelope. Absent on human-typed replies. Set by the trusted authoring
        site. The UI keys the
        auto-decider attribution on this marker for the response-only arm of
        SESSION_MONITOR CONTINUED, whose wire shape is otherwise
        indistinguishable from a human reply. The action-bearing arm carries
        its own attribution via `AgentSystemMessageData.detectedIntent` and
        does not use this field.

UserMessageAgentInputProvenance:
  type: string
  enum:
    - session_monitor
    - task_monitor
  description: >-
    Closed enum of non-human authors of a `UserMessageData.agentInput`
    envelope. `session_monitor` is stamped by the API when the session
    monitor's response-only CONTINUED arm fires; `task_monitor` identifies
    guidance USER messages authored by Task Monitor. The enum stays deliberately
    narrow rather than modeling human and UI authorship here.

