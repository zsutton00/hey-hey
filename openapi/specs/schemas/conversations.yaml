# =============================================
# Conversation and Message Schemas
# =============================================
ConversationResponseDto:
  type: object
  required:
    - id
    - createdBy
    - projectId
    - organizationId
    - initiatedBy
    - status
    - workflowName
    - version
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/ConversationId"
    createdBy:
      type: string
      nullable: true
      description: User who initiated the conversation, when human initiated
    projectId:
      $ref: "./common.yaml#/ProjectId"
    organizationId:
      $ref: "./common.yaml#/OrganizationId"
    workflowId:
      $ref: "./common.yaml#/WorkflowId"
    workflowAboutType:
      type: string
      description: Type of entity that workflowAboutId refers to (initiative, task, project, etc.)
      example: "initiative"
    initiatedBy:
      $ref: "#/InitiationType"
      description: How this conversation was initiated
    triggerEvent:
      type: string
      description: Event that triggered this conversation
    status:
      $ref: "#/ConversationStatus"
      description: Current status of the conversation
    title:
      type: string
      description: Optional title of the conversation
    version:
      type: integer
      minimum: 1
      description: Version number for optimistic locking and race condition prevention
      example: 5
    lastModifiedBy:
      type: string
      description: ID of user who last modified the conversation
      example: "user-123"
    workflowName:
      $ref: "#/WorkflowName"
      nullable: true
      description: The name/type of the workflow from flow templates
    workflowAboutId:
      type: string
      description: Entity ID for workflow-based conversations
      example: "init-123"
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
    goalPmRoutingDecisions:
      type: array
      items:
        $ref: "#/GoalPmRoutingDecisionResponseDto"
      description: Immutable routing choices included when includeSuggestionDecisions is true
    suggestionDecisions:
      type: array
      items:
        $ref: "./suggestions.yaml#/SuggestionDecisionResponseDto"
      description: Suggestion decisions associated with this conversation, if requested

ConversationVersionResponseDto:
  type: object
  required:
    - version
  properties:
    version:
      type: integer
      minimum: 1
      description: Current version number for the conversation
      example: 5

OnboardingReplyAnswers:
  type: object
  minProperties: 1
  additionalProperties: true
  properties:
    feature-list:
      $ref: "#/OnboardingFeatureListReviewUserSubmission"
    onboarding_plan_candidate_proposals:
      $ref: "#/OnboardingPlanStageProposalReviewUserSubmission"
    repository_grounding_intent:
      $ref: "./repository-grounding.yaml#/RepositoryGroundingIntentAnswer"
      description: The exact Yes/No branch selected at the new-project gate.
  description: Complete values for the current server-authored onboarding form.

RepositoryImportReplyAnswers:
  type: object
  minProperties: 1
  additionalProperties: true
  properties:
    repository_feature_enrichment_choice:
      $ref: "./repository-grounding.yaml#/RepositoryFeatureEnrichmentChoice"
    repository_first_work_request:
      type: string
      minLength: 1
      description: What the user wants to work on next after imported Features are created.
    repository_first_work_follow_up:
      $ref: "#/RepositoryFirstWorkFollowUpAnswers"
    feature-list:
      $ref: "#/OnboardingFeatureListReviewUserSubmission"
    repository_prerequisites:
      $ref: "./repository-grounding.yaml#/RepositoryGroundingPrerequisites"
      description: Accepted Service, brief, entry, and machine choices.
    repository_analysis_configuration:
      $ref: "./repository-grounding.yaml#/RepositoryGroundingAnalysisConfiguration"
      description: Saved scope, provider, model, usage, and bounds choices.
    repository_grounding_action:
      $ref: "./repository-grounding.yaml#/RepositoryGroundingAction"
      description: Explicit action for the current repository-grounding step.
    repository_placement_strategy:
      $ref: "./repository-grounding.yaml#/RepositoryPlacementStrategySubmission"
      description: Existing-project root-placement strategy selected by the user.
    repository_placement_review:
      $ref: "./repository-grounding.yaml#/RepositoryPlacementReviewSubmission"
      description: Approved root-keyed edits to intelligent placement suggestions.
  description: Complete values for the current server-authored repository-import form.

RepositoryFirstWorkFollowUpAnswers:
  type: object
  additionalProperties: false
  required: [clarifyingAnswers]
  properties:
    clarifyingAnswers:
      type: array
      minItems: 1
      maxItems: 3
      items:
        $ref: "./repository-grounding.yaml#/RepositoryFeatureEnrichmentAnswer"

WorkTrackerImportReplyAnswers:
  type: object
  minProperties: 1
  additionalProperties: true
  properties:
    work_tracker_source:
      $ref: "./work-tracker-import.yaml#/WorkTrackerImportSource"
    work_tracker_machine_id:
      $ref: "./common.yaml#/MachineId"
    work_tracker_provider:
      type: string
      enum: [claude, codex]
    work_tracker_model:
      type: string
      minLength: 1
    work_tracker_reasoning_effort:
      type: string
      enum: [none, minimal, low, medium, high, xhigh, max, ultra, default]
    work_tracker_action:
      $ref: "./work-tracker-import.yaml#/WorkTrackerImportAction"
    feature-list:
      $ref: "#/OnboardingFeatureListReviewUserSubmission"
    repository_placement_strategy:
      $ref: "./repository-grounding.yaml#/RepositoryPlacementStrategySubmission"
  description: Complete values for the current server-authored work-tracker-import form.

SubmitWorkTrackerImportReplyRequestDto:
  type: object
  additionalProperties: false
  required:
    - parentMessageId
    - expectedConversationVersion
    - answers
  properties:
    parentMessageId:
      $ref: "./common.yaml#/MessageId"
    expectedConversationVersion:
      type: integer
      minimum: 1
    answers:
      $ref: "#/WorkTrackerImportReplyAnswers"

SubmitOnboardingReplyRequestDto:
  type: object
  additionalProperties: false
  required:
    - parentMessageId
    - expectedConversationVersion
    - answers
  properties:
    parentMessageId:
      $ref: "./common.yaml#/MessageId"
    expectedConversationVersion:
      type: integer
      minimum: 1
    answers:
      $ref: "#/OnboardingReplyAnswers"

SubmitRepositoryImportReplyRequestDto:
  type: object
  additionalProperties: false
  required:
    - parentMessageId
    - expectedConversationVersion
    - answers
  properties:
    parentMessageId:
      $ref: "./common.yaml#/MessageId"
    expectedConversationVersion:
      type: integer
      minimum: 1
    answers:
      $ref: "#/RepositoryImportReplyAnswers"

ConversationCliStatusResponseDto:
  type: object
  additionalProperties: false
  required:
    - connected
    - selectedMachineId
    - authorizationProtocolVersion
    - executionReadiness
  properties:
    connected:
      type: boolean
      description: >-
        True when the conversation's owning user has at least one active
        websocket connection identifying itself as a CLI client. False
        when the conversation has no agent session attributed to a user
        yet, or when the owner has no CLI socket open.
      example: true
    selectedMachineId:
      type: string
      format: uuid
      nullable: true
      description: >-
        Server-resolved machine selected for this conversation, or null when no
        machine is selected.
    authorizationProtocolVersion:
      allOf:
        - $ref: "./controller-authorization.yaml#/AuthorizationProtocolVersion"
      nullable: true
      description: >-
        Selected-machine protocol version, or null when no machine is selected.
        Version 1 remains visible but is never executable version-2 authority.
    executionReadiness:
      $ref: "./controller-authorization.yaml#/MachineExecutionReadinessState"
  description: >-
    Presence and controller-authorization readiness for the conversation's
    server-resolved machine. The UI may display every state but gates
    host-affecting work on READY rather than socket presence alone.

ConversationStartResponseDto:
  type: object
  required:
    - status
    - started
  properties:
    status:
      $ref: "#/ConversationStatus"
      description: Current status of the conversation after the start request was processed
    started:
      type: boolean
      description: |
        True when this call transitioned the conversation out of NOT_STARTED and kicked off
        the workflow. False when the conversation was already past NOT_STARTED and the call
        was an idempotent no-op.
      example: true
    workflowId:
      $ref: "./common.yaml#/WorkflowId"
      description: Workflow id for the started workflow. Present whenever the conversation has a workflow id (always when started=true; also when started=false and a workflow was already running).
  description: Response from the conversation start operation

ConversationTriggerRetryResponseDto:
  type: object
  additionalProperties: false
  required:
    - accepted
    - triggerMessageId
  properties:
    accepted:
      type: boolean
    triggerMessageId:
      $ref: "./common.yaml#/MessageId"

CreateConversationBaseDto:
  type: object
  required:
    - projectId
    - organizationId
    - initiatedBy
    - workflowName
    - context
  properties:
    projectId:
      $ref: "./common.yaml#/ProjectId"
    organizationId:
      $ref: "./common.yaml#/OrganizationId"
    workflowId:
      $ref: "./common.yaml#/WorkflowId"
    workflowAboutType:
      type: string
      description: Type of entity that workflowAboutId refers to (initiative, task, project, etc.)
      example: "initiative"
    initiatedBy:
      $ref: "#/InitiationType"
      description: How this conversation was initiated
    triggerEvent:
      type: string
      description: Event that triggered this conversation
    title:
      type: string
      description: Optional title of the conversation
    workflowName:
      $ref: "#/WorkflowName"
      description: The name/type of the workflow from flow templates
    workflowAboutId:
      type: string
      description: Entity ID for workflow-based conversations
      example: "task-456"
    status:
      $ref: "#/ConversationStatus"
      description: Optional initial status of the conversation
    context:
      type: object
      additionalProperties: true
      description: Workflow-specific context payload keyed by workflowName

CreateAdrConversationContext:
  type: object
  additionalProperties: false
  description: Context for ADR workflow conversation creation

CreateInitiativeRefinementConversationContext:
  type: object
  additionalProperties: false
  description: Context for initiative refinement workflow conversation creation

CreateOnboardingConversationContext:
  type: object
  additionalProperties: false
  description: Context for onboarding workflow conversation creation

CreateRepositoryImportConversationContext:
  type: object
  required:
    - repositoryGrounding
  additionalProperties: false
  properties:
    repositoryGrounding:
      oneOf:
        - $ref: "./repository-grounding.yaml#/RepositoryGroundingConversationSeed"
        - $ref: "./workflows.yaml#/RepositoryGroundingWorkflowContext"
      description: >-
        Typed repository-grounding entry seed or accepted workflow choices
        carried into repository-import workflow state.
  description: Context for repository-import workflow conversation creation

CreateWorkTrackerImportConversationContext:
  type: object
  required:
    - entryMode
  additionalProperties: false
  properties:
    entryMode:
      $ref: "./repository-grounding.yaml#/RepositoryGroundingEntryMode"
    source:
      $ref: "./work-tracker-import.yaml#/WorkTrackerImportSource"
  description: Context for work-tracker-import workflow conversation creation

CreatePlanFromDesignDocConversationContext:
  type: object
  required:
    - designDocMarkdown
    - planTitle
  additionalProperties: false
  properties:
    designDocMarkdown:
      type: string
      minLength: 1
      description: Rendered design-doc markdown that seeds the plan-from-design-doc workflow
    planTitle:
      type: string
      minLength: 1
      description: Title for the plan that the workflow will materialize
    parentFeatureId:
      type: string
      format: uuid
      description: Parent FEATURE task when the plan belongs to a feature. Omitted for an existing standalone PLAN work item.
  description: |
    Context for the plan-from-design-doc workflow conversation creation.

    The agent supplies a rendered design-doc markdown blob plus the plan
    title and the parent feature that anchors it. The workflow's
    first node materializes the design-doc and plan from these inputs and
    then reuses the post-design-doc plan-shaping nodes to drive the
    conversation through to task review.

CreateRfcConversationContext:
  type: object
  additionalProperties: false
  description: Context for RFC workflow conversation creation

CreateTaskGenerationConversationAboutType:
  type: string
  enum:
    - initiative
    - task
  description: Workflow about type for task generation conversations

CreateTaskGenerationConversationContext:
  type: object
  required:
    - aboutId
    - aboutType
  additionalProperties: false
  properties:
    aboutId:
      type: string
      description: Entity ID that task generation is about
    aboutType:
      $ref: "#/CreateTaskGenerationConversationAboutType"
  description: Context for task generation workflow conversation creation

CreateTaskRefinementConversationContext:
  type: object
