CreateConversationDto:
  oneOf:
    - $ref: "#/CreateAdrConversationDto"
    - $ref: "#/CreateInitiativeRefinementConversationDto"
    - $ref: "#/CreateOnboardingConversationDto"
    - $ref: "#/CreateRepositoryImportConversationDto"
    - $ref: "#/CreateWorkTrackerImportConversationDto"
    - $ref: "#/CreateRfcConversationDto"
    - $ref: "#/CreateTaskGenerationConversationDto"
    - $ref: "#/CreateTaskRefinementConversationDto"
    - $ref: "#/CreateTaskPrioritizationConversationDto"
    - $ref: "#/CreateEntityConversationDto"
    - $ref: "#/CreateProjectConversationDto"
    - $ref: "#/CreateBrainstormRefinementConversationDto"
    - $ref: "#/CreateDecisionRefinementConversationDto"
    - $ref: "#/CreateDailySessionConversationDto"
    - $ref: "#/CreateAgentTaskRefiningConversationDto"
    - $ref: "#/CreateAgentEntityConversationDto"
    - $ref: "#/CreateAgentDesignDocRefiningConversationDto"
    - $ref: "#/CreatePlanFromDesignDocConversationDto"
    - $ref: "#/CreateFeatureTreeConversationDto"
  discriminator:
    propertyName: workflowName
    mapping:
      adr: "#/CreateAdrConversationDto"
      initiative-refinement: "#/CreateInitiativeRefinementConversationDto"
      onboarding: "#/CreateOnboardingConversationDto"
      repository-import: "#/CreateRepositoryImportConversationDto"
      work-tracker-import: "#/CreateWorkTrackerImportConversationDto"
      plan-from-design-doc: "#/CreatePlanFromDesignDocConversationDto"
      rfc: "#/CreateRfcConversationDto"
      task-generation: "#/CreateTaskGenerationConversationDto"
      task-refinement: "#/CreateTaskRefinementConversationDto"
      task-prioritization: "#/CreateTaskPrioritizationConversationDto"
      entity-conversation: "#/CreateEntityConversationDto"
      project-conversation: "#/CreateProjectConversationDto"
      brainstorm-refinement: "#/CreateBrainstormRefinementConversationDto"
      decision-refinement: "#/CreateDecisionRefinementConversationDto"
      daily-session: "#/CreateDailySessionConversationDto"
      agent-task-refining: "#/CreateAgentTaskRefiningConversationDto"
      agent-entity-conversation: "#/CreateAgentEntityConversationDto"
      agent-design-doc-refining: "#/CreateAgentDesignDocRefiningConversationDto"
      feature-tree-conversation: "#/CreateFeatureTreeConversationDto"
UpdateConversationDto:
  type: object
  required:
    - expectedVersion
  properties:
    expectedVersion:
      type: integer
      minimum: 1
      description: Expected current version for optimistic locking (required)
      example: 5
    status:
      $ref: "#/ConversationStatus"
      description: Optional new status for the conversation
    title:
      type: string
      description: Optional new title for the conversation
    workflowName:
      type: string
      description: Optional new workflow name for the conversation
    workflowId:
      $ref: "./common.yaml#/WorkflowId"
    workflowAboutId:
      type: string
      description: Entity ID for workflow-based conversations

CloneConversationDto:
  type: object
  required:
    - targetNodeId
  properties:
    targetNodeId:
      type: string
      description: The workflow node ID to clone up to
      example: "gather_feedback"
    title:
      type: string
      description: Optional custom title for the cloned conversation (defaults to source title with "(Clone)" suffix)
      example: "Project Setup - Alternative Path"

ConversationStatus:
  type: string
  enum:
    - NOT_STARTED
    - STARTED
    - IN_PROGRESS
    - GENERATING_RESPONSE
    - COMPLETED
    - FAILED
    - RECOVERABLE
    - DELETED
  description: Current status of the conversation

WorkflowName:
  type: string
  enum:
    - adr
    - initiative-refinement
    - onboarding
    - repository-import
    - work-tracker-import
    - rfc
    - task-generation
    - task-refinement
    - task-prioritization
    - entity-conversation
    - project-conversation
    - brainstorm-refinement
    - decision-refinement
    - agent-session
    - daily-session
    - session-monitor
    - task-monitor
    - agent-task-refining
    - agent-entity-conversation
    - goal-pm
    - open-items-triage
    - agent-project-conversation
    - agent-design-doc-refining
    - agent-search
    - agent-proposal-refining
    - feature-sync
    - plan-from-design-doc
    - feature-tree-conversation
  description: |
    Name of the workflow template from src/flows/templates/:
    - adr: Architecture Decision Record creation workflow
    - initiative-refinement: Initiative refinement conversations
    - onboarding: User onboarding flow
    - repository-import: Existing-project repository analysis, review, placement, and import workflow
    - work-tracker-import: One-time Jira or Linear import run on the paired CLI, reviewed and placed like repository import
    - plan-from-design-doc: CLI-driven plan generation seeded by an existing design-doc markdown blob. The first node materializes the design-doc and plan, then the workflow reuses the post-design-doc plan-shaping nodes through to task review.
    - rfc: Request for Comments creation workflow
    - task-generation: Task generation conversations
    - task-refinement: Task refinement conversations
    - task-prioritization: Find highest priority tasks
    - entity-conversation: Conversational agent about a specific entity
    - project-conversation: Conversational agent about an entire project
    - brainstorm-refinement: Brainstorm design doc refinement
    - decision-refinement: Decision design doc refinement
    - agent-session: Pseudo workflow name, no temporal workflow is run
    - daily-session: Daily session conversational agent for assisting with daily goals
    - task-monitor: Canonical coordinating agent for one TASK_MONITOR work item
    - agent-task-refining: Non-temporal agent session for task refinement
    - agent-entity-conversation: Non-temporal agent session for entity-scoped conversation
    - goal-pm: Non-temporal standing Goal PM routing conversation for a GOAL
    - open-items-triage: Non-temporal standing Open Items triage conversation for one user in a project
    - agent-project-conversation: Non-temporal agent session for project-scoped conversation
    - agent-design-doc-refining: Non-temporal agent session for design doc refinement
    - agent-search: Non-temporal agent session for AdvancedSearch agent-search chat
    - agent-proposal-refining: Non-temporal agent session for iterative proposal refinement
    - feature-sync: Initial feature-sync stage run at the start of a coding session, driven by an external CLI agent
    - feature-tree-conversation: Project-scoped conversational agent for exploring and restructuring the feature hierarchy — structural rebalancing, project insights, and competitive analysis. Launched from the Features page "Discuss" action.

InitiationType:
  type: string
  enum:
    - SYSTEM
    - USER
  description: Who initiated the conversation

PaginatedConversationResponse:
  type: object
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      items:
        $ref: "#/ConversationResponseDto"
      description: Array of conversation data
    pagination:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Number of items per page
          example: 20
        total:
          type: integer
          description: Total number of items
          example: 85
        totalPages:
          type: integer
          description: Total number of pages
          example: 5

# =============================================
# Message Schemas
# =============================================
MessageType:
  type: string
  enum:
    - USER
    - SYSTEM
  description: Type of message - either from user or system

MessageExecutionStatus:
  type: string
  enum: [queued, started, cancelled, failed]
  description: >-
    Durable input execution status, independent of MessageStatus. Queued is
    established only by atomic executable submission and delivery commitment.
    Acknowledgement does not start execution. Started is terminal for this
    input status; cancelled and failed are confirmed pre-execution outcomes.
    Workflow-answer evidence and legacy messages without established admission
    evidence omit this field.

MessageExecutionAdmissionDisposition:
  type: string
  readOnly: true
  enum: [PENDING, IMMEDIATE, QUEUED]
  description: >-
    The execution owner's recorded admission decision for an executable
    input, written once from its correlated acceptance. PENDING: the owner has
    not confirmed admission (offline, or delivery is ambiguous). IMMEDIATE:
    admitted and reserved to run next with nothing ahead of it. QUEUED:
    admitted to wait behind active work, earlier inputs, or an execution hold.
    Independent of executionStatus; IMMEDIATE does not mean started, and
    timeline placement still happens only at execution start. Present exactly
    when executionStatus is present.

MessageStatus:
  type: string
  enum:
    - system_processing
    - streaming_ready
    - open
    - completed
    - failed
  description: |
    Status of a Message interaction:
    - open: Message is open and awaiting processing or user response
    - completed: Message processing is finished, no further action needed
    - failed: Message processing failed

UpdateMessageDto:
  type: object
  properties:
    status:
      $ref: "#/MessageStatus"
      description: Optional new status for the message
    data:
      type: object
      description: Optional new data for the message
    parentMessageId:
      $ref: "./common.yaml#/MessageId"
      description: Optional new parent message ID (used when rewiring thread order)

CreateMessageDto:
  type: object
  required: [projectId, type, conversationId]
  discriminator:
    propertyName: type
    mapping:
      SYSTEM: "#/CreateSystemMessage"
      USER: "#/CreateUserMessage"
  properties:
    projectId: { $ref: "./common.yaml#/ProjectId" }
    type: { $ref: "#/MessageType" } # SYSTEM | USER
    userId: { type: string }
    status: { $ref: "#/MessageStatus" }
    conversationId: { $ref: "./common.yaml#/ConversationId" }
    parentMessageId:
      allOf:
        - $ref: "./common.yaml#/MessageId"
      nullable: true
      description: "Unique identifier for a message (branded type). When null or absent the message is appended after the conversation's latest message (tail). Set an explicit value to thread off a specific message instead."
    createdAt: { type: string, format: date-time }

CreateSystemMessage:
  description: >-
    SYSTEM message persistence shape. When used by a generic message-write
    operation, only registry-classified passive projections are admitted;
    SESSION_MONITOR authority and triggersAgent fields require typed
    server-owned admission.
  allOf:
    - $ref: "#/CreateMessageDto"
    - type: object
      required: [data]
      properties:
        data: { $ref: "#/SystemMessageData" }
        proposalIds:
          type: array
          items:
            $ref: "./common.yaml#/ProposalId"
          description: >-
            Optional complete ordered set of Proposal identities presented by
            this final Message. The set may contain Proposals created during
            the current Turn and existing Proposals from other Conversations in
            the same organization and project. Presentation preserves the
            original Proposal Conversation and Message ownership and any
            existing Proposal Group home.
        reportIds:
          type: array
          items:
            $ref: "./common.yaml#/ReportId"
          description: Optional concrete Report identities created during the same agent turn.
      x-discriminator-value: SYSTEM

CreateUserMessage:
  allOf:
    - $ref: "#/CreateMessageDto"
    - type: object
      required: [data]
      properties:
        data: { $ref: "#/UserMessageData" }
        handler:
          $ref: "#/SecondaryActionHandler"
          description: Optional handler that triggered this user message
      x-discriminator-value: USER

SubmitExecutableUserMessageRequestDto:
  allOf:
    - $ref: "#/CreateUserMessage"
    - type: object
      additionalProperties: false
      required:
        [authorization, operationId, operationFingerprint, agentSessionId]
      properties:
        operationId:
          $ref: "./agent-operation.yaml#/AgentOperationId"
        operationFingerprint:
          $ref: "./agent-operation.yaml#/AgentOperationFingerprint"
        agentSessionId:
          $ref: "./common.yaml#/AgentSessionId"
        authorization:
          $ref: "./controller-authorization.yaml#/AdmissionEnvelopeAuthorization"
          description: >-
            Exactly one fresh controller assertion with its complete immutable
            descriptor or one active controller-device grant reference. The
            server resolves all reuse scope from persisted grant state.

MessageResponseDto:
  oneOf:
    - $ref: "#/SystemMessage"
    - $ref: "#/UserMessage"
  discriminator:
    propertyName: type
    mapping:
      SYSTEM: "#/SystemMessage"
      USER: "#/UserMessage"
  description: |
    Message response that varies based on type:
    - SYSTEM messages: contain feedback and questions (SystemMessageData)
    - USER messages: contain flexible user response data (UserMessageData)

MessageReadMode:
  type: string
  enum:
    - REVERSE_HISTORY
  description: |
    Explicit Message read mode. `REVERSE_HISTORY` returns a bounded page of
    the newest Messages at or before an opaque history cursor. Omitting the
    mode preserves the existing full-thread and forward `since` behavior.

ConversationMessageHistoryPageDto:
  type: object
  required:
    - messages
  properties:
    messages:
      type: array
      items:
        $ref: "#/MessageResponseDto"
      description: Messages in chronological `(createdAt, id)` order.
    nextCursor:
      type: string
      description: |
        Opaque cursor for the next older page. Omitted when no older Messages
        remain. The cursor is bound to the authorized project and conversation.

GetMessagesQueryDto:
  type: object
  properties:
    projectId:
      $ref: "./common.yaml#/ProjectId"
      description: Optional project ID to filter by
    conversationId:
      $ref: "./common.yaml#/ConversationId"
      description: Optional conversation ID to filter by
    type:
      $ref: "#/MessageType"
      description: Optional message type to filter by
    limit:
      type: integer
      default: 10
      description: Number of items per page
    page:
      type: integer
      default: 1
      description: Page number
    mode:
      $ref: "#/MessageReadMode"
      description: |
        Selects bounded reverse-history paging. Requires `conversationId`,
        cannot be combined with `since` or `page`, and is the only mode that
        accepts `historyCursor`.
    historyCursor:
      type: string
      description: |
        Opaque continuation cursor returned by a previous reverse-history
        page. Requires `mode=REVERSE_HISTORY` and the same conversation scope.
    since:
      $ref: "./common.yaml#/MessageId"
      description: |
        Optional cursor message id. When set, the response contains only
        messages whose (createdAt, id) tuple is strictly greater than the
        cursor's, ordered ascending. The cursor message must belong to the
        requested conversation; an unknown or mismatched id returns 404.
        When omitted, the endpoint returns the full conversation as before.
    includeProposals:
      type: boolean
      default: true
      description: Include proposals linked to each message in the response
    includeReports:
      type: boolean
      default: false
      description: Include reports linked to each message in the response

SearchConversationMessagesResponseDto:
  type: object
  required:
    - conversationId
    - conversationTitle
    - messageId
    - snippet
    - createdAt
    - type
  properties:
    conversationId:
      $ref: "./common.yaml#/ConversationId"
      description: Conversation the matched message belongs to
    conversationTitle:
      type: string
      nullable: true
      description: Title of the conversation (mirrors Conversation.title, which is nullable)
    messageId:
      $ref: "./common.yaml#/MessageId"
      description: Matched message id
    snippet:
      type: string
      description: Server-trimmed excerpt of the message content centered on the query match (~200 chars)
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp of the matched message
    type:
      $ref: "#/MessageType"
      description: Whether the matched message is a USER or SYSTEM message
  description: |
    One row of a `searchConversationMessages` result — a single message that
    matched the query, with enough context (conversation id+title, message
    id+createdAt, server-trimmed snippet) to render a result list without
    a follow-up fetch.

# Specific SystemMessage subtypes
QuestionsSystemMessage:
  type: object
  required:
    - id
    - workflowId
    - projectId
    - type
    - status
    - conversationId
    - createdAt
    - awaitingResponse
    - response
    - data
  properties:
    executionStatus:
      $ref: "#/MessageExecutionStatus"
    executionQueueConfirmed:
      type: boolean
      readOnly: true
      description: >-
        True only while queued after the execution owner confirms this input
        must wait: derived from an executionAdmissionDisposition of QUEUED or
        a waiting projection. False or absent on an executable queued message
        means delivery is pending or the input was admitted for immediate
        execution; render it beside the composer, outside the visible queue
        and conversation timeline.
    executionAdmissionDisposition:
      $ref: "#/MessageExecutionAdmissionDisposition"
    executionCancellationRequested:
      type: boolean
      description: >-
        A durable cancellation request is awaiting owner confirmation. This
        does not imply cancellation and never stops already-started execution.
    executionOperationId:
      $ref: "./agent-operation.yaml#/AgentOperationId"
      description: Exact submitted operation owning this executable message.
    id:
      $ref: "./common.yaml#/MessageId"
      description: Unique identifier of the Message interaction
    workflowId:
      $ref: "./common.yaml#/WorkflowId"
    projectId:
      $ref: "./common.yaml#/ProjectId"
    status:
      $ref: "#/MessageStatus"
      description: Current status of the message
    conversationId:
      type: string
      description: ID of the associated conversation
    parentMessageId:
      $ref: "./common.yaml#/MessageId"
      description: ID of the message this responds to (for responses)
    responses:
      type: array
      items:
        $ref: "#/MessageResponseDto"
      description: Messages that respond to this message
    parentMessage:
      $ref: "#/MessageResponseDto"
      description: The message this is responding to
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp
    awaitingResponse:
      type: boolean
      description: Whether the message is awaiting a response from the user
    type:
      type: string
      enum: [SYSTEM]
      description: Message type - always SYSTEM for this schema
    flowId:
      type: string
      description: ID of the conversational flow this message belongs to
      example: "onboarding"
    nodeId:
      type: string
      description: ID of the specific node/step within the flow
      example: "gather"
    response:
      type: string
      description: Human-readable response message from the system
      example: "I'd like to understand your project better. Let me ask a few questions."
    title:
      type: string
      description: Title or header for this conversation step
      example: "Project Understanding"
    archive:
      type: boolean
      description: If not false, generate a QA_PAIR artifact
    data:
      $ref: "#/QuestionsSystemMessageData"
      properties:
        detectedIntent:
          type: string
          description: Intent detected by the LLM
          example: "gather_requirements"
        intentConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score for the detected intent
          example: 0.9
        reasoning:
          type: string
          description: LLM's reasoning for the intent detection
          example: "User needs help understanding project requirements"
    uiElements:
      type: array
      items:
        $ref: "#/UIElement"
      description: UI elements for rendering the questions
    actions:
      type: array
      items:
        $ref: "#/Action"
      description: Actions to perform

