CreateEntityConversationContext:
  type: object
  additionalProperties: false
  properties:
    entityId:
      type: string
      description: Entity ID to anchor the entity conversation
    entityType:
      type: string
      description: Entity type for the entity conversation
  description: Context for entity conversation workflow creation

CreateProjectConversationContext:
  type: object
  additionalProperties: false
  description: Context for project conversation workflow conversation creation

CreateBrainstormRefinementConversationContext:
  type: object
  additionalProperties: false
  description: Context for brainstorm refinement workflow conversation creation

CreateDecisionRefinementConversationContext:
  type: object
  additionalProperties: false
  description: Context for decision refinement workflow conversation creation

CreateDailySessionConversationContext:
  type: object
  additionalProperties: false
  description: >
    Context for daily session workflow conversation creation.
    Carries the activity delta payload so the agent workflow receives recent
    activity items, computed diffs, and session state snapshots.
  properties:
    lastSystemMessage:
      type: string
      description: The most recent system message from a prior conversation turn, providing continuity context
    lastUserActivities:
      type: array
      items:
        $ref: "./activity-correlation.yaml#/RecentActivityCorrelationRecordDto"
      description: Recent user activity records correlated to the current session
    lastActivityDelta:
      $ref: "./agent-coordination.yaml#/ActivityDelta"
      description: Computed delta of activity changes since the session snapshot was taken

CreateAdrConversationDto:
  allOf:
