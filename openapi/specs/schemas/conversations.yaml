# A message read by identity or from the input queue. Identical to
# SystemMessage/UserMessage except that createdAt is null while the message is
# a queued executable input the agent has not started (or never started).
# Timeline reads exclude such rows and keep MessageResponseDto.
MessageRecordDto:
  oneOf:
    - $ref: "#/MessageRecordSystemMessage"
    - $ref: "#/MessageRecordUserMessage"
