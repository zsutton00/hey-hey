        - plan_shaping_feature_sync_review_request_revisions
        - implementation_readiness_reply
        - implementation_readiness_dismiss
      description: Discriminator field identifying the payload type
  discriminator:
    propertyName: handlerType
    mapping:
      adr_content_apply: "#/AdrContentApplyPayload"
      initiative_content_apply: "#/InitiativeContentApplyPayload"
      task_content_apply: "#/TaskContentApplyPayload"
      content_apply: "#/ContentApplyPayload"
      task_generation_generate: "#/TaskGenerationPayload"
      coding_prompt_accept: "#/CodingPromptAcceptPayload"
      next_step: "#/NextStepPayload"
      suggested_action: "#/SuggestedActionPayload"
      suggested_agent_action: "#/SuggestedAgentActionPayload"
      related_entities: "#/RelatedEntitiesPayload"
      complete_onboarding: "#/CompleteOnboardingPayload"
      plan_gap_continue_revising: "#/PlanGapContinueRevisingPayload"
      plan_approval_continue_revising: "#/PlanApprovalContinueRevisingPayload"
      plan_stage_continue_revising: "#/PlanStageContinueRevisingPayload"
      plan_service_analyze: "#/PlanServicesAnalyzePayload"
      feature_list_continue_revising: "#/FeatureListContinueRevisingPayload"
      plan_generation_stage_review_continue_revising: "#/PlanGenerationStageReviewContinueRevisingPayload"
      plan_generation_stage_review_approve_all: "#/PlanGenerationStageReviewApproveAllPayload"
      plan_generation_step_review_continue_revising: "#/PlanGenerationStepReviewContinueRevisingPayload"
      plan_generation_step_review_approve_all: "#/PlanGenerationStepReviewApproveAllPayload"
      plan_generation_visual_preview_approve: "#/PlanGenerationVisualPreviewApprovePayload"
      plan_generation_visual_preview_continue_revising: "#/PlanGenerationVisualPreviewContinueRevisingPayload"
      plan_generation_journey_map_approve: "#/PlanGenerationJourneyMapApprovePayload"
      plan_generation_journey_map_continue_revising: "#/PlanGenerationJourneyMapContinueRevisingPayload"
      refine_stage_validation_choice_pick_validation_on: "#/RefineStageValidationChoicePickValidationOnPayload"
      refine_stage_validation_choice_pick_validation_off: "#/RefineStageValidationChoicePickValidationOffPayload"
      plan_shaping_feature_sync_review_done: "#/PlanShapingFeatureSyncReviewDonePayload"
      plan_shaping_feature_sync_review_request_revisions: "#/PlanShapingFeatureSyncReviewRequestRevisionsPayload"
      implementation_readiness_reply: "#/ImplementationReadinessReplyActionPayload"
      implementation_readiness_dismiss: "#/ImplementationReadinessDismissActionPayload"
