DailySessionSystemMessageData:
  allOf:
    - $ref: "#/SystemMessageData"
    - type: object
      required:
        - type
        - response
        - detectedIntent
        - intentConfidence
      properties:
        flowId:
          type: string
          description: ID of the conversational flow this message belongs to
          example: "daily-session"
        nodeId:
          type: string
          description: ID of the specific node/step within the flow
          example: "briefing"
        ragEnabled:
          type: boolean
          description: Whether this message should be included in RAG retrieval
        title:
          type: string
          description: Title or header for this conversation step, used for breadcrumbs and navigation
          example: "Daily Briefing"
        detectedIntent:
          type: string
          description: Intent detected by the LLM
          example: "daily_session"
        intentConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score for the detected intent
          example: 0.95
        reasoning:
          type: string
          description: LLM's reasoning for the intent detection
        skippable:
          type: boolean
          description: Whether this step can be skipped by the user
          example: false
        widgets:
          type: array
          items:
            $ref: "#/WidgetSpec"
          description: Structured widget declarations emitted by the agent for dashboard-style rendering
  x-discriminator-value: DAILY_SESSION

