      repository_grounding: "#/AgentTriggerRepositoryGrounding"
      repository_feature_enrichment: "#/AgentTriggerRepositoryFeatureEnrichment"
      repository_first_work: "#/AgentTriggerRepositoryFirstWork"
      repository_placement: "#/AgentTriggerRepositoryPlacement"
      session_monitor: "#/AgentTriggerSessionMonitor"
      user_message: "#/AgentTriggerUserMessage"
      start_run: "#/AgentTriggerStartRun"
  description: >-
    Structured marker that a conversation message is a trigger for the CLI
    to dispatch a PromptHandler. Attachable to any message author (SYSTEM
    triggers are emitted by the workflow engine on EXTERNAL_AGENT node entry;
    USER triggers are produced by the UI at submit time). Pending-handler
    work is derived over the conversation log as a set difference between
    messages carrying `data.triggersAgent` and completion messages whose
    `data.completesExternalAgentNode.completesTriggerMessageId` references
    them.

