      description: Proposals created for or linked to this message (included when includeProposals=true)
    reports:
      type: array
      items:
        $ref: "./reports.yaml#/ReportDto"
      description: Reports linked to this message via ReportEntity (included when includeReports=true)

# =============================================
# Message Retry Schemas
# =============================================
MessageRetryResponse:
  type: object
  required:
    - status
    - message
  properties:
    status:
      type: string
      enum: ["retry_initiated"]
      description: Status of the retry request
      example: "retry_initiated"
    message:
      type: string
      description: Human-readable message about the retry status
      example: "Retry request has been sent to the workflow"
    retryCount:
      type: integer
      minimum: 1
      description: New retry count after this attempt
      example: 2
  description: Response when a message retry is initiated

MessageRetryStatus:
  type: object
  required:
    - retryable
    - retryCount
    - lastRetryAt
  properties:
    retryable:
      type: boolean
      description: Whether the message can be retried
      example: true
    retryCount:
      type: integer
      minimum: 0
      description: Number of times this message has been retried
      example: 1
    lastRetryAt:
      type: string
      format: date-time
      nullable: true
      description: Timestamp of the last retry attempt
      example: "2024-01-15T10:30:00Z"
    failedNodeId:
      type: string
      description: ID of the workflow node that failed
      example: "generate_questions"
    failedWorkflowStep:
      type: string
      description: Name of the workflow step that failed
      example: "GENERATING_QUESTIONS"
  description: Current retry status information for a message

# =============================================
# Secondary Action Schemas
# =============================================

# Secondary Action Payload Types (Discriminated Union)
# Base payload with discriminator
RelatedEntityDto:
  type: object
  required:
    - entityId
    - entityType
    - entityName
  properties:
    entityId:
      type: string
      description: Related entity identifier
    entityType:
      type: string
      description: Related entity type
    entityName:
      type: string
      description: Display name for the related entity
    writerPayloadMode:
      type: string
      enum:
        - full_document
        - summary_only
        - excluded
      description: How this entity's evidence would be included in writer context
    selectedForHydration:
      type: boolean
      description: Whether this entity was selected for full-document hydration
    hydrated:
      type: boolean
      description: Whether full-document hydration succeeded for this entity

SecondaryActionPayload:
  type: object
  required:
    - handlerType
  properties:
    handlerType:
      type: string
      enum:
        - adr_content_apply
        - initiative_content_apply
        - task_content_apply
        - content_apply
        - next_step
        - complete_onboarding
        - task_generation_generate
        - coding_prompt_accept
        - suggested_action
        - related_entities
        - plan_gap_continue_revising
        - plan_approval_continue_revising
        - plan_stage_continue_revising
        - plan_service_analyze
        - suggested_agent_action
        - feature_list_continue_revising
        - plan_generation_stage_review_continue_revising
        - plan_generation_stage_review_approve_all
        - plan_generation_step_review_continue_revising
        - plan_generation_step_review_approve_all
        - plan_generation_visual_preview_approve
        - plan_generation_visual_preview_continue_revising
        - plan_generation_journey_map_approve
        - plan_generation_journey_map_continue_revising
