ProjectApprovalPolicyRuleSource:
  type: string
  enum:
    - PROJECT
    - DEFAULT
    - FIXED
  description: Origin of a rule in the effective policy.

ProjectApprovalPolicyRequirement:
  type: string
  enum:
    - IMMEDIATE
    - PROJECT_REQUIRED
    - FIXED_REQUIRED
  description: >-
    IMMEDIATE applies without human approval. PROJECT_REQUIRED uses the
    rule's requiredApprovals value. FIXED_REQUIRED uses a code-owned count
    and is never editable through project settings.

ProjectApprovalPolicyAuthor:
  type: string
  enum:
    - USER
    - AGENT

ProjectApprovalPolicyAction:
  type: string
  enum:
    - CREATE
    - UPDATE
    - DELETE
  description: >-
    UPDATE rules match both UPDATE and VERSIONED_UPDATE proposals. The API
    normalizes VERSIONED_UPDATE to UPDATE before policy evaluation; the policy
    action model therefore remains unchanged.

ProjectApprovalPolicyChangeSelector:
  type: string
  enum:
    - STATUS_ONLY
    - CONTENT_CHANGE
  description: >-
    CONTENT_CHANGE matches when at least one changed field is not status.
    STATUS_ONLY matches exactly one changed field named status. These generic
    selectors are distinct from the existing FEATURE content classifier,
    which is retained on effective code-default rules and is reported in
    review explanations.

ProjectApprovalPolicyConditions:
  type: object
  additionalProperties: false
  properties:
    typeKey:
      type: string
      minLength: 1
      description: >-
        Exact stable key in the project's effective work-item type registry.
        Omit to match all types; there is no registry key for the Default
        presentation group.
    author:
      $ref: "#/ProjectApprovalPolicyAuthor"
    action:
      $ref: "#/ProjectApprovalPolicyAction"
    change:
      $ref: "#/ProjectApprovalPolicyChangeSelector"

ProjectApprovalPolicyEffectiveConditions:
  type: object
  additionalProperties: false
  properties:
    typeKey:
      type: string
      minLength: 1
      description: Exact effective registry key; omitted means all work-item types.
    author:
      $ref: "#/ProjectApprovalPolicyAuthor"
    action:
      $ref: "#/ProjectApprovalPolicyAction"
    change:
      $ref: "#/ProjectApprovalPolicyChangeSelector"
    featureContentChange:
      type: boolean
      description: >-
        Optional existing FEATURE-specific content classification. True means
        at least one changed field is name, sections.description,
        sections.requirements, or sections.acceptanceCriteria. It is separate
        from the generic change selector.
    topLevel:
      type: boolean
      description: Existing API-owned structural top-level match input used by code defaults.
    toolName:
      type: string
      minLength: 1
      description: Existing authoring-boundary match input used by code defaults.
  description: >-
    Omitted conditions match any value for that dimension. Conditions are
    conjunctive. For project-authored rules, typeKey, author, action, and
    change are the settings controls; featureContentChange, topLevel, and
    toolName preserve the complete effective match explanation for code-owned
    rules.

ProjectApprovalPolicyRule:
  type: object
  additionalProperties: false
  required:
    - conditions
    - requirement
    - requiredApprovals
    - allowsProposerApproval
  properties:
    conditions:
      $ref: "#/ProjectApprovalPolicyConditions"
    requirement:
      type: string
      enum:
        - IMMEDIATE
        - PROJECT_REQUIRED
      description: Project-authored rules cannot set FIXED_REQUIRED.
    requiredApprovals:
      type: integer
      minimum: 0
      description: >-
        Per-rule effective count. IMMEDIATE requires 0; PROJECT_REQUIRED
        requires a positive supported count. The API enforces the pairing and
        reports a field-addressable validation issue when it is invalid.
    allowsProposerApproval:
      type: boolean
      description: >-
        Whether an eligible user proposer may contribute one ordinary human
        approval. The API still verifies the current actor and membership;
        clients cannot grant eligibility or proposer credit.
  description: One editable rule in project-authored global priority order.

ProjectApprovalPolicyEffectiveRule:
  type: object
  additionalProperties: false
  required:
    - order
    - source
    - editable
    - conditions
    - requirement
    - requiredApprovals
    - allowsProposerApproval
  properties:
    order:
      type: integer
      minimum: 0
      description: Zero-based position in the complete first-match evaluation order.
    source:
      $ref: "#/ProjectApprovalPolicyRuleSource"
    editable:
      type: boolean
      description: False for code defaults and protected fixed exceptions.
    conditions:
      $ref: "#/ProjectApprovalPolicyEffectiveConditions"
    requirement:
      $ref: "#/ProjectApprovalPolicyRequirement"
    requiredApprovals:
      type: integer
      minimum: 0
      description: Effective per-rule count; zero for IMMEDIATE, configured rule count for PROJECT_REQUIRED, fixed count for FIXED_REQUIRED.
    allowsProposerApproval:
      type: boolean
      description: Effective rule setting before the API applies current author and eligibility checks.

ProjectApprovalPolicyFallback:
  type: object
  additionalProperties: false
  required:
    - source
    - editable
    - requiresProposal
    - requirement
    - requiredApprovals
    - allowsProposerApproval
  properties:
    source:
      type: string
      enum:
        - DEFAULT
      description: The unmatched behavior is code-owned.
    editable:
      type: boolean
      enum: [false]
    requiresProposal:
      type: boolean
      enum: [false]
      description: Existing fallback behavior when no rule matches.
    requirement:
      type: string
      enum:
        - PROJECT_REQUIRED
    requiredApprovals:
      type: integer
      minimum: 0
    allowsProposerApproval:
      type: boolean
      enum: [false]

ProjectApprovalPolicySnapshot:
  type: object
  additionalProperties: false
  required:
    - projectId
    - revision
    - hasProjectOverride
    - rules
    - fallback
  properties:
    projectId:
      $ref: "./common.yaml#/ProjectId"
    revision:
      type: integer
      minimum: 0
      description: >-
        Monotonic project policy concurrency token. A project with no prior
        policy writes starts at 0. Every successful replacement or restore
        increments it, including restore when no override is currently saved.
        Restore retains this revision history while removing the override.
    hasProjectOverride:
      type: boolean
      description: Whether an editable project override currently exists; false does not imply revision 0.
    rules:
      type: array
      items:
        $ref: "#/ProjectApprovalPolicyEffectiveRule"
      description: >-
        Complete global evaluation order. Protected FIXED rules precede
        project rules; project rules appear in saved order; ordinary code
        defaults follow them in their established order. The first matching
        rule wins. With no override, code defaults retain their established
        order and behavior. Replacing the project configuration replaces only
        the project rule layer. Code-owned defaults and their established
        counts remain in effect when no project rule matches.
    fallback:
      $ref: "#/ProjectApprovalPolicyFallback"
  description: >-
    Effective, API-owned policy for one project. Provenance belongs to each
    effective rule; it is not inferred from a type group or a fake Default
    registry entry.

ProjectApprovalPolicyReplaceRequest:
  type: object
  additionalProperties: false
  required:
    - expectedRevision
    - rules
  properties:
    expectedRevision:
      type: integer
      minimum: 0
      description: Revision from the latest policy read, including 0 on first save.
    rules:
      type: array
      items:
        $ref: "#/ProjectApprovalPolicyRule"
      description: Complete replacement of the editable project rule layer, in global priority order.

ProjectApprovalPolicyRestoreRequest:
  type: object
  additionalProperties: false
  required:
    - expectedRevision
  properties:
    expectedRevision:
      type: integer
      minimum: 0
      description: Revision from the latest policy read; restore uses the same compare-and-swap protection as replacement.

ProjectApprovalPolicyValidationIssue:
  type: object
  additionalProperties: false
  required:
    - path
    - message
  properties:
    path:
      type: string
      minLength: 1
      description: JSON Pointer to the invalid replacement field, for example /rules/0/conditions/typeKey.
    message:
      type: string
      minLength: 1
      description: Human-readable explanation for the field-level validation failure.

ProjectApprovalPolicyValidationErrorResponse:
  allOf:
    - $ref: "./common.yaml#/ApiErrorResponse"
    - type: object
      required:
        - code
        - issues
      properties:
        code:
          type: string
          enum:
            - PROJECT_APPROVAL_POLICY_VALIDATION_FAILED
        issues:
          type: array
          minItems: 1
          items:
            $ref: "#/ProjectApprovalPolicyValidationIssue"
  description: Invalid rule document or selector rejected without changing the current policy.

ProjectApprovalPolicyRevisionConflictResponse:
  allOf:
    - $ref: "./common.yaml#/ApiErrorResponse"
    - type: object
      required:
        - code
        - expectedRevision
        - currentRevision
      properties:
        code:
          type: string
          enum:
            - PROJECT_APPROVAL_POLICY_REVISION_CONFLICT
        expectedRevision:
          type: integer
          minimum: 0
        currentRevision:
          type: integer
          minimum: 0
  description: >-
    Compare-and-swap failed. The request did not change the policy; reread the
    effective snapshot before retrying. This covers concurrent first saves
    and replacement/restore/recreate races.

ProjectApprovalPolicyResponse:
  allOf:
    - $ref: "./common.yaml#/ApiResponse"
    - type: object
      required:
        - data
      properties:
        data:
          $ref: "#/ProjectApprovalPolicySnapshot"

ProposalApprovalExplanationEvidence:
  type: string
  enum:
    - LIVE
    - CAPTURED
    - UNAVAILABLE
  description: >-
    Pending ordinary proposals report LIVE policy on each read or decision.
    Terminal decisions report CAPTURED evidence from the decision transition.
    Legacy terminal proposals without captured evidence report UNAVAILABLE;
    they are never reconstructed from current policy.

ProposalApprovalExplanation:
  type: object
  additionalProperties: false
  required:
    - evidence
    - source
    - conditions
    - requirement
    - changedFields
    - changedFieldClassification
    - creditedProposerApprovals
    - viewerEligibility
  properties:
    evidence:
      $ref: "#/ProposalApprovalExplanationEvidence"
    source:
      allOf:
        - $ref: "#/ProjectApprovalPolicyRuleSource"
      nullable: true
      description: Null only when historical evidence is UNAVAILABLE.
    conditions:
      allOf:
        - $ref: "#/ProjectApprovalPolicyEffectiveConditions"
      nullable: true
      description: Matched rule conditions; null only when historical evidence is UNAVAILABLE.
    requirement:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - category
        - requiredApprovals
      properties:
        category:
          $ref: "#/ProjectApprovalPolicyRequirement"
        requiredApprovals:
          type: integer
          minimum: 0
      description: Null only when historical evidence is UNAVAILABLE.
    changedFields:
      type: array
      nullable: true
      items:
        type: string
      description: >-
        API-classified field paths for the proposal. Null only when historical
        evidence is UNAVAILABLE; an empty array means no content fields.
    changedFieldClassification:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - statusOnlyChange
        - contentChange
        - featureContentChange
      properties:
        statusOnlyChange:
          type: boolean
          description: True only when the sole changed field is status.
        contentChange:
          type: boolean
          description: True when at least one changed field is not status.
        featureContentChange:
          type: boolean
          description: Existing FEATURE classifier for name and the supported description, requirements, and acceptance-criteria fields.
      description: Null only when historical evidence is UNAVAILABLE.
    creditedProposerApprovals:
      type: integer
      minimum: 0
      maximum: 1
      nullable: true
      description: >-
        Captured/live count of approval records credited to the user proposer.
        Agent authorship contributes zero. This is historical decision evidence
        for CAPTURED and never depends on the current viewer; null when legacy
        terminal history is unavailable.
    viewerEligibility:
      type: object
      additionalProperties: false
      required:
        - eligibleToApprove
      properties:
        eligibleToApprove:
          type: boolean
          description: Current viewer's server-derived approval eligibility, evaluated now and never stored as historical evidence.
  description: API-owned explanation of the rule and approval requirement for this proposal response.
