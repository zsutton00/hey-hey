# =============================================
# Work Item Schema Definitions
# =============================================
# Unified schemas for work items (initiatives and tasks) with staged content support

WorkItemType:
  type: string
  enum:
    - initiative
    - task
  description: The type of work item

WorkItemSectionKey:
  type: string
  description: Section key declared by the target work-item type. Built-in and project-defined keys are supported.

WorkItemSection:
  type: object
  required:
    - key
    - order
  properties:
    id:
      type: string
      description: The section's unique id
    key:
      type: string
      description: Unique identifier for the section (e.g., description, details).
    order:
      type: integer
      description: Ordering index for rendering sections.

WorkItemSectionInput:
  type: object
  required:
    - key
    - content
  properties:
    key:
      type: string
      description: Unique identifier for the section (e.g., description, details).
    content:
      description: >
        Section content to initialize or update. Markdown sections use a
        string; schema-backed JSON sections may send a value that the server
        validates against the section's declared schema; html/css sections use
        the strict WorkItemHtmlCssSectionContent object; structured-mockup
        sections use WorkItemStructuredMockupSectionContent.
    order:
      type: integer
      description: Optional ordering index for rendering sections.

ImageSectionContent:
  type: object
  additionalProperties: false
  description: >
    Inline image stored in a schema-backed JSON section. The server checks that
    `data` is valid base64, that the decoded bytes match `mimeType`, and that
    they are at most 1,000,000 bytes. Images are stored exactly as supplied;
    they are not compressed or resized. An absent section means no image.
  required:
    - mimeType
    - data
  properties:
    mimeType:
      type: string
      enum:
        - image/png
        - image/jpeg
        - image/webp
    data:
      type: string
      format: byte
      minLength: 1
      maxLength: 1333336
      description: Standard padded base64 encoding of the image bytes (at most 1,000,000 decoded bytes).

ProjectModeFiles:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - files
  properties:
    schemaVersion:
      type: string
      enum:
        - project-mode-files.v1
      description: Version of the project MODE file-bundle schema.
    files:
      type: object
      minProperties: 1
      required:
        - MODE.md
      x-propertyNames:
        pattern: '^(?!/)(?!.*(?:^|/)\.\.?(?:/|$))(?!.*//)(?!.*\\)[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$'
      properties:
        MODE.md:
          type: string
          minLength: 1
          description: Required entry instructions for the selected project MODE.
      additionalProperties:
        type: string
      description: |
        Text files keyed by safe relative POSIX paths. `MODE.md` is the required
        entry document; supporting files remain available for on-demand reads.
  description: |
    Closed, versioned value stored in a MODE work item's schema-backed `files`
    section. File paths are relative and file values are text; the bundle does
    not carry executable hooks, tool grants, or provider configuration.

ProjectModeProjectAssistantSetting:
  type: object
  additionalProperties: false
  required:
    - enabled
  properties:
    enabled:
      type: boolean
      description: Whether Project Assistant runs before the MODE's first turn.
  description: |
    Project Assistant participation chosen by the MODE author. It is the
    project-mode handler's participation baseline rather than a
    session-configuration override, which is why it may turn participation on.

SessionRole:
  type: string
  description: Kind of work performed by a mode session, independent of mode identity and work-item-type registry role.
  enum:
    - implementation
    - research
    - planning
    - review
  default: implementation

ProjectModeSettings:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - projectAssistant
  properties:
    schemaVersion:
      type: string
      enum:
        - project-mode-settings.v1
      description: Version of the project MODE settings schema.
    projectAssistant:
      $ref: "#/ProjectModeProjectAssistantSetting"
    sessionRole:
      allOf:
        - $ref: "#/SessionRole"
      description: Session role declared by this Agent Mode. Omission, including omission of the settings section, resolves to implementation.
      default: implementation
    eligibleWorkItemTypeKeys:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: |
        Stable effective work-item type keys this MODE may launch against,
        chosen per MODE. Keys must be unique (enforced by the platform
        validator rather than `uniqueItems`, which generators map to sets). Each key must resolve to an active type in the
        project's effective registry snapshot. Launch eligibility is this list
        intersected with the MODE's Feature `DEPENDS_ON` scope. When absent, the
        MODE keeps its legacy eligibility derived from the shared MODE type's
        agent-guidance contexts; consumers must not widen access for an absent
        list.
  description: |
    Closed, versioned value stored in a MODE work item's schema-backed
    `settings` section.

WorkItemGraphLayoutValue:
  type: object
  additionalProperties: false
  description: >
    Reusable authored graph layout section value for graph-capable work-item
    types. The value stores density-independent logical coordinates keyed by
    either materialized work-item identities or change-set-scoped temporary
    references. Omitting or clearing this section asks consumers to compute
    canonical layout.
  required:
    - schemaVersion
    - nodes
  properties:
    schemaVersion:
      type: string
      enum:
        - work-item-graph-layout.v1
      description: Version of the reusable graph layout value schema.
    nodes:
      type: array
      description: Authored logical positions keyed by graph node identity.
      items:
        $ref: "#/WorkItemGraphLayoutNodePosition"

WorkItemGraphLayoutPreferenceValue:
  type: object
  additionalProperties: false
  description: Reusable preferred logical shape for an authored work-item graph.
  required:
    - schemaVersion
    - rows
    - columns
  properties:
    schemaVersion:
      type: string
      enum:
        - work-item-graph-layout-preference.v1
      description: Version of the reusable graph layout preference schema.
    rows:
      type: integer
      minimum: 1
      description: Preferred number of logical graph rows.
    columns:
      type: integer
      minimum: 1
      description: Preferred number of logical graph columns.

WorkItemGraphNodePresentationValue:
  type: object
  additionalProperties: false
  description: >
    Optional authored presentation for a graph node. It is type-owned section
    data, separate from transient viewer highlighting and graph layout.
  required:
    - schemaVersion
  properties:
    schemaVersion:
      type: string
      enum:
        - work-item-graph-node-presentation.v1
      description: Version of the reusable graph node presentation schema.
    color:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      description: Optional authored six-digit hexadecimal node color.

WorkItemGraphLayoutNodePosition:
  type: object
  additionalProperties: false
  required:
    - node
    - position
  properties:
    node:
      $ref: "#/WorkItemGraphLayoutNodeRef"
    position:
      $ref: "#/WorkItemGraphLogicalPosition"

WorkItemGraphLayoutNodeRef:
  oneOf:
    - $ref: "#/PersistedWorkItemGraphLayoutNodeRef"
    - $ref: "#/TemporaryWorkItemGraphLayoutNodeRef"
  description: >
    Structurally distinct key for a graph-layout node: either an existing
    persisted work item or a change-set-scoped temporary reference.

PersistedWorkItemGraphLayoutNodeRef:
  type: object
  additionalProperties: false
  required:
    - kind
    - workItemId
  properties:
    kind:
      type: string
      enum:
        - persistedWorkItem
    workItemId:
      type: string
      format: uuid
      description: Existing materialized work-item identity for the graph node.

TemporaryWorkItemGraphLayoutNodeRef:
  type: object
  additionalProperties: false
  required:
    - kind
    - temporaryRef
  properties:
    kind:
      type: string
      enum:
        - temporaryWorkItem
    temporaryRef:
      type: string
      minLength: 1
      maxLength: 120
      pattern: "^[A-Za-z][A-Za-z0-9_.:-]*$"
      description: Change-set-scoped temporary identity for a node not yet materialized.

WorkItemGraphLogicalPosition:
  type: object
  additionalProperties: false
  required:
    - x
    - y
  properties:
    x:
      $ref: "#/WorkItemGraphLogicalCoordinate"
    y:
      $ref: "#/WorkItemGraphLogicalCoordinate"

WorkItemGraphLogicalCoordinate:
  type: number
  format: double
  description: >
    Finite density-independent logical coordinate. JSON non-finite values such
    as NaN and Infinity are not valid for this schema.

WorkItemGraphAggregateResponseDto:
  type: object
  required:
    [root, children, relationships, layout, derivedReferences, participation]
  properties:
    root:
      $ref: "./tasks.yaml#/TaskResponseDto"
    children:
      type: array
      items:
        $ref: "./tasks.yaml#/TaskResponseDto"
    relationships:
      type: array
      items:
        $ref: "./agent-edges.yaml#/AgentEdgeResponseDto"
    layout:
      nullable: true
      allOf:
        - $ref: "#/WorkItemGraphLayoutValue"
    derivedReferences:
      type: array
      items:
        $ref: "#/WorkItemGraphDerivedReference"
    participation:
      $ref: "#/WorkItemGraphParticipationResponseDto"

WorkItemGraphParticipationType:
  type: string
  enum: [GUARANTEES, IMPLEMENTS, CONSUMES]

WorkItemGraphParticipationCanonicalIdentity:
  type: object
  additionalProperties: false
  required: [entityType, entityId, title]
  properties:
    entityType:
      type: string
      enum: [TASK, SERVICE]
    entityId:
      type: string
      format: uuid
    title:
      type: string

CanonicalEntityReference:
  type: object
  additionalProperties: false
  required: [entityType, entityId]
  properties:
    entityType:
      type: string
      enum: [TASK, SERVICE]
    entityId:
      type: string
      format: uuid

WorkItemGraphParticipationRecord:
  type: object
  additionalProperties: false
  required:
    [
      evidenceId,
      semanticType,
      sourceEntityId,
      sourceEntityType,
      targetEntityId,
      targetEntityType,
      direction,
      label,
      reason,
    ]
  properties:
    evidenceId:
      type: string
      format: uuid
      description: Stable persisted edge identity used to overlay edits and removals.
    semanticType:
      $ref: "#/WorkItemGraphParticipationType"
    sourceEntityId:
      type: string
      format: uuid
    sourceEntityType:
      type: string
      enum: [TASK]
    targetEntityId:
      type: string
      format: uuid
    targetEntityType:
      type: string
      enum: [TASK]
    direction:
      type: string
      enum: [source-to-target]
      description: Contract participation is authoritative only from a DIAGRAM_ELEMENT source to a CONTRACT target.
    label:
      type: string
    description:
      type: string
      nullable: true
    reason:
      type: string

WorkItemGraphParticipationProvenance:
  type: object
  additionalProperties: false
  required: [queryReference, pathDiagramIds, pathElementIds, derived]
  properties:
    queryReference:
      $ref: "#/CanonicalEntityReference"
    pathDiagramIds:
      type: array
      items: { type: string, format: uuid }
    pathElementIds:
      type: array
      items: { type: string, format: uuid }
    derived:
      type: boolean
      description: False only when the participating element is displayed directly in the requested saved aggregate.

WorkItemGraphParticipationEntry:
  type: object
  additionalProperties: false
  required:
    [
      contract,
      sourceDiagram,
      displayedAnchor,
      participant,
      responsibility,
      relationship,
      provenance,
    ]
  properties:
    contract:
      $ref: "#/WorkItemGraphParticipationCanonicalIdentity"
    sourceDiagram:
      $ref: "#/WorkItemGraphParticipationCanonicalIdentity"
    displayedAnchor:
      $ref: "#/WorkItemGraphParticipationCanonicalIdentity"
      description: The element or canonical identity from which navigation began; it is not necessarily the participant.
    participant:
      $ref: "#/WorkItemGraphParticipationCanonicalIdentity"
      description: Precise DIAGRAM_ELEMENT carrying the authoritative participation relationship.
    responsibility:
      $ref: "#/WorkItemGraphParticipationType"
    relationship:
      $ref: "#/WorkItemGraphParticipationRecord"
    provenance:
      type: array
      minItems: 1
      items:
        $ref: "#/WorkItemGraphParticipationProvenance"

WorkItemGraphParticipationCompleteness:
  type: string
  enum: [COMPLETE, TRUNCATED, FAILED]

WorkItemGraphParticipationLimit:
  type: object
  additionalProperties: false
  required:
    [
      referenceDepth,
      candidateCount,
      diagramCount,
      graphRequestCount,
      evidenceCount,
    ]
  properties:
    referenceDepth: { type: integer, minimum: 0 }
    candidateCount: { type: integer, minimum: 1 }
    diagramCount: { type: integer, minimum: 1 }
    graphRequestCount: { type: integer, minimum: 1 }
    evidenceCount: { type: integer, minimum: 1 }

WorkItemGraphParticipationSummary:
  type: object
  additionalProperties: false
  required:
    [
      completeness,
      uniqueContractCount,
      participantCount,
      responsibilityCount,
      limits,
      truncationReasons,
      errors,
    ]
  properties:
    completeness:
      $ref: "#/WorkItemGraphParticipationCompleteness"
    uniqueContractCount:
      type: integer
      minimum: 0
      nullable: true
      description: Exact only for COMPLETE results; null for capped or failed results.
    participantCount:
      type: integer
      minimum: 0
      description: Unique returned participant identities, distinct from Contract count.
    responsibilityCount:
      type: integer
      minimum: 0
      description: Unique returned persisted participation relationships.
    limits:
      $ref: "#/WorkItemGraphParticipationLimit"
    truncationReasons:
      type: array
      items: { type: string }
    errors:
      type: array
      items: { type: string }
      description: Non-sensitive read-failure classifications; an empty result with errors is never evidence of zero participation.

WorkItemGraphParticipationResponseDto:
  type: object
  additionalProperties: false
  required: [entries, summary]
  properties:
    entries:
      type: array
      items:
        $ref: "#/WorkItemGraphParticipationEntry"
    summary:
      $ref: "#/WorkItemGraphParticipationSummary"

WorkItemReferenceDto:
  type: object
  additionalProperties: false
  description: >
    Lightweight current work-item identity used by consumers that need to
    resolve references without hydrating sections or other aggregate data.
  required:
    - id
    - name
    - type
    - parentTaskId
  properties:
    id:
      type: string
      format: uuid
      description: Stable identity of the work item.
    name:
      type: string
      description: Canonical name of the work item.
    type:
      $ref: "./work-item-type-definition.yaml#/WorkItemTypeKey"
      description: Registry-backed work-item type key.
    parentTaskId:
      type: string
      format: uuid
      nullable: true
      description: Structural parent work-item identity, or null for a root item.

WorkItemReferencePaginationDto:
  type: object
  additionalProperties: false
  description: Stable page traversal metadata for a work-item reference read.
  required:
    - page
    - limit
    - total
    - totalPages
    - hasNext
    - hasPrevious
  properties:
    page:
      type: integer
      minimum: 1
      description: Current 1-based page number.
    limit:
      type: integer
      minimum: 1
      maximum: 500
      description: Number of references requested per page.
    total:
      type: integer
      minimum: 0
      description: Total number of non-archived references matching the scope.
    totalPages:
      type: integer
      minimum: 0
      description: Total number of pages in the deterministic result set.
    hasNext:
      type: boolean
      description: Whether another page follows the current page.
    hasPrevious:
      type: boolean
      description: Whether a page precedes the current page.

PaginatedWorkItemReferenceResponseDto:
  type: object
  additionalProperties: false
  description: Complete page of lightweight work-item references.
  required:
    - items
    - pagination
  properties:
    items:
      type: array
      items:
        $ref: "#/WorkItemReferenceDto"
      description: References in deterministic name-and-identity order.
    pagination:
      $ref: "#/WorkItemReferencePaginationDto"

WorkItemGraphDerivedReference:
  type: object
  additionalProperties: false
  required:
    [
      expansionKey,
      projectionKind,
      entityId,
      entityType,
      displayName,
      viaEntityIds,
    ]
  properties:
    expansionKey:
      type: string
    projectionKind:
      type: string
      enum: [workItemReference]
    entityId:
      type: string
      format: uuid
    entityType:
      $ref: "./common.yaml#/EntityType"
    workItemTypeKey:
      $ref: "./work-item-type-definition.yaml#/WorkItemTypeKey"
    displayName:
      type: string
    viaEntityIds:
      type: array
      minItems: 1
      description: >
        Canonical identities reached by the first hop of matching expansion
        paths. When projected references are deduplicated, this contains the
        sorted union of first-hop identities from every matching path.
      items:
        type: string
        format: uuid
MaterializedWorkItemSection:
  allOf:
    - $ref: "#/WorkItemSection"
    - type: object
      required:
        - materializedMarkdown
        - materializedProposalId
        - id
      properties:
        materializedMarkdown:
          type: string
          description: Persisted markdown snapshot for the section.
        materializedProposalId:
          type: string
          format: uuid
          description: >
            Proposal whose successfully materialized change produced the
            section's current composition or resolved presentation context.
        crdtSnapshotSeq:
          type: integer
          nullable: true
          description: Sequence number associated with the persisted CRDT snapshot.

TaskMonitorJudgmentResponse:
  type: object
  additionalProperties: false
  required:
    - requestMessageId
    - label
    - conclusion
  properties:
    requestMessageId:
      $ref: "./common.yaml#/MessageId"
      description: >
        Canonical Message identity of the originating JUDGMENT_REQUESTED
        Message.
    label:
      type: string
      minLength: 1
      maxLength: 240
      description: User-visible label for the judgment.
    conclusion:
      type: string
      minLength: 1
      maxLength: 500
      description: User-authored judgment text delivered to the Task Monitor.

TaskMonitorLaunchProvider:
  type: string
  enum:
    - claude
    - codex
    - opencode

TaskMonitorLaunchModel:
  type: string
  minLength: 1

TaskMonitorLaunchMethod:
  type: string
  enum:
    - plan
    - open
    - quick

TaskMonitorReasoningEffort:
  type: string
  enum:
    - none
    - minimal
    - low
    - medium
    - high
    - xhigh
    - max
    - ultra
    - default

TaskMonitorReviewMode:
  type: string
  enum:
    - AGENT_DECIDES
    - REQUIRE_REVIEW

TaskMonitorTerminalSupervisionPolicy:
  type: object
  additionalProperties: false
  required:
    - mode
  properties:
    mode:
      $ref: "#/TaskMonitorReviewMode"

TaskMonitorExecutionNodeLaunchConfiguration:
  type: object
  additionalProperties: false
  required:
    - method
    - provider
    - model
    - reasoningEffort
  properties:
    method:
      $ref: "#/TaskMonitorLaunchMethod"
    provider:
      $ref: "#/TaskMonitorLaunchProvider"
    model:
      $ref: "#/TaskMonitorLaunchModel"
    reasoningEffort:
      $ref: "#/TaskMonitorReasoningEffort"
    fastMode:
      type: boolean
      description: Explicit Fast mode intent for catalog-supported provider/model selections; omit for unsupported selections.

TaskMonitorExecutionPlanNode:
  type: object
  additionalProperties: false
  required:
    - taskId
    - dependsOnTaskIds
    - launchConfiguration
  properties:
    taskId:
      type: string
      format: uuid
    dependsOnTaskIds:
      type: array
      description: Canonical task identities that block this node.
      items:
        type: string
        format: uuid
    launchConfiguration:
      $ref: "#/TaskMonitorExecutionNodeLaunchConfiguration"
    agentSessionId:
      type: string
      format: uuid
      nullable: true

TaskMonitorLaunchPolicy:
  type: object
  additionalProperties: false
  required:
    - terminalSupervision
  properties:
    worktree:
      $ref: "./trigger-payloads.yaml#/StartRunWorktree"
      description: Optional monitor-level worktree request applied to every selected-task launch.
    terminalSupervision:
      $ref: "#/TaskMonitorTerminalSupervisionPolicy"

TaskMonitorExecutionDefinition:
  type: object
  additionalProperties: false
  required:
    - executionPlan
    - launchPolicy
    - cursor
  properties:
    executionPlan:
      type: array
      description: Ordered executable task nodes. Array position is the persisted execution order.
      items:
        $ref: "#/TaskMonitorExecutionPlanNode"
    launchPolicy:
      $ref: "#/TaskMonitorLaunchPolicy"
    cursor:
      type: integer
      minimum: 0

# =============================================
# Work Item Refinement Schema Definitions
# =============================================

WorkItemContentUpdateDto:
  type: object
  description: DTO for updating work item content fields in bulk
  properties:
    sections:
      type: array
      items:
        $ref: "#/WorkItemSectionInput"
      description: Updated content sections using the declared section kind.
    priority:
      $ref: "./common.yaml#/Priority"
      description: Updated priority
    assigneeId:
      $ref: "./common.yaml#/UserId"
      nullable: true
      description: Updated assignee
    requestFeedback:
      type: boolean
      description: Whether to request feedback after update
      default: false
    feedbackContext:
      type: string
      description: Additional context for feedback request

WorkItemAdvanceRequestDto:
  type: object
  required:
    - currentLevel
  properties:
    currentLevel:
      $ref: "./common.yaml#/RefinementLevel"
      description: Current refinement level
    targetLevel:
      $ref: "./common.yaml#/RefinementLevel"
      description: Target refinement level (optional, defaults to next level)
    skipValidation:
      type: boolean
      description: Skip validation checks for advancement
      default: false

# Response DTOs for work item operations

RefineWorkItem200ResponseAllOfData:
  type: object
  required:
    - entityId
    - conversationId
    - workflowId
    - currentLevel
  properties:
    entityId:
      type: string
      format: uuid
      description: ID of the work item
    conversationId:
      type: string
      format: uuid
      description: ID of the refinement conversation
    workflowId:
      type: string
      description: ID of the associated workflow
    currentLevel:
      $ref: "./common.yaml#/RefinementLevel"
      description: Current refinement level

UpdateWorkItemContent200ResponseAllOfDataData:
  type: object
  required:
    - workItem
    - updatedFields
    - feedbackRequested
  properties:
    workItem:
      $ref: "#/UpdateWorkItemContent200ResponseAllOfDataDataWorkItem"
    updatedFields:
      type: array
      items:
        type: string
      description: List of fields that were updated
    feedbackRequested:
      type: boolean
      description: Whether feedback was requested

UpdateWorkItemContent200ResponseAllOfDataDataWorkItem:
  type: object
  description: Updated work item data (union of initiative and task fields)
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    sections:
      type: array
      items:
        $ref: "#/MaterializedWorkItemSection"
    status:
      $ref: "./common.yaml#/WorkStatus"
    priority:
      $ref: "./common.yaml#/Priority"
    assigneeId:
      $ref: "./common.yaml#/UserId"
      nullable: true
    organizationId:
      $ref: "./common.yaml#/OrganizationId"

AdvanceWorkItemLevel200ResponseAllOfData:
  type: object
  required:
    - entityId
    - currentLevel
  properties:
    entityId:
      type: string
      format: uuid
      description: ID of the work item
    currentLevel:
      $ref: "./common.yaml#/RefinementLevel"
      description: New current level after advancement

FinalizeWorkItemRefinement200ResponseAllOfData:
  type: object
  required:
    - success
    - message
    - status
    - entityId
    - currentLevel
  properties:
    success:
      type: boolean
      description: Whether finalization was successful
    message:
      type: string
      description: Success message
    status:
      type: string
      description: Final status of the work item
    entityId:
      type: string
      format: uuid
      description: ID of the work item
    currentLevel:
      $ref: "./common.yaml#/RefinementLevel"
      description: Final refinement level
    metadata:
      type: object
      properties:
        finalizedAt:
          type: string
          format: date-time
        finalStatus:
          $ref: "./common.yaml#/WorkStatus"
# =============================================
# UI Work Item Schema Definitions
# =============================================

WorkItem:
  type: object
  description: Consolidated work item representation used by UI clients
  required:
    - id
    - name
    - createdAt
    - status
    - priority
    - organizationId
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier of the work item
    name:
      type: string
      description: Display name for the work item
    description:
      type: string
      description: Current description content
      nullable: true
    details:
      type: string
      description: Current details content
      nullable: true
    acceptanceCriteria:
      type: string
      description: Current acceptance criteria content
      nullable: true
    status:
      $ref: "common.yaml#/WorkStatus"
    priority:
      $ref: "./common.yaml#/Priority"
    dueDate:
      type: string
      format: date-time
      nullable: true
      description: Due date for the initiative
    tags:
      type: array
      description: Tags applied to the work item
      items:
        type: string
    organizationId:
      $ref: "./common.yaml#/OrganizationId"
      description: Identifier for the owning organization
    createdAt:
      type: string
      format: date-time
      description: Creation date of the work item

WorkItemDetectedChange:
  type: object
  description: Summary of a detected content change
  required:
    - type
    - content
  properties:
    type:
      type: string
      enum: [addition, removal, modification]
      description: Nature of the detected change
    content:
      type: string
      description: The content that changed
    intent:
      type: string
      description: Optional intent classification for the change

WorkItemSystemResponse:
  type: object
  description: System response envelope for refinement operations
  required:
    - updatedWorkItem
    - systemResponse
  properties:
    updatedWorkItem:
      $ref: "#/WorkItem"
    systemResponse:
      type: string
      description: Natural language response produced by the system
    suggestedChanges:
      type: array
      description: Suggested edits generated by the system
      items:
        type: string
    crossWorkItemImpacts:
      type: array
      description: Potential impacts to other work items
      items:
        type: string
    readyForNextLevel:
      type: boolean
      description: Indicates if the work item is ready to advance

WorkItemContentUpdateResponse:
  type: object
  description: Response payload for content update operations
  required:
    - updatedWorkItem
    - detectedChanges
  properties:
    updatedWorkItem:
      $ref: "#/WorkItem"
    systemResponse:
      type: string
      description: Optional system summary of the update
    detectedChanges:
      type: array
      items:
        $ref: "#/WorkItemDetectedChange"
    crossWorkItemImpacts:
      type: array
      description: Potential impacts to other work items
      items:
        type: string

WorkItemDeepenResponse:
  type: object
  description: Response payload for deepen operations
  required:
    - updatedWorkItem
    - systemResponse
    - nextLevelContent
  properties:
    updatedWorkItem:
      $ref: "#/WorkItem"
    systemResponse:
      type: string
      description: Natural language guidance from the system
    nextLevelContent:
      type: string
      description: Generated content for the next refinement level
    crossWorkItemImpacts:
      type: array
      description: Potential impacts to other work items
      items:
        type: string

WorkItemReviewSessionProgress:
  type: object
  description: Progress summary for review sessions
  required:
    - reviewedCount
    - totalCount
    - canFinalize
  properties:
    reviewedCount:
      type: integer
      format: int32
      description: Number of items already reviewed
    totalCount:
      type: integer
      format: int32
      description: Total number of items in the session
    canFinalize:
      type: boolean
      description: Indicates if the session can be finalized

WorkItemReviewResponse:
  type: object
  description: Response payload for review operations
  required:
    - updatedWorkItem
  properties:
    updatedWorkItem:
      $ref: "#/WorkItem"
    sessionProgress:
      $ref: "#/WorkItemReviewSessionProgress"

WorkItemFinalizeResponse:
  type: object
  description: Response payload when finalizing a work item
  required:
    - success
    - finalizedWorkItem
    - message
  properties:
    success:
      type: boolean
      description: Indicates the finalization succeeded
    finalizedWorkItem:
      $ref: "#/WorkItem"
    message:
      type: string
      description: Summary message for the finalization

DiagramKind:
  type: string
  enum: [GENERAL, ARCHITECTURE, PROCESS, DYNAMIC, DEPLOYMENT]
  default: GENERAL

DiagramLevel:
  type: string
  enum: [OVERVIEW, SYSTEM_CONTEXT, CONTAINER, COMPONENT, CODE]
  default: OVERVIEW

DiagramMetadata:
  type: object
  additionalProperties: false
  required: [kind, level]
  not:
    type: object
    required: [kind, level]
    properties:
      kind:
        type: string
        enum: [GENERAL, PROCESS, DYNAMIC, DEPLOYMENT]
      level:
        type: string
        enum: [SYSTEM_CONTEXT, CONTAINER, COMPONENT, CODE]
  description: >
    Semantic diagramMetadata section. Creation persists GENERAL/OVERVIEW when
    omitted. OVERVIEW is valid for every kind; other levels require ARCHITECTURE.
    Independent of layout and authored presentation.
  properties:
    kind:
      $ref: "#/DiagramKind"
    level:
      $ref: "#/DiagramLevel"

DiagramElementRole:
  type: string
  minLength: 1
  pattern: "^[A-Z][A-Z0-9_]*$"
  default: GENERIC
  description: >
    Project-effective governed role key. Canonical roles are GENERIC, PERSON, AGENT,
    SOFTWARE_SYSTEM, CONTAINER, COMPONENT, CODE, DATABASE, UI, PRODUCT,
    DECISION, EXTERNAL_SYSTEM, DIAGRAM_REFERENCE, START and END. START labels the
    trigger entering a depicted process; END labels the outcome terminating one
    depicted path without implying completion of every parallel path. Both are
    optional explicit descriptive markers, may occur multiple times, and are
    never inferred from topology or used as runtime instructions. Extensions require a
    role definition with stable notation in the effective type definition.

DiagramCanonicalReference:
  type: object
  additionalProperties: false
  required: [entityId, entityType]
  description: >
    One canonical target, independent of edges and parentage. TASK identifies
    every work item, including DIAGRAM; DIAGRAM is never an entity category.
    Targets must be accessible, non-archived and in the same organization and
    project, and allowed by the effective element reference policy.
  properties:
    entityId:
      type: string
      format: uuid
    entityType:
      type: string
      enum: [TASK, SERVICE]

DiagramGroupMeaning:
  type: string
  enum: [VISUAL_ASSOCIATION, STRUCTURAL_BOUNDARY, DEPLOYMENT_BOUNDARY]
  description: >
    Declared meaning of a Diagram group. VISUAL_ASSOCIATION is a soft
    proximity preference that layout may relax. STRUCTURAL_BOUNDARY and
    DEPLOYMENT_BOUNDARY are factual containment that layout must preserve.
    None of them implies sequence, ownership, Contract participation, a graph
    relationship, or work-item parentage.

DiagramGroupColor:
  type: string
  enum: [blue, green, orange, purple, red, teal]
  description: Palette identity for Diagram group fills, borders, and titles.

DiagramGroupId:
  type: string
  minLength: 1
  maxLength: 120
  pattern: "^[A-Za-z][A-Za-z0-9_.:-]*$"
  description: Stable diagram-local group identity. Labels are never identity keys.

DiagramGroup:
  type: object
  additionalProperties: false
  required: [id, label, meaning, members]
  description: >
    One named group or boundary on a Diagram. Membership belongs to Diagram
    Element placements, so one canonical entity may appear as several
    placements in different boundaries without changing its own facts.
  properties:
    id:
      $ref: "#/DiagramGroupId"
    label:
      type: string
      minLength: 1
      maxLength: 200
      description: Editable display label communicating what the boundary means.
    meaning:
      $ref: "#/DiagramGroupMeaning"
    color:
      allOf:
        - $ref: "#/DiagramGroupColor"
      description: >
        Optional authored presentation identity. Use the same color for groups
        representing the same thing, independent of group meaning. Omit for
        stable automatic assignment. Color never changes membership, containment,
        layout, canonical references, relationships, or Contract participation.
    parentGroupId:
      allOf:
        - $ref: "#/DiagramGroupId"
      description: >
        Optional enclosing group on the same Diagram. Factual boundaries may
        not nest inside a visual association group.
    members:
      type: array
      description: >
        Diagram Element placements directly inside this group. References use
        the graph-layout node reference union and must resolve to elements of
        the same Diagram; temporary references materialize with their elements.
      items:
        $ref: "#/WorkItemGraphLayoutNodeRef"

DiagramGroupsValue:
  type: object
  additionalProperties: false
  required: [schemaVersion, groups]
  description: >
    Optional type-owned diagramGroups section. Absent or empty means the
    Diagram has no groups. Editing groups never changes saved graphLayout
    positions. An element may sit directly inside at most one factual
    boundary; visual association groups may overlap.
  properties:
    schemaVersion:
      type: string
      enum: [diagram-groups.v1]
      description: Version of the Diagram groups section schema.
    groups:
      type: array
      items:
        $ref: "#/DiagramGroup"

DiagramElementMetadata:
  type: object
  additionalProperties: false
  required: [role]
  description: >
    Semantic diagramElementMetadata section. Creation persists GENERIC when
    omitted. DIAGRAM_REFERENCE requires a TASK target of canonical type
    DIAGRAM, and every DIAGRAM target requires that role. Clearing such a
    reference requires a valid role change in the same reviewed result.
  properties:
    role:
      $ref: "#/DiagramElementRole"
    canonicalReference:
      nullable: true
      allOf:
        - $ref: "#/DiagramCanonicalReference"
