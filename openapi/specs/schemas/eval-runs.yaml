EvalRunStatus:
  type: string
  description: Lifecycle of an eval run as a whole.
  enum: [QUEUED, RUNNING, FINISHED, STOPPED]

EvalAttemptStatus:
  type: string
  description: Lifecycle of one attempt at a case, configuration and repeat.
  enum: [QUEUED, PREPARING, RUNNING, JUDGING, COMPLETED, ERROR, STOPPED]

EvalAttemptStopReason:
  type: string
  description: Why a STOPPED attempt stopped.
  enum: [USER, TIME_LIMIT, TOKEN_LIMIT]

EvalRunSettings:
  type: object
  description: How the run executes. An absent limit means no limit.
  required: [maxConcurrentAttempts]
  additionalProperties: false
  properties:
    maxConcurrentAttempts:
      type: integer
      minimum: 1
      default: 3
    attemptTimeLimitSeconds:
      type: integer
      minimum: 1
    attemptTokenLimit:
      type: integer
      minimum: 1
    repeatsPerAttempt:
      type: integer
      minimum: 1
      maximum: 10
      description: >
        How many separate fresh attempts the run makes for each case and
        configuration. Absent on runs recorded before repeats existed, which
        are read as 1.

EvalMeasurementScope:
  type: string
  description: >
    TARGET_PREPARATION (the Project Assistant research agent, present only
    when research ran) and TARGET_HANDLER (the tested agent) are measured per
    attempt. JUDGE is no longer recorded; stored JUDGE entries are ignored.
    COORDINATOR is measured per run. Scopes are never summed into one another.
  enum: [TARGET_PREPARATION, TARGET_HANDLER, JUDGE, COORDINATOR]

EvalModelSetting:
  type: object
  required: [provider, model]
  properties:
    provider:
      type: string
    model:
      type: string
    reasoningEffort:
      type: string
    handlerConfig:
      $ref: "#/EvalHandlerConfig"

EvalHandlerConfig:
  type: object
  additionalProperties: false
  description: Handler settings recorded with a run setup, shared by every case in the run.
  properties:
    handler:
      allOf:
        - $ref: "#/EvalTargetHandlerKey"
      description: >
        The handler every case in the run executes, in place of the handler
        each case names. `project_assistant` runs Project Assistant research
        alone, ignoring `projectAssistant`. Omission keeps each case's own
        handler. Never edits the cases.
    projectAssistant:
      allOf:
        - $ref: "./coding-sessions.yaml#/ProjectAssistantConfig"
      description: >
        Project Assistant participation for an entity conversation case.
        `enabled: false` is an explicit choice to run without Project
        Assistant; omission keeps the handler's real-use behavior, where it
        runs. Never grants participation a handler does not declare.

EvalTargetHandlerKey:
  type: string
  description: >
    Registry key of a handler an Eval Case or an eval run may execute. Each
    key must be a registered handler the Hey Hey CLI can start directly as the
    first agent; the CLI refuses to start when one is not registered.
  enum:
    - agent_search
    - entity_conversation
    - project_assistant
    - feature_sync_analyze
    - free_form

EvalConsumerHandlerKey:
  type: string
  description: >
    Registry key of a handler whose real Project Assistant policy a Project
    Assistant case runs under. Each key must be a registered handler that
    declares a Project Assistant policy; the Hey Hey CLI tests the list against
    its registry.
  enum:
    - startup_session
    - design_doc_refiner
    - feature_sync_analyze
    - feature_refiner
    - task_refiner
    - plan_shaping_feature_sync_analyze
    - free_form
    - entity_conversation
    - html_css_mockup_revision
    - validation_walkthrough

EvalConfiguration:
  type: object
  description: One model and handler setting a run is repeated across.
  required: [id, target]
  properties:
    id:
      type: string
      format: uuid
    target:
      $ref: "#/EvalModelSetting"
    preparation:
      allOf:
        - $ref: "#/EvalModelSetting"
      description: Distinct preparation setting, present only when it differs from the target.

EvalAssessedOutput:
  type: string
  description: >
    Which output the judge assesses for an attempt. CODE_CHANGES is the
    recorded changes of a coding attempt, not its chat reply.
  enum: [RESEARCH_REPORT, HANDLER_REPLY, CODE_CHANGES]

EvalResolvedExecution:
  type: object
  additionalProperties: false
  description: >
    What one attempt runs, resolved at launch from the run's chosen handler
    (or the case's own) and the Project Assistant setting. Recorded so later
    changes to defaults never rewrite what ran.
  required: [handler, projectAssistantPrepares, assessedOutput]
  properties:
    handler:
      $ref: "#/EvalTargetHandlerKey"
    consumerHandler:
      allOf:
        - $ref: "#/EvalConsumerHandlerKey"
      description: >
        Present exactly when `handler` is `project_assistant`: the handler
        whose real policy Project Assistant runs under.
    projectAssistantPrepares:
      type: boolean
      description: >
        True when Project Assistant runs first and hands its research to
        `handler`. False when `handler` runs alone, and for
        `project_assistant`, which is the research itself.
    assessedOutput:
      $ref: "#/EvalAssessedOutput"

EvalCaseTarget:
  type: object
  description: Recorded case context. Only the inputs and focal entity reach the target; situation and supporting items are reviewer and judge context. Runs recorded before inputs existed carry `initiatingRequest` instead and are read as a one-message list.
  required: [situation, inputs, targetHandler]
  properties:
    situation:
      type: string
      description: Approved case content as recorded at launch.
    focalItemId:
      type: string
      format: uuid
      nullable: true
    focalItemType:
      allOf:
        - $ref: "./run-entity.yaml#/RunEntityReference/properties/entityType"
      description: Canonical entity family of the focal item. Required whenever focalItemId is present; work-item subtypes use TASK.
    supportingItemIds:
      type: array
      items:
        type: string
        format: uuid
    inputs:
      $ref: "#/EvalCaseInputs"
    targetHandler:
      $ref: "#/EvalTargetHandlerKey"
      description: Registry key of the handler under test.
    consumerHandler:
      allOf:
        - $ref: "#/EvalConsumerHandlerKey"
      description: >
        Present exactly when `targetHandler` is `project_assistant`: the real
        handler whose policy, tools and prompt Project Assistant runs under.
        Always explicit; there is no default.

EvalCaseTextMessageInput:
  type: object
  additionalProperties: false
  description: A fixed user message, worded as the user would type it.
  required: [kind, text]
  properties:
    kind:
      type: string
      enum: [text_message]
    text:
      type: string
      minLength: 1
      description: The message text, with any inline entity mentions as written.

EvalCaseInput:
  description: One input of an Eval Case. `kind` selects the member.
  oneOf:
    - $ref: "#/EvalCaseTextMessageInput"
  discriminator:
    propertyName: kind
    mapping:
      text_message: "#/EvalCaseTextMessageInput"

EvalCaseInputs:
  type: object
  additionalProperties: false
  description: >
    Inputs section of an Eval Case: the ordered inputs that start and drive the
    case. Never holds situation, expectations, checks or rubric. Checked at
    authoring, approval and launch, and recorded with each run.
  required: [inputs]
  properties:
    inputs:
      type: array
      minItems: 1
      items:
        $ref: "#/EvalCaseInput"

EvalCheckDefinition:
  type: object
  required: [id, description]
  properties:
    id:
      type: string
    description:
      type: string

EvalRubricDimension:
  type: object
  required: [key, name, description]
  properties:
    key:
      type: string
    name:
      type: string
    description:
      type: string

EvalCaseGrading:
  type: object
  description: For the coordinator and judge only. Never passed to the target.
  required: [checks, rubric]
  properties:
    expectations:
      type: string
      description: Expected and forbidden behavior recorded from the approved case.
    checks:
      type: array
      items:
        $ref: "#/EvalCheckDefinition"
    rubric:
      type: array
      description: Dimensions are data, not an enum.
      items:
        $ref: "#/EvalRubricDimension"

EvalCaseCodingCommit:
  type: object
  additionalProperties: false
  description: The commit a coding attempt starts from.
  required: [sha, shortMessage]
  properties:
    sha:
      type: string
      pattern: "^[0-9a-f]{40}$"
      description: Full 40-character commit SHA.
    shortMessage:
      type: string
      minLength: 1
      description: First line of the commit message, shown for recognition.

EvalCaseMockupChecklistItem:
  type: object
  additionalProperties: false
  description: One observable outcome to check in a Mockup-derived coding attempt.
  required: [id, description]
  properties:
    id:
      type: string
      minLength: 1
      description: Unique within the checklist; the judge answers by this id.
    description:
      type: string
      minLength: 1
      description: The outcome to check, written as observable behavior.

EvalCaseMockupChecklist:
  type: object
  additionalProperties: false
  description: >
    What a coding case built from a Mockup is judged against. For a NEW Mockup
    the items cover every control; for an UPDATE only the parts that changed.
  required: [mockupId, kind, items]
  properties:
    mockupId:
      type: string
      format: uuid
      description: The source Mockup, which must be in the case's project.
    kind:
      type: string
      enum: [NEW, UPDATE]
    items:
      type: array
      minItems: 1
      items:
        $ref: "#/EvalCaseMockupChecklistItem"

EvalCaseCoding:
  type: object
  additionalProperties: false
  description: >
    Coding section of an Eval Case whose handler is `free_form`. For the runner,
    coordinator and judge only; never passed to the target. Valid exactly when
    the case's handler is `free_form`; checked at approval and at launch, and
    recorded with each run.
  required: [serviceId, pinnedCommit]
  properties:
    serviceId:
      $ref: "./common.yaml#/ServiceId"
    pinnedCommit:
      $ref: "#/EvalCaseCodingCommit"
    knownGoodDiff:
      type: string
      minLength: 1
      description: >
        Optional reference for the judge: a change that satisfies the case.
        Never passed to the target.
    knownBadDiff:
      type: string
      minLength: 1
      description: >
        Optional reference for the judge: a change that plausibly looks right
        but fails the case. Never passed to the target.
    mockupChecklist:
      $ref: "#/EvalCaseMockupChecklist"

EvalRunCaseInput:
  type: object
  description: >
    Approved case content and selections recorded when the run was launched.
    No project snapshot is implied; discovery reads the live project.
  required: [id, evalCaseId, title, target, grading]
  properties:
    id:
      type: string
      format: uuid
    evalCaseId:
      type: string
      format: uuid
    title:
      type: string
    target:
      $ref: "#/EvalCaseTarget"
    grading:
      $ref: "#/EvalCaseGrading"
    coding:
      $ref: "#/EvalCaseCoding"

EvalRecordedAttempt:
  type: object
  description: One attempt at a case, configuration and repeat as recorded for the coordinator.
  required:
    [
      attemptId,
      caseInput,
      configuration,
      execution,
      targetSessionId,
      targetConversationId,
    ]
  properties:
    attemptId:
      type: string
      format: uuid
    execution:
      $ref: "#/EvalResolvedExecution"
    targetSessionId:
      type: string
      format: uuid
      description: Agent Session the attempt's target runs and writes under.
    targetConversationId:
      type: string
      format: uuid
      description: Conversation prepared at launch alongside the target session.
    caseInput:
      $ref: "#/EvalRunCaseInput"
    configuration:
      $ref: "#/EvalConfiguration"
    repeat:
      type: integer
      minimum: 1
      maximum: 10
      description: >
        1-based repeat this attempt is, copied from its attempt report. Absent
        when the attempt report has none.

EvalAttemptError:
  type: object
  required: [message]
  properties:
    message:
      type: string
    code:
      type: string

EvalKnownCost:
  type: object
  description: >
    A cost read from the provider's own record. `partial` means only some of
    the attempt's provider sessions could be read, so the amount is a lower bound.
  additionalProperties: false
  required: [state, amount, currency]
  properties:
    state:
      type: string
      enum: [available, partial]
    amount:
      type: number
      minimum: 0
    currency:
      type: string
      enum: [USD]

EvalUnavailableCost:
  type: object
  description: >
    The cost could not be read (unsupported provider such as OpenCode, no
    provider session, or a failed read). Carries no amount so it is never
    mistaken for zero.
  additionalProperties: false
  required: [state]
  properties:
    state:
      type: string
      enum: [unavailable]

EvalCost:
  description: What one measured agent cost, or that its cost is not reported.
  oneOf:
    - $ref: "#/EvalKnownCost"
    - $ref: "#/EvalUnavailableCost"

EvalMeasurement:
  type: object
  description: >
    Every number is optional and absent when the provider did not report it.
    It is never defaulted to 0.
  required: [scope]
  properties:
    scope:
      $ref: "#/EvalMeasurementScope"
    elapsedMs:
      type: integer
      minimum: 0
    inputTokens:
      description: Fresh uncached input tokens; excludes cache reads.
      type: integer
      minimum: 0
    outputTokens:
      type: integer
      minimum: 0
    cacheReadInputTokens:
      description: Input tokens read from cache; absent when unreported.
      type: integer
      minimum: 0
    cacheCreationInputTokens:
      description: Input tokens written to cache; absent when unreported.
      type: integer
      minimum: 0
    toolCalls:
      type: integer
      minimum: 0
    cost:
      $ref: "#/EvalCost"

EvalCheckResult:
  type: object
  required: [checkId, passed]
  properties:
    checkId:
      type: string
    passed:
      type: boolean
    explanation:
      type: string

EvalRecognitionResult:
  type: object
  description: Whether the target recognised that the case called for an update, assessed apart from quality.
  required: [recognized, explanation]
  properties:
    recognized:
      type: boolean
    explanation:
      type: string

EvalQualityDimensionResult:
  type: object
  required: [key, name, explanation]
  properties:
    key:
      type: string
    name:
      type: string
    score:
      type: number
    explanation:
      type: string

EvalAutomatedAssessment:
  type: object
  description: Judge output. Stored apart from human review and never overwritten by it.
  required: [checkResults, recognition, quality, createdAt]
  properties:
    judgeSessionId:
      type: string
      format: uuid
      nullable: true
    checkResults:
      type: array
      items:
        $ref: "#/EvalCheckResult"
    recognition:
      $ref: "#/EvalRecognitionResult"
    quality:
      type: array
      items:
        $ref: "#/EvalQualityDimensionResult"
    checklistResults:
      type: array
      description: >
        Coding attempts with a Mockup checklist only: one answer per checklist
        item, hit or missed, judged from the saved changes.
      items:
        $ref: "#/EvalChecklistResult"
    regressions:
      type: array
      description: >
        Coding attempts for an UPDATE checklist only: what used to work and the
        change now breaks.
      items:
        type: string
    createdAt:
      type: string
      format: date-time

EvalChecklistResult:
  type: object
  required: [itemId, hit, explanation]
  properties:
    itemId:
      type: string
      description: The Mockup checklist item this answers.
    hit:
      type: boolean
    explanation:
      type: string

LaunchEvalRunRequest:
  type: object
  required: [evalCaseIds, configurations, judgeSetup]
  properties:
    name:
      type: string
      minLength: 1
      description: >
        User-chosen name of the run. Absent means the run is shown by a name
        generated from what it recorded. Blank is never stored.
    evalCaseIds:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
    configurations:
      type: array
      minItems: 1
      description: One or more setups.
      items:
        $ref: "#/EvalConfiguration"
    judgeSetup:
      $ref: "#/EvalModelSetting"
    settings:
      type: object
      description: Omitted fields take the EvalRunSettings defaults.
      additionalProperties: false
      properties:
        maxConcurrentAttempts:
          type: integer
          minimum: 1
        attemptTimeLimitSeconds:
          type: integer
          minimum: 1
        attemptTokenLimit:
          type: integer
          minimum: 1
        repeatsPerAttempt:
          type: integer
          minimum: 1
          maximum: 10
          description: Separate fresh attempts per case and configuration. Omitted means 1.

EvalRunReportPayload:
  description: >
    Payload for EVAL_RUN reports. The run report is attached to its Eval and
    records exactly what was run; later edits to the cases do not change it.
    Its attempts are the EVAL_ATTEMPT reports whose parentReportId is this
    report.
  allOf:
    - $ref: "./reports.yaml#/BaseReportPayload"
    - type: object
      required:
        [
          reportType,
          evalId,
          status,
          cases,
          configurations,
          judgeSetup,
          settings,
          coordinatorAgentSessionId,
          coordinatorConversationId,
        ]
      additionalProperties: false
      properties:
        reportType:
          type: string
          enum: [EVAL_RUN]
        summary: {}
        evalId:
          type: string
          format: uuid
        status:
          $ref: "#/EvalRunStatus"
        name:
          type: string
          minLength: 1
          description: >
            User-chosen name of the run. Absent means the run is shown by a name
            generated from what it recorded. Blank is never stored.
        judgeSetup:
          $ref: "#/EvalModelSetting"
        cases:
          type: array
          items:
            $ref: "#/EvalRunCaseInput"
        configurations:
          type: array
          items:
            $ref: "#/EvalConfiguration"
        settings:
          $ref: "#/EvalRunSettings"
        coordinatorMeasurement:
          allOf:
            - $ref: "#/EvalMeasurement"
          description: COORDINATOR-scope usage for the run as a whole. Absent until reported.
        coordinatorAgentSessionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Agent Session prepared at launch for the run's coordinator. The
            app starts it; launch starts no agent.
        coordinatorConversationId:
          type: string
          format: uuid
          nullable: true
          description: Conversation prepared at launch alongside the coordinator session.
        completedAt:
          type: string
          format: date-time
          nullable: true

EvalRecordedFileChange:
  type: object
  additionalProperties: false
  description: One file a coding attempt changed relative to its pinned commit.
  required: [path, status, additions, deletions, patch]
  properties:
    path:
      type: string
    status:
      type: string
      enum: [added, modified, deleted]
    additions:
      type: integer
      minimum: 0
    deletions:
      type: integer
      minimum: 0
    patch:
      type: string
      description: Unified diff of the file.

EvalRecordedChanges:
  type: object
  additionalProperties: false
  description: Everything a coding attempt changed, saved before its workspace was removed.
  required: [files]
  properties:
    files:
      type: array
      items:
        $ref: "#/EvalRecordedFileChange"

EvalRecordedToolCall:
  type: object
  additionalProperties: false
  description: >
    One tool call an attempt's tested agent made. The call's result is never
    kept. Evidence only; never shown to the tested agent or other attempts.
  required: [toolName, origin, truncated]
  properties:
    toolName:
      type: string
    arguments:
      type: string
      description: Serialized arguments the agent passed, cut to a fixed size when large.
    origin:
      type: string
      enum: [RUN_OBSERVED, INTERCEPTED]
      description: >
        RUN_OBSERVED calls come from the Run's retained tool usage. INTERCEPTED
        is reserved for calls the CLI answered itself without performing them.
    agentText:
      type: string
      description: Text the agent wrote with an INTERCEPTED call.
    truncated:
      type: boolean
      description: True when arguments were cut.

EvalRecordedToolCalls:
  type: object
  additionalProperties: false
  description: >
    The tool calls one attempt made, in order. UNAVAILABLE means they could not
    be collected, which is different from COLLECTED with no calls.
  required: [state, calls]
  properties:
    state:
      type: string
      enum: [COLLECTED, UNAVAILABLE]
    calls:
      type: array
      description: Empty when state is UNAVAILABLE.
      items:
        $ref: "#/EvalRecordedToolCall"
    omittedCalls:
      type: integer
      minimum: 1
      description: Number of further calls left out once the list reached its cap.

EvalAttemptTurn:
  type: object
  additionalProperties: false
  description: >
    One scripted message an attempt sent and what came of it, saved as soon as
    the message settles. `index` is the message's position in the case's frozen
    inputs. Evidence only; never shown to the tested agent.
  required: [index, input, state]
  properties:
    index:
      type: integer
      minimum: 0
      description: Position of the message in the frozen inputs, from 0.
    turnId:
      type: string
      description: The Run's Turn that handled the message. Absent until the Turn started.
    input:
      type: string
      description: The exact message text sent.
    state:
      type: string
      enum: [STARTED, COMPLETED, FAILED, STOPPED]
    reply:
      type: string
      description: The agent's reply to this message. Absent when none was produced.
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
    recordedToolCalls:
      allOf:
        - $ref: "#/EvalRecordedToolCalls"
      description: Only the calls made while handling this message.
    measurement:
      allOf:
        - $ref: "#/EvalMeasurement"
      description: >
        Time, tokens and cost attributed to this message. Absent values were
        not reported and are never zero.
    measurementPartial:
      type: boolean
      description: True when some of this message's usage could not be attributed to it alone.

EvalAttemptReportPayload:
  description: >
    Payload for EVAL_ATTEMPT reports, one per case, configuration and repeat. The
    report id is the attempt's identity; parentReportId is the run report.
    Status is updated in place. The attempt's output is whatever its target
    session wrote while the attempt was in flight. The target session is
    referenced by id only and never attached, so deleting the session does
    not delete the attempt.
  allOf:
    - $ref: "./reports.yaml#/BaseReportPayload"
    - type: object
      required: [reportType, caseInputId, configuration, status, measurements]
      additionalProperties: false
      properties:
        reportType:
          type: string
          enum: [EVAL_ATTEMPT]
        summary: {}
        caseInputId:
          type: string
          format: uuid
          description: Id of the EvalRunCaseInput recorded in the run report's cases.
        configuration:
          $ref: "#/EvalConfiguration"
        repeat:
          type: integer
          minimum: 1
          maximum: 10
          description: 1-based repeat this attempt is. Absent on attempts recorded before repeats existed, which are read as repeat 1.
        execution:
          allOf:
            - $ref: "#/EvalResolvedExecution"
          description: Absent on attempts recorded before run-level handler selection existed.
        status:
          $ref: "#/EvalAttemptStatus"
        stopReason:
          allOf:
            - $ref: "#/EvalAttemptStopReason"
          nullable: true
          description: Set only when status is STOPPED.
        error:
          type: object
          allOf:
            - $ref: "#/EvalAttemptError"
          nullable: true
        targetSessionId:
          type: string
          format: uuid
          nullable: true
          description: Agent Session prepared at launch for the attempt's target.
        targetConversationId:
          type: string
          format: uuid
          nullable: true
          description: Conversation prepared at launch alongside the target session.
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        attemptProviderSessionIds:
          type: array
          description: Real provider session ids from the attempt Run history, in observation order.
          items:
            type: string
        judgeProviderSessionId:
          type: string
          description: Real provider session id of the child that judged this attempt. Never a pending placeholder.
        judgeSessionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Agent Session of the judge, recorded as soon as it is created so
            a running judge is already known as an eval session. The finished
            assessment repeats it.
        measurements:
          type: array
          description: At most one each of TARGET_PREPARATION and TARGET_HANDLER. Older attempts may also hold a JUDGE entry, which is never shown.
          items:
            $ref: "#/EvalMeasurement"
        automatedAssessment:
          type: object
          allOf:
            - $ref: "#/EvalAutomatedAssessment"
          nullable: true
        recordedChanges:
          allOf:
            - $ref: "#/EvalRecordedChanges"
          description: Present for coding attempts once their changes were saved.
        recordedToolCalls:
          allOf:
            - $ref: "#/EvalRecordedToolCalls"
          description: >
            The tested agent's own tool calls, without results. Absent on
            attempts recorded before tool calls were kept.
        turns:
          type: array
          description: >
            The scripted messages the attempt started, in order, each saved as
            it settled. Absent on attempts recorded before scripted
            conversations, which ran only their final message.
          items:
            $ref: "#/EvalAttemptTurn"
        judgedTurnIndex:
          type: integer
          minimum: 0
          description: Index of the message the judge assessed. Absent when no final assessment happened.
        judgedOutput:
          type: string
          nullable: true
          description: >
            The exact text the judge was given to assess: the saved research for
            research alone, otherwise the handler's reply. Absent when judging
            never started. The judge runs as an isolated child inside the run's
            coordinator session and has no session of its own, so this is the
            record of what it looked at.

EvalHumanReviewReportPayload:
  description: >
    Payload for EVAL_HUMAN_REVIEW reports. parentReportId is the attempt
    report. Kept apart from the attempt's automated assessment and never
    alters it.
  allOf:
    - $ref: "./reports.yaml#/BaseReportPayload"
    - type: object
      required: [reportType, score, challengeCase]
      additionalProperties: false
      properties:
        reportType:
          type: string
          enum: [EVAL_HUMAN_REVIEW]
        summary: {}
        score:
          type: integer
          minimum: 0
          maximum: 5
        comment:
          type: string
          nullable: true
        challengeCase:
          type: boolean
