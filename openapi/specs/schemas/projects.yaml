# =============================================
# Project Schemas
# =============================================
ProjectExistingWorkIntent:
  type: string
  enum:
    - selected
    - declined
    - unanswered
  description: Existing-work onboarding intent persisted for project setup routing.

ProjectConfig:
  type: object
  additionalProperties: false
  required:
    - version
    - existingWorkIntent
  properties:
    version:
      type: integer
      enum:
        - 1
      description: Version of the Project config envelope.
    existingWorkIntent:
      $ref: "#/ProjectExistingWorkIntent"
    featureNextSteps:
      type: array
      minItems: 1
      maxItems: 4
      items:
        $ref: "#/ProjectFeatureNextStep"
      description: Suggested starting points across the top-level Features generated by feature-discovery onboarding. Absent when no suggestions were saved.
  description: Versioned Project-owned configuration used by post-creation setup routing.

ProjectFeatureNextStepKind:
  type: string
  enum:
    - TASKS
    - MOCKUPS
    - DIAGRAM
  description: The kind of first artifact suggested for a Feature after fleshing it out.

ProjectFeatureNextStep:
  type: object
  additionalProperties: false
  required:
    - featureId
    - kind
    - rationale
    - starterPrompt
  properties:
    featureId:
      type: string
      format: uuid
      description: Top-level Feature materialized by onboarding.
    kind:
      $ref: "#/ProjectFeatureNextStepKind"
    rationale:
      type: string
      description: One-sentence reason the Feature is a good place to start.
    starterPrompt:
      type: string
      minLength: 1
      description: Suggested first conversation prompt for producing the step's kind of work on the Feature.
  description: One suggested starting point for a top-level Feature.

ProjectResponseDto:
  type: object
  required:
    - id
    - name
    - organizationId
    - status
    - maturity
    - currentUserRole
    - hasEstablishedActivity
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/ProjectId"
    name:
      type: string
      description: Name of the project
    description:
      type: string
      nullable: true
      description: Optional description of the project
    config:
      $ref: "#/ProjectConfig"
      description: Optional versioned project configuration. Legacy or invalid values are omitted.
    organizationId:
      $ref: "./common.yaml#/OrganizationId"
    status:
      type: string
      description: Current status of the project
      $ref: "#/ProjectStatus"
    maturity:
      type: string
      description: Manual user-controlled maturity stage of the project. Every project starts Established; independent of status, setup, and activity.
      $ref: "#/ProjectMaturity"
    currentUserRole:
      allOf:
        - $ref: "#/ProjectRole"
      description: The authenticated caller's role in this project, so clients can hide actions that role cannot perform. The server still enforces every role-gated operation.
    hasEstablishedActivity:
      type: boolean
      description: Whether the project has reached 10 lifetime, non-bootstrap work activity events. This provider-owned maturation value is monotonic, stable across project reads, and independent of rolling metrics and organization project count.
    createdBy:
      allOf:
        - $ref: "./common.yaml#/UserId"
      nullable: true
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: Deletion timestamp if project is deleted
    tagRelations:
      type: array
      items:
        $ref: "./artifacts.yaml#/ProjectTag"
      description: Project tag relationships

OrganizationProjectEntitlementUsageDto:
  type: object
  required:
    - projectCount
    - workItemCount
    - observedAt
  properties:
    projectCount:
      type: integer
      minimum: 0
    workItemCount:
      type: integer
      minimum: 0
    observedAt:
      type: string
      format: date-time

OrganizationProjectEntitlementDto:
  type: object
  required:
    - defaultProjectLimit
    - projectLimitOverride
    - projectLimit
    - usage
    - canCreateProject
    - creationUnavailableReason
  properties:
    defaultProjectLimit:
      type: integer
      minimum: 0
      example: 2
    projectLimitOverride:
      type: integer
      minimum: 0
      nullable: true
    projectLimit:
      type: integer
      minimum: 0
    usage:
      $ref: "#/OrganizationProjectEntitlementUsageDto"
    canCreateProject:
      type: boolean
    creationUnavailableReason:
      type: string
      nullable: true
      description: Null when creation is available; otherwise the stable server-authored explanation shown by every project-creation surface.

UpdateOrganizationProjectEntitlementDto:
  type: object
  required:
    - projectLimitOverride
  properties:
    projectLimitOverride:
      type: integer
      minimum: 0
      nullable: true
      description: Organization-specific project limit; null restores the default.

ProjectLimitReachedDto:
  type: object
  required:
    - code
    - message
    - entitlement
  properties:
    code:
      type: string
      enum:
        - ORGANIZATION_PROJECT_LIMIT_REACHED
    message:
      type: string
    entitlement:
      $ref: "#/OrganizationProjectEntitlementDto"

CreateProjectDto:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      description: Name of the project
    description:
      type: string
      nullable: true
      description: Optional description of the project
    config:
      $ref: "#/ProjectConfig"
      description: Optional versioned project configuration.

UpdateProjectDto:
  type: object
  properties:
    maturity:
      type: string
      description: User-selected maturity stage, independent of status, setup, and activity. Omission preserves the saved choice.
      $ref: "#/ProjectMaturity"
    name:
      type: string
      description: Optional new name for the project
    description:
      type: string
      nullable: true
      description: Optional new description for the project
    config:
      $ref: "#/ProjectConfig"
      description: Optional replacement versioned project configuration.
    status:
      $ref: "#/ProjectStatus"
      description: Optional new status for the project

ProjectStatus:
  type: string
  enum:
    - ONBOARDING
    - ACTIVE
    - COMPLETED
    - FAILED
  description: Status of the project
ProjectMaturity:
  type: string
  enum:
    - TAKING_SHAPE
    - ESTABLISHED
  description: Manual maturity stage of the project. TAKING_SHAPE means most context still lives in conversations; ESTABLISHED means the graph holds the recorded context.
ProjectRole:
  type: string
  enum:
    - OWNER
    - ARCHITECT
    - MEMBER
    - VIEWER
  description: Role a user holds within a project

ProjectMemberUserDto:
  type: object
  required:
    - id
    - email
    - name
  properties:
    id:
      $ref: "./common.yaml#/UserId"
    email:
      type: string
      format: email
      description: User email address
    name:
      type: string
      description: Display name

AddProjectMemberDto:
  type: object
  required:
    - userId
    - role
  properties:
    userId:
      $ref: "./common.yaml#/UserId"
    role:
      allOf:
        - $ref: "#/ProjectRole"
      description: Role to assign to the new project member

ProjectMemberResponseDto:
  type: object
  required:
    - id
    - projectId
    - userId
    - role
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Project membership ID
    projectId:
      $ref: "./common.yaml#/ProjectId"
    userId:
      $ref: "./common.yaml#/UserId"
    role:
      $ref: "#/ProjectRole"
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
    user:
      allOf:
        - $ref: "#/ProjectMemberUserDto"
      description: Minimal user details for rendering the members list

PaginatedProjectMembersResponseDto:
  type: object
  required:
    - members
    - pagination
  properties:
    members:
      type: array
      items:
        $ref: "#/ProjectMemberResponseDto"
      description: Project members for the requested page
    pagination:
      $ref: "./initiatives.yaml#/PaginationDto"

ProjectCountsResponseDto:
  type: object
  required:
    - tasks
    - initiatives
    - designDocs
    - agentSessions
    - conversations
    - services
    - plans
  properties:
    tasks:
      type: integer
      description: Number of tasks in the project
    initiatives:
      type: integer
      description: Number of initiatives in the project
    designDocs:
      type: integer
      description: Number of design docs in the project
    agentSessions:
      type: integer
      description: Number of agent sessions in the project
    conversations:
      type: integer
      description: Number of conversations in the project
    services:
      type: integer
      description: Number of services in the project
    plans:
      type: integer
      description: Number of plans in the project

ProjectMetricIdentity:
  type: string
  enum:
    - TASK_CREATED
    - TASK_COMPLETED
    - TASK_VERIFYING
    - BUG_CREATED
    - BUG_COMPLETED
    - BUG_VERIFYING
    - PLAN_CREATED
    - PLAN_COMPLETED
    - PLAN_VERIFYING
    - AGENT_SESSION_CREATED
    - PROJECT_INFO_CREATED
    - PROJECT_INFO_UPDATED
  description: |
    Closed identity for a rolling project metric. Project Info
    creation and update are distinct identities; a creation is never also an
    update. Personal scope omits both Project Info identities; classification
    otherwise remains project-registry owned in every actor scope.

ActivityActorScopeMode:
  type: string
  enum:
    - ORGANIZATION
    - PERSONAL
  description: Whether rolling evidence includes every actor or only one identified user.

OrganizationActivityActorScopeDto:
  type: object
  additionalProperties: false
  required:
    - mode
  properties:
    mode:
      type: string
      enum:
        - ORGANIZATION

PersonalActivityActorScopeDto:
  type: object
  additionalProperties: false
  required:
    - mode
    - userId
  properties:
    mode:
      type: string
      enum:
        - PERSONAL
    userId:
      $ref: "./common.yaml#/UserId"

ActivityActorScopeDto:
  oneOf:
    - $ref: "#/OrganizationActivityActorScopeDto"
    - $ref: "#/PersonalActivityActorScopeDto"
  discriminator:
    propertyName: mode
    mapping:
      ORGANIZATION: "#/OrganizationActivityActorScopeDto"
      PERSONAL: "#/PersonalActivityActorScopeDto"
  description: Exact actor population used for aggregation and matching Activity evidence.

ProjectMetricDto:
  type: object
  additionalProperties: false
  required:
    - metric
    - value
    - activityContinuation
  properties:
    metric:
      $ref: "#/ProjectMetricIdentity"
    value:
      type: integer
      format: int64
      minimum: 0
      description: Exact non-negative count for the metric within the returned window and scope.
    activityContinuation:
      $ref: "./activity-correlation.yaml#/ActivityMetricContinuationDto"

ProjectMetricsResponseDto:
  type: object
  additionalProperties: false
  required:
    - metrics
    - effectiveProjectIds
    - windowStart
    - windowEnd
    - actorScope
  properties:
    metrics:
      type: array
      minItems: 10
      maxItems: 12
      items:
        $ref: "#/ProjectMetricDto"
      description: Deterministically ordered metric results. Organization scope includes every identity; personal scope omits Project Info identities.
    actorScope:
      $ref: "#/ActivityActorScopeDto"
    effectiveProjectIds:
      type: array
      items:
        $ref: "./common.yaml#/ProjectId"
      description: Deduplicated authorized non-deleted project scope used for every metric in this response, in deterministic order.
    windowStart:
      type: string
      format: date-time
      description: Inclusive start of the fixed rolling 24-hour window.
    windowEnd:
      type: string
      format: date-time
      description: Exclusive request-time end of the fixed rolling 24-hour window.
