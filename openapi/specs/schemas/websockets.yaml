# =============================================
# WebSocket Event Schemas - Lightweight Notifications
# =============================================
WebSocketEvent:
  type: object
  required:
    - type
    - timestamp
    - organizationId
  properties:
    type:
      type: string
      description: Event type identifier
    timestamp:
      type: string
      format: date-time
      description: When the event occurred
    organizationId:
      type: string
      description: Associated organization ID
    projectId:
      type: string
      description: Associated project ID (if applicable)
    conversationId:
      type: string
      description: Associated conversation ID (if applicable)
    userId:
      type: string
      description: Associated user ID (if applicable)

WebSocketMessageCreatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - messageId
      properties:
        type:
          type: string
          enum: ["message.created"]
        messageId:
          type: string
          description: ID of the created message

WebSocketMessageUpdatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - messageId
      properties:
        type:
          type: string
          enum: ["message.updated"]
        messageId:
          type: string
          description: ID of the updated message
        changedFields:
          type: array
          items:
            type: string
          description: List of fields that were updated
          example: ["content", "metadata"]

WebSocketMessageRealtimeEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - messageId
        - requestId
        - sequence
        - kind
        - source
        - projectId
        - conversationId
      properties:
        type:
          type: string
          enum: ["message.realtime"]
        messageId:
          type: string
          description: ID of the message receiving realtime updates
        requestId:
          type: string
          description: Request identifier for the realtime stream
        sequence:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic sequence per request/message stream
        kind:
          type: string
          enum:
            - "response.delta"
            - "response.replace"
            - "loading.update"
            - "tool.progress"
            - "run.status"
            - "run.error"
        source:
          type: string
          description: Producer that emitted the realtime event
        payload:
          type: object
          additionalProperties: false
          properties:
            responseDelta:
              type: string
            response:
              type: string
            loadingText:
              type: string
            currentStep:
              type: string
            progress:
              type: number
            status:
              type: string
            toolName:
              type: string
            toolPhase:
              type: string
            error:
              type: string
            metadata:
              type: object
              additionalProperties: true

WebSocketMessageDeletedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - messageId
      properties:
        type:
          type: string
          enum: ["message.deleted"]
        messageId:
          type: string
          description: ID of the deleted message

WebSocketConversationCreatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - projectId
        - conversationId
      properties:
        type:
          type: string
          enum: ["conversation.created"]
        projectId:
          type: string
        conversationId:
          type: string

WebSocketConversationUpdatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - previousVersion
        - newVersion
        - changeType
        - projectId
        - conversationId
      properties:
        type:
          type: string
          enum: ["conversation.updated"]
        previousVersion:
          type: integer
          minimum: 1
          description: Version before the update
          example: 5
        newVersion:
          type: integer
          minimum: 1
          description: Version after the update
          example: 6
        changeType:
          type: string
          enum:
            - "user"
            - "message_added"
            - "message_prepended"
            - "message_deleted"
            - "status_change"
            - "system"
          description: Type of change that triggered the version update
          example: "message_added"
        lastModifiedBy:
          type: string
          description: ID of user who made the change
          example: "user-123"
        changedFields:
          type: array
          items:
            type: string
          description: List of conversation fields that were updated
          example: ["status", "lastActivity"]
        latestMessageId:
          type: string
          description: |
            ID of the most recent message in the conversation. Clients use
            this to no-op (when it matches their cache) or to fetch a delta
            via `GET .../messages?since=<previousLatestMessageId>`.
          example: "msg-7f9e"

WebSocketConversationStatusChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - previousStatus
        - newStatus
        - projectId
        - conversationId
      properties:
        type:
          type: string
          enum: ["conversation.status_changed"]
        previousStatus:
          type: string
          description: Previous conversation status
        newStatus:
          type: string
          description: New conversation status

WebSocketProjectCreatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      properties:
        type:
          type: string
          enum: ["project.created"]

WebSocketProjectUpdatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      properties:
        type:
          type: string
          enum: ["project.updated"]
        changedFields:
          type: array
          items:
            type: string
          description: List of project fields that were updated
          example: ["name", "description", "settings"]

WebSocketProjectStatusChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - previousStatus
        - newStatus
      properties:
        type:
          type: string
          enum: ["project.status_changed"]
        previousStatus:
          type: string
          description: Previous project status
        newStatus:
          type: string
          description: New project status

WebSocketTaskCreatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - taskId
      properties:
        type:
          type: string
          enum: ["task.created"]
        taskId:
          type: string
          description: ID of the task
        initiativeId:
          type: string
          description: ID of the parent initiative (absent for FEATURE tasks)

WebSocketTaskUpdatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - taskId
        - changedBy
      properties:
        type:
          type: string
          enum: ["task.updated"]
        taskId:
          type: string
          description: ID of the task
        initiativeId:
          type: string
          description: ID of the parent initiative (absent for most tasks)
        changedFields:
          type: array
          items:
            type: string
          description: List of task fields that were updated
          example: ["name", "status", "priority"]
        totalFieldsChanged:
          type: integer
          description: Total number of fields that were changed
          example: 3
        changedBy:
          type: object
          properties:
            userId:
              type: string
              description: ID of the user who made the changes
            email:
              type: string
              description: Email of the user who made the changes
            name:
              type: string
              description: Name of the user who made the changes
          description: Information about who made the changes

WebSocketTaskStatusChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - taskId
        - previousStatus
        - newStatus
      properties:
        type:
          type: string
          enum: ["task.status_changed"]
        taskId:
          type: string
          description: ID of the task
        initiativeId:
          type: string
          description: ID of the parent initiative (absent for most tasks)
        previousStatus:
          type: string
          description: Previous task status
        newStatus:
          type: string
          description: New task status

WebSocketInitiativeCreatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - initiativeId
      properties:
        type:
          type: string
          enum: ["initiative.created"]
        initiativeId:
          type: string
          description: ID of the initiative

WebSocketInitiativeUpdatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - initiativeId
        - changedBy
      properties:
        type:
          type: string
          enum: ["initiative.updated"]
        initiativeId:
          type: string
          description: ID of the initiative
        projectId:
          type: string
          description: Active project that triggered the update.
        originatingProjectId:
          type: string
          description: Canonical project captured at initiative creation.
        linkedProjectIds:
          type: array
          items:
            type: string
          description: All projects currently linked to the initiative.
        changedFields:
          type: array
          items:
            type: string
          description: List of initiative fields that were updated
          example: ["name", "status", "priority"]
        totalFieldsChanged:
          type: integer
          description: Total number of fields that were changed
          example: 3
        changedBy:
          type: object
          properties:
            userId:
              type: string
              description: ID of the user who made the changes
            email:
              type: string
              description: Email of the user who made the changes
            name:
              type: string
              description: Name of the user who made the changes
          description: Information about who made the changes

WebSocketInitiativeStatusChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - initiativeId
        - previousStatus
        - newStatus
      properties:
        type:
          type: string
          enum: ["initiative.status_changed"]
        initiativeId:
          type: string
          description: ID of the initiative
        previousStatus:
          type: string
          description: Previous initiative status
        newStatus:
          type: string
          description: New initiative status

WebSocketDesignDocCreatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - designDocId
      properties:
        type:
          type: string
          enum: ["design_doc.created"]
        designDocId:
          type: string
          description: ID of the design doc

WebSocketDesignDocUpdatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - designDocId
        - changedBy
      properties:
        type:
          type: string
          enum: ["design_doc.updated"]
        designDocId:
          type: string
          description: ID of the design doc
        changedFields:
          type: array
          items:
            type: string
          description: List of design doc fields that were updated
          example: ["title", "content", "status"]
        totalFieldsChanged:
          type: integer
          description: Total number of fields that were changed
          example: 3
        changedBy:
          type: object
          properties:
            userId:
              type: string
              description: ID of the user who made the changes
            email:
              type: string
              description: Email of the user who made the changes
            name:
              type: string
              description: Name of the user who made the changes
          description: Information about who made the changes

WebSocketDesignDocStatusChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - designDocId
        - previousStatus
        - newStatus
      properties:
        type:
          type: string
          enum: ["design_doc.status_changed"]
        designDocId:
          type: string
          description: ID of the design doc
        previousStatus:
          type: string
          description: Previous design doc status
        newStatus:
          type: string
          description: New design doc status

WebSocketSystemNotificationEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - $ref: "./notifications.yaml#/NotificationPushEventPayload"
    - type: object
      properties:
        type:
          type: string
          enum: ["system.notification"]
        message:
          type: string
          description: Legacy human-readable message.
        severity:
          type: string
          enum: ["info", "warning", "error"]
          description: Legacy severity hint.

# =============================================
# WebSocket Agent Session Events
# =============================================
WebSocketAgentSessionCreatedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - agentSessionId
      properties:
        type:
          type: string
          enum: ["agent_session.created"]
        agentSessionId:
          type: string
          description: ID of the agent session

WebSocketAgentSessionDeletedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - agentSessionId
      properties:
        type:
          type: string
          enum: ["agent_session.deleted"]
        agentSessionId:
          type: string
          description: ID of the agent session

WebSocketAgentSessionStatusChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - agentSessionId
        - previousStatus
        - newStatus
      properties:
        type:
          type: string
          enum: ["agent_session.status_changed"]
        agentSessionId:
          type: string
          description: ID of the agent session
        previousStatus:
          type: string
          description: Previous agent session status
        newStatus:
          type: string
          description: New agent session status

# =============================================
# WebSocket Proposal Events
# =============================================
WebSocketProposalApprovedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - proposalId
        - targetEntityId
        - targetEntityType
        - action
      properties:
        type:
          type: string
          enum: ["proposal.approved"]
        proposalId:
          type: string
          description: ID of the approved proposal
        targetEntityId:
          type: string
          description: ID of the entity targeted by the proposal
        targetEntityType:
          type: string
          description: Type of the target entity (TASK, DESIGN_DOC)
        action:
          type: string
          description: Proposal action (CREATE, UPDATE, DELETE)
        resultingEntityId:
          type: string
          description: ID of the entity created or modified as a result

WebSocketProposalGroupLifecycleEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - projectId
        - groupId
        - revision
        - changedMemberIds
      properties:
        type:
          type: string
          enum: ["proposal_group.lifecycle"]
        groupId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        changedMemberIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      description: Compact project-scoped invalidation signal for refetching the canonical group

# =============================================
# Agent Session Current State Events
# =============================================
AgentSessionCurrentStateObservation:
  type: object
  additionalProperties: false
  required:
    - agentSessionId
    - currentState
    - observedAt
  properties:
    agentSessionId:
      type: string
      format: uuid
      description: Agent Session identity whose state is being observed.
    currentState:
      $ref: "../schemas/coding-sessions.yaml#/AgentSessionCurrentState"
    observedAt:
      type: string
      format: date-time
      description: Time at which the CLI observed the current state.
  description: >-
    Inbound observation sent by the CLI over the authenticated WebSocket for
    an Agent Session. The CLI supplies only Agent Session identity, current
    state, and observation time; the platform derives authorization, project
    scope, and revision.

WebSocketAgentSessionCurrentStateChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - projectId
        - agentSessionId
        - currentState
        - revision
        - transitionedAt
      properties:
        type:
          type: string
          enum: ["agent_session.current_state_changed"]
        projectId:
          type: string
          format: uuid
          description: Project scope of the Agent Session state projection.
        agentSessionId:
          type: string
          format: uuid
          description: Agent Session identity.
        currentState:
          $ref: "../schemas/coding-sessions.yaml#/AgentSessionCurrentState"
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Monotonic revision ordering complete latest-value entries for this
            Agent Session. Skipped revisions do not imply missing history or
            require a recovery read.
        transitionedAt:
          type: string
          format: date-time
          description: Time at which the current state became effective.
  description: >-
    Project-scoped outbound latest-value projection update. The complete
    entry is applied directly by clients keyed by Agent Session identity.
    Revision orders complete values; skipped numbers do not imply that a
    client must fetch missing history. This behavior is governed by the
    Agent Session realtime cache synchronization boundary.

# =============================================
# Agent Session Context Size Events
# =============================================
AgentSessionContextSizeObservation:
  type: object
  additionalProperties: false
  required:
    - agentSessionId
    - runId
    - providerSessionId
    - totalTokens
    - observedAt
  properties:
    agentSessionId:
      type: string
      format: uuid
      description: Agent Session identity whose context size is being observed.
    runId:
      type: string
      format: uuid
      description: Run whose turn completion produced the reading.
    providerSessionId:
      type: string
      description: Latest provider session of the Run, which the reading describes.
    totalTokens:
      type: integer
      format: int64
      minimum: 0
      description: Full context-window total for the provider session.
    observedAt:
      type: string
      format: date-time
      description: Time at which the CLI took the reading.
    maxTokens:
      type: integer
      format: int64
      minimum: 1
      nullable: true
      description: >-
        Model context window for the provider session. Omitted when the
        provider does not report one.
  description: >-
    Inbound observation sent by the CLI over the authenticated WebSocket when
    a turn completes. The CLI supplies only Agent Session identity and the
    reading; the platform derives authorization and project scope, persists
    the latest value, and relays it to browsers.

WebSocketAgentSessionContextSizeChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - projectId
        - agentSessionId
        - contextSize
      properties:
        type:
          type: string
          enum: ["agent_session.context_size_changed"]
        projectId:
          type: string
          format: uuid
          description: Project scope of the Agent Session.
        agentSessionId:
          type: string
          format: uuid
          description: Agent Session identity.
        contextSize:
          $ref: "../schemas/coding-sessions.yaml#/AgentSessionContextSize"
  description: >-
    Project-scoped outbound latest-value update for an Agent Session's
    context-window size. Clients apply the complete entry keyed by Agent
    Session identity; a newer `observedAt` wins. The canonical Agent Session
    read (`AgentSessionDto.contextSize`) remains authoritative.

# =============================================
# Conversation Phase Events
# =============================================
ConversationPhase:
  type: string
  enum:
    - idle
    - starting
    - gathering_context
    - thinking
    - writing
    - awaiting_approval
    - reviewing
  description: >-
    The current conversation-scoped Run phase. This vocabulary is separate
    from the Agent Session current-state projection.

ConversationPhaseObservation:
  type: object
  additionalProperties: false
  required:
    - conversationId
    - phase
    - observedAt
  properties:
    conversationId:
      type: string
      format: uuid
      description: Conversation whose Run phase is being observed.
    phase:
      $ref: "#/ConversationPhase"
    observedAt:
      type: string
      format: date-time
      description: Time at which the CLI observed the phase.
  description: >-
    Inbound observation sent by the CLI over the authenticated WebSocket. The
    platform derives organization and project scope from the authenticated
    connection and conversation authorization.

WebSocketConversationPhaseChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - projectId
        - conversationId
        - phase
        - revision
        - transitionedAt
      properties:
        type:
          type: string
          enum: ["conversation.phase_changed"]
        projectId:
          type: string
          format: uuid
          description: Project scope of the conversation phase projection.
        conversationId:
          type: string
          format: uuid
          description: Conversation identity.
        phase:
          $ref: "#/ConversationPhase"
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic revision for the complete latest-value entry.
        transitionedAt:
          type: string
          format: date-time
          description: Time at which the phase became effective.
  description: >-
    Conversation-scoped outbound latest-value projection update. Authorized
    room subscribers receive the complete current value and revision.

WebSocketAgentSessionOutputAttentionChangedEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - projectId
        - userId
        - agentSessionId
        - state
        - revision
        - changedAt
      properties:
        type:
          type: string
          enum: ["agent_session.output_attention_changed"]
        projectId:
          type: string
          format: uuid
          description: Project scope of the Agent Session attention projection.
        userId:
          type: string
          format: uuid
          description: Authenticated user scope of the attention projection.
        agentSessionId:
          type: string
          format: uuid
          description: Agent Session identity.
        state:
          $ref: "../schemas/coding-sessions.yaml#/AgentSessionOutputAttentionState"
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic revision for the complete latest-value entry.
        changedAt:
          type: string
          format: date-time
          description: Time at which the attention value became effective.
  description: >-
    User-scoped outbound latest-value projection update. Clients apply the
    complete entry directly by Agent Session identity and revision; it is
    separate from lifecycle current-state events and is delivered only to the
    authenticated user's room.

ProviderIdentityInboundPayload:
  type: object
  required:
    - conversationId
    - agentSessionId
    - providerSessionId
  properties:
    conversationId:
      type: string
      description: Conversation the Run belongs to.
    agentSessionId:
      type: string
      description: The platform AgenticSession this Run is bound to.
    providerSessionId:
      type: string
      description: Provider-side session id surfaced by the SDK at Run start.
    providerConversationId:
      type: string
      nullable: true
      description: >-
        Provider-side conversation id, when the provider has one (Codex).
        Null for providers that expose only a session id (Claude).
  additionalProperties: false
  description: >-
    Inbound frame sent by the CLI over the WebSocket carrying the
    provider-side session and conversation ids for a Run. The CLI is the
    authoritative source of these ids — it holds them the moment it spawns
    the provider. The gateway persists them onto the agent session so any
    device watching the conversation can render the Run without a host
    browser round-tripping them back. This frame is NOT a trigger — it
    carries no signed envelope and never causes the CLI to execute work.

ServiceRepoBinding:
  type: object
  required:
    - serviceId
    - repositoryPath
    - createdAt
    - updatedAt
  properties:
    serviceId:
      type: string
      description: The service this binding maps to
    repositoryPath:
      type: string
      description: Absolute filesystem path to the cloned repository on this machine
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  additionalProperties: false

MachineRepoBindingsInboundPayload:
  type: object
  required:
    - bindings
  properties:
    bindings:
      type: array
      items:
        $ref: "#/ServiceRepoBinding"
  additionalProperties: false
  description: >-
    Inbound frame sent by the CLI over the WebSocket to report its current
    service-to-repository bindings. The gateway caches the full set per machineId
    and fans it out to every socket in the conversation rooms the machine serves.
    This frame is NOT a trigger — it carries no signed envelope.

WebSocketMachineRepoBindingsEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - machineId
        - bindings
      properties:
        type:
          type: string
          enum: ["machine.repo_bindings"]
        machineId:
          type: string
          description: Machine whose repo bindings are being reported
        bindings:
          type: array
          items:
            $ref: "#/ServiceRepoBinding"
  description: >-
    Outbound frame emitted to each `conversation:${id}` room the machine is
    serving whenever its repo bindings change or the machine disconnects
    (bindings will be empty on disconnect). Browsers use it to know which local
    paths back each service so they can open files directly.

# =============================================
# WebSocket Machine Security Event Feed
# =============================================
WebSocketMachineSecurityEventEvent:
  type: object
  required:
    - type
    - timestamp
    - userId
    - machineId
    - event
  properties:
    type:
      type: string
      enum: ["machine_security_event"]
    timestamp:
      type: string
      format: date-time
      description: When the event was recorded.
    userId:
      type: string
      description: >-
        Owner the frame is routed to. Machines are user-scoped (not
        org-scoped), so this frame carries no organizationId and is delivered to
        the `user:${userId}` room.
    machineId:
      $ref: "./common.yaml#/MachineId"
    event:
      $ref: "./machine-security-events.yaml#/MachineSecurityEventDto"
  description: >-
    Display/cache-only frame announcing a newly recorded machine security
    event. Routed to the owning user's `user:${userId}` room so the
    Settings → Machines feed updates within seconds rather than only on poll. It
    carries the full persisted event so the client can prepend it without a
    refetch. This is NOT a trigger frame: it never causes the CLI to execute
    work.

# =============================================
# WebSocket Trigger Frames
# =============================================
# The only websocket frames that cause the CLI to execute work. Each is
# a WebSocketEvent subtype carrying one `envelope` field — the
# server-signed, machine-addressed trigger body. Every other frame in
# this file is a display/cache-only notification and never triggers
# execution.
WebSocketConversationTriggerEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - envelope
      properties:
        type:
          type: string
