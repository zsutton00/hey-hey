# =============================================
# Signed CLI User Settings command envelopes
# =============================================
SignedCliSettingsEnvelope:
  allOf:
    - $ref: "#/SignedEnvelopeFields"
    - type: object
      required:
        - event
      properties:
        event:
          $ref: "#/CliSettingsEnvelopeBody"
  description: >-
    Server-signed envelope wrapping the closed, operation-discriminated Daily
    Session settings command. It is carried by `cli.settings.request` and uses
    the same machine, user, freshness, replay, and signature protections as
    other authenticated CLI frames.

WebSocketCliSettingsRequestEvent:
  allOf:
    - $ref: "#/WebSocketEvent"
    - type: object
      required:
        - envelope
      properties:
        type:
          type: string
          enum: ["cli.settings.request"]
        envelope:
          $ref: "#/SignedCliSettingsEnvelope"
  description: >-
    Machine-addressed, acknowledged request for the project-scoped Daily
    Session settings resource. The CLI acknowledges only after it has verified
    the signed envelope and completed the read or atomic replacement.

CliSettingsDailySessionGetRequest:
  type: object
  required:
    - operation
    - projectId
  properties:
    operation:
      type: string
      enum:
        - daily_session.settings.get
    projectId:
      type: string
      format: uuid
      description: Project whose Daily Session settings are requested.
  additionalProperties: false

CliSettingsDailySessionReplaceRequest:
  type: object
  required:
    - operation
    - projectId
    - expectedPersistenceRevision
    - value
  properties:
    operation:
      type: string
      enum:
        - daily_session.settings.replace
    projectId:
      type: string
      format: uuid
      description: Project whose Daily Session settings are replaced.
    expectedPersistenceRevision:
      type: integer
      minimum: 0
      description: Revision read by the caller before this full replacement.
    value:
      $ref: "../schemas/user-settings.yaml#/DailySessionUserSettingsValueV1"
  additionalProperties: false

CliSettingsRequestDto:
  oneOf:
    - $ref: "#/CliSettingsDailySessionGetRequest"
    - $ref: "#/CliSettingsDailySessionReplaceRequest"
  discriminator:
    propertyName: operation
    mapping:
      daily_session.settings.get: "#/CliSettingsDailySessionGetRequest"
      daily_session.settings.replace: "#/CliSettingsDailySessionReplaceRequest"
  description: >-
    Closed command union for the project-scoped Daily Session settings family.
    Future settings families add explicit operation variants rather than
    widening this command to arbitrary JSON.

CliSettingsDailySessionGetEnvelopeBody:
  type: object
  required:
    - requestId
    - operation
    - projectId
  properties:
    requestId:
      type: string
      format: uuid
      description: Correlation identity minted by the platform.
    operation:
      type: string
      enum:
        - daily_session.settings.get
    projectId:
      type: string
      format: uuid
  additionalProperties: false

CliSettingsDailySessionReplaceEnvelopeBody:
  type: object
  required:
    - requestId
    - operation
    - projectId
    - expectedPersistenceRevision
    - value
  properties:
    requestId:
      type: string
      format: uuid
      description: Correlation identity minted by the platform.
    operation:
      type: string
      enum:
        - daily_session.settings.replace
    projectId:
      type: string
      format: uuid
    expectedPersistenceRevision:
      type: integer
      minimum: 0
    value:
      $ref: "../schemas/user-settings.yaml#/DailySessionUserSettingsValueV1"
  additionalProperties: false

CliSettingsEnvelopeBody:
  oneOf:
    - $ref: "#/CliSettingsDailySessionGetEnvelopeBody"
    - $ref: "#/CliSettingsDailySessionReplaceEnvelopeBody"
  discriminator:
    propertyName: operation
    mapping:
      daily_session.settings.get: "#/CliSettingsDailySessionGetEnvelopeBody"
      daily_session.settings.replace: "#/CliSettingsDailySessionReplaceEnvelopeBody"

CliSettingsErrorCode:
  type: string
  enum:
    - INVALID_REQUEST
    - INVALID_PROJECT_CONTEXT
    - USER_SETTINGS_VALIDATION_FAILED
    - USER_SETTINGS_REVISION_CONFLICT
    - SETTINGS_UNAVAILABLE
    - PERSISTENCE_FAILED
    - MACHINE_NOT_BOUND
    - NO_RECIPIENT
    - TIMEOUT
    - CORRELATION_MISMATCH
    - MALFORMED_ACK

CliSettingsGenericError:
