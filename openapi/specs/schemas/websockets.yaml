# =============================================
# WebSocket Presence Heartbeat
# =============================================
WebSocketHeartbeat:
  type: object
  required:
    - type
  properties:
    type:
      type: string
      enum: ["heartbeat"]
      description: Frame discriminator. Always "heartbeat".
    timestamp:
      type: string
      format: date-time
      description: When the CLI emitted the heartbeat (ISO-8601).
    organizationId:
      type: string
      description: Organization the emitting CLI is connected to.
    clientType:
      type: string
      enum: ["cli", "browser"]
      description: Kind of client emitting the heartbeat. Always "cli" today.
    machineId:
      type: string
      description: >-
        Paired machine identifier the CLI authenticated as. Present for a
        machine connection; the gateway keys on it to refresh that machine's
        durable `lastSeen`. Absent heartbeats only refresh the in-memory
        connection activity.
  description: >-
    Periodic application-level liveness frame emitted by an authenticated CLI
    over its already-open socket (default every 30s). The gateway consumes it to
    refresh the connection's in-memory activity timestamp and, when a machineId
    is present, persist the machine's `lastSeen` so presence reflects a
    maintained signal rather than the one-time authentication snapshot. This is
    NOT a trigger frame — it never causes the CLI to execute work. Field names
    match the shipped CLI exactly (platform-ws.ts).

WebSocketLeaveRoomRequest:
  description: Browser-only departure using a request-specific Socket.IO acknowledgement callback.
  type: object
  additionalProperties: false
  required: [roomType, roomId]
  properties:
    roomType:
      type: string
      enum: [project, conversation, initiative, design_doc, open_items]
    roomId:
      type: string
      minLength: 1

WebSocketLeftSuccessResponse:
  description: Confirms physical departure and removal of delivery bookkeeping before success.
  type: object
  additionalProperties: false
  required: [status, roomType, roomId]
  properties:
    status:
      type: string
      enum: [success]
    roomType:
      type: string
      enum: [project, conversation, initiative, design_doc, open_items]
    roomId:
      type: string
      minLength: 1

WebSocketLeftResponse:
  description: Request-specific acknowledgement of browser departure. Failure never includes requested scope.
  oneOf:
    - $ref: "#/WebSocketLeftSuccessResponse"
    - $ref: "#/WebSocketAccessDeniedResponse"

