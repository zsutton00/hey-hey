      INVALID_PROJECT_CONTEXT: "#/CliSettingsGenericError"
      USER_SETTINGS_VALIDATION_FAILED: "#/CliSettingsValidationError"
      USER_SETTINGS_REVISION_CONFLICT: "#/CliSettingsRevisionConflictError"
      SETTINGS_UNAVAILABLE: "#/CliSettingsGenericError"
      PERSISTENCE_FAILED: "#/CliSettingsGenericError"
      MACHINE_NOT_BOUND: "#/CliSettingsGenericError"
      NO_RECIPIENT: "#/CliSettingsGenericError"
      TIMEOUT: "#/CliSettingsGenericError"
      CORRELATION_MISMATCH: "#/CliSettingsGenericError"
      MALFORMED_ACK: "#/CliSettingsGenericError"

