    category:
      type: string
      enum:
        - flow
    direction:
      $ref: "./agent-edges.yaml#/AgentEdgeDirection"
    actionLabel:
      $ref: "./agent-edges.yaml#/WorkflowEdgeActionLabel"
    reasoning:
      type: string
      nullable: true
    metadata:
      type: object
      additionalProperties: true
      nullable: true

WorkItemConditionalRelationshipCreateOperation:
  type: object
  additionalProperties: false
  required:
    - op
    - ref
    - source
    - target
    - edgeType
    - category
    - direction
    - predicate
  properties:
    op:
      type: string
      enum:
        - relationship.create
    ref:
      $ref: "#/TemporaryRelationshipIdentity"
    source:
      $ref: "#/WorkItemChangeSetIdentity"
    target:
      $ref: "#/WorkItemChangeSetIdentity"
    edgeType:
      type: string
      enum:
        - CONDITIONAL
    category:
      type: string
      enum:
        - flow
    direction:
      $ref: "./agent-edges.yaml#/AgentEdgeDirection"
    predicate:
      $ref: "./agent-edges.yaml#/WorkflowEdgePredicate"
    actionLabel:
      $ref: "./agent-edges.yaml#/WorkflowEdgeActionLabel"
    reasoning:
      type: string
      nullable: true
    metadata:
      type: object
      additionalProperties: true
      nullable: true

WorkItemLoopRelationshipCreateOperation:
  type: object
  additionalProperties: false
  required:
    - op
    - ref
    - source
    - target
    - edgeType
    - category
  properties:
    op:
      type: string
      enum:
        - relationship.create
    ref:
      $ref: "#/TemporaryRelationshipIdentity"
    source:
      $ref: "#/WorkItemChangeSetIdentity"
    target:
      $ref: "#/WorkItemChangeSetIdentity"
    edgeType:
      type: string
      enum:
        - LOOP
    category:
      type: string
      enum:
        - flow
    predicate:
      $ref: "./agent-edges.yaml#/WorkflowEdgePredicate"
    actionLabel:
      $ref: "./agent-edges.yaml#/WorkflowEdgeActionLabel"
    reasoning:
      type: string
      nullable: true
    metadata:
      type: object
      additionalProperties: true
      nullable: true

WorkItemRelationshipCreateOperation:
  oneOf:
    - $ref: "#/WorkItemMetaRelationshipCreateOperation"
    - $ref: "#/WorkItemStandardRelationshipCreateOperation"
    - $ref: "#/WorkItemConditionalRelationshipCreateOperation"
    - $ref: "#/WorkItemLoopRelationshipCreateOperation"
  discriminator:
    propertyName: edgeType
    mapping:
      RELATED_TO: "#/WorkItemMetaRelationshipCreateOperation"
      DEPENDS_ON: "#/WorkItemMetaRelationshipCreateOperation"
      DERIVES_FROM: "#/WorkItemMetaRelationshipCreateOperation"
      SUPERSEDES: "#/WorkItemMetaRelationshipCreateOperation"
      CONTRADICTS: "#/WorkItemMetaRelationshipCreateOperation"
      EVOLVES: "#/WorkItemMetaRelationshipCreateOperation"
      TRACKS: "#/WorkItemMetaRelationshipCreateOperation"
      PROPOSED_TOGETHER: "#/WorkItemMetaRelationshipCreateOperation"
      FULFILLED_BY: "#/WorkItemMetaRelationshipCreateOperation"
      GUARANTEES: "#/WorkItemMetaRelationshipCreateOperation"
      IMPLEMENTS: "#/WorkItemMetaRelationshipCreateOperation"
      CONSUMES: "#/WorkItemMetaRelationshipCreateOperation"
      STANDARD: "#/WorkItemStandardRelationshipCreateOperation"
      CONDITIONAL: "#/WorkItemConditionalRelationshipCreateOperation"
      LOOP: "#/WorkItemLoopRelationshipCreateOperation"

WorkItemRelationshipUpdateOperation:
  type: object
  additionalProperties: false
  required:
    - op
    - ref
  properties:
    op:
      type: string
      enum:
        - relationship.update
    ref:
      $ref: "#/WorkItemChangeSetRelationshipIdentity"
    source:
      $ref: "#/WorkItemChangeSetIdentity"
    sourceEntityType:
      $ref: "./agent-edges.yaml#/AgentEdgeEndpointEntityType"
    target:
      $ref: "#/WorkItemChangeSetIdentity"
    targetEntityType:
