WorkItemLayoutClearOperation:
  type: object
  additionalProperties: false
  required:
    - op
    - root
    - sectionKey
  properties:
    op:
      type: string
      enum:
        - layout.clear
    root:
      $ref: "#/WorkItemChangeSetIdentity"
    sectionKey:
      type: string
      minLength: 1

WorkItemChangeSetOperation:
  oneOf:
    - $ref: "#/WorkItemCreateOperation"
    - $ref: "#/WorkItemUpdateOperation"
    - $ref: "#/WorkItemDeleteOperation"
    - $ref: "#/WorkItemSectionReplaceOperation"
    - $ref: "#/WorkItemSectionClearOperation"
    - $ref: "#/WorkItemRelationshipCreateOperation"
    - $ref: "#/WorkItemRelationshipUpdateOperation"
    - $ref: "#/WorkItemRelationshipDeleteOperation"
    - $ref: "#/WorkItemLayoutReplaceOperation"
    - $ref: "#/WorkItemLayoutClearOperation"
  discriminator:
    propertyName: op
    mapping:
      workItem.create: "#/WorkItemCreateOperation"
      workItem.update: "#/WorkItemUpdateOperation"
      workItem.delete: "#/WorkItemDeleteOperation"
      section.replace: "#/WorkItemSectionReplaceOperation"
      section.clear: "#/WorkItemSectionClearOperation"
      relationship.create: "#/WorkItemRelationshipCreateOperation"
      relationship.update: "#/WorkItemRelationshipUpdateOperation"
      relationship.delete: "#/WorkItemRelationshipDeleteOperation"
      layout.replace: "#/WorkItemLayoutReplaceOperation"
      layout.clear: "#/WorkItemLayoutClearOperation"

WorkItemChangeSetValidationRequest:
  type: object
  additionalProperties: false
  required:
    - root
    - operations
  properties:
    root:
      $ref: "#/WorkItemChangeSetIdentity"
    operations:
      type: array
      items:
        $ref: "#/WorkItemChangeSetOperation"
    layoutBoundary:
      type: array
      description: Complete set of work-item identities expected in the root graph layout boundary.
      items:
        $ref: "#/WorkItemChangeSetLayoutNodeIdentity"

ProjectedWorkItemSection:
  type: object
  additionalProperties: false
  required:
    - key
    - content
  properties:
    key:
      type: string
    content:
      $ref: "#/WorkItemChangeSetSectionValue"

ProjectedWorkItem:
  type: object
  additionalProperties: false
  required:
    - identity
    - label
    - type
    - name
    - sections
    - deleted
  properties:
    identity:
      $ref: "#/WorkItemChangeSetIdentity"
    label:
      type: string
    type:
      $ref: "./work-item-type-definition.yaml#/WorkItemTypeKey"
    name:
      type: string
    parent:
      nullable: true
      $ref: "#/WorkItemChangeSetIdentity"
    status:
      $ref: "./common.yaml#/WorkStatus"
    priority:
      $ref: "./tasks.yaml#/TaskPriority"
    dueDate:
      type: string
      format: date-time
      nullable: true
    assigneeId:
      type: string
      format: uuid
      nullable: true
    tag:
      $ref: "./tasks.yaml#/FeatureTag"
    serviceIds:
      type: array
      uniqueItems: true
      items:
        $ref: "./common.yaml#/ServiceId"
    sections:
      type: array
      items:
        $ref: "#/ProjectedWorkItemSection"
    deleted:
      type: boolean

ProjectedWorkItemRelationship:
  type: object
  additionalProperties: false
  required:
    - identity
    - label
    - source
    - target
    - edgeType
    - deleted
  properties:
    identity:
      $ref: "#/WorkItemChangeSetRelationshipIdentity"
    label:
      type: string
    source:
      $ref: "#/WorkItemChangeSetIdentity"
    sourceEntityType:
      $ref: "./agent-edges.yaml#/AgentEdgeEndpointEntityType"
    target:
      $ref: "#/WorkItemChangeSetIdentity"
    targetEntityType:
      $ref: "./agent-edges.yaml#/AgentEdgeEndpointEntityType"
    edgeType:
      $ref: "./agent-edges.yaml#/AgentEdgeType"
    category:
      $ref: "./agent-edges.yaml#/AgentEdgeCategory"
    direction:
      nullable: true
      $ref: "./agent-edges.yaml#/AgentEdgeDirection"
    predicate:
      type: string
      nullable: true
    actionLabel:
      allOf:
        - $ref: "./agent-edges.yaml#/WorkflowEdgeActionLabel"
      nullable: true
    reasoning:
      type: string
      nullable: true
    metadata:
      type: object
      additionalProperties: true
      nullable: true
    deleted:
      type: boolean

ProjectedWorkItemChangeSetIssue:
  type: object
  additionalProperties: false
  required:
    - field
    - code
    - reason
    - layer
  properties:
    field:
      type: string
    code:
      type: string
    reason:
      type: string
    layer:
      type: string
      enum:
        - structural
        - referential
        - permission
    suggestion:
      type: string
    metadata:
      type: object
      additionalProperties: true
      description: >-
        Machine-readable identities and counts that locate the projected
        topology involved in this finding. Identity values use the same
        existing:/temporary: labels as the projected change-set response.

ProjectedWorkItemChangeSetResponse:
  type: object
  additionalProperties: false
  required:
    - valid
    - projectedRoot
    - children
    - sections
    - incidentRelationships
    - identityLabels
    - issues
    - warnings
  properties:
    valid:
      type: boolean
    projectedRoot:
      nullable: true
      $ref: "#/ProjectedWorkItem"
    children:
      type: array
      items:
        $ref: "#/ProjectedWorkItem"
    sections:
      type: array
      items:
        $ref: "#/ProjectedWorkItemSection"
    incidentRelationships:
      type: array
      items:
        $ref: "#/ProjectedWorkItemRelationship"
    identityLabels:
      type: object
      additionalProperties:
        type: string
    issues:
      type: array
      items:
        $ref: "#/ProjectedWorkItemChangeSetIssue"
    warnings:
      type: array
      items:
        $ref: "#/ProjectedWorkItemChangeSetIssue"

UpdateProposalDto:
  type: object
  properties:
    type:
      $ref: "#/ProposalType"
    action:
      $ref: "#/ProposalAction"
    status:
      $ref: "#/ProposalStatus"
    reviewedReconciliationRevisionId:
      type: string
      format: uuid
      description: Immutable reconciled revision displayed for review. Required when approving reconciled content; further drift requires reconciliation again.
    acknowledgeOutOfDate:
      type: boolean
      deprecated: true
      description: Retained for older clients. Acknowledgement never authorizes application of stale content.
    targetEntityId:
      type: string
      description: >-
        Replacement target identity. For ENTITY_PROMPT_TEMPLATE proposals,
        this remains the stable templateKey returned by the effective-template
        read, never a selector-derived value or revision ID.
    targetEntityType:
      $ref: "#/TargetEntityType"
    title:
      type: string
      nullable: true
      description: >
        Optional caller-supplied title snapshot override (rarely used —
        the server stamps this field at write time on create; updates do
        not refresh it).
    eli5:
      type: string
      minLength: 1
      maxLength: 150
      description: Optional replacement for the proposal-owned explanation while the proposal is in draft.
    updates:
      $ref: "#/ProposalUpdates"
    requestorContext:
      type: object
      additionalProperties: true
    influences:
      type: array
      items:
        $ref: "./artifacts.yaml#/Influence"
      description: >
        Entities that influenced this proposal. Entries supplied here are
        **appended** to the proposal's existing influences — this field is
        not a replacement of the prior list. Optional; omit when the update
        carries no new influence attribution. The canonical user-edit case
        attaches a single entry with `entityType: USER`, `reasonType:
        user_reason`, the editing user's id as `entityId`, and an optional
        free-text `reasoning` string captured at save time. Server-side, the
        `updates` patch and any appended influences are applied atomically
        within the same request — see the PATCH /proposals/{proposalId}
        operation description.
    generatedWithVersion:
      type: string
      description: Model version or tool version used to generate the proposal
    validationSessionId:
      type: string
      format: uuid
      nullable: true
    conversationId:
      type: string
      format: uuid
      nullable: true

RejectProposalDto:
  type: object
  properties:
    reason:
      type: string
      maxLength: 2000
      description: >
        Reason for rejecting the proposal. Optional for CREATE proposals;
        UPDATE and DELETE proposals require a non-blank reason.

RejectionResult:
  type: object
  required:
    - proposal
  properties:
    proposal:
      $ref: "#/ProposalResponseDto"

PaginatedProposalsResponse:
  type: object
  required:
    - data
    - total
    - limit
    - offset
  properties:
    data:
      type: array
      items:
        $ref: "#/ProposalResponseDto"
    total:
      type: integer
    limit:
      type: integer
    offset:
      type: integer
    windowStart:
      type: string
      format: date-time
      description: Inclusive proposal occurrence-time lower bound applied to data and total
    windowEnd:
      type: string
      format: date-time
      description: Exclusive proposal occurrence-time upper bound applied to data and total

RollupProposalReportPayload:
  description: >
    Payload shape for reports with reportType ROLLUP_PROPOSAL.
    Stored in the report's payload JSON field.
  allOf:
    - $ref: "./reports.yaml#/BaseReportPayload"
    - type: object
      required:
        - reportType
        - taskId
        - triggeredBy
        - triggeredAt
        - parentFeatures
        - relatedFeatures
      properties:
        reportType:
          type: string
          enum:
            - ROLLUP_PROPOSAL
        taskId:
          type: string
          format: uuid
          description: ID of the feature task being updated by this rollup
        triggeredBy:
          type: string
          description: User ID or agent ID that triggered the rollup proposal
        triggeredAt:
          type: string
          format: date-time
        parentFeatures:
          type: array
          items:
            type: string
            format: uuid
          description: Proposal IDs for parent feature updates
        relatedFeatures:
          type: array
          items:
            type: string
            format: uuid
          description: Proposal IDs for related feature updates

# =============================================
# Proposal Edge Declaration Schemas
# =============================================
ProposalEdgeType:
  type: string
  enum:
    - DEPENDS_ON
    - BLOCKS
    - RELATED_TO
    - SUPERSEDES
    - DERIVES_FROM
    - CONTRADICTS
    - EVOLVES
    - TRACKS
  description: >
    Relationship type for edges declared on proposals. Values are a
    proposal-scoped subset of the graph-service RelationshipType enum.
    `SUPERSEDES` is declared by the supersede transition: the proposal that
    sets a task's status to `SUPERSEDED` carries the matching `SUPERSEDES`
    edge to the successor task, so the status change and the edge travel
    on one reviewable proposal. `EVOLVES` marks that the source entity
    refines, extends, or iterates on the target entity, which remains
    canonical — distinct from `SUPERSEDES`, where the target is displaced.
    `TRACKS` is reserved for the server-authored declaration produced by a
    compound `CreateWorkItemTracksAttachment`; generic proposal edge inputs
    do not author it directly.

CreateWorkItemTracksAttachment:
  type: object
  additionalProperties: false
  required:
    - sourceEntityId
  properties:
    sourceEntityId:
      type: string
      format: uuid
      description: >
        Existing work-item id that will originate a TRACKS relationship to
        the newly created TASK. The source work-item type is resolved from
        the registry at runtime; it must be configured as a tracking source
        and must allow the new work-item type as a tracking target.
  description: >
    Optional compound attachment for CREATE/TASK proposals. Validation happens
    before proposal persistence, and approval materializes the new work item
    together with a TRACKS relationship from this existing source. Use the
    separate attach-to-goal operation when the target entity already exists.

ProposalEdgeTargetType:
  type: string
  enum:
    - TASK
    - DESIGN_DOC
    - PROPOSAL
  description: >
    Type of entity referenced by a declared proposal edge. `TASK` and
    `DESIGN_DOC` link to an already-materialized entity (the edge is
    created in the graph service immediately on approval). `PROPOSAL`
    references a proposal in the same organization and project. endpointMode
    determines whether proposal identities are retained or resolved on approval.

ProposalEdgeEndpointMode:
  type: string
  enum:
    - ENTITY
    - PROPOSAL
  description: >
    ENTITY (also the behavior when omitted) materializes entity relationships
    on approval, deferring proposal targets until approved. PROPOSAL stores a
    durable source-proposal to target-proposal relationship from authoring and
    requires targetEntityType PROPOSAL. Neither endpoint is replaced by its
    materialized entity. Pending, undecided, rejected, and approved targets
    retain the relationship. This is not an enactment prerequisite.

ProposalEdgeDeclaration:
  type: object
  description: >
    endpointMode PROPOSAL requires targetEntityType PROPOSAL. Graph-shaped
    CREATE/UPDATE proposals may declare deferred ENTITY-mode outer edges only
    to PROPOSAL targets; internal relationships to existing entities belong
    in operations. sourceRef identifies the Diagram or one of its projected
    work items as the edge source. It is only valid for PROPOSAL targets and
    deferred ENTITY mode. When omitted, the proposal root is the source.
  required:
    - targetEntityId
    - targetEntityType
    - edgeType
  properties:
    endpointMode:
      $ref: "#/ProposalEdgeEndpointMode"
    sourceRef:
      $ref: "#/WorkItemChangeSetIdentity"
      description: >
        Optional projected work-item source for a deferred ENTITY-mode edge
        to a PROPOSAL target. Use `{ refType: "temporary", tempId }` for a
        work item created in this change set or `{ refType: "existing", id }`
        for an existing work item in the projected change set. Omit this field
        to source the proposal root. This field is not valid for TASK or
        DESIGN_DOC targets, or for durable endpointMode PROPOSAL links.
    targetEntityId:
      type: string
      format: uuid
      description: >
        ID of the target of the edge. When `targetEntityType` is
        `TASK` or `DESIGN_DOC`, this is the id of an existing entity.
        When `targetEntityType` is `PROPOSAL`, this is the id of a
        proposal in the same organization and project.
    targetEntityType:
      $ref: "#/ProposalEdgeTargetType"
    targetEntityTitle:
      type: string
      nullable: true
      description: >
        Snapshot of the target entity's title at the moment the proposal
        was created. Optional on input — when omitted and `targetEntityType`
        is `TASK` or `DESIGN_DOC`, the server resolves the title from the
        EntityRegistry and stamps it before the row is persisted. For
        `PROPOSAL` targets with endpointMode PROPOSAL, the server snapshots
        the proposal title at authoring. ENTITY-mode proposal targets retain
        their deferred title semantics. The stored
        snapshot intentionally does not auto-update if the target is
        renamed or deleted; the mention link still resolves to the live
        entity for the current name.
    edgeType:
      $ref: "#/ProposalEdgeType"
    description:
      type: string
      description: Human-readable explanation of the relationship
  allOf:
    - not:
        required:
          - sourceRef
        properties:
          targetEntityType:
            enum:
              - TASK
              - DESIGN_DOC
    - not:
        required:
          - sourceRef
        properties:
          endpointMode:
            enum:
              - PROPOSAL

ProposalReconciliationBasis:
  type: object
  additionalProperties: false
  required: [entityType, entityId, version, content]
  properties:
    entityType:
      type: string
      enum: [TASK, DESIGN_DOC, REPORT, SERVICE, AGENT_SESSION, CONVERSATION, WORK_ITEM_TYPE, ENTITY_PROMPT_TEMPLATE, EDGE]
    entityId:
      type: string
    version:
      type: string
      description: Server-owned version of the exact captured content, including section edits.
    content:
      type: object
      additionalProperties: true
      description: Complete canonical content produced by the owning entity adapter; never a client-supplied historical baseline.

ProposalReconciliationRevision:
  type: object
  additionalProperties: false
  required: [id, proposalId, source, bases, proposedResult, intent, createdAt]
  properties:
    id:
      type: string
      format: uuid
    proposalId:
      type: string
      format: uuid
    source:
      type: string
      enum: [AUTHORING, MERGE, AGENT_FIX, MANUAL]
    previousRevisionId:
      type: string
      format: uuid
      nullable: true
    bases:
      type: array
      items:
        $ref: '#/ProposalReconciliationBasis'
    proposedResult:
      type: object
      additionalProperties: true
      description: Complete canonical projected content. Graph change sets are keyed by target identity. Omitted patch fields are preserved from the exact authoring basis.
    intent:
      type: string
      nullable: true
      description: Exact authored explanation or title; null when neither was supplied.
    createdAt:
      type: string
      format: date-time

ProposalReconciliationState:
  type: object
  additionalProperties: false
  required: [status, currentBases, revisions, conflictingPaths, interveningProposals, overlaps]
  properties:
    status:
      type: string
      enum: [NOT_APPLICABLE, CURRENT, RECONCILIATION_REQUIRED, AGENT_FIX_REQUIRED, READY_FOR_REVIEW]
    suggestions:
      type: array
      items:
        $ref: '#/ProposalReconciliationSuggestion'
    futureRevision:
      type: integer
      minimum: 0
      description: Stored future revision used to prepare this context; include as expectedFutureRevision when submitting future reconciliation.
    writtenAt:
      type: string
      format: date-time
      description: >-
        When the change under review was originally written; for a merged replacement,
        when the proposal it reconciles was written.
    interveningProposals:
      type: array
      description: >-
        Proposals approved on the same target after this change was written, oldest first.
        Empty for terminal proposals; approved unapplied futures remain reviewable.
      items:
        $ref: '#/ProposalReconciliationIntervening'
    overlaps:
      type: array
      description: >-
        Fields an intervening change and this proposal both changed in ways that cannot be
        combined automatically. Approval stays unavailable until they are resolved.
      items:
        $ref: '#/ProposalReconciliationOverlap'
    currentBases:
      type: array
      items:
        $ref: '#/ProposalReconciliationBasis'
    revisions:
      type: array
      items:
        $ref: '#/ProposalReconciliationRevision'
    conflictingPaths:
      type: array
      items:
        type: string
    candidateRevisionId:
      type: string
      format: uuid
    replacementGroupId:
      type: string
      format: uuid
    replacementProposalId:
      type: string
      format: uuid

ProposalReconciliationIntervening:
  type: object
  additionalProperties: false
  required: [proposalId, title, approvedById, approvedByName, approvedAt, changedPaths, overlappingPaths, changes]
  properties:
    proposalId: { type: string, format: uuid }
    title: { type: string }
    approvedById: { type: string, nullable: true }
    approvedByName: { type: string, nullable: true }
    approvedAt: { type: string, format: date-time }
    changedPaths:
      type: array
      description: Fields this intervening proposal changed, e.g. `name` or `sections.description`.
      items: { type: string }
    overlappingPaths:
      type: array
      description: Fields of `changedPaths` that overlap this proposal and could not be merged.
      items: { type: string }
    changes:
      type: array
      description: >-
        The intervening proposal's own change per field, from the content it was reviewed
        against to the result it applied. Empty when that record is unavailable.
      items:
        $ref: '#/ProposalReconciliationFieldChange'

ProposalReconciliationFieldChange:
  type: object
  additionalProperties: false
  required: [path]
  properties:
    path: { type: string }
    before: {}
    after: {}

ProposalReconciliationOverlap:
  type: object
  additionalProperties: false
  required: [path, interveningProposalId]
  properties:
    path: { type: string }
    proposedValue:
      description: This proposal's value for the field.
    currentValue:
      description: The field's current value after intervening changes.
    interveningProposalId:
      type: string
      format: uuid
      nullable: true

CreateProposalReconciliationCandidate:
  oneOf:
    - $ref: '#/ProposalReconciliationMergeRequest'
    - $ref: '#/ProposalReconciliationAgentFixRequest'
    - $ref: '#/ProposalReconciliationManualRequest'
    - $ref: '#/ProposalReconciliationSuggestionDecision'

ProposalAgentFixRequest:
  type: object
  additionalProperties: false
  required: [proposalId, organizationId, projectId, agentSessionId, conversationId, payload, createdAt]
  description: >-
    A recorded Agent fix request: the proposal-refiner Agent Session and Conversation
    prepared for one out-of-date proposal, and the exact run input the app must start
    it with. Recording never starts an agent; the app starts it with the user's
    machine and authorization.
  properties:
    proposalId: { type: string, format: uuid }
    organizationId: { type: string, format: uuid }
    projectId: { type: string, format: uuid }
    agentSessionId: { type: string, format: uuid }
    conversationId: { type: string, format: uuid }
    payload:
      $ref: './run-payloads.yaml#/RunCreatePayloadProposalRefiner'
    createdAt: { type: string, format: date-time }

ProposalReconciliationMergeRequest:
  type: object
  additionalProperties: false
  required: [method]
  properties:
    method:
      type: string
      enum: [MERGE]

ProposalReconciliationAgentFixRequest:
  type: object
  additionalProperties: false
  required: [method, proposedResult, expectedCurrentBases]
  properties:
    method:
      type: string
      enum: [AGENT_FIX]
    expectedCandidateRevisionId:
      type: string
      format: uuid
      description: Required for future reconciliation; the exact persisted proposal content revision reviewed by the editor.
    expectedFutureRevision:
      type: integer
      minimum: 0
      description: Required for a future candidate; prevents a stale result replacing a newer reviewed future.
    proposedResult:
      type: object
      additionalProperties: true
      description: Required for Agent fix; admitted through ordinary proposal validation before persistence. Submission never authorizes application.
    expectedCurrentBases:
      type: array
      items:
        $ref: '#/ProposalReconciliationBasis'
      description: The server-issued current bases used to prepare an Agent fix; further drift rejects submission.

ProposalReconciliationManualRequest:
  type: object
  additionalProperties: false
  required: [method, proposedResult, expectedCurrentBases]
  properties:
    method:
      type: string
      enum: [MANUAL]
    expectedCandidateRevisionId:
      type: string
      format: uuid
      description: Required for future reconciliation; the exact persisted proposal content revision reviewed by the editor.
    expectedFutureRevision:
      type: integer
      minimum: 0
      description: Required for a future candidate; prevents a stale result replacing a newer reviewed future.
    proposedResult:
      type: object
      additionalProperties: true
      description: Required for manual resolution; admitted through ordinary proposal validation before persistence. Submission never authorizes application.
    expectedCurrentBases:
      type: array
      items:
        $ref: '#/ProposalReconciliationBasis'
      description: The server-issued current bases used to prepare a manual resolution; further drift rejects submission.

ProposalReconciliationSuggestionDecision:
  type: object
  additionalProperties: false
  required: [method, suggestionId]
  properties:
    method:
      type: string
      enum: [ACCEPT_SUGGESTION, REJECT_SUGGESTION]
    suggestionId:
      type: string
      format: uuid

ProposalReconciliationSuggestion:
  type: object
  additionalProperties: false
  required: [id, proposalId, organizationId, projectId, status, candidateRevisionId, proposedResult, createdAt]
  properties:
    id: { type: string, format: uuid }
    organizationId: { type: string, format: uuid }
    projectId: { type: string, format: uuid }
    proposalId: { type: string, format: uuid }
    status:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, SUPERSEDED, OUT_OF_DATE, RETIRED]
    candidateRevisionId: { type: string, format: uuid }
    proposedResult: { type: object, additionalProperties: true }
    messageId: { type: string, format: uuid }
    legacyProposalId: { type: string, format: uuid }
    createdAt: { type: string, format: date-time }
