    predicate:
      type: string
      nullable: true
    actionLabel:
      allOf:
        - $ref: "./agent-edges.yaml#/WorkflowEdgeActionLabel"
      nullable: true
    reasoning:
      type: string
      nullable: true
    metadata:
      type: object
      additionalProperties: true
      nullable: true

WorkItemRelationshipDeleteOperation:
  type: object
  additionalProperties: false
  required:
