  x-heyhey-prompt-payload:
    $ref: "./trigger-payloads.yaml#/VerifyFeaturePromptPayload"
  required: [promptType, entity, concern, parentAgentSessionId, userMessage]
  properties:
    promptType:
      type: string
      enum:
        - verify_feature
    entity:
      $ref: ./run-entity.yaml#/RunEntityReference
    concern:
      type: string
      minLength: 1
      description: The flagged discrepancy this session investigates, and nothing else.
    parentAgentSessionId:
      type: string
      format: uuid
      description: >
        The session whose conversation, Project Assistant findings and Feature Sync outcome the mode
        reads.
    impactedEntities:
      type: array
      default: []
      description: >
        Possibly impacted entities named by the session that raised the concern, in its order.
        Starting points for the investigation, not its boundary. May be empty; launches from
        suggestions saved before the field existed omit it and read as empty.
      items:
        $ref: ./conversations.yaml#/VerifyImpactedEntityReference
    userMessage:
      type: string
      description: The opening message (or the user's follow-up) for this turn.

