    - $ref: "#/RunCreatePayloadResearch"
    - $ref: "#/RunCreatePayloadRunEval"
    - $ref: "#/RunCreatePayloadQuick"
    - $ref: "#/RunCreatePayloadProjectMode"
    - $ref: "#/RunCreatePayloadDailySession"
    - $ref: "#/RunCreatePayloadProjectReport"
    - $ref: "#/RunCreatePayloadReleaseNotes"
    - $ref: "#/RunCreatePayloadTaskRefiner"
    - $ref: "#/RunCreatePayloadFeatureRefiner"
    - $ref: "#/RunCreatePayloadDesignDocRefiner"
    - $ref: "#/RunCreatePayloadProposalRefiner"
    - $ref: "#/RunCreatePayloadAgentSearch"
    - $ref: "#/RunCreatePayloadReportUpdate"
    - $ref: "#/RunCreatePayloadFeatureTreeConversation"
    - $ref: "#/RunCreatePayloadOpenItemsTriage"
    - $ref: "#/RunCreatePayloadVerifyFeature"
    - $ref: "#/RunCreatePayloadWorkTrackerConnect"
    - $ref: "#/RunCreatePayloadWorkTrackerImport"
    - $ref: "#/RunCreatePayloadRepositoryGrounding"
    - $ref: "#/RunCreatePayloadRepositoryFeatureEnrichment"
    - $ref: "#/RunCreatePayloadRepositoryFirstWork"
    - $ref: "#/RunCreatePayloadFeatureSyncAnalyze"
    - $ref: "#/RunCreatePayloadFeatureSyncIterate"
    - $ref: "#/RunCreatePayloadPlanShapingFeatureSyncAnalyze"
    - $ref: "#/RunCreatePayloadPlanShapingFeatureSyncIterate"
    - $ref: "#/RunCreatePayloadPlanShapingProposedStages"
    - $ref: "#/RunCreatePayloadPlanShapingRefineStage"
    - $ref: "#/RunCreatePayloadPlanShapingVisualPreview"
    - $ref: "#/RunCreatePayloadPlanShapingPhaseBreakdown"
    - $ref: "#/RunCreatePayloadPlanShapingStepReview"
    - $ref: "#/RunCreatePayloadPlanShapingFinalize"
    - $ref: "#/RunCreatePayloadValidationWalkthrough"
    - $ref: "#/RunCreatePayloadSetSplitting"
    - $ref: "#/RunCreatePayloadSessionMonitor"
    - $ref: "#/RunCreatePayloadTaskMonitor"
    - $ref: "#/RunCreatePayloadHtmlCssMockupRevision"
    - $ref: "#/RunCreatePayloadWorkflowKickoff"
  discriminator:
    propertyName: promptType
    mapping:
      startup_session: "#/RunCreatePayloadStartupSession"
      plan_execution: "#/RunCreatePayloadPlanExecution"
      entity_conversation: "#/RunCreatePayloadEntityConversation"
      goal_pm: "#/RunCreatePayloadGoalPm"
      free_form: "#/RunCreatePayloadFreeForm"
      debug: "#/RunCreatePayloadDebug"
      research: "#/RunCreatePayloadResearch"
      run_eval: "#/RunCreatePayloadRunEval"
      quick: "#/RunCreatePayloadQuick"
      project_mode: "#/RunCreatePayloadProjectMode"
      daily_session: "#/RunCreatePayloadDailySession"
      project_report: "#/RunCreatePayloadProjectReport"
      release_notes: "#/RunCreatePayloadReleaseNotes"
      task_refiner: "#/RunCreatePayloadTaskRefiner"
      feature_refiner: "#/RunCreatePayloadFeatureRefiner"
      design_doc_refiner: "#/RunCreatePayloadDesignDocRefiner"
      proposal_refiner: "#/RunCreatePayloadProposalRefiner"
      agent_search: "#/RunCreatePayloadAgentSearch"
      report_update: "#/RunCreatePayloadReportUpdate"
      feature_tree_conversation: "#/RunCreatePayloadFeatureTreeConversation"
      open_items_triage: "#/RunCreatePayloadOpenItemsTriage"
      verify_feature: "#/RunCreatePayloadVerifyFeature"
      work_tracker_connect: "#/RunCreatePayloadWorkTrackerConnect"
      work_tracker_import: "#/RunCreatePayloadWorkTrackerImport"
      repository_grounding: "#/RunCreatePayloadRepositoryGrounding"
      repository_feature_enrichment: "#/RunCreatePayloadRepositoryFeatureEnrichment"
      repository_first_work: "#/RunCreatePayloadRepositoryFirstWork"
      feature_sync_analyze: "#/RunCreatePayloadFeatureSyncAnalyze"
      feature_sync_iterate: "#/RunCreatePayloadFeatureSyncIterate"
      plan_shaping_feature_sync_analyze: "#/RunCreatePayloadPlanShapingFeatureSyncAnalyze"
      plan_shaping_feature_sync_iterate: "#/RunCreatePayloadPlanShapingFeatureSyncIterate"
      plan_shaping_proposed_stages: "#/RunCreatePayloadPlanShapingProposedStages"
      plan_shaping_refine_stage: "#/RunCreatePayloadPlanShapingRefineStage"
      plan_shaping_visual_preview: "#/RunCreatePayloadPlanShapingVisualPreview"
      plan_shaping_phase_breakdown: "#/RunCreatePayloadPlanShapingPhaseBreakdown"
      plan_shaping_step_review: "#/RunCreatePayloadPlanShapingStepReview"
      plan_shaping_finalize: "#/RunCreatePayloadPlanShapingFinalize"
      validation_walkthrough: "#/RunCreatePayloadValidationWalkthrough"
      set_splitting: "#/RunCreatePayloadSetSplitting"
      session_monitor: "#/RunCreatePayloadSessionMonitor"
      task_monitor: "#/RunCreatePayloadTaskMonitor"
      html_css_mockup_revision: "#/RunCreatePayloadHtmlCssMockupRevision"
      workflow_kickoff: "#/RunCreatePayloadWorkflowKickoff"
  description: >
    Discriminated union of every start-run-eligible payload. Carries
    the handler's typed payload alongside the `promptType` literal
    the CLI dispatcher branches on. Variants for the 4 subagent-owned
    handlers (`commit`, `code_review`, `final_assessment`, `implement`)
    and the follow-up-only handler (`coding_freeform`) is
    intentionally absent — they are never entered via start-run, only
    via in-process subagent dispatch or as user-message follow-ups
    against an already-running session.

RunCreatePayloadStartupSession:
  allOf:
    - type: object
      required:
        - promptType
        - entity
      properties:
        promptType:
          type: string
          enum:
            - startup_session
        entity:
          $ref: "./run-entity.yaml#/RunEntityReference"
    - $ref: "./trigger-payloads.yaml#/LocalStartupSessionPromptPayload"

