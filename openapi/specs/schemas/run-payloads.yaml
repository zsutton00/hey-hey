RunCreatePayloadTaskMonitor:
  # Close the complete wire object; a closed allOf constituent rejects the envelope fields.
  type: object
  additionalProperties: false
  x-heyhey-prompt-payload:
    $ref: "./trigger-payloads.yaml#/TaskMonitorPromptPayload"
  required: [promptType, entity, monitorId, cause, correlationId]
  properties:
    promptType:
      type: string
      enum:
        - task_monitor
    entity:
      $ref: ./run-entity.yaml#/RunEntityReference
    monitorId:
      type: string
      format: uuid
    cause:
      $ref: ./trigger-payloads.yaml#/TaskMonitorLifecycleCause
    correlationId:
      type: string
      format: uuid
    coordinatorAttemptId:
      type: string
      format: uuid
      description: Stable committed delivery identity; independent of released Turn correlation.
    correction:
      $ref: ./trigger-payloads.yaml#/TaskMonitorCoordinatorCorrection
    userMessage:
      type: string
      maxLength: 5000
    launchConfig:
