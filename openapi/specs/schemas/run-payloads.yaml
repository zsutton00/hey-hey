# =============================================
# Shared run-payload wire schemas
# Single source of truth for the start-run-eligible
# discriminated payload union carried on both the
# platform start-run envelope (trigger-payloads.yaml)
# and the transport-neutral Agent Bridge runtime contract
# (agent-bridge/openapi.yaml). Flat top-level schema names;
# refs as ./file.yaml#/Name and
# ../agent-bridge/openapi.yaml#/components/schemas/Name for
# the per-handler body payloads owned by the Agent Bridge.
# =============================================

LocalPromptType:
  type: string
  enum:
    - startup_session
    - plan_execution
    - final_assessment
    - verification_plan
    - child_task_updates
    - entity_conversation
    - goal_pm
    - set_splitting
    - free_form
    - debug
    - research
    - run_eval
    - quick
    - daily_session
    - rollup_proposal
    - task_refiner
    - feature_refiner
    - design_doc_refiner
    - proposal_refiner
    - commit
    - agent_search
    - report_update
    - code_review
    - feature_sync_analyze
    - feature_sync_iterate
    - plan_shaping_feature_sync_analyze
    - plan_shaping_feature_sync_iterate
    - plan_shaping_feature_sync_discuss
    - plan_shaping_proposed_stages
    - plan_shaping_refine_stage
    - plan_shaping_visual_preview
    - plan_shaping_phase_breakdown
    - plan_shaping_step_review
    - plan_shaping_finalize
    - implement
    - validation_walkthrough
    - coding_freeform
    - session_message
    - workflow-defined
    - feature_tree_conversation
    - open_items_triage
    - verify_feature
    - work_tracker_connect
    - work_tracker_import
    - repository_grounding
    - repository_feature_enrichment
    - repository_first_work
    - repository_placement
    - session_monitor
    - task_monitor
    - html_css_mockup_revision
    - project_assistant
    - project_mode
    - project_report
    - release_notes
  description: |
    Discriminator for typed prompt payloads.

    `debug` is a debugging-discipline variant of the free-form mode: it
    reuses the free-form payload shape but swaps in a system prompt tuned
    for methodical root-cause investigation. It is explicit-selection-only
    — no workflow node emits it and no terminal fallback resolves to it; a
    user must deliberately choose the debug mode to start a run with it.
    There is deliberately no `coding_debug` follow-up analogue mirroring
    `coding_freeform`: debug-session follow-ups already re-ground through
    the mode-agnostic `coding_freeform` prompt, which re-situates the model
    in the coding-session context regardless of the prior promptType, so a
    debug-specific follow-up prompt would be redundant. Note that the
    `PromptTypeResponseDto` mirror in workflows.yaml is intentionally NOT
    extended with `debug` (it is selection-only, never API-returned), so
    the lockstep rule between that mirror and this enum is not misread as
    requiring the addition there.

    `research` is a read-only investigation variant of the free-form mode:
    it reuses the free-form payload shape but swaps in a system prompt
    tuned for a read-only investigative posture — gathering evidence and
    synthesizing findings without mutating code or entities. Like `debug`,
    it is explicit-selection-only: no workflow node emits it and no
    terminal fallback resolves to it; a user must deliberately choose the
    research mode to start a run with it. There is deliberately no
    `coding_research` follow-up analogue mirroring `coding_freeform`:
    research-session follow-ups already re-ground through the
    mode-agnostic `coding_freeform` prompt, which re-situates the model in
    the coding-session context regardless of the prior promptType, so a
    research-specific follow-up prompt would be redundant. The
    `PromptTypeResponseDto` mirror in workflows.yaml is intentionally NOT
    extended with `research` (it is selection-only, never API-returned),
    so the lockstep rule between that mirror and this enum is not misread
    as requiring the addition there.

    `quick` is a minimal pass-through variant: no graph fetching, no design-doc
    loading, no Project Assistant pass. The user's message is the full prompt; the
    handler applies only a brief coding-context framing. Like `debug` and
    `research`, it is explicit-selection-only — no workflow node emits it and
    no terminal fallback resolves to it. There is no follow-up analogue; quick
    sessions re-ground through the mode-agnostic `coding_freeform` prompt on
    follow-ups. The `PromptTypeResponseDto` mirror in workflows.yaml is
    intentionally NOT extended with `quick` (selection-only, never
    API-returned), and `quick` is NOT added to `PROJECT_ASSISTANT_ELIGIBLE_PROMPT_TYPES`.

    `coding_freeform` is the override-by-construction system prompt for
    coding-session follow-ups. When a user sends a free-form message into
    an active coding session, the message-service edge sets this prompt
    type so the resolver swaps in a fresh, situating system prompt that
    re-grounds the model in the coding-session context — naming the
    session, surfacing the prior promptType as a loose fact, and
    orienting positively toward the user's latest message. This closes
    the empty-prompt re-grounding hole left when a follow-up turn would
    otherwise inherit the previous turn's promptType.

    `workflow-defined` is a wire-level sentinel. The CLI's message-service
    edge resolves it into a concrete prompt type before any runtime code
    runs: `sendMessage` (and the coalesced-drain path) calls the platform's
    `getConversationPromptType` endpoint with the run's `conversationId`
    and substitutes the returned value in place of the sentinel. A null
    response — meaning the conversation has no active workflow node with a
    declared prompt type — is rejected with HTTP 400 before the request
    enters Turn construction. Consumers downstream of the edge (resolver,
    prepare, dispatch queue, Turn lifecycle) therefore never observe the
    sentinel; there is no fallback to the run's persisted value.
    The route's payload-required guard does not apply to this sentinel.

    `plan_shaping_feature_sync_discuss` is a follow-up-only persona for chat
    turns sent while the conversation is parked on the plan-shaping
    feature-sync review gate. Like `coding_freeform`, it is never carried on
    a platform EXTERNAL_AGENT trigger: the message-service edge resolves the
    `workflow-defined` sentinel, sees a `FEATURE_SYNC_REVIEW` gate on the
    `getConversationPromptType` response, and synthesizes this prompt type
    locally with the gate's design doc, plan, and outstanding flagged items.
    Because it is CLI-synthesized and never API-returned, it is deliberately
    NOT added to the `PromptTypeResponseDto.promptType` mirror in
    workflows.yaml (which carries only API-returned prompt types) — the
    lockstep rule between that mirror and this enum does not apply to it. The
    turn has no submission tools, so it cannot post a workflow completion.

    `project_assistant` is an internal-only subagent promptType dispatched
    once per coding Run before the parent agent's first turn. It runs the
    Project Assistant handler as a subagent, emits a `CODING_RESEARCH` report,
    and records a `previousProviderSession` that is prepended to the parent's
    first prompt so the coding agent begins with relevant entity context
    already surfaced. It is never delivered via the platform API and has no
    `RunCreatePayload` entry. The `PromptTypeResponseDto` mirror in
    workflows.yaml is intentionally NOT extended with it.

# =============================================
# Pathless Agent Skill selection and catalog models
# =============================================

AgentSkillProvider:
  type: string
  enum:
    - claude
    - codex
    - opencode

AgentSkillCatalogScope:
  type: string
  enum:
    - user
    - repo
    - system
    - admin

AgentSkillSelection:
  type: object
  required:
    - provider
    - name
    - catalogScope
  properties:
    provider:
      $ref: "#/AgentSkillProvider"
    name:
      type: string
      minLength: 1
      maxLength: 200
      description: Provider-owned Skill name. Host paths are never part of the selection.
    catalogScope:
      $ref: "#/AgentSkillCatalogScope"
  additionalProperties: false

AgentSkillInterfaceMetadata:
  type: object
  properties:
    brandColor:
      type: string
      nullable: true
    defaultPrompt:
      type: string
      nullable: true
    displayName:
      type: string
      nullable: true
    iconLarge:
      type: string
      nullable: true
    iconSmall:
      type: string
      nullable: true
    shortDescription:
      type: string
      nullable: true
  additionalProperties: false

AgentSkillToolDependency:
  type: object
  required:
    - type
    - value
  properties:
    type:
      type: string
    value:
      type: string
    command:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    transport:
      type: string
      nullable: true
    url:
      type: string
      nullable: true
  additionalProperties: false

AgentSkillDependencies:
  type: object
  required:
    - tools
  properties:
    tools:
      type: array
      items:
        $ref: "#/AgentSkillToolDependency"
  additionalProperties: false

AgentSkillCatalogEntry:
  type: object
  required:
    - provider
    - name
    - catalogScope
    - description
    - enabled
  properties:
    provider:
      $ref: "#/AgentSkillProvider"
    name:
      type: string
      minLength: 1
      maxLength: 200
    catalogScope:
      $ref: "#/AgentSkillCatalogScope"
    description:
      type: string
    shortDescription:
      type: string
      nullable: true
    enabled:
      type: boolean
    interface:
      $ref: "#/AgentSkillInterfaceMetadata"
    dependencies:
      $ref: "#/AgentSkillDependencies"
  additionalProperties: false

AgentSkillDiscoveryError:
  type: object
  required:
    - provider
    - message
  properties:
    provider:
      $ref: "#/AgentSkillProvider"
    message:
      type: string
  additionalProperties: false

AgentSkillCatalog:
  type: object
  required:
    - provider
    - skills
    - errors
  properties:
    provider:
      $ref: "#/AgentSkillProvider"
    skills:
      type: array
      items:
        $ref: "#/AgentSkillCatalogEntry"
    errors:
      type: array
      items:
        $ref: "#/AgentSkillDiscoveryError"
  additionalProperties: false

