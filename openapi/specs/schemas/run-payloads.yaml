RunCreatePayloadWorkflowKickoff:
  type: object
  required:
    - promptType
    - userMessage
  additionalProperties: false
  properties:
    promptType:
      type: string
      enum:
        - workflow_kickoff
    entity:
      $ref: "./run-entity.yaml#/RunEntityReference"
      description: >
        Canonical focal entity for an entity-scoped workflow launch. Omit only
        when the workflow is genuinely unscoped. The entity type and id are
        the identity source; callers must not introduce workflow-specific
        identity fields.
    userMessage:
      type: string
      description: >
        The user's launch kickoff text, which may be empty for a supported blank
        startup. The API authors a real USER message
        row from this value before the start-run trigger, ordered ahead of
        the workflow's first turn, so the user's opening text renders before
        the response.
  description: >
    Payload variant for the workflow-orchestrated materialization arm of
    `start-run`. Carries the kickoff text the API needs to author the USER row
    that opens a workflow session (e.g. plan mode) and, when scoped, the same
    canonical `entity` reference used by other start-run payload variants.
    Always paired with `workflowName`; the CLI materializes the Run from this
    payload but does not fire it as a turn. Omitting `entity` is the explicit
    genuinely-unscoped form. The wire form mirrors kickoff-bearing turn-firing
    variants by carrying `userMessage`, keeping kickoff text single-sourced in
    the request payload across both arms.

