      type: array
      items:
        $ref: "#/LocalPromptAdjacentScopeTaskInput"
    evidenceItems:
      type: array
      items:
        $ref: "#/LocalPromptEvidenceItem"

TaskMonitorPlanGuidance:
  type: object
  additionalProperties: false
  required:
    - plan
    - stage
    - step
  properties:
    plan:
      type: object
      additionalProperties: false
      required: [id, title, outcome]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        description: { type: string }
        outcome: { type: string, minLength: 1 }
    designDoc:
      type: object
      additionalProperties: false
      required: [id, title, sections]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        sections:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
    stage:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        description: { type: string }
    step:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        description: { type: string }
LocalStartupSessionPromptPayload:
  type: object
  properties:
    startupInput:
      deprecated: true
      description: >-
        Deprecated compatibility input. Entity-scoped launches load canonical context from the persisted Run entity;
        this field is ignored by the CLI and will be removed in a later schema revision.
      allOf:
        - $ref: "#/LocalPromptStartupInput"
    userMessage:
      type: string
    launchPlanId:
      type: string
      minLength: 1
      description: >
        Plan that the coding-plan turn was launched from, when the
        active task is part of a plan stage. Threaded onto the wire
        payload from the run's contextMetadata so the coding-plan
        prompt can branch on plan-membership pre-prompt without
        re-reading session state. Paired with `launchStepId` — both
        must be present for the planned-task variant of the prompt to
        engage; either field absent yields the free-task variant.
    launchStepId:
      type: string
      minLength: 1
      description: >
        Plan step that the coding-plan turn was launched from. Paired
        with `launchPlanId` to identify which step within the plan
        stage the task is anchored to. Use `launchStageId` (not this
        field) when calling `get_plan_stage` for the stage catch-up
        read.
    launchStageId:
      type: string
      minLength: 1
      description: >
        Plan stage that contains `launchStepId`. Threaded onto the
        wire payload from the run's contextMetadata so the agent can
        call `get_plan_stage(stageId: launchStageId)` directly without
        an extra lookup. Required by the planned-task variant alongside
        `launchPlanId` and `launchStepId`; if any of the three is
        absent the free-task variant runs.
    implementationReadiness:
      description: >-
        The Feature Sync-owned implementation-readiness disposition that
        was checked before this coding session was admitted. The CLI stores
        it in shared session context; CLEAR and DISMISSED permanently satisfy
        this one-time gate for subsequent planning and code-capable work.
      allOf:
        - $ref: "./flows.yaml#/ImplementationReadinessDisposition"

# =============================================
# Start-run envelope payload
# =============================================

StartRunWorktree:
  type: object
  additionalProperties: false
  required:
    - enabled
  properties:
    enabled:
      type: boolean
      enum:
        - true
    branch:
      type: string
      minLength: 1
  description: >
    Worktree materialization request forwarded to the Agent Bridge runtime.

StartRunPromptPayload:
  type: object
  required:
    - model
    - provider
    - contextMetadata
    - agentSessionId
  description: >
    Payload for the start-run envelope variant
    (AgentTriggerStartRun, sentinel promptType=`start_run`). Mirrors the
    fields of the Agent Bridge runtime contract in
    openapi/specs/agent-bridge/openapi.yaml
    that the CLI needs to materialize a Run on the host side. The platform
    start-run producer forwards this payload on the signed envelope so the
    CLI can materialize the Run without re-deriving any field. Carried inside an
    `AgentTriggerStartRun` whose discriminator value is the sentinel
    literal `start_run`.

    Two arms on the signed trigger envelope, distinguished by a
    `handlerPromptType` (turn-firing) vs `workflowName` (materialize-only)
    discriminator — exactly one discriminator is present on any given
    envelope:

    - **`handlerPromptType` + `payload` (turn-firing arm).** The
      non-workflow case. The CLI materializes the Run and immediately
      fires its first turn against `handlerPromptType`, driven by
      `payload`. This is the only arm that drives turn one from the CLI.
    - **`workflowName` (materialize-only arm).** The workflow-orchestrated
      case (e.g. plan mode). `handlerPromptType` is absent. A bind-only launch
      omits `payload`; a kickoff launch carries a `workflow_kickoff` payload
      with the opening user message and optional canonical focal `entity`.
      The CLI materializes the Run and binds `conversationId → runId` but
      fires no turn — the Temporal workflow (already started server-side)
      drives every turn via its own signed SYSTEM triggers. Skipping
      `start_run` entirely for a workflow session would leave no
      `conversationId → runId` binding and the workflow's triggers would be
      dropped as `no_active_run`; the materialize-only arm is how a launch
      turn is suppressed without dropping the envelope.

    On the kickoff form, the API authors the workflow arm's USER opening row
    from `payload.userMessage`, while the same payload supplies the CLI with
    the optional focal `entity` needed for Run materialization. Bind-only
    launches author no kickoff row and carry no payload.

    Independently of the arm discriminator, `triggersAgent` (default `true`)
    governs whether the turn-firing arm actually fires turn one. Setting it
    `false` turns a `handlerPromptType` + `payload` envelope materialize-only:
    the CLI materializes the Run and binds `conversationId → runId` but fires
    no turn. This is the non-workflow way to seed a standing greeting that
    waits for the user — the same launch-turn suppression the `workflowName`
    arm achieves by routing dispatch to a Temporal workflow.
  not:
    anyOf:
      # Exactly one arm discriminator must be present.
      - required:
          - handlerPromptType
          - workflowName
      - allOf:
          - not:
              required:
                - handlerPromptType
          - not:
              required:
                - workflowName
      # The handler arm always carries its first-turn payload.
      - allOf:
          - required:
              - handlerPromptType
          - not:
              required:
                - payload
      # A workflow payload is optional for bind-only launches. When present,
      # it must be the workflow_kickoff variant.
      - allOf:
          - required:
              - workflowName
              - payload
          - properties:
              payload:
                not:
                  $ref: "../agent-bridge/openapi.yaml#/components/schemas/RunCreatePayloadWorkflowKickoff"
  properties:
    runId:
      type: string
      format: uuid
      description: Explicit replacement Run identity; the owning Agent Session is unchanged.
    attachments:
      type: array
      description: Optional file references for a handler launch. The CLI uses an empty list when omitted. Content stays on the host.
      items:
        $ref: "#/RunAttachmentReference"
    stagedBrowserTab:
      description: >
        Shared Browser tab the user opened before the Run existed. The new Run
        adopts it as its selected page and its first Turn is told the user
        opened it and at which URL. Null when none. A reference whose tab no
        longer exists rejects the start with STAGED_BROWSER_TAB_NOT_FOUND
        before the first Turn. Turn-firing arm only.
      allOf:
        - $ref: "#/StagedBrowserTabReference"
      nullable: true
    triggersAgent:
      type: boolean
      default: true
      description: >
        Whether the turn-firing arm fires turn one. Defaults to `true`: a
        `handlerPromptType` + `payload` envelope materializes the Run and
        immediately dispatches its first turn, exactly as before. When
        `false`, the CLI materializes the Run and binds
        `conversationId → runId` but fires no turn even though
        `handlerPromptType`/`payload` are present — the third,
        non-dispatching bootstrap mode, used to seed a standing SYSTEM
        greeting that simply waits for the user's first message. The
        non-workflow analogue of the `workflowName` materialize-only arm.
        Omit (or set `true`) on every existing turn-firing path.
    handlerPromptType:
      type: string
      minLength: 1
      description: >
        The actual `LocalPromptType` routing key from the Agent Bridge
        contract that the CLI should dispatch
        the run against (e.g. `startup_session`, `feature_sync_analyze`,
        `implement`). Distinct from the sentinel `promptType: 'start_run'`
        on the parent trigger envelope. Carried as a plain string because
        the `LocalPromptType` enum is owned by the transport-neutral Agent
        Bridge contract; the CLI narrows this string against its own enum at the
        dispatcher boundary. Present on the turn-firing arm only; absent
        when `workflowName` is set.
    payload:
      allOf:
        - $ref: "../agent-bridge/openapi.yaml#/components/schemas/RunCreatePayload"
      description: >
        Typed prompt payload discriminated by `handlerPromptType`, refs the
        shared `RunCreatePayload` union in ./run-payloads.yaml — the same
        union that the Agent Bridge runtime validates, so the platform
        start-run envelope and CLI execution share one source of truth
        instead of an unconstrained re-validated object.

        Required with `handlerPromptType`, where it drives the first turn.
        Optional with `workflowName`: omitted for a bind-only workflow launch,
        or the `workflow_kickoff` variant for a kickoff launch. The API uses
        `userMessage` to author the opening USER row, and the CLI uses the
        optional canonical `entity` to materialize a scoped Run. Omitting
        `entity` from a kickoff payload represents a genuinely unscoped
        workflow launch.
    workflowName:
      type: string
      minLength: 1
      description: >
        Name of the Temporal workflow that orchestrates this session
        (e.g. `feature-sync`). Present on the materialize-only arm. When set,
        the CLI materializes the Run and binds the conversation but fires
        no first turn — the workflow drives every turn via its own SYSTEM
        triggers. Value-set mirrors the `WorkflowName` enum; carried as a
        plain string for the same independent-generation reason as
        `handlerPromptType`.

        `workflowName` is mutually exclusive with `handlerPromptType`.
        `payload` is absent for bind-only launches or must be the
        `workflow_kickoff` variant. For kickoff launches, the API authors the
        USER opening row from `payload.userMessage`; the CLI uses
        `payload.entity`, when present, as the Run's canonical focal identity.
    model:
      type: string
      minLength: 1
      description: >
        Claude model id the CLI should use for the run (e.g.
        `claude-opus-4-6`, `claude-sonnet-4-6`,
        `claude-haiku-4-5-20251001`). Forwarded verbatim onto
        the Agent Bridge runtime's model field.
    reasoningEffort:
      type: string
      enum:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
        - ultra
        - default
      description: >
        Reasoning-effort level for the run. Value-set mirrors
        the Agent Bridge runtime contract (the source of truth); additions
        there require extending this enum in
        lockstep.
    config:
      allOf:
        - $ref: "./coding-sessions.yaml#/AgentSessionConfig"
      nullable: true
      description: >
        Typed AgentSession launch config forwarded to the CLI. Project Assistant
        proactive behavior and plan-combination aggressiveness are read from
        this persisted config after the Run is materialized; absent config or
        absent flags resolve at the consuming boundary.
    provider:
      type: string
      enum:
        - claude
        - codex
        - opencode
      description: >
        Agent provider the CLI should dispatch against. Value-set mirrors
        the Agent Bridge runtime provider contract (the source of truth);
        additions there require extending this enum in
        lockstep.
    skillSelection:
      $ref: "./run-payloads.yaml#/AgentSkillSelection"
      description: >-
        Optional pathless Skill identity for the first turn. The provider
        resolves it locally from the active Run workspace.
    fastMode:
      type: boolean
      description: >
        Optional provider-neutral Fast mode preference. `true`, `false`, and
        omission are distinct; the provider runner decides how omission applies.
        This field is accepted only when `provider` is `codex` or `claude` and
        carries no provider-native value.
    contextMetadata:
      allOf:
        - $ref: "./run-context.yaml#/RunContextMetadata"
      description: >
        Run context metadata, refs the shared `RunContextMetadata` in
        the Agent Bridge-owned `RunContextMetadata` schema. The CLI
        adopts `agentSessionId` verbatim as the local run's
        `agentic_session_id` and stamps it on the `X-Agent-Session-ID`
        header for every MCP request. Shared so the platform start-run
        envelope and CLI execution validate against one source of truth
        instead of an unconstrained re-validated object.
    serviceIds:
      type: array
      items:
        type: string
        minLength: 1
      description: >
        Set of platform service ids the run executes against. Threaded through
        so the CLI can resolve working directories and scope without extra
        lookups. Optional: coding runs always carry it, but non-coding sessions
        (task / feature refiners, entity conversations) operate on entity text
        rather than a checked-out repo and omit it entirely.
    launchServiceId:
      type: string
      minLength: 1
      description: >
        The service the CLI launches the session against. Required when
        serviceIds is non-empty; must be a member of serviceIds. Threaded
        through so the CLI can resolve the primary working directory without
        an extra lookup. Omit the field rather than sending an empty string.
    worktree:
      $ref: "#/StartRunWorktree"
      description: >
        Worktree materialization request forwarded to the CLI-side
        the Agent Bridge worktree field. Present only when the launch wizard
        enabled worktree creation. `branch` carries the chosen branch name the
        CLI should materialize for each selected service.
    agentSessionId:
      type: string
      minLength: 1
      description: >
        Canonical id of the platform agent session that owns this run.
        Mirrors `contextMetadata.agentSessionId` at the top level for
        symmetry with the context metadata's canonical session id.

RepositoryGroundingPromptPayload:
  $ref: "./repository-grounding.yaml#/RepositoryGroundingRequest"
  description: >-
    Machine-addressed repository-grounding request carried by the existing
    EXTERNAL_AGENT trigger rail. The selected machine resolves its own local
    Service binding; the payload contains no directory path or source body.

RepositoryFeatureEnrichmentPromptPayload:
  $ref: "./repository-grounding.yaml#/RepositoryFeatureEnrichmentRequest"
  description: >-
    Complete-state Feature enrichment request. Every turn carries the latest
    accepted repository analysis snapshot, accepted runtime configuration, and
    all prior answers.

RepositoryFirstWorkPromptPayload:
  $ref: "./repository-grounding.yaml#/RepositoryFirstWorkRequest"
  description: >-
    Complete-state first-work request carried by the EXTERNAL_AGENT trigger
    rail after imported Features are materialized.

RepositoryPlacementPromptPayload:
  $ref: "./repository-grounding.yaml#/RepositoryPlacementRequest"
  description: >-
    Existing-project-only immutable root-placement request carried by the
    external-agent trigger rail.

# =============================================
# User-message follow-up payload
# =============================================

TaskMonitorLifecycleCause:
  type: string
  enum:
    - START
    - PAUSE
    - RESUME
    - STOP
    - JUDGMENT_RESOLVED
    - CONTINUE
    - COMPLETE
    - HALT
  description: >
    Lifecycle cause delivered to the Task Monitor handler through the signed
    start-run or user-message dispatch rail.

TaskMonitorLaunchConfig:
  type: object
  additionalProperties: false
  required:
    - taskId
    - method
    - provider
    - model
    - reasoningEffort
  properties:
    taskId:
      type: string
      format: uuid
    method:
      $ref: "./work-items.yaml#/TaskMonitorLaunchMethod"
    provider:
      $ref: "./work-items.yaml#/TaskMonitorLaunchProvider"
    model:
      $ref: "./work-items.yaml#/TaskMonitorLaunchModel"
    reasoningEffort:
      $ref: "./work-items.yaml#/TaskMonitorReasoningEffort"
    fastMode:
      type: boolean
      description: Immutable catalog-supported Fast mode intent copied from the persisted cursor node; omit for unsupported selections.
    worktree:
      $ref: "#/StartRunWorktree"
      description: Optional monitor-level worktree materialization request included in the immutable launch snapshot.

TaskMonitorPromptPayload:
  type: object
  additionalProperties: false
  required:
    - monitorId
    - cause
    - correlationId
  properties:
    monitorId:
      type: string
      format: uuid
    cause:
      $ref: "#/TaskMonitorLifecycleCause"
    correlationId:
      type: string
      format: uuid
    coordinatorAttemptId:
      type: string
      format: uuid
      description: Stable committed delivery identity; independent of released Turn correlation.
    correction:
      $ref: "#/TaskMonitorCoordinatorCorrection"
    userMessage:
      type: string
      maxLength: 5000
    launchConfig:
      $ref: "#/TaskMonitorLaunchConfig"
    judgment:
      $ref: "./work-items.yaml#/TaskMonitorJudgmentResponse"
    settledTurn:
      $ref: "#/SessionMonitorSettledTurnEvidence"
      description: >
        Canonical settled-Turn evidence supplied for CONTINUE. The
        correlationId is the same stable turnId; Reports are optional evidence
        references and never select Task Monitor admission.
  description: >
    Complete typed Task Monitor lifecycle input. The UI authors this payload on
    the platform API; the API preserves it inside the signed CLI dispatch
    envelope. It is never posted to a browser-local CLI endpoint.

UserMessageAdmittedServiceScope:
  type: object
  required:
    - serviceIds
    - launchServiceId
  additionalProperties: false
  description: >-
    Complete ordered Service scope admitted by the authenticated USER-message
    operation. The first Service becomes launchServiceId when the Agent Session
    had no launch anchor; an existing anchor is preserved. The CLI reconciles
    this durable grant into Run-owned workspace authority before the next Turn.
    A non-null launchServiceId is a member of serviceIds.
  properties:
    serviceIds:
      type: array
      items:
        type: string
        format: uuid
    launchServiceId:
      type: string
      format: uuid
      nullable: true

UserMessageFeatureSyncIterateContext:
  type: object
  additionalProperties: false
  required:
    - discrepancies
  description: >
    The feature-sync iterate fields copied from the active flow context for
    a follow-up turn. The handler is selected by the enclosing
    `handlerPromptType`; its outstanding discrepancies are passed through in
    their existing order. An empty array means the flow explicitly has no
    outstanding discrepancies.
  properties:
    discrepancies:
      type: array
      items:
        $ref: "#/FeatureSyncDiscrepancy"

UserMessagePlanShapingFeatureSyncIterateContext:
  type: object
  additionalProperties: false
  required:
    - discrepancies
    - decisions
  description: >
    The plan-shaping feature-sync iterate fields copied from the active flow
    context for a follow-up turn. The handler is selected by the enclosing
    `handlerPromptType`; outstanding discrepancies remain in their existing
    order and every explicit decision is preserved. Empty arrays are valid
    when the flow explicitly has no findings or pending choices.
  properties:
    discrepancies:
      type: array
      items:
        $ref: "#/FeatureSyncDiscrepancy"
    decisions:
      type: array
      items:
        $ref: "./conversations.yaml#/PlanShapingFeatureSyncItemDecision"

UserMessagePromptPayload:
  type: object
  required:
    - handlerPromptType
    - userMessage
    - attachments
  description: >
    Payload for the user-message follow-up variant
    (AgentTriggerUserMessage, sentinel promptType=`user_message`). Carried
    on the SYSTEM trigger emitted when a USER message lands on a
    conversation with an active AgentSession binding. The CLI dispatcher
    routes off `handlerPromptType` (the actual LocalPromptType routing
    key) rather than the sentinel `user_message` discriminator, and
    forwards `userMessage` as the user's text body on the resulting
    Agent Bridge prompt operation. Most follow-ups use the already-loaded
    CLI run state; feature-sync iterate follow-ups also carry their typed
    outstanding-item context so prompt reconstruction never depends on a
    provider session retaining its original startup payload.
  properties:
    handlerPromptType:
      type: string
      minLength: 1
      description: >
        The actual LocalPromptType routing key from the Agent Bridge
        contract that the CLI should dispatch
        the follow-up turn against (e.g. `feature_sync_analyze`,
        `feature_tree_conversation`, `implement`). The API resolves it
        from the conversation's current node via
        `FlowExecutionService.resolveConversationPromptType` so the
        follow-up turn lands on the same handler the conversation is
        already paused on. Carried as a plain string because the
        LocalPromptType enum is owned by the transport-neutral Agent Bridge
        contract; the CLI narrows
        this string against its own enum at the dispatcher boundary.
    userMessage:
      type: string
      description: >
        Plain-text body of the USER message this trigger follows up on.
        Extracted server-side via `UserMessageExtractor.extractContent`
        so the field matches whatever the rest of the engine treats as
        the user's text content (the extractor tries `message → comment
        → feedback → message-keyword fields → first non-empty string`).
    attachments:
      type: array
      items:
        $ref: "#/RunAttachmentReference"
      description: >
        Files the user attached to this USER message, copied from
        `UserMessageData.attachments`; empty when none. The CLI resolves
        each reference to the file it stored for this Run and sends its contents
        as separate provider input without changing userMessage. Supported files
        are UTF-8 text/code files and PNG, JPEG or WebP images. Unsupported
        formats are rejected; an unresolvable reference rejects the message.
    skillSelection:
      $ref: "./run-payloads.yaml#/AgentSkillSelection"
      description: >
        Optional pathless Skill identity for this follow-up turn. The
        provider resolves it locally from the active Run workspace.
    taskMonitorPayload:
      $ref: "#/TaskMonitorPromptPayload"
      description: >
        Typed Task Monitor fields preserved from UserMessageData.agentInput
        when handlerPromptType is task_monitor. Absent for every other handler.
    featureSyncContext:
      oneOf:
        - $ref: "#/UserMessageFeatureSyncIterateContext"
        - $ref: "#/UserMessagePlanShapingFeatureSyncIterateContext"
      description: >
        Typed iterate context preserved from UserMessageData.agentInput for
        feature_sync_iterate and plan_shaping_feature_sync_iterate follow-ups.
        Required for those two handlerPromptType values and absent otherwise.
    runtime:
      $ref: "./conversations.yaml#/ImplementRuntimeSelection"
      description: >
        The provider, model, reasoning effort and Fast mode the user picked for
        this one `commit` or `code_review` follow-up, preserved from
        UserMessageData.agentInput. The sub-agent for that Turn runs on exactly
        this selection and the Run's stored runtime is left unchanged; an
        omitted `reasoningEffort` or `fastMode` is not filled from the Run.
        Absent when the user made no selection, in which case the sub-agent
        uses the Run's current settings. Valid only for those two
        handlerPromptType values.

StagedBrowserTabReference:
  type: object
  additionalProperties: false
  required: [stagedTabId]
  description: >
    Reference to a Shared Browser tab opened through the CLI loopback
    pre-Run open-browser endpoint, owned by no Run until a start-run adopts
    it. Carries only the identity returned at open.
  properties:
    stagedTabId:
      type: string
      format: uuid

RunAttachmentReference:
  type: object
  additionalProperties: false
  required: [attachmentId, fileName]
  description: >
    Reference to a file uploaded to a Run through the CLI loopback
    attachment endpoint. Carries only the identity returned at upload,
    never file bytes.
  properties:
    attachmentId:
      type: string
      format: uuid
    fileName:
      type: string
      minLength: 1

TaskMonitorCoordinatorValidationFailure:
  type: object
  additionalProperties: false
  required: [code, message, issues]
  properties:
    code:
      type: string
    message:
      type: string
    issues:
      type: array
      items:
        type: string

TaskMonitorCoordinatorCorrection:
  type: object
  additionalProperties: false
  required: [attempt, validationFailure]
  properties:
    attempt:
      type: integer
      minimum: 1
      maximum: 2
    validationFailure:
      $ref: "#/TaskMonitorCoordinatorValidationFailure"
