      $ref: "./run-entity.yaml#/RunEntityReference"
    designDoc:
      $ref: "#/LocalPromptDesignDocInput"
    plan:
      $ref: "#/LocalPromptPlanInput"
    planGuidance:
      $ref: "#/TaskMonitorPlanGuidance"
