# Additional Flow System Types
ConversationEntry:
  type: object
  required:
    - type
    - message
    - timestamp
  properties:
    type:
      type: string
      enum: [user, system, assistant]
      description: The type of conversation entry
    message:
      type: string
      description: The message content
    timestamp:
      type: string
