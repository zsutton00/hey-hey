# =============================================
# Standard Response Schemas
# =============================================
ApiResponse:
  type: object
  required:
    - success
    - message
    - timestamp
    - statusCode
  properties:
    success:
      type: boolean
      description: Indicates if the request was successful
      example: true
    message:
      type: string
      description: Human-readable message about the operation
      example: "Request processed successfully"
    data:
      description: Response data (type varies by endpoint)
    timestamp:
      type: string
      format: date-time
      description: ISO timestamp of when the response was generated
      example: "2023-12-01T12:00:00.000Z"
    statusCode:
      type: integer
      description: HTTP status code
      example: 200
    path:
      type: string
      description: Request path
      example: "/api/v1/projects"

ApiErrorResponse:
  type: object
  required:
    - success
    - message
    - timestamp
    - statusCode
  properties:
    success:
      type: boolean
      description: Indicates if the request was successful
      example: false
    message:
      type: string
      description: Error message
      example: "Resource not found"
    data:
      nullable: true
      description: No data for error responses
    timestamp:
      type: string
      format: date-time
      description: ISO timestamp of when the response was generated
      example: "2023-12-01T12:00:00.000Z"
    statusCode:
      type: integer
      description: HTTP status code
      example: 404
    path:
      type: string
      description: Request path
      example: "/api/v1/projects/123"

PlanTierGatingErrorDto:
  type: object
  required:
    - success
    - message
    - timestamp
    - statusCode
    - code
    - gatedFeature
  properties:
    success:
      type: boolean
      description: Indicates if the request was successful
      example: false
    message:
      type: string
      description: Human-readable error message describing the plan tier violation
      example: "Your current plan does not include access to the user-assistant feature"
    code:
      type: string
      enum:
        - PLAN_TIER_INSUFFICIENT
        - PLAN_TIER_EXPIRED
      description: Machine-readable error code for plan tier violations
      example: "PLAN_TIER_INSUFFICIENT"
    gatedFeature:
      type: string
      description: Identifier of the feature that is gated
      example: "user-assistant"
    upgradeGuidance:
      type: string
      description: Human-readable upgrade messaging for UI-driven conversion flows
      example: "Upgrade your plan to access the daily session assistant"
    timestamp:
      type: string
      format: date-time
      description: ISO timestamp of when the response was generated
      example: "2023-12-01T12:00:00.000Z"
    statusCode:
      type: integer
      description: HTTP status code (always 402 for plan tier gating errors)
      example: 402
    path:
      type: string
      description: Request path
      example: "/api/v1/organizations/org-123/projects/proj-456/conversations"

# =============================================
# Common Simple Response Objects
# =============================================
SimpleMessageResponse:
  type: object
  properties:
    message:
      type: string
      description: Simple message response
      example: "Operation completed successfully"

ValidateTokenRequest:
  type: object
  required:
    - token
  properties:
    token:
      type: string
      description: JWT token to validate

TokenValidationResponse:
  type: object
  properties:
    valid:
      type: boolean
      description: Whether the token is valid
    payload:
      type: object
      properties:
        userId:
          type: string
          description: User ID from token
        email:
          type: string
          description: Email from token
        currentOrgId:
          type: string
          description: Current organization ID
        orgMemberships:
          type: array
          items:
            type: object
            properties:
              orgId:
                type: string
                description: Organization ID
              role:
                type: string
                description: User role in organization
        iat:
          type: number
          description: Token issued at timestamp
        exp:
          type: number
          description: Token expiration timestamp
    error:
      type: string
      nullable: true
      description: Error message if validation failed

JWKSResponse:
  type: object
  properties:
    keys:
      type: array
      items:
        type: object
        properties:
          kty:
            type: string
            description: Key type
          use:
            type: string
            description: Key use
          kid:
            type: string
            description: Key ID
          n:
            type: string
            description: RSA modulus
          e:
            type: string
            description: RSA exponent
          alg:
            type: string
            description: Algorithm

AssignTagRequest:
  type: object
  required:
    - tagId
  properties:
    tagId:
      type: string
      format: uuid
      description: Tag ID to assign

AssignProjectTagRequest:
  type: object
  required:
    - tagId
  properties:
    tagId:
      type: string
      format: uuid
      description: Tag ID to assign to the project

ConnectionStatsResponse:
  type: object
  properties:
    totalConnections:
      type: integer
      description: Total number of active connections
    connectionsByProject:
      type: object
      additionalProperties:
        type: integer
      description: Number of connections per project
    connectionsByUser:
      type: object
      additionalProperties:
        type: integer
      description: Number of connections per user

HealthCheckResponse:
  type: object
  properties:
    status:
      type: string
      enum: ["healthy", "unhealthy"]
      description: Health status
    connections:
      type: integer
      description: Number of active connections
    redisConnected:
      type: boolean
      description: Whether Redis is connected

NotificationRequest:
  type: object
  required:
    - message
  properties:
    message:
      type: string
      description: Notification message
    severity:
      type: string
      enum: ["info", "warning", "error"]
      default: "info"
      description: Notification severity

NotificationResponse:
  type: object
  properties:
    status:
      type: string
      example: "success"
      description: Operation status
    projectId:
      type: string
      nullable: true
      description: Project ID (for project notifications)
    message:
      type: string
      description: Notification message that was sent

# =============================================
# Enums
# =============================================
Priority:
  type: string
  enum:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
  description: Priority level

RefinementLevel:
  type: string
  enum:
    - description
    - details
    - acceptanceCriteria
  description: Refinement level for work items (initiatives and tasks)

WorkStatus:
  type: string
  enum:
    - GENERATED
    - BACKLOG
    - READY
    - REFINING
    - BLOCKED
    - REFINING_DESCRIPTION
    - REFINING_DETAILS
    - REFINING_ACCEPTANCE_CRITERIA
    - GENERATING_DESCRIPTION
    - GENERATING_DETAILS
    - GENERATING_DESCRIPTION_AND_DETAILS
    - GENERATING_ACCEPTANCE_CRITERIA
    - GENERATING_ALL
    - ACTIVE
    - ON_HOLD
    - VERIFYING
    - COMPLETED
    - CANCELLED
    - ARCHIVED
    - SUPERSEDED
  description: Unified work status for initiatives and tasks

TopologyCategory:
  type: string
  enum:
    - technology
    - process
    - product
    - people
  description: Primary project topology classification

TopologyFacet:
  type: object
  required:
    - category
    - subfacet
  properties:
    category:
      $ref: "#/TopologyCategory"
      description: High-level topology category for the entity
    subfacet:
      type: string
      description: Required narrower subfacet within the category
  additionalProperties: false

