SetDemoTemplateDto:
  type: object
  additionalProperties: false
  required: [projectId, repositoryUrl]
  properties:
    projectId:
      type: string
      format: uuid
    repositoryUrl:
      type: string
      format: uri
      pattern: '^https://github[.]com/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+/?$'
      description: Public GitHub repository URL; an optional .git suffix is accepted.

DemoTemplateDto:
  type: object
  required: [id, projectId, repositoryUrl, active, createdAt]
  properties:
    id:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    repositoryUrl:
      type: string
      format: uri
    active:
      type: boolean
    createdAt:
      type: string
      format: date-time

ProvisionDemoSandboxDto:
  type: object
  additionalProperties: false
  required: [botCheckToken, demoTermsVersion, agentBridgeAcknowledgmentVersion]
  properties:
    botCheckToken:
      type: string
      description: Token issued by the bot-check widget; verified server-side before provisioning.
    demoTermsVersion:
      type: string
      description: Version of the demo terms the visitor agreed to.
    agentBridgeAcknowledgmentVersion:
      type: string
      description: Version of the Agent Bridge acknowledgment the visitor acknowledged.

DemoSandboxResponseDto:
  type: object
  required:
    - organizationId
    - projectId
    - expiresAt
    - inactivityTimeoutSeconds
    - repositoryUrl
    - resumed
  properties:
    organizationId:
      type: string
      format: uuid
    projectId:
      type: string
      format: uuid
    expiresAt:
      type: string
      format: date-time
      description: When the sandbox expires if it sees no further activity.
    inactivityTimeoutSeconds:
      type: integer
      description: Idle time after which the sandbox expires.
    repositoryUrl:
      type: string
      format: uri
      description: Public repository of the designated demo template.
    resumed:
      type: boolean
      description: True when an existing sandbox was reused instead of provisioning a new one.

DemoSandboxSetupStage:
  type: string
  enum: [COPYING, CONNECTING, READY]
  description: >-
    COPYING while the template is copied into the new project, CONNECTING while
    the copied features reach the graph, READY once every copied feature is connected.

DemoSandboxSetupProgressDto:
  type: object
  additionalProperties: false
  required: [stage, connectedFeatureCount, totalFeatureCount]
  properties:
    stage:
      $ref: "#/DemoSandboxSetupStage"
    connectedFeatureCount:
      type: integer
      minimum: 0
      description: Copied features already connected to the new project in the graph.
    totalFeatureCount:
      type: integer
      minimum: 0
      description: Copied features that must be connected; 0 until copying finishes.

DemoSandboxAdmissionState:
  type: string
  enum: [ACTIVE, PROVISIONING, FAILED]
  description: >-
    ACTIVE when the sandbox is ready and the caller is signed in to it;
    PROVISIONING while setup is still running; FAILED when setup failed or
    passed its deadline and the attempt was discarded.

DemoSandboxAdmissionDto:
  type: object
  additionalProperties: false
  required: [state]
  properties:
    state:
      $ref: "#/DemoSandboxAdmissionState"
    sandbox:
      $ref: "#/DemoSandboxResponseDto"
    progress:
      $ref: "#/DemoSandboxSetupProgressDto"
  description: >-
    sandbox is present only when state is ACTIVE; progress only when state is
    PROVISIONING. A FAILED state carries neither.

DemoSandboxUnavailableCode:
  type: string
  enum: [DISABLED, AT_CAPACITY, PROVISIONING_FAILED, RATE_LIMITED, BOT_CHECK_FAILED]
  description: >-
    DISABLED, AT_CAPACITY and PROVISIONING_FAILED are returned with 503,
    RATE_LIMITED with 429 and BOT_CHECK_FAILED with 400.

DemoSandboxUnavailableDto:
  allOf:
    - $ref: "./common.yaml#/ApiErrorResponse"
    - type: object
      required: [code]
      properties:
        code:
          $ref: "#/DemoSandboxUnavailableCode"

DemoSandboxResumeState:
  type: string
  enum: [EXPIRED, NONE]
  description: EXPIRED when this browser had a sandbox that is gone; NONE when it never had one.

DemoSandboxResumeMissDto:
  allOf:
    - $ref: "./common.yaml#/ApiErrorResponse"
    - type: object
      required: [data]
      properties:
        data:
          type: object
          required: [state]
          properties:
            state:
              $ref: "#/DemoSandboxResumeState"

DemoSandboxProgramDto:
  type: object
  additionalProperties: false
  required: [activeCap, perIpLimit, perIpWindowSeconds]
  properties:
    activeCap:
      type: integer
      minimum: 0
      description: Maximum ACTIVE sandboxes plus provisioning attempts.
    perIpLimit:
      type: integer
      minimum: 1
      description: Sandboxes one creator address may create per window.
    perIpWindowSeconds:
      type: integer
      minimum: 1

DemoSandboxAdminOverviewDto:
  type: object
  required: [program, template, activeCount]
  properties:
    program:
      $ref: "#/DemoSandboxProgramDto"
    template:
      description: The active demo template, or null when none is designated.
      nullable: true
      allOf:
        - $ref: "#/DemoTemplateDto"
    activeCount:
      type: integer
      minimum: 0
      description: ACTIVE sandboxes only; provisioning reservations also count toward the cap.

DemoSandboxAvailabilityDto:
  type: object
  additionalProperties: false
  required: [available]
  properties:
    available:
      type: boolean
      description: True in every deployment except production. The same value decides whether View demo is shown and whether starting a demo is attempted.
