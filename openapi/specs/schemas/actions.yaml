# ====================================================
# Action Inference System Schemas
# ====================================================

# Core action types
ActionType:
  type: string
  enum:
    - new_initiative
    - update_initiative
    - create_project
    - schedule_meeting
    - assign_task
  description: Type of action that can be inferred from user messages

# Binary confidence levels
ActionConfidence:
  type: string
  enum:
    - HIGH
    - LOW
  description: Binary confidence level for action inference (no numeric scores)

# Base action context (structured, not generic metadata)
BaseActionContext:
  type: object
  required:
    - actionType
    - sourceText
    - messageId
    - conversationId
    - timestamp
  properties:
    actionType:
      $ref: "#/ActionType"
      description: Discriminator that identifies the specific action context type
    sourceText:
      type: string
      minLength: 1
      description: The exact text that triggered action inference
    messageId:
      $ref: "./common.yaml#/MessageId"
      description: ID of the message that triggered the action
    conversationId:
      $ref: "./common.yaml#/ConversationId"
      description: ID of the conversation context
    timestamp:
      type: string
      format: date-time
      description: When the action was inferred

# New initiative action context
NewInitiativeActionContext:
  allOf:
    - $ref: "#/BaseActionContext"
    - type: object
      required:
        - extractedTitle
        - projectId
        - organizationId
        - parameters
        - dependencies
      properties:
        actionType:
          type: string
          enum:
            - new_initiative
          description: Identifies this context as a new initiative action
        extractedTitle:
          type: string
          minLength: 1
          maxLength: 200
          description: Title extracted from user message
        suggestedDescription:
          type: string
          maxLength: 500
          description: Optional suggested description for the initiative
        currentInitiativeId:
          $ref: "./common.yaml#/InitiativeId"
          nullable: true
          description: Current initiative ID if discussing within initiative context
        projectId:
          $ref: "./common.yaml#/ProjectId"
          description: Project ID for the new initiative
        organizationId:
          $ref: "./common.yaml#/OrganizationId"
          description: Organization ID for the new initiative
        parameters:
          type: object
          additionalProperties: true
          description: Structured action parameters (not generic metadata)
        dependencies:
          type: array
          items:
            type: string
            format: uuid
          description: Array of dependent action IDs

# Update initiative action context
UpdateInitiativeActionContext:
  allOf:
    - $ref: "#/BaseActionContext"
    - type: object
      required:
        - initiativeId
        - updateType
        - suggestedValue
        - projectId
        - organizationId
        - parameters
        - dependencies
      properties:
        actionType:
          type: string
          enum:
            - update_initiative
          description: Identifies this context as an update initiative action
        initiativeId:
          $ref: "./common.yaml#/InitiativeId"
          description: ID of the initiative to update
        updateType:
          type: string
          enum:
            - title
            - description
            - priority
            - status
            - tags
          description: Type of update to perform
        currentValue:
          type: string
          nullable: true
          description: Current value (if known)
        suggestedValue:
          type: string
          minLength: 1
          description: Suggested new value
        projectId:
          $ref: "./common.yaml#/ProjectId"
          description: Project ID
        organizationId:
          $ref: "./common.yaml#/OrganizationId"
          description: Organization ID
        parameters:
          type: object
          additionalProperties: true
          description: Structured action parameters
        dependencies:
          type: array
          items:
            type: string
            format: uuid
          description: Array of dependent action IDs

# Union of all action contexts (discriminated union)
ActionContext:
  oneOf:
    - $ref: "#/NewInitiativeActionContext"
    - $ref: "#/UpdateInitiativeActionContext"
  discriminator:
    propertyName: actionType
    mapping:
      new_initiative: "#/NewInitiativeActionContext" 
      update_initiative: "#/UpdateInitiativeActionContext"

# Action recommendation DTO for API responses
ActionRecommendationDto:
  type: object
  required:
    - id
    - type
    - description
    - confidence
    - actionContext
    - requiresConfirmation
    - reasoning
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier for this action recommendation
    type:
      $ref: "#/ActionType"
      description: Type of action recommended
    description:
      type: string
      description: Human-readable description of the recommended action
    confidence:
      $ref: "#/ActionConfidence"
      description: Confidence level for this recommendation
    actionContext:
      $ref: "#/ActionContext"
      description: Structured context for executing the action
    requiresConfirmation:
      type: boolean
      description: Whether this action requires user confirmation
    reasoning:
      type: string
      description: Explanation of why this action was recommended

# Action confirmation request
ActionConfirmationDto:
  type: object
  required:
    - confirmed
  properties:
    confirmed:
      type: boolean
      description: Whether the user confirms the action
    confirmationData:
      type: object
      additionalProperties: true
      nullable: true
      description: Optional additional data from user for action execution

# Action execution result
ActionExecutionResult:
  type: object
  required:
    - success
    - actionId
    - message
  properties:
    success:
      type: boolean
      description: Whether the action executed successfully
    actionId:
      type: string
      format: uuid
      description: ID of the executed action
    resultType:
      type: string
      description: Type of result (e.g., 'INITIATIVE_CREATED', 'INITIATIVE_UPDATED')
    resultData:
      type: object
      additionalProperties: true
      nullable: true
      description: Data about the execution result
    message:
      type: string
      description: Human-readable message about the execution result
    error:
      type: string
      nullable: true
      description: Error message if execution failed

# Enhanced message response with action recommendations
EnhancedMessageResponseDto:
  oneOf:
    - $ref: "#/EnhancedSystemMessage"
    - $ref: "#/EnhancedUserMessage"
  discriminator:
    propertyName: type
    mapping:
      SYSTEM: "#/EnhancedSystemMessage"
      USER: "#/EnhancedUserMessage"
  description: |
    Enhanced message response that varies based on type:
    - SYSTEM messages: SystemMessage with action recommendations
    - USER messages: UserMessage with action recommendations

EnhancedSystemMessage:
  allOf:
    - $ref: "./conversations.yaml#/MessageRecordSystemMessage"
    - type: object
      properties:
        actionRecommendations:
          type: array
          items:
            $ref: "#/ActionRecommendationDto"
          description: Array of action recommendations for this system message

EnhancedUserMessage:
  allOf:
    - $ref: "./conversations.yaml#/MessageRecordUserMessage"
    - type: object
      properties:
        actionRecommendations:
          type: array
          items:
            $ref: "#/ActionRecommendationDto"
          description: Array of action recommendations for this user message
