    ProposalEvents:
      description: Union of all proposal event envelopes.
      oneOf:
        - "$ref": "#/components/schemas/ProposalApprovedEvent"
        - "$ref": "#/components/schemas/ProposalGroupLifecycleEvent"
    ProposalEventEnvelope:
      type: object
      description: Base shape shared by every proposal event.
      required:
        - id
        - type
        - aggregateId
        - payload
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        type:
          type: string
          description: Discriminator for the concrete event type.
        aggregateId:
          "$ref": "./common.yaml#/ProposalId"
        payload:
          type: object
          description: Event-specific payload that always includes the shared execution context.
      additionalProperties: false
    ProposalGroupEventEnvelope:
      type: object
      description: Base shape for project-scoped proposal-group lifecycle events.
      required:
        - id
        - type
        - aggregateId
        - payload
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        type:
          type: string
          description: Discriminator for the concrete event type.
        aggregateId:
          type: string
          format: uuid
          description: Proposal-group identity.
        payload:
          type: object
      additionalProperties: false
    ProposalApprovedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - proposalId
            - targetEntityId
            - targetEntityType
            - action
            - requestorId
            - createdAt
            - shouldProcess
          properties:
            proposalId:
              "$ref": "./common.yaml#/ProposalId"
            shouldProcess:
              type: boolean
              description: False when consumers must not ingest this proposal into project knowledge.
            targetEntityId:
              type: string
              format: uuid
              description: ID of the entity targeted by the proposal.
            targetEntityType:
              type: string
              description: Type of the target entity (TASK, DESIGN_DOC).
            action:
              type: string
              description: Proposal action (CREATE, UPDATE, DELETE).
            requestorId:
              "$ref": "./common.yaml#/UserId"
            requestorContext:
              type: object
              additionalProperties: true
              description: Metadata about the requestor and request context.
            influences:
              type: array
              items:
                "$ref": "./artifacts.yaml#/Influence"
              description: Entities that influenced this proposal.
            generatedWithVersion:
              type: string
              description: Model or tool version used to generate the proposal.
            resultingEntityId:
              type: string
              format: uuid
              description: ID of the entity created or modified as a result of enacting the proposal.
            createdAt:
              type: string
              format: date-time
              description: Timestamp when the proposal was created.
          additionalProperties: false
    ProposalApprovedEvent:
      allOf:
        - "$ref": "#/components/schemas/ProposalEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - proposal.approved
            payload:
              "$ref": "#/components/schemas/ProposalApprovedEventPayload"
    ProposalGroupLifecycleEventPayload:
      type: object
      required:
        - payloadType
        - organizationId
        - projectId
        - groupId
        - revision
        - changedMemberIds
      properties:
        payloadType:
          type: string
          enum:
            - proposal_group.lifecycle
        organizationId:
          "$ref": "./common.yaml#/OrganizationId"
        projectId:
          "$ref": "./common.yaml#/ProjectId"
        groupId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        changedMemberIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
      description: Compact invalidation signal; consumers refetch the canonical proposal-group snapshot
    ProposalGroupLifecycleEvent:
      allOf:
        - "$ref": "#/components/schemas/ProposalGroupEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - proposal_group.lifecycle
            payload:
              "$ref": "#/components/schemas/ProposalGroupLifecycleEventPayload"

    GitHubWebhookEvents:
      description: Union of normalized GitHub webhook acceptance events.
      oneOf:
        - "$ref": "#/components/schemas/GitHubWebhookAcceptedEvent"
    GitHubWebhookEventEnvelope:
      type: object
      description: Base shape shared by normalized GitHub webhook events.
      required:
        - id
        - type
        - aggregateId
        - payload
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        type:
          type: string
          description: Discriminator for the concrete event type.
        aggregateId:
          type: string
          format: uuid
          description: Durable GitHub webhook inbox identity.
        payload:
          type: object
          description: Normalized, project-scoped delivery facts.
      additionalProperties: false
    GitHubWebhookAcceptedEventPayload:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - projectId
        - integrationId
        - inboxId
        - deliveryId
        - eventName
        - repository
        - action
        - acceptedAt
      properties:
        organizationId:
          "$ref": "./common.yaml#/OrganizationId"
        projectId:
          "$ref": "./common.yaml#/ProjectId"
        integrationId:
          type: string
          format: uuid
        inboxId:
          type: string
          format: uuid
        deliveryId:
          type: string
          minLength: 1
        eventName:
          type: string
          minLength: 1
        repository:
          type: object
          additionalProperties: false
          required:
            - id
            - fullName
            - htmlUrl
          properties:
            id:
              type: integer
              format: int64
            fullName:
              type: string
              minLength: 1
            htmlUrl:
              type: string
              format: uri
        action:
          type: string
          nullable: true
        pullRequest:
          type: object
          additionalProperties: false
          required:
            - id
            - number
            - title
            - state
            - merged
            - mergedAt
            - mergedByLogin
            - htmlUrl
            - headSha
            - baseSha
          properties:
            id:
              type: integer
              format: int64
            number:
              type: integer
            title:
              type: string
            state:
              type: string
            merged:
              type: boolean
            mergedAt:
              type: string
              format: date-time
              nullable: true
            mergedByLogin:
              type: string
              nullable: true
            htmlUrl:
              type: string
              format: uri
            headSha:
              type: string
            baseSha:
              type: string
        acceptedAt:
          type: string
          format: date-time
    GitHubWebhookAcceptedEvent:
      allOf:
        - "$ref": "#/components/schemas/GitHubWebhookEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - github.webhook.accepted
            payload:
              "$ref": "#/components/schemas/GitHubWebhookAcceptedEventPayload"
