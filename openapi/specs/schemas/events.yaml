---
openapi: 3.0.3
info:
  title: Hey Hey Message Domain Events
  version: 0.1.0
  description:
    Portable contracts for message domain events emitted by the Hey Hey
    API.
paths: {}
components:
  schemas:
    PayloadType:
      type: string
      description: Discriminator for event payload types
      enum:
        - agent.complete
        - agent.error
        - agent.progress
        - agent.request
        - artifact.archived
        - artifact.created
        - artifact.deleted
        - artifact.embedding_generated
        - artifact.generation_requested
        - artifact.restored
        - artifact.updated
        - implementation_hint.created
        - implementation_hint.deleted
        - implementation_hint.updated
        - agent_session.created
        - agent_session.deleted
        - agent_session.status_changed
        - service.created
        - service.updated
        - service.archived
        - conversation.created
        - conversation.deleted
        - conversation.status_changed
        - conversation.updated
        - design_doc.archived
        - design_doc.created
        - design_doc.restored
        - design_doc.updated
        - design_doc.status_changed
        - design_doc.content_changed
        - flow_node.complete
        - flow_node.start
        - initiative.archived
        - initiative.created
        - initiative.project_linked
        - initiative.project_unlinked
        - initiative.status_changed
        - initiative.updated
        - initiative.content_changed
        - llm.complete
        - llm.progress
        - llm.request
        - message.created
        - message.deleted
        - message.updated
        - message.realtime
        - mention.created
        - mention.removed
        - message_processor.error
        - non_interactive_flow_node.complete
        - non_interactive_flow_node.error
        - non_interactive_flow_node.start
        - organization.closed
        - project.created
        - project.deleted
        - project.status_changed
        - project.updated
        - report.created
        - queue.job
        - queue.llm_analysis
        - queue.llm_initiative_creation
        - summary.created
        - summary.deleted
        - summary.updated
        - subfacet.created
        - subfacet.deprecated
        - system
        - task.archived
        - task.assigned
        - task.created
        - task.status_changed
        - task.unassigned
        - task.updated
        - task.content_changed
        - proposal.approved
        - proposal_group.lifecycle
        - eval_run.updated
        - eval_attempt.updated
        - github.webhook.accepted
        - help.content_changed

    MessageEventContract:
      description: Union of all message event envelopes.
      oneOf:
        - "$ref": "#/components/schemas/MessageCreatedEvent"
        - "$ref": "#/components/schemas/MessageUpdatedEvent"
        - "$ref": "#/components/schemas/MessageRealtimeEvent"
        - "$ref": "#/components/schemas/MessageDeletedEvent"
    MessageEvents:
      $ref: "#/components/schemas/MessageEventContract"
    MessageEventEnvelope:
      type: object
      description: Base shape shared by every message event.
      required:
        - id
        - type
        - aggregateId
        - payload
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        type:
          type: string
          description: Discriminator for the concrete event type.
        aggregateId:
          "$ref": "./common.yaml#/MessageId"
        payload:
          type: object
          description:
            Event-specific payload that always includes the shared execution
            context.
      additionalProperties: false
    MessageCreatedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - message
          properties:
            message:
              "$ref": "#/components/schemas/MessageCreatedMessage"
            messageDataType:
              type: string
              description: Elevated type discriminator from message.data.type (e.g. QUESTIONS, ANALYSIS, CONTROL).
            completesExternalAgentNode:
              "$ref": "./conversations.yaml#/ExternalAgentNodeCompletion"
              description: |
                Elevated routing envelope from message.data.completesExternalAgentNode.
                Present iff this SYSTEM message closes an EXTERNAL_AGENT node;
                the MessageProcessor routes on this to re-enter workflow signaling.
            triggersAgent:
              "$ref": "./conversations.yaml#/AgentTrigger"
              description: |
                Elevated routing envelope from message.data.triggersAgent.
                Present iff this message is a trigger the CLI should dispatch.
                Carried at the payload root so trigger consumers route off the
                wire without unpacking the dropped data blob.
            triggerNotification:
              type: boolean
              description: |
                Elevated routing flag from message.data.triggerNotification.
                Gates the SYSTEM_MESSAGE notification pipeline at the wire root
                so the consumer can decide whether to fire without unpacking
                the dropped data blob.
            mentions:
              type: array
              description: Validated entity mentions extracted from the message content.
              items:
                "$ref": "#/components/schemas/MessageMention"
            sequenceNumber:
              type: integer
              format: int64
              description: Ordering key for messages within a conversation.
          additionalProperties: false
    MessageCreatedMessage:
      allOf:
        - "$ref": "./conversations.yaml#/CreateMessageDto"
        - type: object
          required: [shouldProcess]
          properties:
            userMessage:
              type: string
            shouldProcess:
              type: boolean
      discriminator:
        propertyName: type
        mapping:
          SYSTEM: "#/components/schemas/MessageCreatedSystemMessage"
          USER: "#/components/schemas/MessageCreatedUserMessage"
    MessageCreatedParentMessage:
      type: object
      required:
        - id
        - content
      properties:
        id:
          "$ref": "./common.yaml#/MessageId"
        content:
          type: string
      additionalProperties: false
    MessageCreatedSystemMessage:
      allOf:
        - "$ref": "#/components/schemas/MessageCreatedMessage"
        - type: object
          x-discriminator-value: SYSTEM
    MessageCreatedUserMessage:
      allOf:
        - "$ref": "#/components/schemas/MessageCreatedMessage"
        - type: object
          properties:
            parentMessage:
              "$ref": "#/components/schemas/MessageCreatedParentMessage"
              nullable: true
          x-discriminator-value: USER
    MessageCreatedEvent:
      allOf:
        - "$ref": "#/components/schemas/MessageEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - message.created
            payload:
              "$ref": "#/components/schemas/MessageCreatedEventPayload"
    MessageUpdatedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - update
          properties:
            update:
              type: object
              required: [shouldProcess, contentChanged]
              properties:
                contentChanged:
                  type: boolean
                status:
                  "$ref": "./conversations.yaml#/MessageStatus"
                parentMessageId:
                  "$ref": "./common.yaml#/MessageId"
                  description: Optional new parent message ID (used when rewiring thread order)
                systemMessage:
                  type: string
                shouldProcess:
                  type: boolean
            messageDataType:
              type: string
              description: Elevated type discriminator from update.data.type when present.
            completesExternalAgentNode:
              "$ref": "./conversations.yaml#/ExternalAgentNodeCompletion"
              description: Elevated routing envelope from update.data.completesExternalAgentNode when present.
            triggersAgent:
              "$ref": "./conversations.yaml#/AgentTrigger"
              description: Elevated routing envelope from update.data.triggersAgent when present.
          additionalProperties: false
    MessageUpdatedEvent:
      allOf:
        - "$ref": "#/components/schemas/MessageEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - message.updated
            payload:
              "$ref": "#/components/schemas/MessageUpdatedEventPayload"
    MessageRealtimeKind:
      type: string
      enum:
        - response.delta
        - response.replace
        - loading.update
        - tool.progress
        - run.status
        - run.error
    MessageRealtimePayload:
      type: object
      additionalProperties: false
      properties:
        responseDelta:
          type: string
        response:
          type: string
        loadingText:
          type: string
        currentStep:
          type: string
        progress:
          type: number
        status:
          type: string
        toolName:
          type: string
        toolPhase:
          type: string
        error:
          type: string
        metadata:
          type: object
          additionalProperties: true
    MessageRealtimeEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - conversationId
            - messageId
            - requestId
            - projectId
            - sequence
            - kind
            - source
            - timestamp
          properties:
            conversationId:
              "$ref": "./common.yaml#/ConversationId"
            messageId:
              "$ref": "./common.yaml#/MessageId"
            requestId:
              "$ref": "./common.yaml#/RequestId"
            sequence:
              type: integer
              format: int64
              minimum: 0
            kind:
              "$ref": "#/components/schemas/MessageRealtimeKind"
            source:
              type: string
            timestamp:
              type: string
              format: date-time
            payload:
              "$ref": "#/components/schemas/MessageRealtimePayload"
          additionalProperties: false
    MessageRealtimeEvent:
      allOf:
        - "$ref": "#/components/schemas/MessageEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - message.realtime
            payload:
              "$ref": "#/components/schemas/MessageRealtimeEventPayload"
    MessageDeletedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - deletedBy
          properties:
            deletedBy:
              type: string
              description: Identifier for the actor that removed the message.
          additionalProperties: false
    MessageDeletedEvent:
      allOf:
        - "$ref": "#/components/schemas/MessageEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - message.deleted
            payload:
              "$ref": "#/components/schemas/MessageDeletedEventPayload"
    MessageMention:
      type: object
      description: Entity reference parsed from a message mention token.
      required:
        - entityId
        - entityType
      properties:
        entityId:
          type: string
          description: Identifier of the mentioned entity.
        entityType:
          description: Domain entity type encoded in the mention token (matches Prisma EntityType enum).
          $ref: "./common.yaml#/EntityType"
      additionalProperties: false
    MentionEventContract:
      description: Union of all mention event envelopes.
      oneOf:
        - "$ref": "#/components/schemas/MentionCreatedEvent"
        - "$ref": "#/components/schemas/MentionRemovedEvent"
    MentionEvents:
      $ref: "#/components/schemas/MentionEventContract"
    MentionEventEnvelope:
      type: object
      description: Base shape shared by every mention event.
      required:
        - id
        - type
        - aggregateId
        - payload
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        type:
          type: string
          description: Discriminator for the concrete event type.
        aggregateId:
          type: string
          description: Unique identifier for the mention.
        payload:
          type: object
          description:
            Event-specific payload that always includes the shared execution
            context.
      additionalProperties: false
    MentionCreatedEventPayload:
      description:
        Emitted when a mention is added to an entity body or message.
        Producer contract — mention.created and mention.removed are
        always derived from an explicit prior-vs-new diff of the
        mentions persisted on the source entity. Producers MUST
        snapshot prior mentions before mutation, compute the new set
        after mutation, and emit one mention.created per added entityId
        alongside one mention.removed per removed entityId. Removals
        are NEVER inferred from the absence of a mention.created — a
        subscriber cannot distinguish "no event arrived yet" from
        "mention was dropped" without an explicit removal.
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - sourceEntityId
            - sourceEntityType
            - entityId
            - entityType
          properties:
            sourceEntityId:
              type: string
              description:
                Identifier of the entity whose body or content carries the
                mention. For message mentions this is the messageId; for
                task or design-doc body mentions this is the task or
                design-doc id.
            sourceEntityType:
              type: string
              description: Domain entity type of sourceEntityId.
              enum:
                - MESSAGE
                - TASK
                - DESIGN_DOC
            messageId:
              $ref: "./common.yaml#/MessageId"
              description:
                Optional. Set when the mention was carried by a message.
                Omitted for entity-body mentions emitted from proposal
                enactment.
            conversationId:
              $ref: "./common.yaml#/ConversationId"
              description:
                Optional. Set when the mention emission has a conversation
                context (e.g. a message or a proposal enacted via an
                in-conversation approval).
            workflowAboutId:
              type: string
              description:
                Optional. Entity ID that the conversation is primarily
                about. Set only when conversationId is set.
            workflowAboutType:
              type: string
              description: Type of entity that workflowAboutId refers to.
            entityId:
              type: string
              description: Identifier of the mentioned entity.
            entityType:
              type: string
              description: Domain entity type encoded in the mention token.
              enum:
                - ARTIFACT
                - INITIATIVE
                - PROJECT
                - TASK
                - MESSAGE
                - CONVERSATION
                - DESIGN_DOC
                - AGENT_SESSION
                - SERVICE
                - AGENT_SESSION
          additionalProperties: false
    MentionCreatedEvent:
      allOf:
        - "$ref": "#/components/schemas/MentionEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - mention.created
            payload:
              "$ref": "#/components/schemas/MentionCreatedEventPayload"
    MentionRemovedEventPayload:
      description:
        Emitted when a mention previously persisted on an entity body has
        been removed (e.g. by an edit-task or edit-design-doc proposal that
        dropped the mention token). Mirrors the shape of MentionCreatedEventPayload
        so the same source attribution and target identifiers are available
        for the consumer to prune the corresponding edge. See
        MentionCreatedEventPayload for the prior-vs-new diff contract that
        producers MUST follow — removals are never inferred from absence
        of a mention.created.
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - sourceEntityId
            - sourceEntityType
            - entityId
            - entityType
          properties:
            sourceEntityId:
              type: string
              description:
                Identifier of the entity whose body or content previously
                carried the mention.
            sourceEntityType:
              type: string
              description: Domain entity type of sourceEntityId.
              enum:
                - MESSAGE
                - TASK
                - DESIGN_DOC
            conversationId:
              $ref: "./common.yaml#/ConversationId"
              description:
                Optional. Set when the removal has a conversation context.
            entityId:
              type: string
              description: Identifier of the previously-mentioned entity.
            entityType:
              type: string
              description: Domain entity type encoded in the original mention token.
              enum:
                - ARTIFACT
                - INITIATIVE
                - PROJECT
                - TASK
                - MESSAGE
                - CONVERSATION
                - DESIGN_DOC
                - AGENT_SESSION
                - SERVICE
                - AGENT_SESSION
          additionalProperties: false
    MentionRemovedEvent:
      allOf:
        - "$ref": "#/components/schemas/MentionEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - mention.removed
            payload:
              "$ref": "#/components/schemas/MentionRemovedEventPayload"
    InitiativeEvents:
      description: Union of all initiative event envelopes.
      oneOf:
        - "$ref": "#/components/schemas/InitiativeCreatedEvent"
        - "$ref": "#/components/schemas/InitiativeUpdatedEvent"
        - "$ref": "#/components/schemas/InitiativeContentChangedEvent"
        - "$ref": "#/components/schemas/InitiativeStatusChangedEvent"
        - "$ref": "#/components/schemas/InitiativeArchivedEvent"
        - "$ref": "#/components/schemas/InitiativeProjectLinkedEvent"
        - "$ref": "#/components/schemas/InitiativeProjectUnlinkedEvent"
    InitiativeEventEnvelope:
      type: object
      description: Base shape shared by every initiative event.
      required:
        - id
        - type
        - aggregateId
        - payload
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        type:
          type: string
          description: Discriminator for the concrete event type.
        aggregateId:
          "$ref": "./common.yaml#/InitiativeId"
        payload:
          type: object
          description: Event-specific payload that always includes the shared execution context.
      additionalProperties: false
    InitiativeCreatedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - initiative
          properties:
            initiative:
              "$ref": "#/components/schemas/InitiativeEventSnapshot"
          additionalProperties: false
    InitiativeCreatedEvent:
      allOf:
        - "$ref": "#/components/schemas/InitiativeEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - initiative.created
            payload:
              "$ref": "#/components/schemas/InitiativeCreatedEventPayload"
    InitiativeUpdatedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - update
            - projectId
          properties:
            update:
              "$ref": "#/components/schemas/InitiativeEventUpdateSnapshot"
            projectId:
              "$ref": "./common.yaml#/ProjectId"
              description: Active project that triggered the update. Falls back to originatingProjectId if no request context.
            linkedProjectIds:
              type: array
              items:
                "$ref": "./common.yaml#/ProjectId"
              description: All projects currently linked to the initiative.
            originatingProjectId:
              "$ref": "./common.yaml#/ProjectId"
              nullable: true
              description: Canonical project captured at initiative creation.
            changes:
              type: array
              items:
                "$ref": "./initiatives.yaml#/FieldChangeDto"
            changedBy:
              "$ref": "./initiatives.yaml#/ChangedByDto"
            totalFieldsChanged:
              type: integer
              minimum: 0
            changeMetadata:
              "$ref": "#/components/schemas/InitiativeChangeMetadata"
          additionalProperties: false
    InitiativeUpdatedEvent:
      allOf:
        - "$ref": "#/components/schemas/InitiativeEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - initiative.updated
            payload:
              "$ref": "#/components/schemas/InitiativeUpdatedEventPayload"
    InitiativeContentChangedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - content
            - projectId
          properties:
            content:
              "$ref": "#/components/schemas/InitiativeEventContentSnapshot"
            projectId:
              "$ref": "./common.yaml#/ProjectId"
              description: Active project that triggered the content change. Falls back to originatingProjectId if no request context.
            linkedProjectIds:
              type: array
              items:
                "$ref": "./common.yaml#/ProjectId"
              description: All projects currently linked to the initiative.
            originatingProjectId:
              "$ref": "./common.yaml#/ProjectId"
              nullable: true
              description: Canonical project captured at initiative creation.
          additionalProperties: false
    InitiativeContentChangedEvent:
      allOf:
        - "$ref": "#/components/schemas/InitiativeEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - initiative.content_changed
            payload:
              "$ref": "#/components/schemas/InitiativeContentChangedEventPayload"
    InitiativeStatusChangedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - previousStatus
            - newStatus
          properties:
            previousStatus:
              "$ref": "./common.yaml#/WorkStatus"
            newStatus:
              "$ref": "./common.yaml#/WorkStatus"
            originatingProjectId:
              "$ref": "./common.yaml#/ProjectId"
              nullable: true
          additionalProperties: false
    InitiativeStatusChangedEvent:
      allOf:
        - "$ref": "#/components/schemas/InitiativeEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - initiative.status_changed
            payload:
              "$ref": "#/components/schemas/InitiativeStatusChangedEventPayload"
    InitiativeArchivedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - archivedAt
          properties:
            archivedAt:
              type: string
              format: date-time
          additionalProperties: false
    InitiativeArchivedEvent:
      allOf:
        - "$ref": "#/components/schemas/InitiativeEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - initiative.archived
            payload:
              "$ref": "#/components/schemas/InitiativeArchivedEventPayload"
    InitiativeProjectLinkedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - projectId
          properties:
            projectId:
              "$ref": "./common.yaml#/ProjectId"
            role:
              type: string
          additionalProperties: false
    InitiativeProjectLinkedEvent:
      allOf:
        - "$ref": "#/components/schemas/InitiativeEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - initiative.project_linked
            payload:
              "$ref": "#/components/schemas/InitiativeProjectLinkedEventPayload"
    InitiativeProjectUnlinkedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - projectId
          properties:
            projectId:
              "$ref": "./common.yaml#/ProjectId"
          additionalProperties: false
    InitiativeProjectUnlinkedEvent:
      allOf:
        - "$ref": "#/components/schemas/InitiativeEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - initiative.project_unlinked
            payload:
              "$ref": "#/components/schemas/InitiativeProjectUnlinkedEventPayload"
    ConversationEvents:
      description: Union of all conversation event envelopes.
      oneOf:
        - "$ref": "#/components/schemas/ConversationCreatedEvent"
        - "$ref": "#/components/schemas/ConversationUpdatedEvent"
        - "$ref": "#/components/schemas/ConversationDeletedEvent"
        - "$ref": "#/components/schemas/ConversationStatusChangedEvent"
    ConversationEventEnvelope:
      type: object
      description: Base shape shared by every conversation event.
      required:
        - id
        - type
        - aggregateId
        - payload
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        type:
          type: string
          description: Discriminator for the concrete event type.
        aggregateId:
          "$ref": "./common.yaml#/ConversationId"
        payload:
          type: object
          description: Event-specific payload that always includes the shared execution context.
      additionalProperties: false
    ConversationCreatedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - workflowName
            - initiatedBy
            - status
          properties:
            workflowAboutId:
              type: string
              description: Entity ID associated with the conversation workflow.
            workflowAboutType:
              type: string
              description: Entity type associated with workflowAboutId.
            workflowName:
              "$ref": "./conversations.yaml#/WorkflowName"
            conversationTitle:
              type: string
              description: Human-readable conversation title when available.
            initiatedBy:
              "$ref": "./conversations.yaml#/InitiationType"
            status:
              "$ref": "./conversations.yaml#/ConversationStatus"
            version:
              type: integer
              minimum: 0
              description: Optional version number included with the event.
          additionalProperties: false
    ConversationCreatedEvent:
      allOf:
        - "$ref": "#/components/schemas/ConversationEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - conversation.created
            payload:
              "$ref": "#/components/schemas/ConversationCreatedEventPayload"
    ConversationUpdateEventData:
      allOf:
        - "$ref": "./conversations.yaml#/UpdateConversationDto"
        - type: object
          properties:
            workflowAboutType:
              type: string
              description: |
                Persisted entity type associated with workflowAboutId. Producers
                include this metadata when publishing a workflowAboutId update
                so consumers can materialize the correctly typed endpoint.
            messageAdded:
              type: string
              description: ID of message added to the conversation.
            messageDeleted:
              type: string
              description: ID of message deleted from the conversation.
            messageUpdated:
              type: string
              description: ID of message updated in the conversation.
    ConversationUpdatedEventPayload:
      allOf:
        - "$ref": "#/components/schemas/ExecutionContext"
        - type: object
          required:
            - update
          properties:
            update:
              "$ref": "#/components/schemas/ConversationUpdateEventData"
            latestMessageId:
              type: string
              description: |
                ID of the most recent message in the conversation at the time
                this event was emitted. Clients use it to no-op when their
                cache already contains this id, or to fetch a delta with
                `?since=<previousLatestMessageId>` otherwise. Absent only
                when the conversation has no messages yet (e.g. a status-only
                update on a freshly created conversation).
            previousVersion:
              type: integer
            newVersion:
              type: integer
            changeType:
              type: string
            lastModifiedBy:
              type: string
            triggersAgent:
              "$ref": "./conversations.yaml#/AgentTrigger"
              description: |
                Elevated routing envelope set on message-added publishes when
                the newly-added message carries `data.triggersAgent`. Lets the
                websocket bridge gate trigger emission on a typed top-level
                read (no `as SystemMessageData` cast, no DB round-trip on the
                non-trigger common case). Absent on non-message-added publishes
                (message updated/deleted) and on message-added publishes whose
                message is not a trigger.
          additionalProperties: false
    ConversationUpdatedEvent:
      allOf:
        - "$ref": "#/components/schemas/ConversationEventEnvelope"
        - type: object
          properties:
            type:
              type: string
              enum:
                - conversation.updated
            payload:
              "$ref": "#/components/schemas/ConversationUpdatedEventPayload"
