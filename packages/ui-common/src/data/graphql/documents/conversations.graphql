fragment ConversationFields on Conversation {
  id
  organizationId
  projectId
  title
  status
  workflowName
  workflowId
  workflowAboutType
  workflowAboutId
  initiatedBy
  triggerEvent
  createdBy
  lastModifiedBy
  restricted
  version
  createdAt
  updatedAt
}

fragment ConversationWithDecisionsFields on Conversation {
  ...ConversationFields
  suggestionDecisions
  goalPmRoutingDecisions
}

fragment MessageFields on Message {
  id
  conversationId
  projectId
  type
  status
  userId
  parentMessageId
  createdAt
  executionStatus
  executionQueueConfirmed
  executionAdmissionDisposition
  executionCancellationRequested
  executionOperationId
  awaitingResponse
  handler
  user
  data
}

query GetConversation($id: ID!) {
  conversation(id: $id) {
    ...ConversationFields
  }
}

query GetConversationWithDecisions($id: ID!) {
  conversation(id: $id) {
    ...ConversationWithDecisionsFields
  }
}

query GetConversations(
  $statuses: [String!]
  $workflowNames: [String!]
  $workflowAboutId: String
  $workflowAboutType: String
  $search: String
  $page: Int
  $limit: Int
) {
  page: conversations(
    statuses: $statuses
    workflowNames: $workflowNames
    workflowAboutId: $workflowAboutId
    workflowAboutType: $workflowAboutType
    search: $search
    page: $page
    limit: $limit
  ) {
    nodes {
      ...ConversationFields
    }
  }
}

query GetConversationsWithDecisions(
  $statuses: [String!]
  $workflowNames: [String!]
  $workflowAboutId: String
  $workflowAboutType: String
  $search: String
  $page: Int
  $limit: Int
) {
  page: conversations(
    statuses: $statuses
    workflowNames: $workflowNames
    workflowAboutId: $workflowAboutId
    workflowAboutType: $workflowAboutType
    search: $search
    page: $page
    limit: $limit
  ) {
    nodes {
      ...ConversationWithDecisionsFields
    }
  }
}

query GetActiveConversations(
  $workflowNames: [String!]
  $workflowAboutId: String
  $workflowAboutType: String
  $search: String
  $page: Int
  $limit: Int
) {
  page: activeConversations(
    workflowNames: $workflowNames
    workflowAboutId: $workflowAboutId
    workflowAboutType: $workflowAboutType
    search: $search
    page: $page
    limit: $limit
  ) {
