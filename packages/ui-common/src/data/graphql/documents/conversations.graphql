query GetActiveConversationsWithDecisions(
  $workflowNames: [String!]
  $workflowAboutId: String
  $workflowAboutType: String
  $search: String
  $page: Int
  $limit: Int
) {
  page: activeConversations(
    workflowNames: $workflowNames
    workflowAboutId: $workflowAboutId
    workflowAboutType: $workflowAboutType
    search: $search
    page: $page
    limit: $limit
  ) {
