name: Build images
run-name: Staging candidates — ${{ github.ref_name }}

# Release pushes and release-only manual retries publish the same verified build.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      target:
        description: What would you like to build?
        type: choice
        required: true
        default: Both
        options:
          - UI
          - API
          - Both

permissions:
  contents: read

concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - name: Require a release branch
        env:
          REF: ${{ github.ref }}
        run: '[[ "$REF" == refs/heads/release/?* ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: select
        env:
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/image-candidate-selection.mjs

  build:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.images != '[]' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    name: Build ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3

      - name: Image name and version
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SAFE_REF="${SAFE_REF//[^a-zA-Z0-9_.-]/-}"
          REPOSITORY="ghcr.io/zsutton00/${IMAGE}-service"
          VERSION="${SAFE_REF}-${GITHUB_SHA::7}"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.repository }}:candidate-${{ github.sha }}
            ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.version }}

      - name: Check UI starts
        if: matrix.image == 'ui'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.repository }}:candidate-${{ github.sha }}
        run: |
          docker run -d --name ui-build -p 5173:5173 "$IMAGE_TAG"
          trap 'docker logs ui-build; docker rm -f ui-build' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ -o /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:5173/runtime-config.js -o /dev/null

      - name: Check API runtime
        if: matrix.image == 'api'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.repository }}:candidate-${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_TAG" -c '
            set -e
            flyway -v
            test -d db/flyway && test -f prisma/schema.prisma && test -d content/help
            node -e "
              require(\"./dist/app.module.js\");
              require(\"./dist/worker-app.module.js\");
              new (require(\"@prisma/client\").PrismaClient)();
            "
          '

      - name: Record verified build
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.repository }}:candidate-${{ github.sha }}
        run: |
          node scripts/image-build-evidence.mjs --image "$IMAGE" --image-id "$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" --tag "$IMAGE_TAG" > "$RUNNER_TEMP/build-evidence.json"
          node scripts/image-publication-evidence.mjs verified "$RUNNER_TEMP/build-evidence.json"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        env:
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$REPOSITORY:candidate-$GITHUB_SHA" | tee "$RUNNER_TEMP/push.log"
          DIGEST="$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$RUNNER_TEMP/push.log" | tail -1)"
          node scripts/image-publication-evidence.mjs published "$RUNNER_TEMP/build-evidence.json" "$DIGEST"
          docker push "$REPOSITORY:$VERSION"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.image }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-evidence.json
            ${{ runner.temp }}/push.log
          if-no-files-found: ignore
