name: Build images
run-name: Staging candidates — ${{ github.ref_name }}

# Release pushes and manual runs from any branch publish the same verified build.
# Every run builds and smoke-checks linux/arm64 only, including manual runs.
# When api, ui and graph-search are all built in one run, a candidate
# release-manifest.json is uploaded for testing
# `heyhey local`; the Release CLI workflow publishes that same manifest.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      target:
        description: What would you like to build?
        type: choice
        required: true
        default: Both
        options:
          - UI
          - API
          - Both
          - Graph Search
          - All

permissions:
  contents: read

concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_OWNER: ghcr.io/zsutton00
  # Upstream images are pinned by digest into the manifest, not republished.
  POSTGRES_UPSTREAM: docker.io/pgvector/pgvector:0.8.7-pg17-trixie
  REDIS_UPSTREAM: docker.io/library/redis:8-alpine

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: select
        env:
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/image-candidate-selection.mjs

  build:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.images != '[]' }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
        platform: [linux/arm64]
    name: Build ${{ matrix.image }} ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3

      - name: Image name and version
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SAFE_REF="${SAFE_REF//[^a-zA-Z0-9_.-]/-}"
          REPOSITORY="ghcr.io/zsutton00/${IMAGE}-service"
          VERSION="${SAFE_REF}-${GITHUB_SHA::7}"
          ARCH="${PLATFORM#linux/}"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "tag=$REPOSITORY:candidate-$GITHUB_SHA-$ARCH" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tag }}

      - name: Check UI starts
        if: matrix.image == 'ui'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name ui-build -p 5173:5173 "$IMAGE_TAG"
          trap 'docker logs ui-build; docker rm -f ui-build' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ -o /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:5173/runtime-config.js -o /dev/null

      - name: Check API runtime
        if: matrix.image == 'api'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_TAG" -c '
            set -e
            flyway -v
            test -d db/flyway && test -f prisma/schema.prisma && test -d content/help
            node -e "
              require(\"./dist/app.module.js\");
              require(\"./dist/worker-app.module.js\");
              new (require(\"@prisma/client\").PrismaClient)();
            "
          '

      - name: Check graph/search startup and restart
        if: matrix.image == 'graph-search'
        env:
          GRAPH_SEARCH_IMAGE: ${{ steps.meta.outputs.tag }}
        run: bash apps/graph-search/scripts/test-container.sh

      - name: Record verified build
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          node scripts/image-build-evidence.mjs --image "$IMAGE" --image-id "$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" --tag "$IMAGE_TAG" > "$RUNNER_TEMP/build-evidence.json"
          node scripts/image-publication-evidence.mjs verified "$RUNNER_TEMP/build-evidence.json"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ steps.meta.outputs.arch }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG" | tee "$RUNNER_TEMP/push.log"
          DIGEST="$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$RUNNER_TEMP/push.log" | tail -1)"
          node scripts/image-publication-evidence.mjs published "$RUNNER_TEMP/build-evidence.json" "$DIGEST"
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$DIGEST" > "$RUNNER_TEMP/digest/digest-$IMAGE-$ARCH.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ steps.meta.outputs.arch }}
          path: ${{ runner.temp }}/digest/digest-${{ matrix.image }}-${{ steps.meta.outputs.arch }}.txt

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.image }}-${{ steps.meta.outputs.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-evidence.json
            ${{ runner.temp }}/push.log
          if-no-files-found: ignore

  merge:
    needs: [select, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    name: Merge ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image variants and record the digest
        env:
          IMAGE: ${{ matrix.image }}
          EXPECTED_PLATFORMS: "1"
        run: |
          set -euo pipefail
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SAFE_REF="${SAFE_REF//[^a-zA-Z0-9_.-]/-}"
          REPOSITORY="${REGISTRY_OWNER}/${IMAGE}-service"
          VERSION="${SAFE_REF}-${GITHUB_SHA::7}"
          SOURCES=()
          for file in "$RUNNER_TEMP"/digests/digest-*.txt; do
            SOURCES+=("$REPOSITORY@$(cat "$file")")
          done
          [ "${#SOURCES[@]}" -eq "$EXPECTED_PLATFORMS" ] || { echo "Expected one digest per platform" >&2; exit 1; }
          docker buildx imagetools create -t "$REPOSITORY:candidate-$GITHUB_SHA" -t "$REPOSITORY:$VERSION" "${SOURCES[@]}"
          DIGEST="$(docker buildx imagetools inspect "$REPOSITORY:candidate-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          mkdir -p "$RUNNER_TEMP/reference"
          echo "$REPOSITORY@$DIGEST" > "$RUNNER_TEMP/reference/reference-$IMAGE.txt"
          echo "$IMAGE: $REPOSITORY@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-${{ matrix.image }}
          path: ${{ runner.temp }}/reference/reference-${{ matrix.image }}.txt

  manifest:
    needs: [select, merge]
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    name: Candidate release manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: reference-*
          path: ${{ runner.temp }}/references
          merge-multiple: true
      - name: Require all three images
        id: complete
        run: |
          refs="$RUNNER_TEMP/references"
          if [ -f "$refs/reference-api.txt" ] && [ -f "$refs/reference-ui.txt" ] && [ -f "$refs/reference-graph-search.txt" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "No candidate manifest: this run did not build api, ui and graph-search together. Run it with target All." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.complete.outputs.complete == 'true'
      - name: Pin PostgreSQL and Redis by digest
        if: steps.complete.outputs.complete == 'true'
        env:
          REQUIRED_ARCHITECTURES: arm64
        run: |
          set -euo pipefail
          pin() {
            local tagged="$1" repository="${1%%:*}"
            local raw digest
            raw="$(docker buildx imagetools inspect "$tagged" --raw)"
            for platform in $REQUIRED_ARCHITECTURES; do
              jq -e --arg a "$platform" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)' <<<"$raw" >/dev/null \
                || { echo "$tagged has no linux/$platform variant" >&2; exit 1; }
            done
            digest="$(docker buildx imagetools inspect "$tagged" --format '{{.Manifest.Digest}}')"
            echo "$repository@$digest"
          }
          echo "$(pin "$POSTGRES_UPSTREAM")" > "$RUNNER_TEMP/references/reference-postgres.txt"
          echo "$(pin "$REDIS_UPSTREAM")" > "$RUNNER_TEMP/references/reference-redis.txt"
      - uses: pnpm/action-setup@v4
        if: steps.complete.outputs.complete == 'true'
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        if: steps.complete.outputs.complete == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hey-hey/cli...
        if: steps.complete.outputs.complete == 'true'
      - name: Write and verify the candidate release manifest
        if: steps.complete.outputs.complete == 'true'
        working-directory: apps/cli
        env:
          RELEASE_IMAGE_PLATFORMS: '["linux/arm64"]'
        run: |
          set -euo pipefail
          refs="$RUNNER_TEMP/references"
          jq -n \
            --arg api "$(cat "$refs/reference-api.txt")" \
            --arg ui "$(cat "$refs/reference-ui.txt")" \
            --arg graphSearch "$(cat "$refs/reference-graph-search.txt")" \
            --arg postgres "$(cat "$refs/reference-postgres.txt")" \
            --arg redis "$(cat "$refs/reference-redis.txt")" \
            '{api: $api, ui: $ui, graphSearch: $graphSearch, postgres: $postgres, redis: $redis}' \
            > "$RUNNER_TEMP/digests.json"
          pnpm exec tsx scripts/write-release-manifest.ts "$RUNNER_TEMP/digests.json"
          pnpm exec tsx scripts/verify-release-manifest.ts
          cp release-manifest.json "$RUNNER_TEMP/release-manifest.json"
      - uses: actions/upload-artifact@v4
        if: steps.complete.outputs.complete == 'true'
        with:
          name: release-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/release-manifest.json
