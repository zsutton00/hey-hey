name: Build images
run-name: Build ${{ inputs.target || 'Both' }} images

# Verify release images automatically; publication is an explicit manual choice.
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      target:
        description: What would you like to build?
        type: choice
        required: true
        default: Both
        options:
          - UI
          - API
          - Both
      publish:
        description: Publish verified images to GHCR
        type: boolean
        required: true
        default: false

concurrency:
  group: images-${{ github.ref }}-${{ inputs.publish && 'publish' || 'verify' }}
  cancel-in-progress: ${{ github.event_name == 'push' || !inputs.publish }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - id: select
        env:
          TARGET: ${{ inputs.target || 'Both' }}
        run: |
          case "$TARGET" in
            UI) echo 'images=["ui"]' >> "$GITHUB_OUTPUT" ;;
            API) echo 'images=["api"]' >> "$GITHUB_OUTPUT" ;;
            Both) echo 'images=["ui","api"]' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown image selection" >&2; exit 1 ;;
          esac

  build:
    needs: select
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    name: Build ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image name and version
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SAFE_REF="${SAFE_REF//[^a-zA-Z0-9_.-]/-}"
          REPOSITORY="ghcr.io/zsutton00/${IMAGE}-service"
          VERSION="${SAFE_REF}-${GITHUB_SHA::7}"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.repository }}:candidate-${{ github.sha }}
            ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.version }}

      - name: Check UI starts
        if: matrix.image == 'ui'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.repository }}:candidate-${{ github.sha }}
        run: |
          docker run -d --name ui-build -p 5173:5173 "$IMAGE_TAG"
          trap 'docker logs ui-build; docker rm -f ui-build' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ -o /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:5173/runtime-config.js -o /dev/null

      - name: Check API runtime
        if: matrix.image == 'api'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.repository }}:candidate-${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_TAG" -c '
            set -e
            flyway -v
            test -d db/flyway && test -f prisma/schema.prisma && test -d content/help
            node -e "
              require(\"./dist/app.module.js\");
              require(\"./dist/worker-app.module.js\");
              new (require(\"@prisma/client\").PrismaClient)();
            "
          '

      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker push "$REPOSITORY:candidate-$GITHUB_SHA"
          docker push "$REPOSITORY:$VERSION"
          echo "Built and published: \`$REPOSITORY:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
