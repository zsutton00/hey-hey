name: Publish images

# The only workflow that pushes UI/API images. It runs by manual dispatch from
# main and waits on the protected `image-publication` environment, which must
# have required reviewers configured in the repository settings. It rebuilds the
# named revision and pushes only if the build matches the evidence the Images
# workflow recorded for that revision. images.yml stays push:false.
#
# Pushed tags: candidate-<sha> and main-<sha7>, the form deployments pin.
# Changing which tag a deployment runs is a separate, reviewed change in the
# deployment configuration.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Verified candidate revision (full 40-character SHA on main)
        required: true
      images:
        description: JSON list of images to publish
        default: '["ui","api"]'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: image-publication
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    name: publish ${{ matrix.image }}
    env:
      REVISION: ${{ inputs.revision }}
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Require a full revision
        shell: bash
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3

      - name: Require the revision to be on main
        run: git merge-base --is-ancestor "$REVISION" origin/main

      - name: Fetch the recorded evidence for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(gh run list --workflow images.yml --commit "$REVISION" \
            --branch main --status success --json databaseId -q '.[0].databaseId')
          test -n "$run_id" || { echo "No successful Images run on main for $REVISION"; exit 1; }
          gh run download "$run_id" -n "image-evidence-$IMAGE" -D "$RUNNER_TEMP/evidence"

      - name: Version label as the Images run on main recorded it
        id: meta
        shell: bash
        run: echo "app_version=main-${REVISION::7}" >> "$GITHUB_OUTPUT"

      - name: Rebuild the candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            SOURCE_REVISION=${{ inputs.revision }}
          tags: heyhey-${{ matrix.image }}:candidate-${{ inputs.revision }}

      - name: Check the build matches the recorded evidence
        run: >-
          node scripts/image-build-evidence.mjs
          --image "$IMAGE"
          --image-id "${{ steps.build.outputs.imageid }}"
          --tag "candidate-$REVISION"
          --verify "$RUNNER_TEMP/evidence/image-evidence-$IMAGE.json"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push under the existing name
        shell: bash
        run: |
          repository=$(node scripts/image-build-evidence.mjs --repository "$IMAGE")
          for tag in "candidate-$REVISION" "main-${REVISION::7}"; do
            docker tag "heyhey-$IMAGE:candidate-$REVISION" "$repository:$tag"
            docker push "$repository:$tag"
          done
