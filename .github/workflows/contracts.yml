name: Contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Resolver tests
        run: pnpm test:scripts
      - name: Validate specs, regenerate every consumer and check for drift
        if: github.event_name == 'workflow_dispatch'
        run: pnpm generate:check
      - name: Verify recorded contracts and controller schema compatibility
        run: pnpm generate:verify
      - name: Check actual controller payload producers
        run: pnpm check:controller-producers
