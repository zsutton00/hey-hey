name: Release CLI
run-name: CLI release — ${{ github.ref_name }}

# Publishes one CLI version with the exact images already built and verified by a
# "Build images" run selected for the release. Nothing is rebuilt here: the candidate
# run's release-manifest.json is the one that ships. Tags the images with the CLI
# version and stages npm for human approval. Run again with operation=verify
# after approving on npm to check the public artifact against that staging run.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage a package, or verify it after approving on npm
        type: choice
        options: [stage, verify]
        default: stage
        required: true
      candidate_run_id:
        description: Run ID of the successful "Build images" run (target All) whose pinned images should ship
        type: string
        required: false
      staging_run_id:
        description: For verify only — successful Release CLI staging run ID
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

env:
  REGISTRY_OWNER: ghcr.io/zsutton00

jobs:
  approve:
    if: inputs.operation == 'stage'
    # The protected environment holds the required-reviewer approval.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate_revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - name: Require a release branch
        env:
          REF: ${{ github.ref }}
        run: '[[ "$REF" == refs/heads/release/?* || "$REF" == refs/heads/release-?* ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: version
        run: echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@hey-hey/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@hey-hey/cli@$VERSION is already published" >&2
            exit 1
          fi
      - name: Require a successful candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Enter a numeric candidate_run_id for stage" >&2; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          [ "$(jq -r .path <<<"$run")" = ".github/workflows/publish-images.yml" ] || { echo "Run $RUN_ID is not a Build images run" >&2; exit 1; }
          [ "$(jq -r .conclusion <<<"$run")" = "success" ] || { echo "Run $RUN_ID did not succeed" >&2; exit 1; }
          echo "revision=$(jq -r .head_sha <<<"$run")" >> "$GITHUB_OUTPUT"

  publish:
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest-${{ needs.approve.outputs.candidate_revision }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the candidate images with the CLI version
        env:
          VERSION: ${{ needs.approve.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/candidate/release-manifest.json"
          for image in api ui graphSearch; do
            reference="$(jq -r --arg i "$image" '.images[$i].reference' "$manifest")"
            docker buildx imagetools create -t "${reference%@*}:$VERSION" "$reference"
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.2
      # CLI prepack validates checked-in OpenAPI outputs and compiles contracts.
      # Install those tool owners explicitly: the CLI bundles contracts rather
      # than declaring a workspace dependency. No generation is run here.
      - run: pnpm install --frozen-lockfile --filter @hey-hey/cli... --filter @hey-hey/contracts --filter hey-hey-openapi
      - name: Stage on npm with the candidate manifest
        working-directory: apps/cli
        run: |
          cp "$RUNNER_TEMP/candidate/release-manifest.json" release-manifest.json
          npm stage publish --provenance --access public
      - name: Record the staged release identity
        env:
          VERSION: ${{ needs.approve.outputs.version }}
        run: |
          jq -n --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            '{version: $version, revision: $revision}' > "$RUNNER_TEMP/candidate/release-metadata.json"
          echo "Staged @hey-hey/cli@$VERSION. Approve it on npm with 2FA, then run Release CLI with operation=verify and staging_run_id=$GITHUB_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/candidate/*.json

  verification-context:
    if: inputs.operation == 'verify'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require a successful staging run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Enter a numeric staging_run_id for verify" >&2; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          [ "$(jq -r .path <<<"$run")" = ".github/workflows/release-cli.yml" ] || { echo "Run $RUN_ID is not a Release CLI run" >&2; exit 1; }
          [ "$(jq -r .conclusion <<<"$run")" = "success" ] || { echo "Staging run $RUN_ID did not succeed" >&2; exit 1; }
          echo "STAGED_REVISION=$(jq -r .head_sha <<<"$run")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Read the staged release identity
        id: identity
        run: |
          set -euo pipefail
          jq -e --arg revision "$STAGED_REVISION" '.revision == $revision and (.version | type == "string" and length > 0)' release-metadata.json
          echo "version=$(jq -r .version release-metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  verify-pull:
    needs: verification-context
    name: Anonymous pull on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions: {}
    strategy:
      matrix:
        include:
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { platform: linux/amd64, runner: ubuntu-latest }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - name: Pull every manifest image without registry credentials
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # No login step runs in this job; make sure no credentials exist.
          rm -f "$HOME/.docker/config.json"
          for reference in $(jq -r '.images[].reference' release-manifest.json); do
            docker pull --platform "$PLATFORM" "$reference"
          done

  verify-install:
    needs: verification-context
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the published package and compare its manifest
        env:
          VERSION: ${{ needs.verification-context.outputs.version }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cd "$scratch"
          for attempt in $(seq 1 12); do
            npm install "@hey-hey/cli@$VERSION" && break
            sleep 10
          done
          [ "$(npx --no-install heyhey --version)" = "$VERSION" ]
          cmp node_modules/@hey-hey/cli/release-manifest.json "$GITHUB_WORKSPACE/release-manifest.json"
