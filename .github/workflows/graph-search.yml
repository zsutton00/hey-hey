name: Graph and search foundation
on:
  pull_request:
    paths:
      - "apps/graph-search/**"
      - ".github/workflows/graph-search.yml"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "apps/graph-search/**"
      - ".github/workflows/graph-search.yml"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/graph-search
    services:
      database:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_DB: heyhey_graph_search
          POSTGRES_USER: graph_search
          POSTGRES_PASSWORD: local_graph_search
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U graph_search -d heyhey_graph_search"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check SQL against PostgreSQL and exercise database startup
        env:
          DATABASE_URL: postgres://graph_search:local_graph_search@127.0.0.1:55437/heyhey_graph_search
          GRAPH_SEARCH_TEST_DATABASE_URL: postgres://graph_search:local_graph_search@127.0.0.1:55437/heyhey_graph_search
          SQLX_OFFLINE: "false"
        run: |
          cargo clean -p hey-hey-graph-search
          cargo check --locked --all-targets
          cargo test --locked --test database -- --ignored --test-threads=1
      - name: Build and smoke-test runtime image
        run: |
          docker build -f Dockerfile -t heyhey-graph-search:local ../..
          bash scripts/test-container.sh
